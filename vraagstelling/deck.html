<section class="slide obuild vqy" data-audience="all" data-n="JULLIE V1, LANGS DE VIJF TOETSEN (ongeveer 4 minuten; drie klikken), vlak voor de oefening. Bron: de onderzoeksvragen die de groepen maandag op het onderwijsplatform uploadden (Groepsproject, ‘Van de groep’). Dit zijn concepten van deelnemers: presenteer ze als ‘zo scherp je verder aan’, nooit als kritiek, en noem op de slide geen namen. KLIK 1, EFFECTIVE DETERRENCE (geüpload door Sanne): de hoofdvraag staat letterlijk op de slide; de deelvragen gaan over typen nucleaire signalen per geadresseerde (DV1), de uitgedrukte geloofwaardigheid van de afschrikking, zoals bluf, reëel risico of expliciete afschrikking (DV2), en verschillen tussen officiële, militair-expert- en informele bronnen (DV3). Complimenteer de groep expliciet: ze hebben zelf ‘Russische inschatting’ vervangen door ‘representatie’, omdat de bronnen uitspraken doen en geen toegang geven tot wat Moskou werkelijk gelooft. Dat is precies de toets Observeerbaar. Wat nog open ligt: wat telt als ‘nucleair signaal’ en als ‘expliciet’, ook in het Russisch (bijvoorbeeld ядерное сдерживание en de signaalwoorden rond kernwapens), welke vorm elk antwoord krijgt, en welke uitkomst hen zou verrassen (bijvoorbeeld als Europese NAVO-staten vaker doelwit zijn dan de VS). KLIK 2, TRANSPARENT BATTLEFIELD: in de groep liggen vier varianten, van Johannes (innovatie-ecosysteem en wat Defensie ervan kan leren), Klaas (officieel versus Telegram, 2014–2026, kill chain), Leo (de Nederlandse versie op de slide: divergentie tussen officiële bronnen en milbloggers, met een divergentiescore) en een vierde concept over de cyclus van maatregel en tegenmaatregel bij drones. Drie van de vier delen de rode draad officieel tegenover milbloggers: dat is een goed vertrekpunt om er samen één te kiezen. Het vierde concept eindigt nog met de zin ‘I can work this into a one-page research proposal with a hypothesis, or draft the classification prompt’: onbewerkte chatbottekst. Die zin staat bewust NIET op de slide; de slide zegt alleen in het algemeen dat je restjes modeltekst uit een concept haalt. Noem de zin hooguit als de groep er zelf ontspannen over is, en wijs nooit iemand aan: het is herkenbaar, en het laat zien dat modeltekst een concept is en nog geen eigen vraag. Inhoudelijk: ‘lessen voor westerse commandanten’ en ‘wat Defensie kan overnemen’ staan niet in een corpus van Russische teksten; houd ze als duiding achteraf. KLIK 3, GREY-ZONE WARFARE: het geüploade document (een pdf van Bram) kon vannacht niet worden opgehaald; de kaart is een gemarkeerde plaatshouder. Vraag de groep hun v1 even voor te lezen en verwijs naar de uitgewerkte aanscherping op dia 8, die over hun thema gaat. Overgang: in de oefening doet elke groep precies dit met de eigen v1." data-sec="do" data-sid="vq-yours" data-t="Jullie v1, langs de vijf toetsen">

<script>
/* ---------------- data ---------------- */
var DAYS=[{"sec": "why", "short": "Waarom", "label": "Waarom", "title": "Vragen komen vaag binnen", "mins": 10, "desc": "Waar vandaag past; hoe een ontvangen vraag een onderzoeksvraag wordt."}, {"sec": "craft", "short": "Vak", "label": "Vak", "title": "Een vraag aanscherpen", "mins": 25, "desc": "De ladder, wat een corpus kan beantwoorden, het antwoord vooraf bepalen, vijf toetsen."}, {"sec": "worked", "short": "Uitgewerkt", "label": "Uitgewerkt", "title": "Een uitgewerkte aanscherping", "mins": 10, "desc": "E\u00e9n HCSS-onderzoeksvraag, stap voor stap aangescherpt; waar de woorden sturen."}, {"sec": "do", "short": "Oefening", "label": "Oefening", "title": "Van jullie v1 naar v2", "mins": 25, "desc": "De toetsen op je eigen vraag; opschrijven hoe goede en slechte antwoorden eruitzien."}, {"sec": "next", "short": "Straks", "label": "Straks", "title": "Van vraag naar relevantieprompt", "mins": 5, "desc": "Deelvragen worden de relevantiecriteria van vanmiddag."}];
var PIPE=[["Waarom", "Vragen komen vaag binnen"], ["Vak", "Een vraag aanscherpen"], ["Uitgewerkt", "Een uitgewerkte aanscherping"], ["Oefening", "Van jullie v1 naar v2"], ["Straks", "Van vraag naar relevantieprompt"]];
var PIPE_SEC=["why", "craft", "worked", "do", "next"];

/* ---------------- boot ---------------- */
var stage=document.getElementById('stage'),tpl=document.getElementById('deck');
stage.appendChild(tpl.content.cloneNode(true));
var slides=[].slice.call(stage.querySelectorAll('.slide'));
/* --- audience switcher (SDS 2026-09-04) ---------------------------------------
   A slide declares the rooms it belongs to in data-audience. Choosing a category
   hides the others and re-derives the slides array, because go() indexes into it:
   filtering the DOM without rebuilding that array would leave navigation pointing
   at hidden slides. The title slide's framing line adapts to the room. --------- */
var AUD_FRAME = {
  policy:   "What our field currently cannot see, and what we built to see it",
  academic: "An argument about measurement, and a null we can defend",
  defence:  "What this instrument can see, and what it cannot see by construction",
  student:  "Reading a country at machine scale",
  workshop: "A structure you will apply to your own question",
  futures:  "Russia's futures: what comes next, and what it means for us",
  mixed:    "Reading Russia at machine scale"
};
function setAudience(key){
  document.body.setAttribute('data-audience', key||'');
  var all=[].slice.call(stage.querySelectorAll('.slide'));
  all.forEach(function(s){
    var a=s.getAttribute('data-audience');
    var show = !key || !a || a==='all' || a.split(/\s+/).indexOf(key)>=0;
    s.classList.toggle('aud-hidden', !show);
  });
  slides = all.filter(function(s){ return !s.classList.contains('aud-hidden'); });
  var btns=document.querySelectorAll('.audbtn');
  for(var i=0;i<btns.length;i++)
    btns[i].classList.toggle('on', btns[i].getAttribute('data-aud')===key);
  var now=document.getElementById('audnow');
  if(now) now.textContent = key ? (key+' \u00b7 '+slides.length+' slides') : 'every slide';
  var fr=document.querySelector('.gt01-frame');
  if(fr && AUD_FRAME[key]) fr.textContent = AUD_FRAME[key];
  try{ localStorage.setItem('gtr-audience', key||''); }catch(e){}
  if(cur>=slides.length) cur=slides.length-1;
  go(0,false,false);
}
/* Curated morning sequence: do not inherit a generic-deck audience filter. */
var dividers=[];slides.forEach(function(s,i){if(s.classList.contains('divider'))dividers.push(i);});
var cur=0,fitted=[],view='home';
/* Derive each section's entry point and beats from the slides ACTUALLY spliced in,
   so the home page cannot drift from the deck. Nothing here is typed in: a section
   with no slides reports itself empty rather than silently linking to slide 0. */
DAYS.forEach(function(d){
  d.first=-1; d.items=[];
  slides.forEach(function(sl,i){
    if(sl.getAttribute('data-sec')!==d.sec)return;
    if(d.first<0)d.first=i;
    d.items.push(sl.dataset.t||('Slide '+(i+1)));
  });
  d.count=d.items.length;
});

/* ---------- SHELL GUARD (not in deck.html) ----------------------------------
   The house deck always has slides. This shell ships with ZERO, so every deck
   entry point would dereference slides[0] and throw. These three guards are
   inert the moment a single &lt;section class="slide"> exists in #deck, so they
   can stay in place once the deck is populated. */
var EMPTY = slides.length === 0;
if(EMPTY){
  stage.innerHTML = '<div class="slide on"><div class="fill title-slide">'
    + '<div class="kicker">house deck shell</div>'
    + '<div class="t">No slides yet</div>'
    + '<div class="s">Splice &lt;section class="slide"&gt; blocks into &lt;template id="deck"&gt;.</div>'
    + '</div></div>';
  slides = [].slice.call(stage.querySelectorAll('.slide'));

}
/* -------------------------------------------------------------------------- */


/* ---------------- AUTOFIT: grow --sc until the slide is as full as it can be ----------------
   Every type size on a slide is calc(N cqw * var(--sc)). We binary-search the largest --sc at
   which nothing overflows its box. That is what makes a slide FILL its frame instead of
   floating a small block of text in the middle of it. Runs once per slide, then is cached;
   the cache is dropped on resize because cqw is relative to the frame.                        */
function overflows(s){
  var body=document.body, had=body.classList.contains('measuring');
  if(!had)body.classList.add('measuring');
  try{ return _overflows(s); } finally { if(!had)body.classList.remove('measuring'); }
}
function _overflows(s){
  /* Two independent failure modes.
     (1) VERTICAL/BLOCK overflow: a child escapes a box that clips. Rect containment, not
         scrollHeight - with line-height near 1 a glyph box is taller than its element box, so
         scrollHeight>clientHeight fires on every heading even when the layout is perfect.
         Every layout box must be checked, INCLUDING .fill: checking only the slide's direct
         children passes any .fill, because .fill is flex:1 and so always fits by construction
         while its children spill straight out of the frame.
     (2) HORIZONTAL text overflow: a long word that cannot wrap ("Classification", "Foundations")
         overflows its element without moving that element's rect at all. Rect containment is
         blind to it; scrollWidth is the only signal. Tolerance 4px absorbs letter-spacing,
         which adds trailing space after the last glyph. */
  var TOL=2, WTOL=4;
  function inner(el){
    var r=el.getBoundingClientRect(),cs=getComputedStyle(el);
    return {left:r.left+parseFloat(cs.paddingLeft),right:r.right-parseFloat(cs.paddingRight),
            top:r.top+parseFloat(cs.paddingTop),bottom:r.bottom-parseFloat(cs.paddingBottom)};
  }
  function outside(box,r){
    return r.left<box.left-TOL||r.right>box.right+TOL||r.top<box.top-TOL||r.bottom>box.bottom+TOL;
  }
  var boxes=[s].concat([].slice.call(
    s.querySelectorAll('.fill,.card,.grid,.split,.stack,.arrowrow,ul.big')));
  for(var i=0;i<boxes.length;i++){
    var bb=inner(boxes[i]),kids=boxes[i].children;
    for(var j=0;j<kids.length;j++){
      if(outside(bb,kids[j].getBoundingClientRect()))return true;
    }
  }
  /* A <pre> clips its own content without moving any rect, so rect containment
     cannot see it. Its line-height is 1.5, well clear of the glyph-overflow
     artifact that makes scrollHeight useless on tight-leading headings, so
     scrollHeight is the right test here and only here. */
  var pres=s.querySelectorAll('pre.prompt');
  for(var q=0;q<pres.length;q++){
    if(pres[q].scrollHeight>pres[q].clientHeight+2)return true;
  }
  var text=s.querySelectorAll('h2,.sub,.body-lg,.kicker,.small-note,.card .k,.card .d,.card .v,'
    +'li,.daytitle,.daysub,.daymins,.title-slide .t,.title-slide .s,.title-slide .m,.ar');
  for(var t=0;t<text.length;t++){
    if(text[t].scrollWidth>text[t].clientWidth+WTOL)return true;
  }
  return false;
}
function autofit(i){
  var s=slides[i];
  document.body.classList.add('measuring');
  try{ _autofit(i); } finally { document.body.classList.remove('measuring'); }
}
function _autofit(i){
  var s=slides[i];
  if(s.classList.contains('img'))return;
  if(fitted[i])return;
  var lo=0.5,hi=3.2,best=0.5;
  s.style.setProperty('--sc',hi);
  if(!overflows(s)){best=hi;}
  else{
    for(var k=0;k<9;k++){
      var mid=(lo+hi)/2;
      s.style.setProperty('--sc',mid);
      if(overflows(s)){hi=mid;}else{best=mid;lo=mid;}
    }
  }
  s.style.setProperty('--sc',best);
  fitted[i]=true;
}

/* ---------------- navigation ---------------- */
function dayOf(i){
  var sl=slides[i]; if(sl){var sec=sl.getAttribute('data-sec');
    for(var k=0;k<DAYS.length;k++)if(DAYS[k].sec===sec)return k+1;}
  var d=0;for(var k=0;k<dividers.length;k++){if(i>=dividers[k])d=k+1;}return d;}
/* ---------------- build-up fragments ----------------
   Right arrow reveals the next fragment before advancing; left arrow un-reveals
   before going back. Entering forwards starts unbuilt; entering backwards, or by
   jump or deep link, starts fully built, so a link never lands on a half-drawn
   slide. B toggles builds off. */
var buildOff=false;
function frags(i){return slides[i].querySelectorAll('[data-frag]');}
function fragShown(i){return slides[i].querySelectorAll('[data-frag].shown').length;}
function setFrags(i,n){
  var f=frags(i);
  for(var k=0;k<f.length;k++){f[k].classList.toggle('shown',k<n);}
  paintPip(i);
}
/* ---- feedback-mode deck-only view (SDS 2026-09-01) ------------------------
   Chrome is stripped and a section progress rail shown ONLY when the review
   layer is present. The review server injects its own script at request time, so a
   deck opened directly, or published to Pages, keeps its full chrome and this
   code never fires. */
function isFeedbackMode(){
  /* Detect the review layer by its own DOM marker ONLY. Do NOT test for the
     script's filename: the review server injects it with a guard of the form
     "if the filename is not already in the html", so naming that file here made the
     server skip injection entirely and the check suppressed what it detected. */
  return !!document.getElementById('gtr-toggle');
}
function buildPrograil(){
  var el=document.getElementById('prograil'); if(!el||el.dataset.built)return;
  var h='';
  DAYS.forEach(function(d,k){
    h+='<button class="pseg'+(d.count?'':' empty')+'" data-k="'+k+'" style="--w:'+d.mins+'"'+
       (d.count?' onclick="goDay('+(k+1)+')"':'')+
       ' title="'+d.label+' \u00b7 '+d.title+' \u00b7 '+d.mins+' min">'+
       '<span class="pfill"></span>'+
       '<span class="plabel">'+(d.short||d.title)+'</span></button>';
  });
  el.innerHTML=h; el.dataset.built='1';
}
function paintPrograil(){
  var el=document.getElementById('prograil'); if(!el||!el.dataset.built)return;
  var here=dayOf(cur);                       /* 1-based section, 0 = none */
  [].forEach.call(el.children,function(b){
    var k=parseInt(b.dataset.k,10), d=DAYS[k], fill=b.querySelector('.pfill');
    b.classList.toggle('on', k+1===here);
    b.classList.toggle('done', here>0 && k+1<here);
    if(k+1===here && d.count){
      /* how far through THIS section we are, so the bar moves on every slide */
      var pos=cur-d.first+1;
      fill.style.width=Math.max(0,Math.min(100, pos/d.count*100))+'%';
    } else if(!b.classList.contains('done')){ fill.style.width='0'; }
    else { fill.style.width='100%'; }
  });
}
var _fbTries=0;
function watchFeedbackMode(){
  if(isFeedbackMode()){ if(view==='deck') applyDeckOnly(true); return; }
  if(++_fbTries>20) return;                 /* ~5 s, then give up quietly */
  setTimeout(watchFeedbackMode,250);
}
function applyDeckOnly(on){
  document.body.classList.toggle('deckonly', !!on);
  buildPrograil(); paintPrograil();
  if(typeof autofit==='function'){ try{ autofit(cur); }catch(e){} }
}
function paintPip(i){
  paintPrograil();
  var el=document.getElementById('buildpip'),n=frags(i).length;
  if(!el)return;
  el.textContent=(n&&!buildOff)?('  \u25CF '+fragShown(i)+'/'+n):'';
}
function stepFwd(){
  if(buildOff)return false;
  var f=frags(cur),n=fragShown(cur);
  if(n<f.length){setFrags(cur,n+1);return true;}
  return false;
}
function stepBack(){
  if(buildOff)return false;
  var n=fragShown(cur);
  if(n>0){setFrags(cur,n-1);return true;}
  return false;
}
function toggleBuild(){
  buildOff=!buildOff;
  document.body.classList.toggle('nobuild',buildOff);
  setFrags(cur,buildOff?frags(cur).length:fragShown(cur));
}
function go(i,push,built){ if(i<0)i=0;if(i>=slides.length)i=slides.length-1; /* set the incoming slide's fragment state BEFORE it becomes visible: otherwise a slide that still carries .shown from a previous build paints fully built for a few frames and then collapses - the 'ghosting' flash. */ setFrags(i, (buildOff || built===true) ? frags(i).length : 0); slides[cur].classList.remove('on'); cur=i; slides[cur].classList.add('on'); autofit(cur); setFrags(cur, (buildOff || built===true) ? frags(cur).length : 0);
  document.getElementById('counter').textContent=(cur+1)+' / '+slides.length;
  document.getElementById('slidetitle').innerHTML=slides[cur].dataset.t||'';
  document.getElementById('notes').innerHTML=slides[cur].dataset.n?('<b>Notitie</b> &nbsp;'+slides[cur].dataset.n):'<i>Geen notitie bij deze dia.</i>';
  paintTimeline();paintSidebar();
  if(push!==false)history.replaceState(null,'','#'+(cur+1));
}
function showDeck(i,built){
  view='deck';
  applyDeckOnly(true);
  document.getElementById('home').classList.remove('on');
  stage.classList.add('on');document.getElementById('deckbar').classList.add('on');
  document.getElementById('navHome').classList.remove('on');
  document.getElementById('navDeck').classList.add('on');
  var target=typeof i==='number'?i:cur; var openBuilt=built===undefined && slides[target] && ['ada-students','ada-protocol'].includes(slides[target].dataset.sid) ? false : built!==false; go(target, true, openBuilt);
}
function showHome(){
  view='home';
  applyDeckOnly(false);
  stage.classList.remove('on');document.getElementById('deckbar').classList.remove('on');
  document.getElementById('notes').classList.remove('on');
  document.getElementById('home').classList.add('on');
  document.getElementById('navHome').classList.add('on');
  document.getElementById('navDeck').classList.remove('on');
  history.replaceState(null,'','#home');
  paintTimeline();paintSidebar();
}
function goDay(d){
  if(d===0){showDeck(0);return;}
  var e=DAYS[d-1];
  if(e&&e.first>=0){showDeck(e.first);return;}
  if(dividers.length&&dividers[d-1]!=null)showDeck(dividers[d-1]);else showDeck(0);
}
function goSec(id){for(var i=0;i<DAYS.length;i++)if(DAYS[i].sec===id)return goDay(i+1);goDay(0);}
function toggleNotes(){document.getElementById('notes').classList.toggle('on');}
function toggleOv(){
  var ov=document.getElementById('ov');
  if(!ov.classList.contains('on'))buildOv();
  ov.classList.toggle('on');
}
function present(){
  if(view!=='deck')showDeck();
  document.body.classList.add('present');
  fitted=[];autofit(cur);
  if(document.documentElement.requestFullscreen)document.documentElement.requestFullscreen().catch(function(){});
}
function unpresent(){
  document.body.classList.remove('present');
  fitted=[];autofit(cur);
  if(document.fullscreenElement&&document.exitFullscreen)document.exitFullscreen().catch(function(){});
}

/* ---------------- chrome painting ---------------- */
function paintTimeline(){
  var bar=document.getElementById('timelineBar');
  if(!bar.dataset.built){
    var h='';
    DAYS.forEach(function(d,k){
      if(k)h+='<div class="timeline-connector"></div>';
      h+='<button class="timeline-block" data-d="'+(k+1)+'" onclick="goDay('+(k+1)+')">'+
         '<div class="timeline-time">'+d.label+' &#183; '+d.mins+' min</div>'+
         '<div class="timeline-label">'+d.title+'</div>'+
         '<div class="timeline-duration">'+(d.count?d.count+(d.count===1?' dia':' dia&#8217;s'):'nog niet gebouwd')+'</div></button>';
    });
    bar.innerHTML=h;bar.dataset.built='1';
  }
  var d=view==='deck'?dayOf(cur):0;
  [].forEach.call(bar.querySelectorAll('.timeline-block'),function(b){
    b.classList.toggle('active',parseInt(b.dataset.d,10)===d);});
}
function paintSidebar(){
  var sb=document.getElementById('sidebar'),h='';
  if(view==='home'){
    h+='<div class="sidebar-section"><div class="sidebar-section-title">De sessie</div>';
    DAYS.forEach(function(d,k){
      h+='<button class="sidebar-item" onclick="goDay('+(k+1)+')"><span class="sidebar-item-title">'+
         d.label+' &#183; '+d.title+'</span><span class="sidebar-badge">'+(d.count?d.count+(d.count===1?' dia':' dia&#8217;s'):'leeg')+'</span></button>';});
    h+='</div><div class="sidebar-section"><div class="sidebar-section-title">Deck</div>'+
       '<button class="sidebar-item" onclick="showDeck(0)"><span class="sidebar-item-title">Vanaf het begin</span><span class="sidebar-badge">'+slides.length+'</span></button>'+
       '<button class="sidebar-item" onclick="toggleOv()"><span class="sidebar-item-title">Overzicht van de dia&#8217;s</span><span class="sidebar-badge">O</span></button>'+
       '<button class="sidebar-item" onclick="present()"><span class="sidebar-item-title">Volledig scherm presenteren</span><span class="sidebar-badge">F</span></button></div>'+
       '<div class="sidebar-section"><div class="sidebar-section-title">Naslag</div>'+'<a class="sidebar-item" href="https://rubase.org/" target="_blank" rel="noopener"><span class="sidebar-item-title">RuBase-dashboard</span><span class="sidebar-badge">&#8599;</span></a>'+'<a class="sidebar-item" href="https://rubasediscovery.app.hcss.nl/sources" target="_blank" rel="noopener"><span class="sidebar-item-title">Overzicht RuBase-bronnen</span><span class="sidebar-badge">&#8599;</span></a>'+'<a class="sidebar-item" href="https://onderwijsophcss.app.hcss.nl" target="_blank" rel="noopener"><span class="sidebar-item-title">Trainingsplatform</span><span class="sidebar-badge">&#8599;</span></a>'+'</div>';
    sb.innerHTML=h;return;
  }
  var d=dayOf(cur);
  var start=d===0?0:dividers[d-1];
  var end=d<dividers.length?dividers[d]:slides.length;
  if(d===0){start=0;end=dividers.length?dividers[0]:slides.length;}
  h+='<div class="sidebar-section"><div class="sidebar-section-title">'+
     (d===0?'Opening':(DAYS[d-1].label+' &#183; '+DAYS[d-1].title))+'</div>';
  for(var i=start;i<end;i++){
    h+='<button class="sidebar-item'+(i===cur?' active':'')+'" onclick="showDeck('+i+')">'+
       '<span class="sidebar-item-title">'+(slides[i].dataset.t||('Slide '+(i+1)))+'</span>'+
       '<span class="sidebar-badge">'+(i+1)+'</span></button>';
  }
  h+='</div><div class="sidebar-section"><div class="sidebar-section-title">Naar een onderdeel</div>';
  DAYS.forEach(function(dd,k){
    h+='<button class="sidebar-item'+(k+1===d?' active':'')+'" onclick="goDay('+(k+1)+')">'+
       '<span class="sidebar-item-title">'+dd.label+' &#183; '+dd.title+'</span>'+
       '<span class="sidebar-badge">'+(dd.count?dd.count+(dd.count===1?' dia':' dia&#8217;s'):'leeg')+'</span></button>';});
  h+='</div>';
  sb.innerHTML=h;
  var act=sb.querySelector('.sidebar-item.active');
  if(act&&act.scrollIntoViewIfNeeded)act.scrollIntoViewIfNeeded();
}
function buildHome(){
  var h='<div class="welcome-screen">'+
    '<div class="welcome-title">Van vage naar toetsbare vraag</div>'+'<div class="welcome-subtitle">Hoe een vraag die je krijgt een onderzoeksvraag wordt die een corpus en een taalmodel kunnen beantwoorden, en waarom je bepaalt hoe een goed antwoord eruitziet voordat je de vraag stelt.</div>'+'<div class="welcome-meta">Dinsdag 13 oktober 2026 &#183; 09:00&#8211;10:15 &#183; AIRA-training, Den Haag</div>'+
    '<div class="pipeline">';
  PIPE.forEach(function(p,k){
    if(k)h+='<div class="pipe-arrow">&rarr;</div>';
    h+='<button class="pipe-step" onclick="goSec(\''+PIPE_SEC[k]+'\')"><div class="step-label">'+p[0]+'</div><div class="step-name">'+p[1]+'</div></button>';});
  h+='</div><div class="session-grid">';
  DAYS.forEach(function(d,k){
    h+='<button class="session-card'+(d.count?'':' empty')+'" onclick="goDay('+(k+1)+')">'+
       '<div class="card-num">'+(k+1)+'</div>'+
       '<div class="card-time">'+d.label+' &#183; '+d.mins+' min'+(d.count?' &#183; '+d.count+(d.count===1?' dia':' dia&#8217;s'):'')+'</div>'+
       '<div class="card-title">'+d.title+'</div>'+
       '<div class="card-desc">'+d.desc+'</div><div class="card-items">';
    d.items.forEach(function(it){h+='<div class="card-item"><span class="card-item-bullet"></span><span>'+it+'</span></div>';});
    h+='</div></button>';});
  h+='</div></div>';
  document.getElementById('home').innerHTML=h;
}
function buildOv(){
  var g=document.getElementById('ovg'),h='';
  slides.forEach(function(s,i){
    h+='<button class="'+(s.classList.contains('divider')?'d':'')+'" onclick="document.getElementById(\'ov\').classList.remove(\'on\');showDeck('+i+')">'+
       '<i>'+(i+1)+'</i>'+(s.dataset.t||'')+'</button>';});
  g.innerHTML=h;
}

/* ---------------- keys ---------------- */
document.addEventListener('keydown',function(e){
  if(e.target.tagName==='SELECT'||e.target.tagName==='INPUT')return;
  var k=e.key;
  if(k==='Escape'){
    if(document.getElementById('ov').classList.contains('on')){document.getElementById('ov').classList.remove('on');return;}
    if(document.body.classList.contains('present')){unpresent();return;}
  }
  if(view!=='deck'&&['ArrowRight','ArrowLeft','ArrowUp','ArrowDown','n','N'].indexOf(k)>-1){showDeck();if(k==='ArrowRight'||k==='ArrowLeft')return;}
  if(k==='ArrowRight'||k===' '||k==='PageDown'){e.preventDefault();if(!stepFwd())go(cur+1);}
  else if(k==='ArrowLeft'||k==='PageUp'){e.preventDefault();if(!stepBack())go(cur-1,true,true);}
  else if(k==='ArrowDown'){e.preventDefault();var d=dayOf(cur);goDay(Math.min(d+1,DAYS.length));}
  else if(k==='ArrowUp'){e.preventDefault();var d2=dayOf(cur);goDay(Math.max(d2-1,0));}
  else if(k==='Home'){e.preventDefault();go(0);}
  else if(k==='End'){e.preventDefault();go(slides.length-1);}
  else if(k==='o'||k==='O'){toggleOv();}
  else if(k==='n'||k==='N'){toggleNotes();}
  else if(k==='b'||k==='B'){toggleBuild();}
  else if(k==='f'||k==='F'){document.body.classList.contains('present')?unpresent():present();}
});
document.addEventListener('fullscreenchange',function(){
  if(!document.fullscreenElement&&document.body.classList.contains('present'))document.body.classList.remove('present');
  fitted=[];autofit(cur);
});
var rt;window.addEventListener('resize',function(){clearTimeout(rt);rt=setTimeout(function(){fitted=[];autofit(cur);},140);});

/* ---------------- start ---------------- */
buildHome();



var hash=(location.hash||'').replace('#','');
if(hash&&hash!=='home'&&!isNaN(parseInt(hash,10))){showDeck(parseInt(hash,10)-1);}
else{showHome();}
/* The review layer's script tag is injected at the very END of body, so it has not run
   when the routing above executes and isFeedbackMode() is still false. Poll briefly so
   the deck-only view engages once the layer is actually there. */
watchFeedbackMode();
</script>
