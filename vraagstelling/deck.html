/* ---- gt22 (frag_gt22.css) ---- */
/* =============================================================================
   gt22 - "Seven dimensions" (the 7 HLTPs of the congressional budget-issue
   taxonomy). This slide REPLACES a rasterised taxonomy image whose labels were
   unreadable, so readable type is the entire point of the rebuild.

   ROUTE 3 (drawn). Route 1 is unavailable - the taxonomy is a 4-column TSV
   (TAXONOMY_AGREED_2026-09-01.tsv, 498 data rows) emitted by the murderboard,
   and no generator anywhere produces staged figure layers from it. Route 2 is
   unavailable - there is no pptx /media asset for this content; the only prior
   rendering was the flat raster this slide exists to replace, and dimming that
   raster and cutting clip-path windows in it is the png dump the splicer
   refuses. So the whole picture is inline SVG, drawn from the TSV.

   A LAYOUT DECISION, stated so the next author does not "fix" it: a radial /
   sunburst was tried on paper and rejected. Seven arc labels plus 22 second-level
   and 61 third-level counts cannot be set on arcs at >=1.10% of slide width in a
   1770x750 frame without either rotating the labels or dropping to ~14 viewBox
   units, both of which reproduce the defect this slide is here to remove. A
   horizontal table-of-bars holds every label horizontal at 24-33 viewBox units.
   Readability beats the shape.

   ---------------------------------------------------------------------------
   TYPE-FLOOR ARITHMETIC - why every SVG font-size below is >= 24 viewBox units
   ---------------------------------------------------------------------------
   Floor            = 1.10% of slide width = 15.03px on a 1366px-wide slide.
   viewBox          = 1770 x 750 (aspect 2.360), matching .ob-pic's aspect-ratio.
   .ob-pic width    = slide width - 2 x 3.6% padding = 0.928 x slide width.
   Two cases, and the SMALLER scale is the one that must clear the floor:
     (a) width-fit   : 1366 x 0.928 / 1770                      = 0.7162 px/unit
     (b) height-fit  : .ob-pic is clamped by max-height:68cqh, and with
                       preserveAspectRatio="xMidYMid meet" the SVG then scales to
                       the HEIGHT: 0.68 x 768 / 750             = 0.6963 px/unit
   Worst case = 0.6963. Minimum viewBox unit = 15.03 / 0.6963   = 21.58.
   So the smallest size used here is 26, and the ladder measures:
     33 -> 22.98px = 1.682% of slide   (dimension name)
     31 -> 21.59px = 1.580%            (the three counts)
     28 -> 19.50px = 1.427%            (group headers, totals band)
     26 -> 18.10px = 1.325%            (column headers, glosses, legend)
   MEASURED, not computed, in the real shell at 1366x768 (shot2.py): the flex
   column - not max-height - is what actually sizes .ob-pic, giving a scale of
   0.4363 against an 855px slide, so the 26-unit floor renders at 1.326% of slide
   width. The first cut of this slide carried a 24-unit floor and measured 1.175%;
   it passed, but 26 plus a one-line .sub is the margin this rebuild deserves.

   COLUMN ARITHMETIC (viewBox units, art band x 76..1030):
     name      100..~472  (33u, longest is "Affected Constituency")
     gloss     100..~500  (26u, longest is "what the money is being spent on")
     2ND LVL   centred 570 -> 516..624      3RD LVL centred 700 -> 646..754
     TAXA no.  anchor end 830 -> ~780..830  bar 850..1030, 180u at 107 taxa,
                                            i.e. 1.6822 units per taxon.
   Every pair has clear air between it; verified by getBBox in the render, not by
   eye. The columns moved right when the floor went 24 -> 26: "2ND LVL" and
   "3RD LVL" grew and collided at the old 585/690 centres.
   All clear 1.10% with margin, in BOTH cases. Nothing on this slide is px.
   max-height is 68cqh rather than the shell's 66cqh so the picture is not
   squashed, and "meet" rather than "none" so that if it ever IS clamped the
   figure letterboxes instead of distorting the glyphs.

   preserveAspectRatio="meet" also fixes where the art ends horizontally: the
   drawn band is viewBox x 30..1030, which lands at 3.0%..58.0% of .ob-pic in
   BOTH cases, so every .ob-note at --x:59% sits on empty ground and can never
   cover a revealed row.

   PREFIXING: every class is gt22-*. An inline SVG <style> is NOT scoped to its
   subtree, so bare names leak page-wide - which is precisely why the class
   definitions live HERE, in a file-scoped `.gt22 .gt22-*` block, and there is no
   <style> element inside any of the four SVGs.

   HIDDEN STATES: none are declared. The deck's own
   `.slide [data-frag]{opacity:0;transition:none}` hides each .ob-step together
   with its SVG and its box, so nothing here can animate back to hidden after
   body.measuring lights the slide for autofit. The only transition added below
   is on a :hover, which autofit never triggers.
   ============================================================================= */

/* the slide is its own inline-size container, so cqw resolves against the slide
   in ANY host shell. The GaTech deck already declares this identically. */
.gt22{container-type:inline-size}

.gt22 .ob-pic{aspect-ratio:1770/750;max-height:68cqh;background:transparent}

.gt22 .ob-pic svg.gt22-lay{position:absolute;inset:0;width:100%;height:100%;display:block}

/* `.obuild .ob-pic img{position:absolute;inset:0;width:100%;height:100%}` outranks
   any plain two-class selector and force-stretches component images. gt22 ships
   no <img>; this is the scoped reset any future one must use. */
.gt22 .ob-pic img.gt22-shot{position:absolute;inset:auto;right:auto;bottom:auto;
  left:var(--x);top:var(--y);width:var(--w);height:auto;max-width:none;display:block;
  border-radius:4px;box-shadow:0 8px 26px rgba(0,0,0,.55)}

/* --- the pointer contract (VISUAL_SPEC 11): every .ob-step is a full-size
   transparent layer that would otherwise swallow the pointer, so the buttons in
   the notes would be unclickable. Both halves are mandatory. ---------------- */
.gt22 .ob-step{pointer-events:none}
.gt22 .ob-step > *{pointer-events:auto}
.gt22 .ob-scrim{pointer-events:none}
.gt22 .ob-pic svg.gt22-lay{pointer-events:none}

/* --- SVG type and marks. Sizes in viewBox user units; see the arithmetic above. */
.gt22 .gt22-hdr{font:600 26px "Titillium Web",system-ui,-apple-system,sans-serif;fill:#b9cee5;letter-spacing:.1em}
.gt22 .gt22-gh {font:700 28px "Titillium Web",system-ui,-apple-system,sans-serif;fill:#dbad50;letter-spacing:.09em}
.gt22 .gt22-nm {font:700 33px "Titillium Web",system-ui,-apple-system,sans-serif;fill:#f3f6fb}
.gt22 .gt22-gl {font:400 26px "Titillium Web",system-ui,-apple-system,sans-serif;fill:#b9cee5}
.gt22 .gt22-num{font:600 31px "Titillium Web",system-ui,-apple-system,sans-serif;fill:#f3f6fb}
.gt22 .gt22-tx {font:700 31px "Titillium Web",system-ui,-apple-system,sans-serif;fill:#dbad50}
.gt22 .gt22-lg {font:400 26px "Titillium Web",system-ui,-apple-system,sans-serif;fill:#b9cee5}
.gt22 .gt22-tot{font:700 28px "Titillium Web",system-ui,-apple-system,sans-serif;fill:#dbad50;letter-spacing:.04em}

.gt22 .gt22-row  {fill:#12294a;stroke:rgba(255,255,255,.15);stroke-width:1.5}
.gt22 .gt22-rowc {fill:#16305a;stroke:#dbad50;stroke-width:2;stroke-opacity:.8}   /* blind convergence */
.gt22 .gt22-acc  {fill:#dbad50}
.gt22 .gt22-bar  {fill:#dbad50;opacity:.82}
.gt22 .gt22-rule {stroke:rgba(255,255,255,.2);stroke-width:1.5}
.gt22 .gt22-totbx{fill:rgba(219,173,80,.10);stroke:#dbad50;stroke-opacity:.55;stroke-width:1.5}

/* --- the modal opener inside a note box.
   THE BUTTON TRAP: a <button> does not inherit font-size, so without an explicit
   size it silently renders at the 13.33px UA default and fails the floor. 1.30vw
   = 17.8px at 1366 = 1.30% of slide width. ---------------------------------- */
.gt22 .gt22-mb{display:inline-block;margin-top:.55em;font-family:inherit;
  font-size:1.20vw;font-weight:700;line-height:1.25;color:#dbad50;
  background:rgba(219,173,80,.10);border:1px solid rgba(219,173,80,.6);
  border-radius:5px;padding:.3em .7em;cursor:pointer;transition:background .15s,color .15s}
.gt22 .gt22-mb:hover,.gt22 .gt22-mb:focus-visible{background:#dbad50;color:#0a192f;outline:none}

/* the byte-identical SHA on the closing card. 1.12vw = 15.3px at 1366 = 1.12%. */
.gt22 .gt22-sha{display:block;margin-top:.6em;padding-top:.45em;
  border-top:1px solid rgba(219,173,80,.3);
  font-family:"SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace;
  font-size:1.25vw;line-height:1.45;color:#b9cee5;word-break:break-all}

/* the closing card sits over a dimmed picture, so it is allowed to cover art */
.gt22 .ob-note.wide{background:rgba(9,24,47,.96)}

/* --- modals. Every id is gt22-prefixed because all fragments splice into ONE
   document. showModal() promotes these to the top layer, so they escape both
   .ob-pic{overflow:hidden} and .slide{overflow:hidden}. Sizes in vw, never px. */
.gt22-mdl{border:1px solid #dbad50;border-left:4px solid #dbad50;border-radius:8px;
  background:#0a192f;color:#e8edf3;max-width:62vw;width:62vw;max-height:78vh;
  overflow:auto;padding:1.5vw 1.8vw;box-shadow:0 18px 60px rgba(0,0,0,.7);
  font-family:"Titillium Web",-apple-system,"Segoe UI",Roboto,Helvetica,sans-serif}
.gt22-mdl::backdrop{background:rgba(4,12,26,.78)}
.gt22-mdl h3{color:#dbad50;font-size:2.05vw;font-weight:700;line-height:1.15;margin:0 0 .5em}
.gt22-mdl p{font-size:1.32vw;line-height:1.5;margin:0 0 .75em;color:#e8edf3}
.gt22-mdl p b{color:#dbad50;font-weight:700}
.gt22-mdl form{margin:.4em 0 0}


/* --- type-floor repair gt22: 1.10% of 1366 = 15.03px effective.
   SVG text is scaled by the viewBox, so a vw size is multiplied by that scale too;
   these are raw viewBox units computed so raw x scale clears the floor. --- */
.gt22 .d{font-size:16px}
.gt22 .gt22-gl{font-size:27px}
.gt22 .gt22-hdr{font-size:27px}
.gt22 .gt22-lg{font-size:27px}

/* type-floor enforcement (high specificity; beats the earlier rules) */
.slide.gt22 .d,.slide.gt22 svg .d{font-size:16px !important}

/* ---- gt23 (frag_gt23.css) ---- */
/* ===========================================================================
   frag_gt23.css  -  slide gt23 "Inside a dimension"
   A four-click drill-down: HLTP > 2nd Level > 3rd Level > actual taxon strings,
   all read from TAXONOMY_AGREED_2026-09-01.tsv.

   EVERY class is prefixed .gt23- because an inline SVG <style> is not scoped to
   its subtree and all fragments splice into ONE document.

   TYPE FLOOR: nothing below 1.10vw (= 15.03px at a 1366px viewport). All sizes
   are vw, never px, never vh. The <button>s carry an explicit font-size and
   font-family because a form control does NOT inherit them.

   GEOMETRY (percentages of .ob-pic, which is 1770/750):
     col A  HLTP        left  0.5%  width 14%    right edge 14.5%
     col B  2nd level   left 17%    width 19%    right edge 36%
     col C  3rd level   left 38%    width 19%    right edge 57%
     col D  taxa        left 59%    width 40%    right edge 99%
     wire trunks sit in the gaps at x = 15.7% / 37.0% / 58.0%
     tree band ends at 67%; the note band (68% down) is therefore always
     over EMPTY ground - no .ob-note ever covers a revealed component.
   =========================================================================== */

/* --- §11 of the visual spec: the full-size step layer must pass the pointer
       through, its CONTENTS must take it, or nothing on the slide is selectable.
       Only a SHOWN step is live, so an invisible button is never clickable. --- */
.gt23 .ob-step{pointer-events:none}
.gt23 .ob-step.shown > *{pointer-events:auto}
.gt23 .gt23-wires{pointer-events:none}

/* defensive: .obuild .ob-pic img{inset:0;width:100%;height:100%} outranks a
   two-class selector. This slide ships no <img>, but the guard costs nothing. */
.gt23 .ob-pic img.gt23-component{position:absolute;right:auto;bottom:auto;
  width:auto;height:auto}

/* ---------------- the explanation boxes ---------------- */
.gt23 .ob-note.gt23-note{left:1%;top:68%;width:57%}
.gt23 .ob-note .k{font-size:1.34vw;line-height:1.18;color:#dbad50}   /* 18.30px @1366 */
.gt23 .ob-note .d{font-size:1.18vw;line-height:1.38;color:#e8edf3}   /* 16.12px @1366 */

/* ---------------- shared node chrome ---------------- */
.gt23 .gt23-hltp,
.gt23 .gt23-l2,
.gt23 .gt23-l3{position:absolute;box-sizing:border-box;
  background:#132f59;border:1px solid rgba(255,255,255,.14);
  border-left:3px solid #82a0bc;border-radius:5px;
  display:flex;flex-direction:column;justify-content:center;
  padding:.28em .6em;overflow:hidden}
.gt23 .gt23-l2.pick,
.gt23 .gt23-l3.pick{border-color:#dbad50;border-left-color:#dbad50;
  background:rgba(219,173,80,.14)}

/* ---------------- col A: the dimension ---------------- */
.gt23 .gt23-hltp{left:.5%;top:3%;width:14%;height:32%;
  border-left-color:#dbad50;background:rgba(219,173,80,.13);border-color:#dbad50}
.gt23 .gt23-hltp .gt23-kick{font-size:1.10vw;line-height:1.25;color:#dbad50;   /* 15.03px */
  font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.gt23 .gt23-hltp .n{font-size:1.34vw;line-height:1.16;color:#f3f6fb;           /* 18.30px */
  font-weight:700;margin:.18em 0 .22em}
.gt23 .gt23-hltp .c{font-size:1.22vw;line-height:1.2;color:#dbad50;            /* 16.66px */
  font-weight:700;font-variant-numeric:tabular-nums}
.gt23 .gt23-hltp .cl{font-size:1.10vw;line-height:1.2;color:#9db8d6}           /* 15.03px */

/* the gauge: taxa carried by each of the seven dimensions, 107 .. 32 */
.gt23 .gt23-gaugebtn{position:absolute;left:.5%;top:38%;width:14%;
  box-sizing:border-box;display:flex;flex-direction:column;gap:.3em;
  background:transparent;border:1px dashed rgba(219,173,80,.42);border-radius:5px;
  padding:.4em .5em;cursor:pointer;text-align:left;
  font-family:"Titillium Web",-apple-system,"Segoe UI",Roboto,Helvetica,sans-serif;
  font-size:1.10vw;line-height:1.22;color:#9db8d6}                             /* 15.03px */
.gt23 .gt23-gaugebtn:hover,
.gt23 .gt23-gaugebtn:focus-visible{border-color:#dbad50;color:#e8edf3;outline:none}
.gt23 .gt23-gauge{display:block;width:100%;height:auto}
.gt23 .gt23-bar{fill:#82a0bc;opacity:.42}
.gt23 .gt23-bar-on{fill:#dbad50;opacity:1}

/* ---------------- col B: the four second-level elements ---------------- */
.gt23 .gt23-l2{left:17%;width:19%;height:17%}
.gt23 .gt23-b1{top:.5%}
.gt23 .gt23-b2{top:17%}
.gt23 .gt23-b3{top:33.5%}
.gt23 .gt23-b4{top:50%}
.gt23 .gt23-l2 .n{font-size:1.12vw;line-height:1.15;color:#f3f6fb;font-weight:700}  /* 15.30px */
.gt23 .gt23-l2 .c{font-size:1.10vw;line-height:1.2;color:#9db8d6;margin-top:.15em}  /* 15.03px */
.gt23 .gt23-l2.pick .n{color:#dbad50}

/* ---------------- col C: the third-level elements ---------------- */
.gt23 .gt23-l3{left:38%;width:19%;height:17%}
.gt23 .gt23-c1{top:2.5%}
.gt23 .gt23-c2{top:21%}
.gt23 .gt23-c3{top:39.5%}
.gt23 .gt23-l3 .n{font-size:1.12vw;line-height:1.15;color:#f3f6fb;font-weight:700}  /* 15.30px */
.gt23 .gt23-l3 .c{font-size:1.10vw;line-height:1.2;color:#9db8d6;margin-top:.15em}  /* 15.03px */
.gt23 .gt23-l3.pick .n{color:#dbad50}

.gt23 .gt23-more{position:absolute;left:38%;top:58%;width:19%;height:8%;
  box-sizing:border-box;background:transparent;border:1px dashed rgba(219,173,80,.5);
  border-radius:5px;color:#dbad50;cursor:pointer;
  font-family:"Titillium Web",-apple-system,"Segoe UI",Roboto,Helvetica,sans-serif;
  font-size:1.10vw;line-height:1.2;font-weight:700}                             /* 15.03px */
.gt23 .gt23-more:hover,
.gt23 .gt23-more:focus-visible{background:rgba(219,173,80,.16);outline:none}

/* ---------------- col D: the taxa themselves ---------------- */
.gt23 .gt23-tax{position:absolute;left:59%;top:1.5%;width:40%;height:97%;
  box-sizing:border-box;display:flex;flex-direction:column;gap:2px;
  justify-content:space-between;background:rgba(10,25,47,.72);border:1px solid rgba(219,173,80,.5);
  border-left:3px solid #dbad50;border-radius:5px;padding:.38em .55em}
.gt23 .gt23-tax .th{font-size:1.18vw;line-height:1.2;color:#dbad50;             /* 16.12px */
  font-weight:700;margin-bottom:.15em}
.gt23 .gt23-tax .tx{font-size:1.12vw;line-height:1.16;color:#e8edf3;            /* 15.30px */
  padding-left:.85em;position:relative}
.gt23 .gt23-tax .tx::before{content:"";position:absolute;left:0;top:.42em;
  width:.34em;height:.34em;background:#dbad50;border-radius:50%}

/* ---------------- the wires ---------------- */
.gt23 .gt23-wires{position:absolute;inset:0;width:100%;height:100%;display:block}
.gt23 .gt23-wire{fill:none;stroke:#82a0bc;stroke-width:2;stroke-linejoin:round;
  stroke-linecap:round;vector-effect:non-scaling-stroke;opacity:.85}
.gt23 .gt23-wire-hot{stroke:#dbad50;stroke-width:2.5;opacity:1}

/* ---------------- motion: the hidden state carries transition:none ----------
   autofit() lights every fragment under body.measuring; a hidden state that
   TRANSITIONS animates back to hidden and the room sees the slide paint fully
   built and then fade. That defect lived in 33 rules once already.           */
.gt23 .ob-reveal{opacity:0;transition:none}
.gt23 .ob-step.shown .ob-reveal{opacity:1;transition:opacity .3s ease}
body.measuring .gt23 .ob-reveal,
body.nobuild .gt23 .ob-reveal{opacity:1;transition:none}

/* ---------------- modals (every id prefixed gt23-) ---------------- */
.gt23 .mdl{border:1px solid #dbad50;border-left:4px solid #dbad50;border-radius:8px;
  background:#0a192f;color:#e8edf3;padding:1.1em 1.35em 1em;
  width:min(58vw,880px);max-height:82vh;overflow:auto;
  box-shadow:0 18px 60px rgba(0,0,0,.65);
  font-family:"Titillium Web",-apple-system,"Segoe UI",Roboto,Helvetica,sans-serif}
.gt23 .mdl::backdrop{background:rgba(4,12,26,.82)}
.gt23 .mdl h3{font-size:1.55vw;line-height:1.15;color:#dbad50;font-weight:700;  /* 21.17px */
  margin:0 0 .35em}
.gt23 .mdl .ms{font-size:1.18vw;line-height:1.42;color:#9db8d6;margin-bottom:.85em}  /* 16.12px */
.gt23 .gt23-mrow{display:grid;grid-template-columns:1fr 4.2em 4.2em 5em;gap:.6em;
  align-items:baseline;padding:.3em .35em;border-bottom:1px solid rgba(255,255,255,.10);
  font-size:1.15vw;line-height:1.28;color:#e8edf3;font-variant-numeric:tabular-nums}  /* 15.71px */
.gt23 .gt23-mrow.gt23-m2{grid-template-columns:1fr 5em}
.gt23 .gt23-mrow span:not(:first-child){text-align:right;color:#9db8d6}
.gt23 .gt23-mhead{color:#dbad50;font-weight:700;border-bottom:1px solid #dbad50}
.gt23 .gt23-mhead span:not(:first-child){color:#dbad50}
.gt23 .gt23-mpick{background:rgba(219,173,80,.14);border-radius:4px}
.gt23 .gt23-mpick span{color:#dbad50;font-weight:700}
.gt23 .gt23-mtot{font-weight:700;border-bottom:0;border-top:1px solid #dbad50;margin-top:.25em}
.gt23 .gt23-mgrp{font-size:1.18vw;line-height:1.3;color:#dbad50;font-weight:700;  /* 16.12px */
  margin:.8em 0 .2em;letter-spacing:.02em}
.gt23 .mdl form{margin-top:1em;display:flex;justify-content:flex-end}
.gt23 .mdl button{background:transparent;border:1px solid #dbad50;color:#dbad50;
  border-radius:6px;padding:.34em 1.1em;cursor:pointer;font-weight:700;
  font-family:"Titillium Web",-apple-system,"Segoe UI",Roboto,Helvetica,sans-serif;
  font-size:1.15vw;line-height:1.3}                                              /* 15.71px */
.gt23 .mdl button:hover,
.gt23 .mdl button:focus-visible{background:#dbad50;color:#0a192f;outline:none}

@media (prefers-reduced-motion:reduce){
  .gt23 .ob-step.shown .ob-reveal{transition:none}
}

/* ---- gt24 (frag_gt24.css) ---- */
/* ============================================================================
   gt24 - "Inside a second dimension" - Remedy Sought.

   ROUTE 3 (draw it). Four inline-SVG figures and nothing raster: a proportional
   band showing the whole dimension to scale, then three "racks" - one per
   second-level element - whose rows are the third-level elements with a
   measured count bar and one taxon quoted verbatim from the agreed TSV. Depth
   beyond that lives in four <dialog> modals holding all 92 taxa.

   WHY IT IS COMPOSED THIS WAY (deliberately unlike its sibling slide): the
   explanation box sits in a FIXED right-hand column, x 70-99%, while every
   figure is confined to x 0-68%. A box therefore cannot cover already-revealed
   art at any step - the collision class VISUAL_SPEC section 2 was written for -
   without needing a scrim on any step but the last.

   TYPE FLOOR. Every size below is in cqw, which on a .slide (container-type:
   inline-size) is 1% of SLIDE width. Floor 1.10cqw = 15.03px at a 1366px slide.
   SVG text is sized in viewBox USER UNITS, which is a different scale: each
   figure is 68% of the picture wide (viewBox 1203.6 units) and the picture is
   1770 units wide, so at a 1366px slide one user unit = 0.7161px. The floor in
   user units is therefore 15.03 / 0.7161 = 20.99, and the two SVG sizes used
   are 22 (15.76px) and 28 (20.05px). Computed, not eyeballed.

   BUTTONS. .gt24-ib and .gt24-more, .gt24-close all carry font-family:inherit
   and an EXPLICIT font-size. A <button> inherits neither, and silently renders
   at the 13.33px UA default - below the floor - if you let it.

   MOTION (VISUAL_SPEC section 7). Every hidden state carries transition:none;
   the fade lives only on the shown state. Otherwise autofit's body.measuring
   pass paints the slide fully built and animates it away, which the room sees
   as a flash before the build starts.

   CLASS PREFIXING. Every class here is gt24-prefixed, and every dialog id is
   gt24-prefixed, because all fragments splice into ONE document.
   ========================================================================== */

/* ---- fragment machinery, scoped so it cannot fight the deck's own copy ---- */
.slide.gt24 [data-frag]{opacity:0;transform:translateY(.28em);transition:none}
.slide.gt24 [data-frag].shown{opacity:1;transform:none;
  transition:opacity .26s ease,transform .26s ease}
body.measuring .slide.gt24 [data-frag]{opacity:1;transform:none;transition:none}
body.nobuild  .slide.gt24 [data-frag]{opacity:1;transform:none}

/* ---- slide shell --------------------------------------------------------- */
.slide.gt24{background:#0a192f;color:#e8edf3;
  font-family:"Titillium Web",-apple-system,"Segoe UI",Roboto,Helvetica,sans-serif}
.slide.gt24 h2{margin:0 0 .28em;color:#dbad50;font-weight:700;
  font-size:4.5cqw;line-height:1.04;letter-spacing:-.01em;text-wrap:balance}
.slide.gt24 .sub{margin:-.1em 0 .70em;color:#b9cfe6;
  font-size:1.95cqw;line-height:1.35;max-width:66ch}

/* ---- the picture --------------------------------------------------------- */
.gt24 .ob-pic{position:relative;width:100%;aspect-ratio:1770/750;margin:0 auto;
  max-height:66cqh;border-radius:4px;overflow:hidden;background:transparent}

/* Each step is a full-size transparent layer that passes the pointer THROUGH,
   so its contents stay reachable to the review overlay (VISUAL_SPEC 11). */
.gt24 .ob-step{position:absolute;inset:0;transform:none;pointer-events:none}
.gt24 .ob-step > *{pointer-events:auto}
.gt24 .ob-scrim{position:absolute;inset:0;background:rgba(6,16,34,.80);
  pointer-events:none}

/* ---- the four figures ---------------------------------------------------- *
   Each is left-aligned in the art zone (0-68% of the picture) and its viewBox
   aspect EQUALS its element aspect, so preserveAspectRatio="meet" letterboxes
   nothing: element w = .68*1770 = 1203.6 units, element h = pct*750 units.     */
.gt24 .ob-pic svg.gt24-fig{position:absolute;left:0;right:auto;bottom:auto;
  width:68%;display:block;overflow:visible}
.gt24 .gt24-fig-band{top:0;    height:16%}   /* viewBox 1203.6 x 120   */
.gt24 .gt24-fig-ra  {top:18%;  height:23%}   /* viewBox 1203.6 x 172.5 */
.gt24 .gt24-fig-cc  {top:43%;  height:23%}   /* viewBox 1203.6 x 172.5 */
.gt24 .gt24-fig-ia  {top:68%;  height:32%}   /* viewBox 1203.6 x 240   */

.gt24 .gt24-fig text{font-family:"Titillium Web",-apple-system,"Segoe UI",
  Roboto,Helvetica,sans-serif}

/* ---- the proportional band (step 1) -------------------------------------- */
.gt24 .gt24-hltp{fill:#dbad50;font-weight:700;letter-spacing:.06em}
.gt24 .gt24-meta{fill:#b9cfe6;font-weight:400}
.gt24 .gt24-seg{stroke:rgba(10,25,47,.55);stroke-width:1}
.gt24 .gt24-tick{stroke:#0a192f;stroke-width:2.5}
.gt24 .gt24-seglab{fill:#e8edf3;font-weight:700}
.gt24 .gt24-segsub{fill:#b9cfe6;font-weight:400}

/* ---- a rack: one second-level element, its third-level rows -------------- */
.gt24 .gt24-l2{fill:#dbad50;font-weight:700;letter-spacing:.055em}
.gt24 .gt24-rule{stroke:rgba(255,255,255,.10);stroke-width:1}
.gt24 .gt24-rule-hd{stroke:rgba(219,173,80,.45);stroke-width:1}
.gt24 .gt24-l3{fill:#e8edf3;font-weight:600}
.gt24 .gt24-trk{fill:rgba(219,173,80,.15)}
.gt24 .gt24-cnt{font-weight:700}
.gt24 .gt24-tax{fill:#b9cfe6;font-weight:400}
.gt24 .gt24-row:hover .gt24-tax{fill:#e8edf3}

/* ---- the round "i" badge that opens a second-level element's full list ---- *
   A <button> inherits NEITHER family nor size: both are stated outright.       */
.gt24 .gt24-ib{position:absolute;left:var(--x);top:var(--y);
  font-family:"Titillium Web",-apple-system,"Segoe UI",Roboto,Helvetica,sans-serif;
  font-size:1.30cqw;font-weight:700;line-height:1;font-style:italic;
  width:2.35cqw;height:2.35cqw;padding:0;border:0;border-radius:50%;
  color:#0a192f;background:#dbad50;cursor:pointer;
  display:grid;place-items:center;
  box-shadow:0 2px 8px rgba(0,0,0,.5);transition:transform .15s}
.gt24 .gt24-ib:hover,.gt24 .gt24-ib:focus-visible{transform:scale(1.12);outline:none;
  box-shadow:0 0 0 .25cqw rgba(219,173,80,.35)}

/* ---- the explanation box: exactly one on screen at a time ---------------- */
.gt24 .ob-note{position:absolute;left:var(--x);top:var(--y);width:var(--w);
  background:rgba(10,24,47,.94);border:1px solid rgba(219,173,80,.55);
  border-left:3px solid #dbad50;border-radius:5px;padding:.72em .9em;
  box-shadow:0 8px 26px rgba(0,0,0,.55);transition:opacity .2s ease}

/* ---- gt25 (frag_gt25.css) ---- */
/* ---- gt25 &#183; "One issue, seven readings" -------------------------------------
   The payoff fragment for the lower levels: ONE real congressional issue, read on
   all seven dimensions at once, with the verbatim taxon from
   TAXONOMY_AGREED_2026-09-01.tsv on each.

   ROUTE 3 (draw it). There is no source figure for this and never was, so the
   whole picture is one inline SVG: an issue card, a beam, a prism, and seven rays
   into seven labelled readings. No plate, no reveal image, nothing rastered.

   ONE SVG, NOT EIGHT. VISUAL_SPEC section 6: every .ob-step is a full-size layer,
   so a per-step <svg> would stack eight full-size overlays and swallow the pointer.
   Instead the art is a SINGLE static <svg> child of .ob-pic and each reading is a
   <g class="gt25-lay gt25-rN"> lit from the step's own .shown class through :has().
   Each .ob-step therefore carries only its .ob-note - which is exactly what the
   spec says a box-only step should carry.

   TYPE FLOOR, COMPUTED NOT EYEBALLED. Inline SVG text is measured against the
   viewBox. Worst case for this fragment:
     .ob-pic is width:100% of the slide content box (92.8% of slide width after the
     3.6% side padding) BUT is also clamped by max-height:66cqh, and #stage is the
     nearest container with block containment. In present mode stage height is
     slide_width * 9/16, so the clamped picture width is
       66% * (W * 9/16) * 1770/750 = 0.876 * W.
     The viewBox is 1770 wide, so a viewBox font-size F renders at
       F * 0.876 * W / 1770 = 0.000495 * F * W  px.
     The 1.10%-of-slide-width floor is therefore F >= 22.2.
   gt01 measured that .ob-pic does NOT always keep its declared aspect (it read 2.60
   against a declared 2.6 - it is a shrinkable flex item). At 2.60 the meet-fitted
   SVG loses a further 9.2% of scale, which pushes the floor to F >= 24.5. NOTHING
   in this fragment is below 26, so the smallest glyph holds at 1.29% of slide width
   in the nominal case and 1.17% in the shrunk case. Both clear the floor.

   HTML type on this slide uses cqw, which is 1% of the SLIDE's inline size - the
   stricter and more literal reading of "1.10% of slide width" than vw, since the
   slide is never wider than the viewport. Nothing is below 1.32cqw (18.0px at
   1366), and the two <button>s carry an explicit size plus font-family:inherit,
   because a button does NOT inherit font-size and silently falls to the 13.33px UA
   default - the trap that shipped today.

   COLOUR. Ground #0a192f; the seven rays run a warm-to-cool ramp anchored at the
   two house accents, gold #dbad50 through to light blue #82a0bc, so the prism reads
   as a spectrum without leaving the palette. All PROSE is off-white #e8edf3 or
   #b9cfe6 (luminance 237 and 205); gold and the ramp are used for accents, rules
   and headings only, matching every other slide in the deck.
   ------------------------------------------------------------------------------ */

/* ---------- the picture ---------- */
.gt25 .ob-pic{aspect-ratio:1770/750;max-height:66cqh;background:#0a192f;border-radius:5px}
.gt25 .ob-pic > svg.gt25-svg{position:absolute;inset:0;width:100%;height:100%;display:block}

/* ---------- hit-testing (VISUAL_SPEC section 11) ----------------------------
   A .ob-step is a full-size transparent layer. Without these two rules the LAST
   step's layer sits over every earlier note and the modal buttons cannot be
   clicked at all, even though they are visible. The layer passes the pointer
   through; its contents take it. */
.gt25 .ob-step{pointer-events:none}
.gt25 .ob-step > *{pointer-events:auto}
.gt25 .ob-scrim{pointer-events:none}

/* ---------- the seven readings light one per click --------------------------
   Hidden state carries transition:none. autofit() lights every fragment under
   body.measuring, and a hidden state that TRANSITIONS animates back to hidden -
   the slide paints fully built and fades away, which the room sees as a flash
   before the build starts. The fade lives on the SHOWN state only. */
.gt25 .gt25-lay{opacity:0;transition:none}
.gt25 .ob-pic:has(.gt25-s1.shown) .gt25-r1,
.gt25 .ob-pic:has(.gt25-s2.shown) .gt25-r2,
.gt25 .ob-pic:has(.gt25-s3.shown) .gt25-r3,
.gt25 .ob-pic:has(.gt25-s4.shown) .gt25-r4,
.gt25 .ob-pic:has(.gt25-s5.shown) .gt25-r5,
.gt25 .ob-pic:has(.gt25-s6.shown) .gt25-r6,
.gt25 .ob-pic:has(.gt25-s7.shown) .gt25-r7{opacity:1;transition:opacity .32s ease}
/* measuring must see the built state, and B (builds off) must show everything */
body.measuring .gt25 .gt25-lay,
body.nobuild  .gt25 .gt25-lay{opacity:1;transition:none}

/* ---------- the explanation boxes ----------
   Slightly tightened from the house default so a 200-character box clears the
   picture: at --w:27% the content column is ~294px at 1366, 1.40cqw is 19.1px,
   ~33 characters a line, seven lines, ~232px against a 507px picture. */

<template id="deck"><section class="slide vqcov" data-audience="all" data-n="OPENING. Van vage naar toetsbare vraag, AIRA-training, dinsdag 13 oktober 2026, 09:00–10:15, Den Haag. Jesse modereert; Stephan verzorgt de inhoud. WAT DEZE SESSIE IS: sinds computers ‘mens’ hebben leren spreken, is natuurlijke taal weer onze belangrijkste interface met ze. Maar mensen denken en communiceren vager dan ze beseffen, en die vaagheid gaat rechtstreeks over in de kwaliteit van wat een AI teruggeeft. Deze sessie gaat over de VRAAG, niet over de prompt: hoe een vraag die je krijgt, vaak vaag of impliciet, een onderzoeksvraag wordt die een corpus en een taalmodel kunnen beantwoorden. DE ENE ZIN OM TE ONTHOUDEN (programmagids): voordat je een vraag stelt, moet duidelijk zijn wat goede en slechte antwoorden zijn – vaak vergeten, maar cruciaal. Of in Stephans ontwerpnotitie: vooraf bepalen hoe een goed antwoord eruitziet, is de kern van prompt engineering. WAT JULLIE MEEBRENGEN: de onderzoeksvraag v1 van maandag met haar drie deelvragen, voor de studie die je groep heeft geërfd (Transparent Battlefield, Grey-Zone Warfare of Effective Deterrence). Vraag de groepen die tekst open te hebben. WAT JULLIE MEENEMEN: een scherpere vraag (op weg naar v2), per deelvraag een beschrijving van een goed en een slecht antwoord, en de eerste relevantiecriteria voor de hands-on van 13:00. TIMING: 75 minuten; ongeveer 45 minuten input, een oefening van 25 minuten en 5 minuten overdracht. Coverbeeld: een getekend schema (een diffuse puntenwolk die door een lens wordt gebundeld tot één scherp doel); het is een metafoor, geen data." data-sec="why" data-sid="vq-cover" data-t="Van vage naar toetsbare vraag"><svg aria-label="Schema: een diffuse puntenwolk, een vage vraag, wordt door een lens gebundeld tot één scherp doel, een toetsbare vraag" class="vqcov-art" preserveaspectratio="xMidYMid slice" role="img" viewbox="0 0 1600 900"><path class="vqcov-grid" d="M0 0 V900"></path><path class="vqcov-grid" d="M50 0 <section class="slide obuild vqday" data-audience="all" data-n="WAAR DEZE SESSIE PAST, ONGEVEER 4 MINUTEN. Bouw één onderdeel per klik op, in de volgorde van de twee dagen, en daarna de boog eronder. (1) MAANDAG 15:00, PROJECTKICK-OFF: elke groep heeft een van drie HCSS-studies met de bijbehorende dataset geërfd (Transparent Battlefield, Grey-Zone Warfare, Effective Deterrence) en is vertrokken met onderzoeksvraag v1 en drie deelvragen. Vraag: wie heeft v1 open? Zorg dat elke groep de eigen tekst kan zien; ze hebben hem nodig in de oefening. (2) NU, 09:00–10:15: deze sessie (Jesse en Stephan). Hier gebeuren twee dingen: v1 wordt scherper, en per deelvraag bepaal je vooraf hoe een goed en een slecht antwoord eruitziet. Dat tweede deel noemt de programmagids ex-ante-evaluatie. (3) 10:30 RUSLAND LEZEN (LILIIA) EN 11:20 KEN JE BRONNEN (JESSE EN STEPHAN). Rusland Lezen: Russische strategische cultuur, officiële retoriek en doctrinetaal lezen, en human-in-the-loop: AI als hypothesegenerator, de analist als validator. Ken je Bronnen is nieuw: het vervangt de oorspronkelijke derde ochtendsessie, omdat de groepen op dag 1 niet aan bronverkenning zijn toegekomen. Daar verkennen ze wat er echt in hun dataset zit (bronnen, databases, periodes, relevantie, lengte) met de interactieve visualisaties van de thema’s. De ruiscatalogus en de uitsluitingscriteria die daar ontstaan, gaan rechtstreeks de relevantieprompt van 13:00 in. Loop niet vooruit op de inhoud van beide sessies. (4) 13:00 HANDS-ON – RELEVANTIEPROMPT (Jesse, Liliia en Nidas): elke groep schrijft een relevantieprompt voor de eigen onderzoeksvraag en test die op 100 fragmenten uit de eigen dataset, met gestructureerde JSON-output. (5) 15:00 PROJECTWERK (Jesse, Stephan, Nidas en Liliia): de oplevering is onderzoeksvraag v2 en een relevantieprompt die op 100 fragmenten is getest. (6) DE BOOG: pauzeer hier. De middagprompt beslist welke fragmenten relevant zijn, en relevant betekent altijd relevant VOOR EEN VRAAG. Is de vraag vaag, dan vult het model de gaten met zijn eigen standaardaannames, en geen promptvakmanschap repareert dat. Ken je Bronnen laat daarna zien wat het corpus kan beantwoorden, nog voordat de prompt geschreven wordt. Het uur dat we nu besteden, is dus waar de middag op rust. Alleen een verwijzing, niet opnieuw uitleggen: maandag behandelde de prompt-valkuilen." data-sec="why" data-sid="vq-day" data-t="Waar deze sessie in de dag past">

<section class="slide obuild vqrec" data-audience="all" data-n="VRAGEN KOMEN BINNEN, ONGEVEER 7 MINUTEN. De echte casus achter een van de drie studies die de groepen erven: Effective Deterrence. Bron: de HCSS-notitie ‘Mogelijke onderwerpen RuBase analyses voor CLAS – na overleg (250902)’, het voorstel dat na het overleg van vrijdag 29 augustus 2025 naar het Commando Landstrijdkrachten (CLAS) ging. Alles wat op de slide geciteerd wordt, staat letterlijk in die notitie, in het Engels van de notitie zelf; daarom blijven de citaten Engels en zijn alleen de labels en uitlegblokken Nederlands. Bouw op in vier klikken. (1) HET OVERLEG: op 29 augustus 2025 sprak HCSS met CLAS. CLAS kwam met een eigen lijst vragen. De notitie zegt dat het onderwerp Effective deterrence ‘reflects Q2 from CLAS’. We tonen de eigen formulering van CLAS-vraag 2 niet, omdat de notitie die niet geeft; parafraseer haar niet uit het hoofd. (2) VERBREED: dezelfde notitie zegt dat het onderwerp ‘has been broadened in line with the face-to-face discussion with CLAS’. Eén vraag van de klant werd vier onderzoeksvragen. Lees de twee volledige vragen hardop voor. Vraag de zaal: welke woorden in deze twee zou je moeten definiëren voordat een corpus ze kan beantwoorden? Verwachte antwoorden: credible (geloofwaardig), effective (effectief), perceived (waargenomen), political will (politieke wil), en deterrence (afschrikking) zelf. Los ze hier niet op; de ladder en de vijf toetsen komen hierna. (3) DE QUICK SCAN: voor onderwerp 1 en 2 (Grey zone en Effective deterrence) maakt de notitie van een quick scan de eerste stap: nagaan of het corpus genoeg substantie bevat voor een zinvolle analyse. Wijs erop dat dit een stap VOOR de analyse is: controleren of de bronnen het onderwerp überhaupt bespreken. (4) DE LES: Stephans ontwerpnotitie voor deze sessie zegt dat hij de vraagformulering op zich neemt omdat het team zijn vragen meestal krijgt. Een ontvangen vraag is het begin van het werk. Brug: de groepen deden gistermiddag hetzelfde toen ze een studie erfden; de volgende slide geeft ze een ladder om te beklimmen." data-sec="why" data-sid="vq-received" data-t="Vragen komen binnen; zelden als onderzoeksvraag">

<section class="slide obuild vqlad" data-audience="all" data-n="DE VRAGENLADDER, ONGEVEER 8 MINUTEN. Bouw één sport per klik op. Het voorbeeld op de sporten is een ILLUSTRATIE die voor deze sessie is geschreven, over het thema afschrikking (hetzelfde thema als de CLAS-casus op de vorige slide); het is geen HCSS-onderzoeksvraag en geen bevinding. Zeg dat erbij. Het gaat om wat elke sport TOEVOEGT, niet om deze specifieke formulering. (1) ZORG: ‘Werkt de afschrikking van de NAVO op Rusland?’ Zo komen vragen binnen. Vraag de zaal: hoe zou een goed antwoord hierop eruitzien? Laat ze merken dat ze dat niet kunnen zeggen. Elk antwoord, ja of nee, klinkt aannemelijk. (2) ANALYTISCHE VRAAG: die noemt wiens blik en waarover. Voor een corpus van Russischtalige teksten is dat beslissend: je kunt bestuderen hoe Russische bronnen afschrikking ZIEN; of afschrikking WERKT, staat niet in de tekst (de volgende slide pakt dit op met de Transparent Battlefield-vraag). (3) ONDERZOEKSVRAAG: nu is er een afbakening (een periode, brontypen), een gedefinieerd object (vooruitgeschoven troepen op de oostflank) en een analyse-eenheid (de framing in een tekstfragment). De drie opties, dreiging, bluf of beperking, leggen de VORM van het antwoord al vast: een typologie met aandelen. De periode 2024–2025 is een illustratieve keuze. (4) DEELVRAGEN: drie, in hetzelfde format als maandag. Elk heeft een eigen antwoordvorm: een rangorde, een typologie, een vergelijking. (5) OBSERVEERBARE SIGNATUUR: wat zou er opduiken, in welke bronnen, hoe vaak en wanneer. Dit is de sport die een relevantieprompt fragment voor fragment kan toetsen, en ze vertelt je vooraf welke uitkomst je zou verrassen. Afsluiting: de meeste vragen die we krijgen, staan op sport 1 of 2; vanochtend tillen de groepen de hunne naar sport 5. Pauzeer voor vragen voordat je verdergaat. Ter vergelijking: de geüploade v1 van de Effective Deterrence-groep staat al op sport 3 tot 4 (periode, kwartalen, geadresseerden, brontypen); dia 10 laat dat zien." data-sec="craft" data-sid="vq-ladder" data-t="De vragenladder">
<h2>De vragenladder</h2>
<p class="sub">Elke sport maakt de vraag concreter. <b class="vqlad-ill">Illustratie over het thema afschrikking, geschreven voor deze sessie.</b></p>
<div class="ob-pic">
<div class="ob-step" data-frag="1">
<div class="vqlad-rung" style="--i:0"><div class="vqlad-lab"><span class="vqlad-n">1</span><span class="vqlad-nm">Zorg</span></div>
<p class="vqlad-ex vqlad-big">“Werkt de afschrikking van de NAVO op Rusland?”</p></div>
<div class="ob-note" style="--x:52.5%;--y:1.5%;--w:46%"><div class="k">Sport 1 · de zorg</div><div class="d">Zo komen vragen meestal binnen: belangrijk, maar zonder afbakening, zonder gedefinieerde begrippen en zonder manier om een goed antwoord van een slecht te onderscheiden. Ja en nee klinken allebei aannemelijk.</div></div>
</div>
<div class="ob-step" data-frag="1">
<div class="vqlad-rung" style="--i:1"><div class="vqlad-lab"><span class="vqlad-n">2</span><span class="vqlad-nm">Analytische vraag</span></div>
<p class="vqlad-ex">Hoe zien Russische bronnen de afschrikkingshouding van de NAVO in Europa?</p></div>
<div class="ob-note" style="--x:65%;--y:1.5%;--w:33.5%"><div class="k">Sport 2 · wiens blik, waarover</div><div class="d">Ze noemt het perspectief en het onderwerp. Met een corpus van Russische teksten is dat beslissend: je kunt bestuderen hoe Russische bronnen afschrikking zien, niet of afschrikking werkt.</div></div>
</div>
<div class="ob-step" data-frag="1">
<div class="vqlad-rung" style="--i:2"><div class="vqlad-lab"><span class="vqlad-n">3</span><span class="vqlad-nm">Onderzoeks­vraag</span></div>
<p class="vqlad-ex">Hoe framen Russische officiële bronnen en expertbronnen de vooruitgeschoven NAVO-troepen op de oostflank in 2024–2025: als dreiging, als bluf of als beperking?</p></div>
<div class="ob-note" style="--x:65%;--y:1.5%;--w:33.5%"><div class="k">Sport 3 · afbakening, begrippen, eenheid</div><div class="d">Nu is er een afbakening (een periode, brontypen), een gedefinieerd object (vooruitgeschoven troepen) en een analyse-eenheid: de framing in een tekst. De drie opties leggen de vorm van het antwoord al vast.</div></div>
</div>
<div class="ob-step" data-frag="1">
<div class="vqlad-rung" style="--i:3"><div class="vqlad-lab"><span class="vqlad-n">4</span><span class="vqlad-nm">Deelvragen</span></div>
<p class="vqlad-ex">(a) Welke NAVO-maatregelen noemen ze het vaakst? (b) Hoe wordt elke maatregel geframed? (c) Verschilt de framing tussen officiële bronnen en expertbronnen?</p></div>
<div class="ob-note" style="--x:1.5%;--y:61%;--w:35%"><div class="k">Sport 4 · beantwoordbare delen</div><div class="d">Elke deelvraag is op zichzelf te beantwoorden en heeft een eigen antwoordvorm: een rangorde, een typologie, een vergelijking. Samen beantwoorden ze de onderzoeksvraag.</div></div>
</div>
<div class="ob-step" data-frag="1">
<div class="vqlad-rung vqlad-last" style="--i:4"><div class="vqlad-lab"><span class="vqlad-n">5</span><span class="vqlad-nm">Observeerbare signatuur</span></div>
<p class="vqlad-ex">Fragmenten die een NAVO-maatregel noemen en typeren, geteld per maand en per brontype. Als afschrikking beperkt, verwacht je na verloop van tijd meer framing als “beperking”.</p></div>
<div class="ob-note" style="--x:1.5%;--y:61%;--w:35%"><div class="k">Sport 5 · wat zou er opduiken</div><div class="d">Wat verschijnt in welke bronnen, hoe vaak en wanneer. Een relevantieprompt kan dit fragment voor fragment toetsen, en je weet vooraf welke uitkomst je zou verrassen.</div></div>
</div>
</div>

<section class="slide obuild vqc" data-audience="all" data-n="WAT EEN CORPUS KAN BEANTWOORDEN (ongeveer 5 minuten; vier klikken). De kern van deze slide: een onderzoeksvraag is maar zo goed als het bewijs dat haar kan beantwoorden, en in ons werk is dat bewijs een corpus van teksten. KLIK 1, DE VRAAG. Lees de onderzoeksvraag van Transparent Battlefield hardop voor, letterlijk uit paragraaf 2.1 van het HCSS-rapport From the Fog of War to the Fever of Exposure: ‘To what extent does the emergence of the transparent battlefield, according to the Russians, influence the character of the fighting in Ukraine?’ (In welke mate beïnvloedt de opkomst van het ‘transparante slagveld’, volgens de Russen, het karakter van de gevechten in Oekraïne?) De vraag staat op de slide in het Engelse origineel. Sta stil bij de vier gemarkeerde woorden. Zonder die woorden gaat de vraag over het slagveld zelf, en dat kan geen verzameling teksten beslechten. Met die woorden gaat ze over wat Russische bronnen zeggen, en dat kan het corpus wel. De corpusregel komt uit paragraaf 2.2: Russischtalige teksten, voorgeselecteerd met de bredere RUW-taxonomie, plus andere brondatabases, 14 databases in totaal, met officieel, expert- en socialemediacommentaar. VRAAG DE ZAAL: wat zou je nodig hebben om de vraag ZONDER die vier woorden te beantwoorden? (Satellietbeelden, gegevens over gevechtsschade, gerubriceerde rapportage: niet in het corpus.) KLIK 2, GROEN: te beantwoorden uit de tekst. Framing, wie het zegt, hoe vaak, verandering in de tijd, verschillen tussen brontypen. Dit zijn eigenschappen van de teksten zelf, dus een model dat fragmenten leest, kan ze meten. KLIK 3, AMBER: met voorzichtigheid af te leiden. Intentie, coördinatie, prioriteiten. Je kunt er vanuit de patronen naartoe redeneren, maar de tekst toont alleen wat iemand koos te zeggen; label deze antwoorden als afleidingen en houd het voorbehoud. KLIK 4, ROOD: niet te beantwoorden uit dit corpus. Werkelijke capaciteiten, besluiten achter gesloten deuren, de feitelijke situatie op het slagveld. Een vraag die deze nodig heeft, is niet fout; ze heeft ander bewijs nodig. Laat het model niet doen alsof. De voorbeeldregels in de drie banden zijn illustraties die ik voor het TB-thema heb geschreven, geen bevindingen uit het rapport; zeg dat erbij. OVERGANG: bepaal dus voordat je vraagt in welke band je vraag thuishoort, en bepaal dan hoe een goed antwoord daar zou uitzien: volgende slide." data-sec="craft" data-sid="vq-corpus" data-t="Wat een corpus kan beantwoorden">
<h2>Wat een corpus kan beantwoorden</h2>
<p class="sub">Transparent Battlefield: het corpus bevat wat Russische bronnen <i>zeggen</i>, niet wat <i>is</i>.</p>
<div class="ob-pic">
<div class="ob-step" data-frag="1">
<div class="vqc-q"><p class="vqc-lab">Transparent Battlefield · de centrale onderzoeksvraag van het rapport (Engels origineel)</p>
<p class="vqc-qt">To what extent does the emergence of the “transparent battlefield,” <span class="vqc-hl">according to the Russians</span>, influence the character of the fighting in Ukraine?</p>
<p class="vqc-cor">Corpus: Russischtalige teksten (RUW-taxonomie) plus andere bronnen · 14 databases: officieel, expert- en socialemediacommentaar · HCSS, <i>From the Fog of War to the Fever of Exposure</i>, §2.1–2.2</p></div>
<div class="ob-note" style="--x:68.5%;--y:1.5%;--w:30.3%"><div class="k">Vier woorden maken haar beantwoordbaar</div><div class="d">“According to the Russians” (volgens de Russen) maakt van een vraag over het slagveld een vraag over wat Russische bronnen zeggen. Geen stapel teksten beslecht het eerste; een corpus van Russischtalige teksten kan het tweede wel onderzoeken.</div></div>
</div>
<div class="ob-step" data-frag="1">
<span class="vqc-ill">voorbeelden: illustratie</span>
<div class="vqc-band vqc-g" style="--y:33.5%">
<svg aria-label="Een pagina met een vinkje: te beantwoorden uit de tekst" class="vqc-ico" viewbox="0 0 100 80"><rect class="vqc-ibg" height="80" rx="6" width="100" x="0" y="0"></rect><path class="vqc-is" d="M18 10 H52 L62 20 V70 H18 Z M26 30 H52 M26 40 H52 M26 50 H44" style="stroke:#7fd08a"></path><path class="vqc-is" d="M64 48 L74 58 L90 34" style="stroke:#7fd08a"></path></svg>
<div class="vqc-body"><p class="vqc-bt">Te beantwoorden uit de tekst</p>
<div class="vqc-chips"><span class="vqc-chip">hoe X wordt geframed</span><span class="vqc-chip">door wie</span><span class="vqc-chip">hoe vaak</span><span class="vqc-chip">verandering in de tijd</span><span class="vqc-chip">verschillen tussen brontypen</span></div>
<p class="vqc-eg"><b>bijv.</b> Noemen oorlogscorrespondenten op Telegram dronesurveillance vaker dan officiële bronnen?</p></div>
</div>
<div class="ob-note" style="--x:68.5%;--y:20%;--w:30.3%"><div class="k">Beantwoordbaar: wat de teksten zelf tonen</div><div class="d">Framing, sprekers, frequentie, verandering in de tijd en verschillen tussen brontypen zijn eigenschappen van de documenten. Een model dat fragmenten leest, kan ze meten, en jij kunt dat controleren door dezelfde fragmenten te lezen.</div></div>
</div>
<div class="ob-step" data-frag="1">
<div class="vqc-band vqc-a" style="--y:56%">
<svg aria-label="Een pagina met een vraagteken: met voorzichtigheid af te leiden" class="vqc-ico" viewbox="0 0 100 80"><rect class="vqc-ibg" height="80" rx="6" width="100" x="0" y="0"></rect><path class="vqc-is" d="M18 10 H52 L62 20 V70 H18 Z M26 30 H52 M26 40 H52 M26 50 H44" style="stroke:#e8c26a"></path><path class="vqc-is" d="M68 36 C68 26 86 26 86 36 C86 44 77 44 77 52 M77 61 L77 63" style="stroke:#e8c26a"></path></svg>
<div class="vqc-body"><p class="vqc-bt">Met voorzichtigheid af te leiden</p>
<div class="vqc-chips"><span class="vqc-chip">intentie</span><span class="vqc-chip">coördinatie</span><span class="vqc-chip">prioriteiten</span></div>
<p class="vqc-eg"><b>bijv.</b> Behandelt de militaire leiding contrasurveillance als prioriteit? Alleen voor zover haar uitspraken en hun timing dat suggereren.</p></div>
</div>
<div class="ob-note" style="--x:68.5%;--y:38%;--w:30.3%"><div class="k">Afleidbaar: een redenering, geen lezing</div><div class="d">Intentie, coördinatie en prioriteiten kun je beargumenteren vanuit patronen in wat er gezegd wordt, maar de tekst toont alleen wat iemand koos te zeggen. Label deze antwoorden als afleidingen en houd het voorbehoud.</div></div>
</div>
<div class="ob-step" data-frag="1">
<div class="vqc-band vqc-r" style="--y:78.5%">
<svg aria-label="Een doorgestreepte pagina: niet te beantwoorden uit dit corpus" class="vqc-ico" viewbox="0 0 100 80"><rect class="vqc-ibg" height="80" rx="6" width="100" x="0" y="0"></rect><path class="vqc-is" d="M18 10 H52 L62 20 V70 H18 Z M26 30 H52 M26 40 H52 M26 50 H44" style="stroke:#e0956a"></path><path class="vqc-is" d="M68 32 L88 56 M88 32 L68 56" style="stroke:#e0956a"></path></svg>
<div class="vqc-body"><p class="vqc-bt">Niet te beantwoorden uit dit corpus</p>
<div class="vqc-chips"><span class="vqc-chip">capaciteiten</span><span class="vqc-chip">besluiten achter gesloten deuren</span><span class="vqc-chip">de feitelijke situatie op het slagveld</span></div>
<p class="vqc-eg"><b>bijv.</b> Hoeveel Russische drones vliegen werkelijk verkenning aan een bepaald front?</p></div>
</div>
<div class="ob-note" style="--x:68.5%;--y:56%;--w:30.3%"><div class="k">Hier niet te beantwoorden</div><div class="d">Wat strijdkrachten echt kunnen, wat achter gesloten deuren is besloten en wat er op de grond gebeurt, staat niet in een corpus van commentaar. Zo’n vraag heeft ander bewijs nodig; een model dat je het toch vraagt, antwoordt toch.</div></div>
</div>
</div>
<img class="aira-logo" src="img/aira/hcss-logo/hcss-logo.jpg" alt="HCSS"></section>
<section class="slide obuild vqe" data-audience="all" data-n="BEPAAL HOE EEN GOED ANTWOORD ERUITZIET, VOORDAT JE VRAAGT (ongeveer 7 minuten; vijf klikken). Dit is het hart van de sessie. De programmagids zegt het onomwonden: voordat je een vraag stelt, moet duidelijk zijn wat goede en slechte antwoorden zijn; dat wordt vaak vergeten, maar is cruciaal. En in de ontwerpnotitie: vooraf bepalen hoe een goed antwoord eruitziet, is de kern van prompt engineering. KLIK 1, HET VERZOEK. Een echt verzoek. Na het overleg met het Commando Landstrijdkrachten (CLAS) op 29 augustus 2025 was een van de drie onderwerpen die HCSS voorstelde ‘hot topics’ in het actuele discours. Lees de onderzoeksvraag letterlijk voor (de slide toont het Engelse origineel): ‘What are the most salient / upcoming &amp; interesting topics in the current (3 months bracket) Russian and Ukrainian discourse?’ (Wat zijn de meest opvallende / opkomende en interessante onderwerpen in het actuele Russische en Oekraïense discours, over een periode van drie maanden?) CLAS had ook benadrukt dat het een onbevooroordeeld beeld wilde van wat de bronnen zelf belangrijk vinden, in plaats van onderwerpen die wij van onze kant definiëren. VRAAG DE ZAAL: is dit een heldere vraag? De meeste mensen zeggen ja. KLIK 2, DE EIGEN NOTITIE VAN HCSS, letterlijk uit hetzelfde document: ‘we must also define what we mean by both hot (e.g. most mentioned!?) and topic (e.g. actor!?)’ (we moeten ook definiëren wat we bedoelen met zowel ‘hot’, bijvoorbeeld ‘het vaakst genoemd’, als ‘onderwerp’, bijvoorbeeld een actor). Let op de uitroep-vraagtekens: de auteurs wisten het zelf ook niet zeker. De andere lezingen in de kleine letters (het snelst stijgend, het meest omstreden; een gebeurtenis, een wapensysteem, een narratief) zijn van mij, ter discussie. Elk paar definities levert uit hetzelfde corpus een andere top tien op. Een model dat de ongedefinieerde vraag krijgt, kiest stilzwijgend één lezing, en je weet niet welke. KLIK 3, ANTWOORDVORMEN. Vijf gangbare vormen: een telling, een trend, een vergelijking, een typologie, een rangorde. Kies de vorm voordat je vraagt, want die bepaalt wat het model moet teruggeven en wat jij kunt controleren. ‘Hot topics’ is een rangorde, en als ‘upcoming’ (opkomend) ertoe doet, een rangorde met een trend. KLIK 4, GOED TEGENOVER SLECHT. De vraag en beide antwoorden zijn een illustratie die ik heb geschreven, geen HCSS-resultaat. Het slechte antwoord is vloeiend en aannemelijk en niet te controleren: geen definitie, geen getallen, geen periode, geen bewijs. Het goede antwoord is gedefinieerd, geteld, vergeleken met de vorige periode en herleidbaar tot fragmenten. De VORM van het goede antwoord kun je opschrijven voordat je iets vraagt; de inhoud komt later. KLIK 5, DE DRIE MOMENTEN, uit het evaluatiekader van de programmagids: ex ante (vooraf bepalen wat goede antwoorden zijn: vanochtend), interim (bijsturen tijdens het proces: vanmiddag, als de relevantieprompt 100 fragmenten uit je dataset tegenkomt), ex post (achteraf valideren: donderdag, menselijke validatie van een steekproef). Vandaag is het goedkoopste moment om een vraag te repareren." data-sec="craft" data-sid="vq-exante" data-t="Bepaal een goed antwoord voordat je vraagt">
<h2>Bepaal een goed antwoord voordat je vraagt</h2>
<p class="sub">“Hot topics”: het verzoek van de klant, en de eigen notitie van HCSS over wat het open laat.</p>
<div class="ob-pic">
<div class="ob-step" data-frag="1">
<div class="vqe-card vqe-ask"><p class="vqe-lab">Het verzoek · ‘Hot topics’ in het actuele discours (Engels origineel)</p>
<p class="vqe-qt">“What are the most salient / upcoming &amp; interesting topics in the current (3 months bracket) Russian and Ukrainian discourse?”</p>
<p class="vqe-src">HCSS-voorstel aan het Commando Landstrijdkrachten (CLAS), na het overleg van 29 augustus 2025</p></div>
<div class="ob-note" style="--x:69%;--y:1%;--w:30%"><div class="k">Een verzoek dat helder oogt</div><div class="d">Het Commando Landstrijdkrachten wilde weten wat Russische en Oekraïense bronnen zelf belangrijk vinden, over een periode van drie maanden. Het leest als een afgeronde vraag, tot je iets probeert te tellen.</div></div>
</div>
<div class="ob-step" data-frag="1">
<div class="vqe-card vqe-def"><p class="vqe-lab">De eigen notitie van HCSS, zelfde document</p>
<p class="vqe-note">“we must also define what we mean by both <span class="vqe-hk">‘hot’</span> (e.g. ‘most mentioned’!?) and <span class="vqe-hk">‘topic’</span> (e.g. actor!?)”</p>
<p class="vqe-alt"><b>Ook mogelijk:</b> hot = snelst stijgend, meest omstreden · topic = gebeurtenis, wapensysteem, narratief</p></div>
<div class="ob-note" style="--x:69%;--y:1%;--w:30%"><div class="k">Twee ongedefinieerde woorden, veel verschillende antwoorden</div><div class="d">“Meest genoemde actoren” en “snelst stijgende narratieven” leveren uit hetzelfde corpus twee verschillende toptienlijsten op. Stel een model de ongedefinieerde vraag en het kiest stilzwijgend één lezing voor je.</div></div>
</div>
<div class="ob-step" data-frag="1">
<div class="vqe-shapes">
<div class="vqe-sh"><svg aria-label="telling" viewbox="0 0 70 45"><text class="vqe-if" style="font-size:34px;font-weight:700" x="4" y="36">42</text></svg><p class="vqe-sn">Telling</p><p class="vqe-sd">hoeveel, hoe vaak</p></div>
<div class="vqe-sh"><svg aria-label="trend" viewbox="0 0 70 45"><path class="vqe-ic" d="M4 40 L22 28 L38 33 L64 8"></path></svg><p class="vqe-sn">Trend</p><p class="vqe-sd">verandering in de tijd</p></div>
<div class="vqe-sh"><svg aria-label="vergelijking" viewbox="0 0 70 45"><rect class="vqe-if" height="28" width="18" x="10" y="14"></rect><rect class="vqe-if" height="38" width="18" x="40" y="4"></rect></svg><p class="vqe-sn">Vergelijking</p><p class="vqe-sd">A tegenover B</p></div>
<div class="vqe-sh"><svg aria-label="typologie" viewbox="0 0 70 45"><path class="vqe-ic" d="M35 6 L12 38 M35 6 L35 38 M35 6 L58 38"></path></svg><p class="vqe-sn">Typologie</p><p class="vqe-sd">soorten X</p></div>
<div class="vqe-sh"><svg aria-label="rangorde" viewbox="0 0 70 45"><rect class="vqe-if" height="9" width="60" x="4" y="4"></rect><rect class="vqe-if" height="9" width="44" x="4" y="18"></rect><rect class="vqe-if" height="9" width="28" x="4" y="32"></rect></svg><p class="vqe-sn">Rangorde</p><p class="vqe-sd">de top N</p></div>
</div>
<div class="ob-note" style="--x:69%;--y:22%;--w:30%"><div class="k">Kies de vorm van het antwoord</div><div class="d">Een telling, een trend, een vergelijking, een typologie of een rangorde: kies er een voordat je vraagt. De vorm bepaalt wat het model moet teruggeven en wat jij kunt controleren. “Hot topics” is een rangorde, plus een trend als “upcoming” (opkomend) ertoe doet.</div></div>
</div>
<div class="ob-step" data-frag="1">
<p class="vqe-ex vqe-qq vqe-qline"><span class="vqe-ill">illustratie</span> <b>V:</b> Welke actoren (onderwerp = actor) stegen dit kwartaal het sterkst in Russische bronnen?</p>
<div class="vqe-ex vqe-bad"><p class="vqe-et">Slecht antwoord</p><p class="vqe-eq">“Het discours wordt gedomineerd door drones, mobilisatie en de economie.” Vloeiend, aannemelijk, onmogelijk te controleren.</p></div>
<div class="vqe-ex vqe-good"><p class="vqe-et">Goed antwoord</p><p class="vqe-eq">Tien actoren naar aandeel fragmenten, met de verandering t.o.v. vorig kwartaal, twee geciteerde fragmenten per actor, en de handmatig gecontroleerde steekproef die het bevestigt.</p></div>
<div class="ob-note" style="--x:69%;--y:40%;--w:30%"><div class="k">De vorm van het goede antwoord schrijf je vandaag</div><div class="d">Het slechte antwoord heeft geen definitie, geen getallen, geen periode en geen bewijs. Het goede is gedefinieerd, geteld, vergeleken en herleidbaar tot fragmenten. De inhoud komt later; de vorm leg je vast voordat je iets vraagt.</div></div>
</div>
<div class="ob-step" data-frag="1">
<div class="vqe-mom">
<div class="vqe-m vqe-now"><p class="vqe-mn">Ex ante · vanochtend</p><p class="vqe-md">vooraf bepalen wat goede antwoorden zijn</p></div>
<div class="vqe-m"><p class="vqe-mn">Interim · vanmiddag</p><p class="vqe-md">bijsturen terwijl de prompt 100 fragmenten tegenkomt</p></div>
<div class="vqe-m"><p class="vqe-mn">Ex post · donderdag</p><p class="vqe-md">achteraf valideren: mensen controleren een steekproef</p></div>
</div>
<div class="ob-note" style="--x:69%;--y:60%;--w:30%"><div class="k">Drie momenten om te evalueren</div><div class="d">Ex ante is de goedkoopste van de drie: een vraag repareren kost nu minuten, en later een volledige nieuwe run. De 100 fragmenten van vanmiddag en de menselijke controle van donderdag toetsen wat je vanochtend beslist.</div></div>
</div>
</div>

<section class="slide obuild vqt" data-audience="all" data-n="VIJF TOETSEN VOOR EEN ONDERZOEKSVRAAG (ongeveer 5 minuten; vijf klikken). Deze vijf toetsen zijn de checklist voor de oefening straks, en de volgende slide past ze toe op een echte HCSS-vraag, dus houd de namen en de volgorde vast: Afgebakend, Gedefinieerd, Observeerbaar, Vormgegeven, Verrasbaar. De rode draad, die in elk uitlegblok staat: een taalmodel zegt nooit ‘je vraag is onduidelijk’. Het vult elk gat dat je laat met zijn eigen standaardaanname, vloeiend, en je ziet niet welke aanname het koos. Elke toets dicht één soort gat. KLIK 1, AFGEBAKEND: welke periode, welke brontypen, welke actoren. Zonder die drie antwoordt het model over ‘Rusland’ in het algemeen, vanuit wat in zijn trainingsdata toevallig oververtegenwoordigd is. KLIK 2, GEDEFINIEERD: de kernbegrippen, en ook hun Russische equivalenten, want de bronnen zijn Russisch en hetzelfde Nederlandse of Engelse woord kan op meerdere Russische woorden slaan (we komen op een latere slide terug op afschrikking). KLIK 3, OBSERVEERBAAR: het antwoord moet zichtbaar worden in tekst die echt in je corpus zit. Dit is het punt van de vorige slides, omgezet in een toets. KLIK 4, VORMGEGEVEN: je kent de vorm van het antwoord voordat je vraagt: telling, trend, vergelijking, typologie, rangorde. KLIK 5, VERRASBAAR: het antwoord kan tegen je verwachting in uitvallen. Als elke mogelijke uitkomst je beeld bevestigt, kan de vraag je niets leren, en een model dat geneigd is je gelijk te geven (maandag: jaknikken, sycophancy) maakt het erger. VRAAG DE ZAAL: neem de v1 van je groep van gisteren; voor welke van de vijf zakt hij het eerst? Neem één antwoord per groep; repareer het nog niet, dat is de oefening. De pictogrammen zijn platte tekeningen in één stijl. Dia 10 (Jullie v1, langs de vijf toetsen) past ze toe op de vragen die de groepen maandag uploadden." data-sec="craft" data-sid="vq-tests" data-t="Vijf toetsen voor een onderzoeksvraag">
<h2>Vijf toetsen voor een onderzoeksvraag</h2>
<p class="sub">Elk gat dat je laat, vult een taalmodel met zijn eigen standaardaanname.</p>
<div class="ob-pic">
<div class="ob-step" data-frag="1">
<div class="vqt-row" style="--y:1%"><span class="vqt-n">1</span>
<svg aria-label="Snijtekens rond een kalender: afgebakend" class="vqt-ico" viewbox="0 0 100 80"><rect class="vqt-bg" height="80" rx="6" width="100" x="0" y="0"></rect><path class="vqt-s" d="M14 24 V12 H28 M72 12 H86 V24 M86 56 V68 H72 M28 68 H14 V56"></path><rect class="vqt-s" height="28" rx="3" width="32" x="34" y="26"></rect><path class="vqt-s" d="M34 35 H66 M42 22 V30 M58 22 V30"></path></svg>
<div class="vqt-tx"><p class="vqt-nm">Afgebakend</p><p class="vqt-ln">Ze noemt de periode, de brontypen en de actoren.</p></div><div class="vqt-gap"><p class="vqt-gk">Blijft het open, dan neemt het model aan</p><p class="vqt-gd">“Rusland” in het algemeen, elk jaar, elke bron</p></div></div>
<div class="ob-note" style="--x:68.5%;--y:1%;--w:30.3%"><div class="k">Afgebakend: waar je kijkt</div><div class="d">Zonder periode, brontypen en actoren antwoordt het model over “Rusland” in het algemeen, vanuit wat in zijn trainingsdata toevallig oververtegenwoordigd is. Jouw afbakening is het kader waar het niet buiten mag treden.</div></div>
</div>
<div class="ob-step" data-frag="1">
<div class="vqt-row" style="--y:21%"><span class="vqt-n">2</span>
<svg aria-label="Twee letterparen verbonden door een isgelijkteken: gedefinieerd" class="vqt-ico" viewbox="0 0 100 80"><rect class="vqt-bg" height="80" rx="6" width="100" x="0" y="0"></rect><text class="vqt-t" x="12" y="50">Aa</text><path class="vqt-s" d="M44 36 H56 M44 46 H56"></path><text class="vqt-t" x="60" y="50">Яя</text></svg>
<div class="vqt-tx"><p class="vqt-nm">Gedefinieerd</p><p class="vqt-ln">De kernbegrippen zijn gedefinieerd, ook zoals ze in het Russisch voorkomen.</p></div><div class="vqt-gap"><p class="vqt-gk">Blijft het open, dan neemt het model aan</p><p class="vqt-gd">zijn eigen alledaagse betekenis</p></div></div>
<div class="ob-note" style="--x:68.5%;--y:13%;--w:30.3%"><div class="k">Gedefinieerd: wat de woorden betekenen</div><div class="d">Een ongedefinieerd begrip krijgt de alledaagse betekenis van het model, en die is misschien niet de jouwe. Omdat de bronnen Russisch zijn, definieer je elk kernbegrip ook via de Russische woorden die het in een fragment zouden signaleren.</div></div>
</div>
<div class="ob-step" data-frag="1">
<div class="vqt-row" style="--y:41%"><span class="vqt-n">3</span>
<svg aria-label="Een oog boven een pagina: observeerbaar" class="vqt-ico" viewbox="0 0 100 80"><rect class="vqt-bg" height="80" rx="6" width="100" x="0" y="0"></rect><path class="vqt-s" d="M30 46 H70 V72 H30 Z M38 56 H62 M38 64 H56"></path><path class="vqt-s" d="M22 24 C34 8 66 8 78 24 C66 40 34 40 22 24 Z"></path><circle class="vqt-f" cx="50" cy="24" r="7"></circle></svg>
<div class="vqt-tx"><p class="vqt-nm">Observeerbaar</p><p class="vqt-ln">Het antwoord blijkt uit tekst die in dit corpus zit.</p></div><div class="vqt-gap"><p class="vqt-gk">Blijft het open, dan neemt het model aan</p><p class="vqt-gd">feiten uit zijn trainingsdata, niet uit je corpus</p></div></div>
<div class="ob-note" style="--x:68.5%;--y:30%;--w:30.3%"><div class="k">Observeerbaar: in je corpus</div><div class="d">Kan het antwoord niet opduiken in de teksten die je hebt, dan haalt het model er een van elders en brengt het met dezelfde stelligheid. Vraag je af wat een fragment zou moeten zeggen om als bewijs te tellen.</div></div>
</div>
<div class="ob-step" data-frag="1">
<div class="vqt-row" style="--y:61%"><span class="vqt-n">4</span>
<svg aria-label="Een lege grafiek die op data wacht: vormgegeven" class="vqt-ico" viewbox="0 0 100 80"><rect class="vqt-bg" height="80" rx="6" width="100" x="0" y="0"></rect><path class="vqt-s" d="M18 12 V66 H84"></path><rect class="vqt-s" height="20" style="stroke-dasharray:4 4" width="12" x="28" y="40"></rect><rect class="vqt-s" height="34" style="stroke-dasharray:4 4" width="12" x="48" y="26"></rect><rect class="vqt-s" height="26" style="stroke-dasharray:4 4" width="12" x="68" y="34"></rect></svg>
<div class="vqt-tx"><p class="vqt-nm">Vormgegeven</p><p class="vqt-ln">De vorm van het antwoord staat vooraf vast.</p></div><div class="vqt-gap"><p class="vqt-gk">Blijft het open, dan neemt het model aan</p><p class="vqt-gd">een vloeiend essay dat je niet kunt controleren</p></div></div>
<div class="ob-note" style="--x:68.5%;--y:46%;--w:30.3%"><div class="k">Vormgegeven: eerst de vorm</div><div class="d">Telling, trend, vergelijking, typologie of rangorde. Laat je de vorm open, dan schrijft het model een essay dat goed leest en niet te controleren is. Leg de vorm vast en je weet wat je moet nagaan.</div></div>
</div>
<div class="ob-step" data-frag="1">
<div class="vqt-row" style="--y:81%"><span class="vqt-n">5</span>
<svg aria-label="Een weegschaal die beide kanten op kan doorslaan: verrasbaar" class="vqt-ico" viewbox="0 0 100 80"><rect class="vqt-bg" height="80" rx="6" width="100" x="0" y="0"></rect><path class="vqt-s" d="M50 14 V66 M36 66 H64 M20 26 L80 18 M20 26 L12 46 H30 Z M80 18 L72 38 H88 Z"></path><circle class="vqt-f" cx="50" cy="20" r="5"></circle></svg>
<div class="vqt-tx"><p class="vqt-nm">Verrasbaar</p><p class="vqt-ln">Het antwoord kan tegen je in uitvallen.</p></div><div class="vqt-gap"><p class="vqt-gk">Blijft het open, dan neemt het model aan</p><p class="vqt-gd">wat jij al lijkt te denken</p></div></div>
<div class="ob-note" style="--x:68.5%;--y:59%;--w:30.3%"><div class="k">Verrasbaar: ze kan je ongelijk geven</div><div class="d">Als elke mogelijke uitkomst bevestigt wat je al denkt, kan de vraag je niets leren. Een model dat geneigd is je gelijk te geven, maakt dat alleen erger; schrijf dus op welk antwoord je zou verrassen.</div></div>
</div>
</div>

<section class="slide obuild vqws" data-audience="all" data-n="EEN UITGEWERKTE AANSCHERPING (ongeveer 8 minuten; zeven klikken). Thema: Grey-Zone Warfare, een van de drie studies die de groepen erven. KLIK 1, DE VRAAG, letterlijk uit het HCSS-voorstel aan het Commando Landstrijdkrachten (CLAS) na het overleg van 29 augustus 2025, onder ‘Grey-zone Confrontation Potential’; de slide toont het Engelse origineel: ‘How does the Kremlin perceive (1) our (alleged) hybrid actions against Russia; and (2) our counter measures and societal resilience, both nationally and as a collective (NATO/EU)?’ (Hoe percipieert het Kremlin (1) onze (vermeende) hybride acties tegen Rusland; en (2) onze tegenmaatregelen en maatschappelijke weerbaarheid, zowel nationaal als collectief (NAVO/EU)?) Zeg duidelijk: dit is een goede analytische vraag, geschreven door HCSS-collega’s, en de klant heeft haar aanvaard. We bekritiseren haar niet; we laten zien wat ze nog nodig heeft voordat een corpus en een model haar kunnen beantwoorden. VRAAG DE ZAAL vóór elke klik: wat vindt deze toets? De gemarkeerde woorden in de vraag wisselen per toets. KLIK 2, AFGEBAKEND: geen periode, geen brontypen; ‘het Kremlin’ kan de presidentiële administratie zijn, het ministerie van Buitenlandse Zaken, staatsmedia of loyale commentatoren. KLIK 3, GEDEFINIEERD: hybride acties, tegenmaatregelen en maatschappelijke weerbaarheid zijn alle drie ongedefinieerd, en Russische bronnen gebruiken er mogelijk andere woorden voor. KLIK 4, OBSERVEERBAAR: ‘perceive’ (waarnemen) is een gemoedstoestand; een corpus toont wat er gezegd wordt. Herschrijf naar hoe bronnen beschrijven of framen. KLIK 5, VORMGEGEVEN: de vraag zegt niet welke vorm het antwoord heeft: een lijst, een trend, een vergelijking van nationaal en collectief. KLIK 6, VERRASBAAR: het verwachte antwoord, dat Moskou westerse acties vijandig noemt, vind je hoe dan ook; vraag naar iets dat beide kanten op kan vallen. KLIK 7, EEN MOGELIJKE AANSCHERPING. Alles in de gouden kaart is mijn eigen formulering, ter discussie, geen HCSS-vraag of -bevinding. De periode is bewust als plaatshouder open gelaten: die hangt af van wat je dataset beslaat. Elke deelvraag draagt haar antwoordvorm. Deelvraag 2 en 3 zijn de verrasbare: niemand in de zaal weet vooraf of Russische bronnen de westerse weerbaarheid als sterk of als zwak beschrijven, of dat nationale maatregelen, bijvoorbeeld Nederlandse, anders worden geframed dan die van NAVO/EU. Vraag de Grey-Zone-groep of dit de aanscherping is die zij zouden kiezen, en wat ze zouden veranderen." data-sec="worked" data-sid="vq-worked" data-t="Een uitgewerkte aanscherping">
<h2>Een uitgewerkte aanscherping</h2>
<p class="sub">Grey-Zone Warfare: één HCSS-onderzoeksvraag langs de vijf toetsen.</p>
<div class="ob-pic">
<div class="ob-step vqws-s1" data-frag="1">
<div class="vqws-q"><p class="vqws-lab">Grey-Zone Warfare · HCSS-voorstel aan het Commando Landstrijdkrachten (CLAS), na 29 augustus 2025 · Engels origineel</p>
<p class="vqws-qt">“How does <span class="vqws-h vqws-h1">the Kremlin</span> <span class="vqws-h vqws-h3">perceive</span> (1) our <span class="vqws-h vqws-h2">(alleged) hybrid actions</span> against Russia; and (2) our <span class="vqws-h vqws-h2">counter measures</span> and <span class="vqws-h vqws-h2">societal resilience</span> – <span class="vqws-h vqws-h4">both nationally and as a collective (NATO/EU)</span>?”</p></div>
<div class="ob-note" style="--x:60.3%;--y:1%;--w:38.7%"><div class="k">Een goede analytische vraag</div><div class="d">HCSS schreef haar en de klant aanvaardde haar, terecht. Het is nog geen onderzoeksvraag: voordat een corpus en een model haar kunnen beantwoorden, moet ze door de vijf toetsen.</div></div>
</div>
<div class="ob-step vqws-s2" data-frag="1">
<div class="vqws-t" style="--y:28.5%"><p class="vqws-tn">1 · Afgebakend</p><div class="vqws-tb"><p class="vqws-gap"><b>Gat:</b> geen periode, geen brontypen; “het Kremlin” kan Poetin zijn, Buitenlandse Zaken, staatsmedia of loyale commentatoren.</p><p class="vqws-fix"><b>Fix:</b> noem de periode, de brontypen en welke stemmen meetellen.</p></div></div>
<div class="ob-note" style="--x:60.3%;--y:1%;--w:38.7%"><div class="k">Afgebakend: wie is “het Kremlin”?</div><div class="d">Het antwoord verandert met de stemmen die je meetelt. Officiële verklaringen en loyale Telegramkanalen kunnen dezelfde westerse maatregel heel verschillend beschrijven, dus de vraag moet zeggen welke ze bedoelt.</div></div>
</div>
<div class="ob-step vqws-s3" data-frag="1">
<div class="vqws-t" style="--y:42.8%"><p class="vqws-tn">2 · Gedefinieerd</p><div class="vqws-tb"><p class="vqws-gap"><b>Gat:</b> hybride acties, tegenmaatregelen en maatschappelijke weerbaarheid zijn niet gedefinieerd, noch hier, noch in het Russisch.</p><p class="vqws-fix"><b>Fix:</b> bepaal wat telt als elk begrip, en welke Russische woorden het signaleren.</p></div></div>
<div class="ob-note" style="--x:60.3%;--y:1%;--w:38.7%"><div class="k">Gedefinieerd: drie open begrippen</div><div class="d">Is een sanctiepakket een “hybride actie”? Is een campagne voor civiele bescherming “weerbaarheid”? Blijft het ongedefinieerd, dan beslist het model per fragment, en misschien elke keer anders.</div></div>
</div>
<div class="ob-step vqws-s4" data-frag="1">
<div class="vqws-t" style="--y:57.1%"><p class="vqws-tn">3 · Observeerbaar</p><div class="vqws-tb"><p class="vqws-gap"><b>Gat:</b> “perceive” (waarnemen) is een gemoedstoestand; het corpus toont alleen wat er gezegd wordt.</p><p class="vqws-fix"><b>Fix:</b> vraag hoe de bronnen beschrijven en framen, niet wat ze waarnemen.</p></div></div>
<div class="ob-note" style="--x:60.3%;--y:1%;--w:38.7%"><div class="k">Observeerbaar: gezegd, niet gedacht</div><div class="d">Geen tekst toont wat het Kremlin waarneemt, alleen wat Russische bronnen kiezen te zeggen. Vragen naar beschrijvingen en framings houdt de vraag binnen wat het corpus kan beantwoorden.</div></div>
</div>
<div class="ob-step vqws-s5" data-frag="1">
<div class="vqws-t" style="--y:71.4%"><p class="vqws-tn">4 · Vormgegeven</p><div class="vqws-tb"><p class="vqws-gap"><b>Gat:</b> geen vorm voor het antwoord: een lijst, een trend, een vergelijking van nationale en NAVO/EU-maatregelen?</p><p class="vqws-fix"><b>Fix:</b> kies een vorm voor elke deelvraag.</p></div></div>
<div class="ob-note" style="--x:60.3%;--y:1%;--w:38.7%"><div class="k">Vormgegeven: de vergelijking zit er al in</div><div class="d">“Nationally and as a collective” (nationaal en collectief) hint naar een vergelijking, maar de vraag vraagt er nergens om. Maak haar expliciet, dan weten jij en het model wat voor resultaat er moet komen.</div></div>
</div>
<div class="ob-step vqws-s6" data-frag="1">
<div class="vqws-t" style="--y:85.7%"><p class="vqws-tn">5 · Verrasbaar</p><div class="vqws-tb"><p class="vqws-gap"><b>Gat:</b> “Moskou noemt westerse acties vijandig” is het verwachte antwoord, en dat vind je hoe dan ook.</p><p class="vqws-fix"><b>Fix:</b> vraag ook iets dat beide kanten op kan vallen.</p></div></div>
<div class="ob-note" style="--x:60.3%;--y:1%;--w:38.7%"><div class="k">Verrasbaar: wat zou je kunnen leren?</div><div class="d">Iedereen in de zaal kan voorspellen dat Russische bronnen westerse maatregelen vijandig noemen. Of ze onze weerbaarheid als sterk of als zwak beschrijven, is een uitkomst die je niet kunt voorspellen.</div></div>
</div>
<div class="ob-step vqws-s7" data-frag="1">
<div class="vqws-sh"><p class="vqws-shk">Een mogelijke aanscherping <span class="vqws-ill">illustratie, ter discussie</span></p>
<p class="vqws-rq">Hoe beschrijven officiële Russische verklaringen en Russische staatsmedia in [de periode die je dataset beslaat] (1) westerse acties die zij hybride noemen, en (2) westerse tegenmaatregelen en maatschappelijke weerbaarheid, nationaal en NAVO/EU?</p>
<div class="vqws-sq"><p class="vqws-sqt"><b>DV1</b> Welke westerse acties worden hybride genoemd, en hoe vaak per kwartaal?</p><span class="vqws-shp">Telling + trend</span></div>
<div class="vqws-sq"><p class="vqws-sqt"><b>DV2</b> Worden tegenmaatregelen en weerbaarheid geframed als dreiging, als zwakte of als effectief?</p><span class="vqws-shp">Typologie: aandeel fragmenten per frame</span></div>
<div class="vqws-sq"><p class="vqws-sqt"><b>DV3</b> Worden nationale maatregelen (bijv. Nederlandse) anders geframed dan die van NAVO/EU?</p><span class="vqws-shp">Vergelijking: nationaal tegenover collectief</span></div></div>
<div class="ob-note" style="--x:60.3%;--y:74%;--w:38.7%"><div class="k">Dezelfde vraag, nu toetsbaar</div><div class="d">Ze heeft nu een afbakening, gedefinieerde begrippen, een observeerbaar object en een vorm per deelvraag. DV2 en DV3 kunnen allebei tegen ons uitvallen.</div></div>
</div>
</div>

<section class="slide obuild vqw" data-audience="all" data-n="DE WOORDEN DRAGEN HET ANTWOORD (ongeveer 6 minuten). Na de uitgewerkte aanscherping nog één laag: ook een goed afgebakende vraag kan het antwoord via haar formulering laten kantelen. Drie mechanismen, één per klik, en dan de afsluiting. Alle voorbeeldvragen en herformuleringen op de slide zijn illustraties ter discussie, voor deze sessie geschreven; het zijn geen citaten van een klant of uit een rapport. Thema: Rusland en de NAVO, afschrikking. KLIK 1, PRESUPPOSITIE. Lees de vraag hardop voor: ‘Waarom escaleert de NAVO?’ Vraag de zaal: wat heeft deze vraag al besloten? (Antwoord: dat de NAVO escaleert.) Een model gaat niet in tegen de premisse; het levert aannemelijke redenen waarom de premisse klopt. De herformulering vraagt eerst of en hoe, en dan pas waarom, en vraagt volgens wie, en dat is wat ons corpus echt kan tonen (verwijs terug naar de corpusslide: het corpus bevat wat Russische bronnen zeggen, niet wat is). KLIK 2, DE EIGEN WOORDEN VAN HET NARRATIEF. ‘Collectieve Westen’ (коллективный Запад) en ‘speciale militaire operatie’ (СВО) zijn geen neutrale labels; elk draagt een frame (één vijandig Westen; een beperkte operatie in plaats van een oorlog). Schrijf je ze zonder aanhalingstekens in je vraag, dan redeneert het model vanuit dat frame. Regel: citeer, neem niet over. Zet de term tussen aanhalingstekens en maak het gebruik ervan tot onderzoeksobject. Pauzeer: vraag de Ruslandanalisten in de zaal om nog een term die zij zouden citeren in plaats van overnemen. KLIK 3, VERTALING. Het Russische сдерживание dekt zowel afschrikking (deterrence) als indamming (containment), en de Russische ‘strategische afschrikking’ (стратегическое сдерживание) omvat ook niet-militaire middelen. ‘Afschrikking’ in je vraag en in de bronnen is dus misschien niet hetzelfde begrip. Dit raakt de Effective Deterrence-groep het meest, maar elke groep heeft zo’n woord: vraag elke groep tijdens de oefening het hare te noemen. Dit is de toets ‘Gedefinieerd’ uit de vijf toetsen: definieer kernbegrippen ook in het Russisch. KLIK 4, DE AFSLUITING. Twee manieren om te falen. Een vage vraag laat het model elk gat vullen met zijn eigen standaardaannames. Een sturende vraag krijgt instemming: dat is de jaknikkersvalkuil (sycophancy) van maandag, dus leg die niet opnieuw uit, verwijs er alleen naar. Overgang: nu doe je dit met je eigen vraag." data-sec="worked" data-sid="vq-words" data-t="De woorden dragen het antwoord">
