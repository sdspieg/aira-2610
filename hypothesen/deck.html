<section class="slide obuild hylo" data-audience="all" data-n="WAT HET MODEL BEDACHT. Casus: Noordelijk Signaal, FICTIEF. Dit is echte modeluitvoer: de HCSS-hypotheseprompt (vier vaste perspectieven, zie de vorige slide) gedraaid op dezelfde steekproef van 80 documenten uit het casuspakket die ook de taxonomiedemo gebruikte (op één na staat elke doc_id die het model citeert in die steekproef). Het model werkte in het Engels; de slide toont een Nederlandse weergave. Beweringen over afwezigheid die aan de steekproef gebonden zijn, zijn nagelopen in het volledige pakket van 1.000 documenten: geen enkel official_ru-document koppelt het Noordpoolgebied aan Oekraïne of aan Europese raketten (Medvedevs eigen post van Dag 4, NS-0722, noemt de speciale militaire operatie alleen als iets waarvan Rusland zich niet laat afleiden); de H4-lezing ‘geen rally-effect’ is die van het model, op basis van zijn steekproef. Bronbestand: demo_outputs/hypotheses_multiperspective.md. Bouw per klik één hypothese op (ongeveer een minuut per stuk), dan de vergelijkingsstap. H1 HEFBOOM VOOR GENÈVE (van de Chinese analist, c1): gecontroleerde signalen om Arctische veiligheid en voorwaartse ontplooiingen op de agenda VS–Rusland voor strategische stabiliteit te krijgen; voorspelt het Noordpoolgebied als formeel agendapunt en kalmere retoriek zodra het daar staat; sterkste bewijs NS-0013. H2 WIG IN NOORWEGEN (Chinese analist c2, plus een deel van a2 van de planner): Oslo bilateraal onder druk zetten; voorspelt doelwitkeuze alleen op Noorwegen en versterking van Noorse onvrede; het model noteert ertegen dat de concessie uit Londen kwam, niet uit Oslo. H3 BASTIONVERDEDIGING (planner van de Generale Staf, a1): echte dreigingsperceptie over geallieerde onderzeebootbestrijding (ASW) bij het SSBN-bastion op Kola; voorspelt militaire activiteit die de geallieerde kalender volgt; ertegen: inspectie eindigde Dag 12, onderzeeboot verwacht op Dag 16. H4 BINNENLANDSE AFLEIDING (binnenlands adviseur van het Kremlin, b1, met b2 erin opgenomen): voorspelt dreigementen in binnenlandse setting (Poetin bij het gouverneursoverleg over de begroting, Dag 8); ertegen: de kanalen in Moermansk blijven gedomineerd door klachten (NS-0373, NS-0764), geen zichtbaar rally-effect. H5 GEEN CAMPAGNE (scepticus d1): geen dirigent; citeer NS-0871. H6 GEREGISSEERDE AMBIGUÏTEIT (scepticus d2 plus a2): de misleidingshypothese, in scène gezette incoherentie die H5 nabootst; het model markeert zelf dat ze moeilijk te falsifiëren is en dat het corpus mogelijk bewust gevoed is. H7 OEKRAÏNE HERKADEREN (Chinese analist c3): het model noemt haar zwak onderbouwd en zet haar op de volglijst. VERGELIJKING MET DE CASUSONTWERPERS: voordat de documenten werden gegenereerd, noemde het scenarioboek zeven verklaringen: (1) afschrikking van een waargenomen echte militaire dreiging, (2) onderhandelingshefboom in aanloop naar Genève, (3) binnenlands publiek, (4) wig in Noorwegen, (5) ongecoördineerde stemmen, (6) opmaat naar escalatie, of misleiding (Dag 7 als bewuste zichtbaarheid), (7) signaal gericht aan China of andere derde partijen. Oekraïne herkaderen staat er niet op. Misleiding wel, maar alleen als bewuste zichtbaarheid van de opslaglocatie op Kola; H6 van het model gaat verder (de incoherentie zelf is het ontwerp). Wees hier precies: de brief zei dat beide nieuw zijn; strikt genomen is alleen H7 helemaal nieuw, H6 is een scherpere versie van een idee van de ontwerpers. Wat het model NIET opleverde (opmaat naar escalatie, China als geadresseerde) komt op de volgende slide." data-sec="do" data-sid="hy-llmout" data-t="Wat het model bedacht">
<h2>Wat het model bedacht</h2>
<p class="sub">Noordelijk Signaal: wat de HCSS-prompt opleverde (Opus 5.5, 80 documenten).</p>
<div class="ob-pic">
<div class="hylo-tag">FICTIEF – trainingscasus</div>
<div class="ob-step" data-frag="1">
<div class="hylo-row" style="--y:0%"><p class="hylo-n"><b>H1</b> Hefboom voor Genève</p><p class="hylo-c">Gecontroleerde signalen om Arctische veiligheid en voorwaartse ontplooiingen op de agenda <span style="white-space:nowrap">VS–Rusland</span> voor strategische stabiliteit te krijgen.</p></div>
<div class="ob-note" style="--x:65%;--y:2%;--w:34.5%"><div class="k">Vanuit de Chinese analist</div><div class="d">Klopt dit, dan duikt het Noordpoolgebied op als formeel Russisch agendapunt, en wordt de retoriek rustiger zodra het daar staat. Het sterkste bewijs volgens het model: NS-0013, waarin het ministerie van Buitenlandse Zaken op Dag 3 het Noordpoolgebied koppelt aan de gesprekken over strategische stabiliteit.</div></div>
</div>
<div class="ob-step" data-frag="1">
<div class="hylo-row" style="--y:13.35%"><p class="hylo-n"><b>H2</b> Wig in Noorwegen</p><p class="hylo-c">Oslo bilateraal onder druk zetten: het kleinste gastland isoleren zodat het de geallieerde aanwezigheid terugschroeft, en de NAVO-solidariteit zien rafelen.</p></div>
<div class="ob-note" style="--x:65%;--y:8%;--w:34.5%"><div class="k">De NAVO testen via haar kleinste gastland</div><div class="d">Klopt dit, dan blijven de eisen op Oslo gericht in plaats van op Londen of Washington, en versterken Russische staatsmedia de Noorse onvrede. Het eigen bezwaar van het model: de enige concessie, het uitgestelde bezoek van de onderzeeboot, kwam uit Londen, niet uit Oslo.</div></div>
</div>
<div class="ob-step" data-frag="1">
<div class="hylo-row" style="--y:26.7%"><p class="hylo-n"><b>H3</b> Bastionverdediging</p><p class="hylo-c">Echte zorg bij de Generale Staf over geallieerde onderzeebootjacht en mariniers bij het kernonderzeebootbastion op Kola: afschrikking, geen onderhandeling.</p></div>
<div class="ob-note" style="--x:65%;--y:18%;--w:34.5%"><div class="k">Vanuit de planner van de Generale Staf</div><div class="d">Klopt dit, dan volgt de Russische militaire activiteit de oefenkalender van de bondgenoten, niet de kalender van Genève. Ertegen: de onaangekondigde inspectie eindigde op Dag 12, vier dagen voordat de Britse onderzeeboot in Tromsø werd verwacht.</div></div>
</div>
<div class="ob-step" data-frag="1">
<div class="hylo-row" style="--y:40.05%"><p class="hylo-n"><b>H4</b> Binnenlandse afleiding</p><p class="hylo-c">Het publiek is Russisch: een dreiging van buiten verdringt de woede over bezuinigingen, lonen, verwarming en een vastgelopen front, en sust de haviken.</p></div>
<div class="ob-note" style="--x:65%;--y:30%;--w:34.5%"><div class="k">Vanuit de binnenlandse adviseur van het Kremlin</div><div class="d">Klopt dit, dan duiken dreigementen op in binnenlandse setting, zoals Poetins “middelen die niemand anders heeft” op een gouverneursoverleg over bezuinigingen (Dag 8). Ertegen, in de steekproef van het model: de lokale kanalen in Moermansk blijven praten over koude radiatoren en achterstallige lonen, dus een rally-effect is niet zichtbaar.</div></div>
</div>
<div class="ob-step" data-frag="1">
<div class="hylo-row" style="--y:53.4%"><p class="hylo-n"><b>H5</b> Geen campagne</p><p class="hylo-c">Geen centraal doel: een routinematige militaire kalender plus ongecoördineerde retoriek van instanties. Waarnemers stellen het “signaal” zelf samen.</p></div>
<div class="ob-note" style="--x:65%;--y:40%;--w:34.5%"><div class="k">Vanuit de scepticus</div><div class="d">De scepticus moest ingaan tegen de voor de hand liggende westerse lezing van een samenhangende dwangcampagne. Klopt dit, dan komen de stemmen nooit samen en steunt niemand Medvedev. Een milblogger in het corpus zegt het letterlijk: “vijf stemmen, één orkest en geen dirigent” (NS-0871).</div></div>
</div>
<div class="ob-step" data-frag="1">
<div class="hylo-row" style="--y:66.75%"><p class="hylo-n"><b>H6</b> Geregisseerde ambiguïteit</p><p class="hylo-c">Misleiding: de incoherentie is gespeeld. Ontkenbare stemmen en zichtbare activiteit verhogen goedkoop het gevoelde nucleaire risico en bootsen H5 na.</p></div>
<div class="ob-note" style="--x:65%;--y:30%;--w:34.5%"><div class="k">Het tweede idee van de scepticus: misleiding</div><div class="d">Het voorspelt dat de stemmen samenkomen zodra er iets te halen valt, en dat Medvedev nooit wordt teruggefloten. Het model noemt zelf de zwakte: H6 is moeilijk te falsifiëren, en het corpus kan zelf bewust gevoed zijn.</div></div>
</div>
<div class="ob-step" data-frag="1">
<div class="hylo-row" style="--y:80.1%"><p class="hylo-n"><b>H7</b> Oekraïne herkaderen</p><p class="hylo-c">Genève herdefiniëren als nucleair risicobeheer tussen grootmachten: Arctische rust ruilen tegen concessies rond Oekraïne, en Kyiv buitenspel zetten.</p></div>
<div class="ob-note" style="--x:65%;--y:40%;--w:34.5%"><div class="k">Het derde idee van de Chinese analist</div><div class="d">Klopt dit, dan gaan Russische verklaringen het Noordpoolgebied bundelen met raketten in Europa en met Oekraïne, en waarschuwt Kyiv dat het buiten de boot valt. Het model acht het zwak onderbouwd: geen officieel Russisch document in zijn steekproef van 80 legt dat verband, en ook niet in het volledige pakket.</div></div>
</div>
<div class="ob-step" data-frag="1">
<div class="hylo-mark" style="--y:66.75%"></div><p class="hylo-chip" style="--y:66.75%">scherper dan de versie van de ontwerpers</p>
<div class="hylo-mark" style="--y:80.1%"></div><p class="hylo-chip" style="--y:80.1%">niet op de lijst van de ontwerpers</p>
<div class="ob-note" style="--x:65%;--y:4%;--w:34.5%"><div class="k">Invalshoeken die de casusontwerpers niet hadden opgeschreven</div><div class="d">Voordat ze de documenten genereerden, schreven de ontwerpers van de casus zeven eigen verklaringen op. Oekraïne herkaderen zit daar niet bij. Misleiding wel, maar alleen als bewuste zichtbaarheid bij een opslaglocatie op Kola; het model ging verder en stelde dat de hele incoherentie in scène gezet kan zijn.</div></div>
</div>
</div>

<section class="slide obuild hycp" data-audience="all" data-n="VERGELIJKEN, ONGEVEER 5 MINUTEN VAN HET BLOK VAN 10 MINUTEN VOOR VERGELIJKEN EN SELECTEREN. Casus: Noordelijk Signaal, FICTIEF. In de les zet elke groep haar eigen lijst uit Ronde 1 links; op de slide staat de lijst van de casusontwerpers voor een menselijk team. BRONNEN: links = de zeven concurrerende verklaringen in het scenarioboek (_build/scenario_bible.md), geschreven voordat er één document was gegenereerd: (1) afschrikking van een waargenomen echte militaire dreiging, (2) onderhandelingshefboom in aanloop naar Genève, (3) binnenlands publiek, (4) wig in Noorwegen, (5) ongecoördineerde stemmen, (6) opmaat naar escalatie, of misleiding (Dag 7 als bewuste zichtbaarheid), (7) signaal gericht aan China of andere derde partijen. Rechts = de zeven van het model (demo_outputs/hypotheses_multiperspective.md). KOPPELING (oordeel van de trainer, zeg dat erbij): 1 = H3 Bastionverdediging, 2 = H1 Hefboom voor Genève, 3 = H4 Binnenlandse afleiding, 4 = H2 Wig in Noorwegen, 5 = H5 Geen campagne, 6-misleiding = H6 gedeeltelijk. Alleen de ontwerpers: opmaat naar escalatie; China als geadresseerde (het model noemt Peking alleen binnen zijn lens van de Chinese analist, als stille steun voor H7, nooit als geadresseerde). Alleen het model: H7 Oekraïne herkaderen; en de draai van H6 dat de incoherentie zelf in scène is gezet om H5 na te bootsen. Het model werkte in het Engels; de slide toont Nederlandse namen. BOODSCHAP: overlap is waar je begint, geen bewijs; ideeën die alleen mensen hadden blijven op de lijst en vertellen je welk perspectief de prompt miste; ideeën die alleen het model had, moeten tegen de documenten worden gecontroleerd voordat je ze overneemt, omdat een model vlot en toch stellig ongelijk kan hebben. Hier was het model eerlijk over H7 (geen Russisch officieel document in zijn steekproef koppelt het Noordpoolgebied aan Oekraïne). Laat de antwoordsleutel voor trainers niet zien; deze slide gebruikt alleen de open lijst uit het scenarioboek." data-sec="do" data-sid="hy-compare" data-t="Vergelijk: wat zag elke kant?">
<h2>Vergelijk: wat zag elke kant?</h2>
<p class="sub">Noordelijk Signaal: een menselijke lijst en de lijst van het model, naast elkaar.</p>
<div class="ob-pic">
<div class="hycp-tag">FICTIEF – trainingscasus</div>
<div class="ob-step" data-frag="1">
<div class="hycp-ell hycp-l"></div>
<p class="hycp-ttl" style="--x:0%;--w:30%">Mensen: de zeven van de casusontwerpers<br/><span>(in plaats van jullie lijst uit Ronde 1)</span></p>
<div class="ob-note" style="--x:64%;--y:2%;--w:35.5%"><div class="k">Jullie lijst, hier gespeeld door de casusontwerpers</div><div class="d">Voordat er één document was gegenereerd, schreven de ontwerpers van deze fictieve casus zeven verklaringen op die het bewijs open moest laten. Hun zesde bevat twee ideeën tegelijk, “opmaat naar escalatie, of misleiding”, dus die verschijnt hier als twee aparte punten. De lijst staat voor de lijst van een menselijk team uit Ronde 1. Zet in je groep je eigen lijst aan deze kant.</div></div>
</div>
<div class="ob-step" data-frag="1">
<div class="hycp-ell hycp-r"></div>
<p class="hycp-ttl hycp-ttlr" style="--x:32%;--w:30%">Model: zeven hypothesen<br/><span>(vier vaste perspectieven)</span></p>
<div class="ob-note" style="--x:64%;--y:2%;--w:35.5%"><div class="k">De lijst van het model</div><div class="d">De zeven hypothesen van de vorige slide. De twee lijsten gebruiken andere woorden, dus koppelen vraagt een oordeel. Vraag of twee hypothesen dezelfde waarnemingen voorspellen, niet of ze hetzelfde klinken.</div></div>
</div>
<div class="ob-step" data-frag="1">
<div class="hycp-items hycp-both"><p>Hefboom voor Genève</p><p>Wig in Noorwegen</p><p>Bastionverdediging</p><p>Binnenlandse afleiding</p><p>Geen campagne</p><p>Misleiding<br/><i>(helft van nr. 6)</i></p></div>
<div class="ob-note" style="--x:64%;--y:2%;--w:35.5%"><div class="k">Door beide gevonden: begin hier</div><div class="d">Zes ideeën staan op beide lijsten, soms onder een andere naam: vijf verklaringen van de ontwerpers volledig, plus de misleidingshelft van hun zesde. Die overlap is een goed beginpunt, maar overeenstemming is geen bewijs: een menselijk team en een model dat op westers commentaar is getraind, kunnen dezelfde blinde vlek delen.</div></div>
</div>
<div class="ob-step" data-frag="1">
<div class="hycp-items hycp-hum"><p>Opmaat naar escalatie<br/><i>(andere helft van nr. 6)</i></p><p>Signaal aan China</p></div>
<div class="ob-note" style="--x:64%;--y:2%;--w:35.5%"><div class="k">Alleen de mensen: houden, en vraag waarom</div><div class="d">De ontwerpers vroegen zich af of de signalen een echte escalatie voorbereiden (de andere helft van hun zesde) en of Peking de eigenlijke geadresseerde was (hun zevende). Het model leverde geen van beide als hypothese. Ontbrak er een perspectief in de prompt, of is het idee zwak? Hoe dan ook: het blijft op je lijst.</div></div>
</div>
<div class="ob-step" data-frag="1">
<div class="hycp-items hycp-mod"><p>Oekraïne herkaderen <i>(H7)</i></p><p>Gespeelde incoherentie<br/><i>(de draai van H6)</i></p></div>
<div class="ob-note" style="--x:64%;--y:2%;--w:35.5%"><div class="k">Alleen het model: eerst controleren</div><div class="d">Twee invalshoeken kwamen alleen van het model. Neem ze niet op zijn woord aan: een model kan vlot formuleren en toch stellig ongelijk hebben. Hier was het eerlijk: het noemde H7 zwak onderbouwd, omdat geen officieel Russisch document het Noordpoolgebied aan Oekraïne koppelt (niet in zijn steekproef van 80 documenten, en niet in het volledige pakket).</div></div>
</div>
<div class="ob-step" data-frag="1">
<div class="hycp-do">
<p class="hycp-dk">Wat doe je met elk?</p>
<p class="hycp-di"><span class="hycp-sw hycp-sw-b"></span><b>Beide:</b> begin hier; overeenstemming is geen bewijs.</p>
<p class="hycp-di"><span class="hycp-sw hycp-sw-h"></span><b>Alleen jullie:</b> houden; zoek het ontbrekende perspectief.</p>
<p class="hycp-di"><span class="hycp-sw hycp-sw-m"></span><b>Alleen het model:</b> twee documenten voor, één tegen, voordat het op je lijst komt.</p>
</div>
<div class="ob-note" style="--x:64%;--y:2%;--w:35.5%"><div class="k">Elke hypothese krijgt een menselijke controle</div><div class="d">De vergelijking vertelt je waar je eerst moet kijken, niet wat waar is. Een hypothese van het model is een aanwijzing, zoals een onbevestigde bron: lees de documenten die het citeert, en zoek er een die het tegenspreekt.</div></div>
</div>
</div>

<section class="slide obuild hysl" data-audience="all" data-n="SELECTEREN, ONGEVEER 5 MINUTEN VAN HET BLOK VOOR VERGELIJKEN EN SELECTEREN. Casus: Noordelijk Signaal, FICTIEF. Drie toetsen, één per klik, dan twee uitgewerkte voorbeelden, dan de selectiekaart. TOETS 1 FALSIFIEERBAAR: benoem de waarneming waardoor je de hypothese laat vallen (‘Moskou zendt een signaal uit’ overleeft elk document). TOETS 2 ONDERSCHEIDEND: het punt van Heuer dat bewijs dat bij elke hypothese past geen diagnostische waarde heeft; voorbeeld uit de modeluitvoer: H5 (geen campagne) en H6 (geregisseerde ambiguïteit) lijken twee weken op elkaar en scheiden pas op de vraag of de stemmen op het beslissende moment samenkomen. TOETS 3 ZICHTBAAR IN HET CORPUS: welke taxonomiecategorie, welk brontype, welk tijdpatroon; verwijs terug naar de taxonomiesessie van vanochtend. UITGEWERKTE VOORBEELDEN (voorspellingen uit demo_outputs/hypotheses_multiperspective.md, H1 indicator 1.2 en H4 indicatoren 4.1–4.2; categorienamen uit de demotaxonomie, demo_outputs/taxonomy_hcss_prompt.md: de HLTP’s Nucleaire explicietheid L1–L4, Geadresseerde 5.3a us_arms_control_track en 5.4 Russisch binnenland, Signaalrol 1.5b context_domestic_economy). Het model maakte deze labels in het Engels; de slide toont een Nederlandse weergave (VS-wapenbeheersingsspoor, binnenlandse economie). De twee grafieken zijn SCHETSEN van voorspelde vormen, geen data: bewust zonder waarden. Eerlijke kanttekening bij Hefboom voor Genève: het casuspakket loopt tot Dag 21, dus alleen Dag 20–21 volgen op de gesprekken (18 en 24 documenten); de toets na Genève is hier mager. Binnenlandse afleiding: vergelijk binnenlandse kanalen (tg_state_news 140 documenten, ru_state_media 100) met officiële verklaringen naar buiten (official_ru 30, waar ook het Telegramkanaal van Medvedev in zit, dus sorteer op geadresseerde, niet alleen op brontype). SELECTIEKAART: elke groep houdt twee of drie hypothesen en schrijft voor elk vier regels; de kaart gaat met taxonomie v1 mee naar de annotatiesessie van 13:00." data-sec="do" data-sid="hy-select" data-t="Kies er twee of drie die je kunt toetsen">
<h2>Kies er twee of drie die je kunt toetsen</h2>
<p class="sub">Noordelijk Signaal: drie toetsen, en wat twee hypothesen voorspellen.</p>
<div class="ob-pic">
<div class="hysl-tag">FICTIEF – trainingscasus</div>
<div class="ob-step" data-frag="1">
<div class="hysl-test" style="--x:0%"><p class="hysl-tq"><span class="hysl-tn">1</span>Falsifieerbaar?</p><p class="hysl-ts">Kan een document haar weerleggen?</p></div>
<div class="ob-note" style="--x:64%;--y:2%;--w:35.5%"><div class="k">Benoem wat je ongelijk zou geven</div><div class="d">Als geen enkele waarneming tegen een hypothese kan pleiten, kan het corpus haar niet toetsen: “Moskou zendt een signaal uit” overleeft elk document. Schrijf de waarneming op waardoor je de jouwe zou laten vallen.</div></div>
</div>
<div class="ob-step" data-frag="1">
<div class="hysl-test" style="--x:20.8%"><p class="hysl-tq"><span class="hysl-tn">2</span>Onderscheidend?</p><p class="hysl-ts">Zou het bewijs anders zijn als een andere hypothese klopte?</p></div>
<div class="ob-note" style="--x:64%;--y:2%;--w:35.5%"><div class="k">Andere hypothesen, ander bewijs</div><div class="d">Een document dat bij elke hypothese past, zegt niets. Houd hypothesen waarvan de voorspellingen verschillen, zodat hetzelfde corpus ze kan scheiden. Twee hypothesen van het model, “geen campagne” en “geregisseerde ambiguïteit”, lijken twee weken op elkaar en scheiden pas aan het eind: komen de stemmen samen?</div></div>
</div>
<div class="ob-step" data-frag="1">
<div class="hysl-test" style="--x:41.6%"><p class="hysl-tq"><span class="hysl-tn">3</span>Zichtbaar in het corpus?</p><p class="hysl-ts">Welke categorie, welke bron, welk tijdpatroon?</p></div>

<section class="slide obuild hymx" data-audience="all" data-n="EEN LICHTE ANALYSE VAN CONCURRERENDE HYPOTHESEN (ACH van Heuer, teruggebracht tot een rooster van 3 × 4). Casus: Noordelijk Signaal, FICTIEF. De kolommen zijn drie van de zeven hypothesen van het model (H1 Hefboom voor Genève, H3 Bastionverdediging, H5 Geen campagne); de rijen zijn vier echte documenten uit het casuspakket, allemaal binnen het vraagvenster Dag 1–14, geciteerd in Nederlandse vertaling (het casuspakket heeft een Engelse glossering). Bouw per klik één rij op. RIJ 1, NS-0013 (Dag 3, briefing van het ministerie van Buitenlandse Zaken, Zacharova): koppelt de oefening aan de gesprekken over strategische stabiliteit (‘The Arctic is an integral part of the overall security picture’, het Noordpoolgebied is een integraal onderdeel van het totale veiligheidsbeeld). Consistent met H1; consistent met H3 omdat ze redeneert vanuit troepen die zich aan de grens samentrekken; inconsistent met H5, waarvan de eigen voorspelling is dat het ministerie in zijn kader van de gesprekken NIET naar de noordelijke episode verwijst. RIJ 2, NS-0722 (Dag 4, Telegramkanaal van Medvedev): ‘Norway would not last the first hour’ (Noorwegen zou het eerste uur niet overleven), kernwapens genoemd, dan ‘we do not intend to be distracted by the circus in Finnmark’ (we laten ons niet afleiden door het circus in Finnmark). Gemarkeerd als inconsistent met H3 (een echte zorg om het bastion heeft geen nucleaire dreiging aan Noorwegen nodig en zou de oefening geen circus noemen); neutraal voor H1 en H5. Dit is een oordeel; zeg dat en nodig uit tot tegenspraak. RIJ 3, NS-0983 (Dag 12, Zvezda): de onaangekondigde inspectie ‘ended exactly on schedule’ (eindigde precies volgens schema); de Britse onderzeeboot werd op Dag 16 verwacht (tijdlijn van het scenario). Inconsistent met H3, consistent met H5 (routinekalender), neutraal voor H1. RIJ 4, NS-0318 (Dag 14, expertcolumn IMEMO): vier registers, ‘no single language’ (geen eenduidige taal). Inconsistent met H1 zoals geformuleerd (gecontroleerde signalen), tenzij de dissonantie in scène is gezet, en dat is precies H6, de misleidingshypothese van het model. Consistent met H5, neutraal voor H3. TELLING: inconsistent H1 1, H3 2, H5 1; consistent H1 1, H3 1, H5 2. H3 is het zwakst. H5 heeft de meeste steun maar staat gelijk met H1 op inconsistenties: de matrix wijst geen winnaar aan, ze vertelt welk document je nu moet zoeken (Dag 19: het ministerie zet ‘Arctische veiligheid’ op de agenda van Genève, wat tegen H5 pleit; dit klopt met de eigen voorlopige lezing van het model). De markeringen zijn de lezing van de trainer van de vertalingen, NIET de antwoordsleutel voor trainers, en geen modeluitvoer. AFSLUITING: de matrix maakt redeneren zichtbaar en aanvechtbaar; ze haalt bias niet vanzelf weg (jij koos de documenten en de markeringen). Een LLM kan zo’n matrix over 1.000 documenten invullen, maar jij kiest de hypothesen en controleert zijn lezing op een steekproef." data-sec="do" data-sid="hy-matrix" data-t="Een lichte matrix van concurrerende hypothesen">
<h2>Een lichte matrix van concurrerende hypothesen</h2>
<p class="sub">Noordelijk Signaal: drie hypothesen, vier casusdocumenten.</p>
<div class="ob-pic">
<div class="hymx-tag">FICTIEF – trainingscasus</div>
<div class="ob-step" data-frag="1">
<div class="hymx-row hymx-head" style="--y:0%;--h:10%"><div class="hymx-doc"><p>Document (Nederlandse vertaling)</p></div><div class="hymx-h"><p><b>H1</b> Hefboom<br/>voor Genève</p></div><div class="hymx-h"><p><b>H3</b> Bastion­verdediging</p></div><div class="hymx-h"><p><b>H5</b> Geen<br/>campagne</p></div></div>
<div class="ob-note" style="--x:64%;--y:9%;--w:35%"><div class="k">Hypothesen in de breedte, bewijs in de hoogte</div><div class="d">Drie van de zeven hypothesen van het model worden kolommen. Elk document wordt dan tegen alle hypothesen tegelijk gemarkeerd: consistent, inconsistent of neutraal. Zo moet je je afvragen wat een document betekent voor de verklaringen die niet je favoriet zijn.</div></div>
</div>
<div class="ob-step" data-frag="1">
<div class="hymx-row" style="--y:10%;--h:19.25%"><div class="hymx-doc"><p class="hymx-id">NS-0013 · Dag 3 · Buitenlandse Zaken (Zacharova)</p><p class="hymx-q">“Je kunt niet over risicovermindering praten en tegelijk de troepen van het blok bij onze grenzen samentrekken. Het Noordpoolgebied hoort bij het totale veiligheidsbeeld.”</p></div><div class="hymx-m hymx-c"><p>consistent</p></div><div class="hymx-m hymx-c"><p>consistent</p></div><div class="hymx-m hymx-i"><p>inconsistent</p></div></div>
<div class="ob-note" style="--x:64%;--y:20%;--w:35%"><div class="k">Buitenlandse Zaken koppelt het Noordpoolgebied aan de gesprekken</div><div class="d">Moskou verbindt de oefening met de dialoog over strategische stabiliteit, precies wat Hefboom voor Genève verwacht. Ze redeneert ook vanuit troepen aan de grens, dus Bastionverdediging overleeft. Het spreekt “geen campagne” tegen, dat voorspelt dat het ministerie bij de gesprekken het noorden zou negeren.</div></div>
</div>
<div class="ob-step" data-frag="1">
<div class="hymx-row" style="--y:29.25%;--h:19.25%"><div class="hymx-doc"><p class="hymx-id">NS-0722 · Dag 4 · Telegramkanaal van Medvedev</p><p class="hymx-q">“Noorwegen zou het eerste uur van een echt conflict niet overleven. … We laten ons niet afleiden door het circus in Finnmark.”</p></div><div class="hymx-m hymx-n"><p>neutraal</p></div><div class="hymx-m hymx-i"><p>inconsistent</p></div><div class="hymx-m hymx-n"><p>neutraal</p></div></div>
<div class="ob-note" style="--x:64%;--y:34%;--w:35%"><div class="k">Een nucleaire dreiging aan het adres van Noorwegen</div><div class="d">Een echte zorg over geallieerde onderzeebootjacht bij Kola heeft geen nucleaire dreiging aan Noorwegen nodig, en zou de oefening geen circus noemen. Daarom is het inconsistent met Bastionverdediging. Dat is een oordeel, en de matrix zet het neer waar je het kunt aanvechten.</div></div>
</div>
<div class="ob-step" data-frag="1">
<div class="hymx-row" style="--y:48.5%;--h:19.25%"><div class="hymx-doc"><p class="hymx-id">NS-0983 · Dag 12 · Zvezda (tv van Defensie)</p><p class="hymx-q">“De onaangekondigde gereedheidsinspectie van de Noordelijke Vloot is precies volgens schema afgerond.” De Britse onderzeeboot werd op Dag 16 verwacht.</p></div><div class="hymx-m hymx-n"><p>neutraal</p></div><div class="hymx-m hymx-i"><p>inconsistent</p></div><div class="hymx-m hymx-c"><p>consistent</p></div></div>
<div class="ob-note" style="--x:64%;--y:40%;--w:35%"><div class="k">De oefening eindigt voordat de onderzeeboot aankomt</div><div class="d">Als de vloot de Britse onderzeeboot vreesde, zou de gereedheidscontrole nog lopen wanneer de boot op Dag 16 Tromsø bereikt. Ze eindigde op Dag 12, zoals aangekondigd. Een routinekalender, de kern van “geen campagne”, verklaart dat moeiteloos.</div></div>
</div>
<div class="ob-step" data-frag="1">
<div class="hymx-row" style="--y:67.75%;--h:19.25%"><div class="hymx-doc"><p class="hymx-id">NS-0318 · Dag 14 · Russische expertcolumn (IMEMO)</p><p class="hymx-q">“Als een staat in meerdere talen spreekt, mag de waarnemer de handigste kiezen, of toegeven dat er geen eenduidige taal is.”</p></div><div class="hymx-m hymx-i"><p>inconsistent</p></div><div class="hymx-m hymx-n"><p>neutraal</p></div><div class="hymx-m hymx-c"><p>consistent</p></div></div>
<div class="ob-note" style="--x:64%;--y:42%;--w:35%"><div class="k">Vier registers, geen eenduidige taal</div><div class="d">Gecontroleerde signalen, zoals Hefboom voor Genève stelt, zouden met één stem moeten spreken; de IMEMO-expert hoort vier verschillende registers. Tenzij de dissonantie in scène is gezet, en dat is precies de misleidingshypothese van het model, H6. De inconsistentie blijft alleen staan zolang niemand haar ensceneert.</div></div>
</div>
<div class="ob-step" data-frag="1">
<div class="hymx-row hymx-tally" style="--y:87%;--h:6.5%"><div class="hymx-doc"><p><b class="hymx-tl">Inconsistent</b> · minste overleeft</p></div><div class="hymx-h hymx-win"><p><b>1</b></p></div><div class="hymx-h hymx-lose"><p><b>2</b></p></div><div class="hymx-h hymx-win"><p><b>1</b></p></div></div>
<div class="hymx-row hymx-tally hymx-tally2" style="--y:93.5%;--h:6.5%"><div class="hymx-doc"><p><b class="hymx-tl">Consistent</b> · alleen steun</p></div><div class="hymx-h"><p>1</p></div><div class="hymx-h"><p>1</p></div><div class="hymx-h"><p>2</p></div></div>
<div class="ob-note" style="--x:64%;--y:24%;--w:35%"><div class="k">Tel wat tegenspreekt, niet wat past</div><div class="d">Bastionverdediging verzamelt de meeste inconsistenties en valt terug. “Geen campagne” heeft de meeste steun, maar staat gelijk met Hefboom voor Genève op wat haar tegenspreekt. De matrix wijst hier geen winnaar aan; ze vertelt welk document je nu moet zoeken: komen de stemmen samen in Genève?</div></div>
</div>
<div class="ob-step" data-frag="1">
<div class="hymx-llm"><p class="hymx-llm-k">Op schaal</p><p class="hymx-llm-d">1.000 documenten × 3 hypothesen = 3.000 markeringen. Een model kan ze zetten; jij kiest de kolommen en controleert een steekproef van zijn markeringen.</p></div>
<div class="ob-note" style="--x:64%;--y:3%;--w:35%"><div class="k">Zichtbaar, niet onbevooroordeeld</div><div class="d">De matrix maakt je redenering zichtbaar en aanvechtbaar. Ze haalt bias niet vanzelf weg: jij koos de documenten en jij zette de markeringen. Een LLM kan het rooster over het hele corpus vullen, maar de hypothesen en de uiteindelijke lezing blijven van jou.</div></div>
</div>
</div>

<section class="slide obuild hyho" data-audience="all" data-n="OVERDRACHT, ONGEVEER 5 MINUTEN. Wat deze zaal verlaat en waar het daarna heen gaat. Bouw per klik één fase op in de volgorde van de dag, dan het eindproduct. (1) TAXONOMIE V1, 09:00–10:30 (vanochtend): zie (2) hieronder voor hoe voorspellingen haar gebruiken. (2) NU, 10:45–12:00: twee of drie hypothesen per groep, elk met de vier regels van de selectiekaart (voorspelling, taxonomiecategorie, brontypen, tijdpatroon). Het zijn geen conclusies; het is waartegen het bewijs van de middag wordt gesorteerd. Elke voorspelling moet naar een categorie wijzen; ontbreekt er een, voeg die dan toe voordat het annoteren begint, want wat de taxonomie niet kan labelen, kan het corpus niet tonen (de zin uit de programmagids: geen categorie ‘dissidentie’, dan wordt er geen dissidentie gevonden). (3) 13:00–15:00 ANNOTATIE OP SCHAAL: taxonomie v1 wordt de annotatieprompt; minstens 1.000 fragmenten, één JSON-record per fragment. (4) DONDERDAG: menselijke validatie van een steekproef van de labels van de machine, dan patronen in de tijd en tussen bronnen, dan het genereren van het rapport; hier ontmoeten de hypothesen de tellingen, en hier komt de matrixlogica van de vorige slide op schaal terug. EINDPRODUCT AAN HET EIND VAN WOENSDAG (programmagids): taxonomie v1, twee tot drie hypothesen, minstens 1.000 geannoteerde fragmenten. Vrijdag presenteren de groepen. De iconen zijn vlakke inline tekeningen in één stijl." data-sec="next" data-sid="hy-handoff" data-t="Van hypothese naar bewijs">

var PIPE=[["Waarom", "Waarom meer dan \u00e9\u00e9n verklaring"], ["Goed", "Wat een goede hypothese is"], ["Casus", "De casus"], ["Oefening", "Genereren, vergelijken, selecteren"], ["Verder", "Van hypothese naar bewijs"]];
var PIPE_SEC=["why", "good", "case", "do", "next"];

/* --- audience switcher (SDS 2026-09-04) ---------------------------------------

  var now=document.getElementById('audnow');

/* Curated morning sequence: do not inherit a generic-deck audience filter. */

DAYS.forEach(function(d){
  d.first=-1; d.items=[];
  slides.forEach(function(sl,i){
    if(sl.getAttribute('data-sec')!==d.sec)return;
    if(d.first<0)d.first=i;

});

/* ---------- SHELL GUARD (not in deck.html) ----------------------------------
   The house deck always has slides. This shell ships with ZERO, so every deck
   entry point would dereference slides[0] and throw. These three guards are
   inert the moment a single &lt;section class="slide"> exists in #deck, so they

var EMPTY = slides.length === 0;
if(EMPTY){

    + '<div class="kicker">house deck shell</div>'

    + '</div></div>';

}
/* -------------------------------------------------------------------------- */


/* ---------------- AUTOFIT: grow --sc until the slide is as full as it can be ----------------
   Every type size on a slide is calc(N cqw * var(--sc)). We binary-search the largest --sc at
   which nothing overflows its box. That is what makes a slide FILL its frame instead of
   floating a small block of text in the middle of it. Runs once per slide, then is cached;
   the cache is dropped on resize because cqw is relative to the frame.                        */
function overflows(s){
  var body=document.body, had=body.classList.contains('measuring');
  if(!had)body.classList.add('measuring');
  try{ return _overflows(s); } finally { if(!had)body.classList.remove('measuring'); }
}
function _overflows(s){
  /* Two independent failure modes.
     (1) VERTICAL/BLOCK overflow: a child escapes a box that clips. Rect containment, not
         scrollHeight - with line-height near 1 a glyph box is taller than its element box, so
         scrollHeight>clientHeight fires on every heading even when the layout is perfect.
         Every layout box must be checked, INCLUDING .fill: checking only the slide's direct
         children passes any .fill, because .fill is flex:1 and so always fits by construction
         while its children spill straight out of the frame.
     (2) HORIZONTAL text overflow: a long word that cannot wrap ("Classification", "Foundations")
         overflows its element without moving that element's rect at all. Rect containment is
         blind to it; scrollWidth is the only signal. Tolerance 4px absorbs letter-spacing,
         which adds trailing space after the last glyph. */
  var TOL=2, WTOL=4;
  function inner(el){
    var r=el.getBoundingClientRect(),cs=getComputedStyle(el);
    return {left:r.left+parseFloat(cs.paddingLeft),right:r.right-parseFloat(cs.paddingRight),
            top:r.top+parseFloat(cs.paddingTop),bottom:r.bottom-parseFloat(cs.paddingBottom)};
  }
  function outside(box,r){
    return r.left<box.left-TOL||r.right>box.right+TOL||r.top<box.top-TOL||r.bottom>box.bottom+TOL;
  }
  var boxes=[s].concat([].slice.call(
    s.querySelectorAll('.fill,.card,.grid,.split,.stack,.arrowrow,ul.big')));
  for(var i=0;i<boxes.length;i++){
    var bb=inner(boxes[i]),kids=boxes[i].children;
    for(var j=0;j<kids.length;j++){
      if(outside(bb,kids[j].getBoundingClientRect()))return true;
    }
  }
  /* A <pre> clips its own content without moving any rect, so rect containment
     cannot see it. Its line-height is 1.5, well clear of the glyph-overflow
     artifact that makes scrollHeight useless on tight-leading headings, so
     scrollHeight is the right test here and only here. */
  var pres=s.querySelectorAll('pre.prompt');
  for(var q=0;q<pres.length;q++){
    if(pres[q].scrollHeight>pres[q].clientHeight+2)return true;
  }
  var text=s.querySelectorAll('h2,.sub,.body-lg,.kicker,.small-note,.card .k,.card .d,.card .v,'
    +'li,.daytitle,.daysub,.daymins,.title-slide .t,.title-slide .s,.title-slide .m,.ar');
  for(var t=0;t<text.length;t++){
    if(text[t].scrollWidth>text[t].clientWidth+WTOL)return true;
  }
  return false;
}
function autofit(i){
  var s=slides[i];
  document.body.classList.add('measuring');
  try{ _autofit(i); } finally { document.body.classList.remove('measuring'); }
}
function _autofit(i){
  var s=slides[i];
  if(s.classList.contains('img'))return;
  if(fitted[i])return;
  var lo=0.5,hi=3.2,best=0.5;
  s.style.setProperty('--sc',hi);
  if(!overflows(s)){best=hi;}
  else{
    for(var k=0;k<9;k++){
      var mid=(lo+hi)/2;
      s.style.setProperty('--sc',mid);
      if(overflows(s)){hi=mid;}else{best=mid;lo=mid;}
    }
  }
  s.style.setProperty('--sc',best);
  fitted[i]=true;
}

/* ---------------- navigation ---------------- */
function dayOf(i){
  var sl=slides[i]; if(sl){var sec=sl.getAttribute('data-sec');
    for(var k=0;k<DAYS.length;k++)if(DAYS[k].sec===sec)return k+1;}
  var d=0;for(var k=0;k<dividers.length;k++){if(i>=dividers[k])d=k+1;}return d;}
/* ---------------- build-up fragments ----------------
   Right arrow reveals the next fragment before advancing; left arrow un-reveals
   before going back. Entering forwards starts unbuilt; entering backwards, or by
   jump or deep link, starts fully built, so a link never lands on a half-drawn
   slide. B toggles builds off. */
var buildOff=false;
function frags(i){return slides[i].querySelectorAll('[data-frag]');}
function fragShown(i){return slides[i].querySelectorAll('[data-frag].shown').length;}
function setFrags(i,n){
  var f=frags(i);
  for(var k=0;k<f.length;k++){f[k].classList.toggle('shown',k<n);}
  paintPip(i);
}
/* ---- feedback-mode deck-only view (SDS 2026-09-01) ------------------------
   Chrome is stripped and a section progress rail shown ONLY when the review
   layer is present. The review server injects its own script at request time, so a
   deck opened directly, or published to Pages, keeps its full chrome and this
   code never fires. */
function isFeedbackMode(){
  /* Detect the review layer by its own DOM marker ONLY. Do NOT test for the
     script's filename: the review server injects it with a guard of the form
     "if the filename is not already in the html", so naming that file here made the
     server skip injection entirely and the check suppressed what it detected. */
  return !!document.getElementById('gtr-toggle');
}
function buildPrograil(){
  var el=document.getElementById('prograil'); if(!el||el.dataset.built)return;
  var h='';
  DAYS.forEach(function(d,k){
    h+='<button class="pseg'+(d.count?'':' empty')+'" data-k="'+k+'" style="--w:'+d.mins+'"'+
       (d.count?' onclick="goDay('+(k+1)+')"':'')+
       ' title="'+d.label+' \u00b7 '+d.title+' \u00b7 '+d.mins+' min">'+
       '<span class="pfill"></span>'+
       '<span class="plabel">'+(d.short||d.title)+'</span></button>';
  });
  el.innerHTML=h; el.dataset.built='1';
}
function paintPrograil(){
  var el=document.getElementById('prograil'); if(!el||!el.dataset.built)return;
  var here=dayOf(cur);                       /* 1-based section, 0 = none */
  [].forEach.call(el.children,function(b){
    var k=parseInt(b.dataset.k,10), d=DAYS[k], fill=b.querySelector('.pfill');
    b.classList.toggle('on', k+1===here);
    b.classList.toggle('done', here>0 && k+1<here);
    if(k+1===here && d.count){
      /* how far through THIS section we are, so the bar moves on every slide */
      var pos=cur-d.first+1;
      fill.style.width=Math.max(0,Math.min(100, pos/d.count*100))+'%';
    } else if(!b.classList.contains('done')){ fill.style.width='0'; }
    else { fill.style.width='100%'; }
  });
}
var _fbTries=0;
function watchFeedbackMode(){
  if(isFeedbackMode()){ if(view==='deck') applyDeckOnly(true); return; }
  if(++_fbTries>20) return;                 /* ~5 s, then give up quietly */
  setTimeout(watchFeedbackMode,250);
}
function applyDeckOnly(on){
  document.body.classList.toggle('deckonly', !!on);
  buildPrograil(); paintPrograil();
  if(typeof autofit==='function'){ try{ autofit(cur); }catch(e){} }
}
function paintPip(i){
  paintPrograil();
  var el=document.getElementById('buildpip'),n=frags(i).length;
  if(!el)return;
  el.textContent=(n&&!buildOff)?('  \u25CF '+fragShown(i)+'/'+n):'';
}
function stepFwd(){
  if(buildOff)return false;
  var f=frags(cur),n=fragShown(cur);
  if(n<f.length){setFrags(cur,n+1);return true;}
  return false;
}
function stepBack(){
  if(buildOff)return false;
  var n=fragShown(cur);
  if(n>0){setFrags(cur,n-1);return true;}
  return false;
}
function toggleBuild(){
  buildOff=!buildOff;
  document.body.classList.toggle('nobuild',buildOff);
  setFrags(cur,buildOff?frags(cur).length:fragShown(cur));
}
function go(i,push,built){ if(i<0)i=0;if(i>=slides.length)i=slides.length-1; /* set the incoming slide's fragment state BEFORE it becomes visible: otherwise a slide that still carries .shown from a previous build paints fully built for a few frames and then collapses - the 'ghosting' flash. */ setFrags(i, (buildOff || built===true) ? frags(i).length : 0); slides[cur].classList.remove('on'); cur=i; slides[cur].classList.add('on'); autofit(cur); setFrags(cur, (buildOff || built===true) ? frags(cur).length : 0);
  document.getElementById('counter').textContent=(cur+1)+' / '+slides.length;
  document.getElementById('slidetitle').innerHTML=slides[cur].dataset.t||'';
  document.getElementById('notes').innerHTML=slides[cur].dataset.n?('<b>Note</b> &nbsp;'+slides[cur].dataset.n):'<i>No note on this slide.</i>';
  paintTimeline();paintSidebar();
  if(push!==false)history.replaceState(null,'','#'+(cur+1));
}
function showDeck(i,built){
  view='deck';
  applyDeckOnly(true);
  document.getElementById('home').classList.remove('on');
  stage.classList.add('on');document.getElementById('deckbar').classList.add('on');
  document.getElementById('navHome').classList.remove('on');

  var target=typeof i==='number'?i:cur; var openBuilt=built===undefined && slides[target] && ['ada-students','ada-protocol'].includes(slides[target].dataset.sid) ? false : built!==false; go(target, true, openBuilt);
}
function showHome(){
  view='home';
  applyDeckOnly(false);
  stage.classList.remove('on');document.getElementById('deckbar').classList.remove('on');
  document.getElementById('notes').classList.remove('on');

  document.getElementById('navHome').classList.add('on');

function goDay(d){
  if(d===0){showDeck(0);return;}
  var e=DAYS[d-1];
  if(e&&e.first>=0){showDeck(e.first);return;}
  if(dividers.length&&dividers[d-1]!=null)showDeck(dividers[d-1]);else showDeck(0);
}

  document.body.classList.remove('present');

/* ---------------- chrome painting ---------------- */
function paintTimeline(){
  var bar=document.getElementById('timelineBar');
  if(!bar.dataset.built){
    var h='';
    DAYS.forEach(function(d,k){
      if(k)h+='<div class="timeline-connector"></div>';
      h+='<button class="timeline-block" data-d="'+(k+1)+'" onclick="goDay('+(k+1)+')">'+
         '<div class="timeline-time">'+d.label+' &#183; '+d.mins+' min</div>'+
         '<div class="timeline-label">'+d.title+'</div>'+
         '<div class="timeline-duration">'+(d.count?d.count+(d.count===1?' slide':' slides'):'not yet built')+'</div></button>';
    });
    bar.innerHTML=h;bar.dataset.built='1';
  }
  var d=view==='deck'?dayOf(cur):0;
  [].forEach.call(bar.querySelectorAll('.timeline-block'),function(b){
    b.classList.toggle('active',parseInt(b.dataset.d,10)===d);});

function paintSidebar(){
  var sb=document.getElementById('sidebar'),h='';
  if(view==='home'){
    h+='<div class="sidebar-section"><div class="sidebar-section-title">The talk</div>';
    DAYS.forEach(function(d,k){
      h+='<button class="sidebar-item" onclick="goDay('+(k+1)+')"><span class="sidebar-item-title">'+
         d.label+' &#183; '+d.title+'</span><span class="sidebar-badge">'+(d.count?d.count+(d.count===1?' slide':' slides'):'empty')+'</span></button>';});
    h+='</div><div class="sidebar-section"><div class="sidebar-section-title">Deck</div>'+
       '<button class="sidebar-item" onclick="showDeck(0)"><span class="sidebar-item-title">Open from the start</span><span class="sidebar-badge">'+slides.length+'</span></button>'+
       '<button class="sidebar-item" onclick="toggleOv()"><span class="sidebar-item-title">Slide overview</span><span class="sidebar-badge">O</span></button>'+
       '<button class="sidebar-item" onclick="present()"><span class="sidebar-item-title">Present full screen</span><span class="sidebar-badge">F</span></button></div>'+
       '<div class="sidebar-section"><div class="sidebar-section-title">Naslag</div>'+'<a class="sidebar-item" href="https://rubase.org/" target="_blank" rel="noopener"><span class="sidebar-item-title">RuBase-dashboard</span><span class="sidebar-badge">&#8599;</span></a>'+'<a class="sidebar-item" href="https://rubasediscovery.app.hcss.nl/sources" target="_blank" rel="noopener"><span class="sidebar-item-title">Overzicht RuBase-bronnen</span><span class="sidebar-badge">&#8599;</span></a>'+'<a class="sidebar-item" href="https://onderwijsophcss.app.hcss.nl" target="_blank" rel="noopener"><span class="sidebar-item-title">Trainingsplatform</span><span class="sidebar-badge">&#8599;</span></a>'+'</div>';
    sb.innerHTML=h;return;
  }
  var d=dayOf(cur);
  var start=d===0?0:dividers[d-1];
  var end=d<dividers.length?dividers[d]:slides.length;
  if(d===0){start=0;end=dividers.length?dividers[0]:slides.length;}
  h+='<div class="sidebar-section"><div class="sidebar-section-title">'+
     (d===0?'Opening':(DAYS[d-1].label+' &#183; '+DAYS[d-1].title))+'</div>';
  for(var i=start;i<end;i++){
    h+='<button class="sidebar-item'+(i===cur?' active':'')+'" onclick="showDeck('+i+')">'+
       '<span class="sidebar-item-title">'+(slides[i].dataset.t||('Slide '+(i+1)))+'</span>'+
       '<span class="sidebar-badge">'+(i+1)+'</span></button>';
  }
  h+='</div><div class="sidebar-section"><div class="sidebar-section-title">Jump to a section</div>';
  DAYS.forEach(function(dd,k){
    h+='<button class="sidebar-item'+(k+1===d?' active':'')+'" onclick="goDay('+(k+1)+')">'+
       '<span class="sidebar-item-title">'+dd.label+' &#183; '+dd.title+'</span>'+
       '<span class="sidebar-badge">'+(dd.count?dd.count+(dd.count===1?' slide':' slides'):'empty')+'</span></button>';});
  h+='</div>';
  sb.innerHTML=h;
  var act=sb.querySelector('.sidebar-item.active');
  if(act&&act.scrollIntoViewIfNeeded)act.scrollIntoViewIfNeeded();
}
function buildHome(){
  var h='<div class="welcome-screen">'+
    '<div class="welcome-title">Hypothesen</div>'+'<div class="welcome-subtitle">Waarom één team vaak één verhaal vindt, wat een hypothese toetsbaar maakt in een corpus, en hoe je concurrerende verklaringen genereert: eerst zelf, daarna met een LLM dat vanuit andere perspectieven redeneert.</div>'+'<div class="welcome-meta">Woensdag 14 oktober 2026 &#183; 10:45&#8211;12:00 &#183; AIRA-training, Den Haag</div>'+
    '<div class="pipeline">';
  PIPE.forEach(function(p,k){
    if(k)h+='<div class="pipe-arrow">&rarr;</div>';
    h+='<button class="pipe-step" onclick="goSec(\''+PIPE_SEC[k]+'\')"><div class="step-label">'+p[0]+'</div><div class="step-name">'+p[1]+'</div></button>';});
  h+='</div><div class="session-grid">';
  DAYS.forEach(function(d,k){
    h+='<button class="session-card'+(d.count?'':' empty')+'" onclick="goDay('+(k+1)+')">'+
       '<div class="card-num">'+(k+1)+'</div>'+
       '<div class="card-time">'+d.label+' &#183; '+d.mins+' min'+(d.count?' &#183; '+d.count+(d.count===1?' slide':' slides'):'')+'</div>'+
       '<div class="card-title">'+d.title+'</div>'+
       '<div class="card-desc">'+d.desc+'</div><div class="card-items">';
    d.items.forEach(function(it){h+='<div class="card-item"><span class="card-item-bullet"></span><span>'+it+'</span></div>';});
    h+='</div></button>';});
  h+='</div></div>';
  document.getElementById('home').innerHTML=h;
}
function buildOv(){
  var g=document.getElementById('ovg'),h='';
  slides.forEach(function(s,i){
    h+='<button class="'+(s.classList.contains('divider')?'d':'')+'" onclick="document.getElementById(\'ov\').classList.remove(\'on\');showDeck('+i+')">'+
       '<i>'+(i+1)+'</i>'+(s.dataset.t||'')+'</button>';});
  g.innerHTML=h;
}

/* ---------------- keys ---------------- */
document.addEventListener('keydown',function(e){
  if(e.target.tagName==='SELECT'||e.target.tagName==='INPUT')return;
  var k=e.key;
  if(k==='Escape'){
    if(document.getElementById('ov').classList.contains('on')){document.getElementById('ov').classList.remove('on');return;}
    if(document.body.classList.contains('present')){unpresent();return;}
  }
  if(view!=='deck'&&['ArrowRight','ArrowLeft','ArrowUp','ArrowDown','n','N'].indexOf(k)>-1){showDeck();if(k==='ArrowRight'||k==='ArrowLeft')return;}
  if(k==='ArrowRight'||k===' '||k==='PageDown'){e.preventDefault();if(!stepFwd())go(cur+1);}
  else if(k==='ArrowLeft'||k==='PageUp'){e.preventDefault();if(!stepBack())go(cur-1,true,true);}
  else if(k==='ArrowDown'){e.preventDefault();var d=dayOf(cur);goDay(Math.min(d+1,DAYS.length));}
  else if(k==='ArrowUp'){e.preventDefault();var d2=dayOf(cur);goDay(Math.max(d2-1,0));}
  else if(k==='Home'){e.preventDefault();go(0);}
  else if(k==='End'){e.preventDefault();go(slides.length-1);}
  else if(k==='o'||k==='O'){toggleOv();}
  else if(k==='n'||k==='N'){toggleNotes();}
  else if(k==='b'||k==='B'){toggleBuild();}
  else if(k==='f'||k==='F'){document.body.classList.contains('present')?unpresent():present();}
});
document.addEventListener('fullscreenchange',function(){
  if(!document.fullscreenElement&&document.body.classList.contains('present'))document.body.classList.remove('present');
  fitted=[];autofit(cur);
});
var rt;window.addEventListener('resize',function(){clearTimeout(rt);rt=setTimeout(function(){fitted=[];autofit(cur);},140);});

/* ---------------- start ---------------- */
buildHome();



var hash=(location.hash||'').replace('#','');
if(hash&&hash!=='home'&&!isNaN(parseInt(hash,10))){showDeck(parseInt(hash,10)-1);}
else{showHome();}
/* The review layer's script tag is injected at the very END of body, so it has not run
   when the routing above executes and isFeedbackMode() is still false. Poll briefly so
   the deck-only view engages once the layer is actually there. */
watchFeedbackMode();
</script>
