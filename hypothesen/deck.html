/* ---- gt22 (frag_gt22.css) ---- */
/* =============================================================================
   gt22 - "Seven dimensions" (the 7 HLTPs of the congressional budget-issue
   taxonomy). This slide REPLACES a rasterised taxonomy image whose labels were
   unreadable, so readable type is the entire point of the rebuild.

   ROUTE 3 (drawn). Route 1 is unavailable - the taxonomy is a 4-column TSV
   (TAXONOMY_AGREED_2026-09-01.tsv, 498 data rows) emitted by the murderboard,
   and no generator anywhere produces staged figure layers from it. Route 2 is
   unavailable - there is no pptx /media asset for this content; the only prior
   rendering was the flat raster this slide exists to replace, and dimming that
   raster and cutting clip-path windows in it is the png dump the splicer
   refuses. So the whole picture is inline SVG, drawn from the TSV.

   A LAYOUT DECISION, stated so the next author does not "fix" it: a radial /
   sunburst was tried on paper and rejected. Seven arc labels plus 22 second-level
   and 61 third-level counts cannot be set on arcs at >=1.10% of slide width in a
   1770x750 frame without either rotating the labels or dropping to ~14 viewBox
   units, both of which reproduce the defect this slide is here to remove. A
   horizontal table-of-bars holds every label horizontal at 24-33 viewBox units.
   Readability beats the shape.

   ---------------------------------------------------------------------------
   TYPE-FLOOR ARITHMETIC - why every SVG font-size below is >= 24 viewBox units
   ---------------------------------------------------------------------------
   Floor            = 1.10% of slide width = 15.03px on a 1366px-wide slide.
   viewBox          = 1770 x 750 (aspect 2.360), matching .ob-pic's aspect-ratio.
   .ob-pic width    = slide width - 2 x 3.6% padding = 0.928 x slide width.
   Two cases, and the SMALLER scale is the one that must clear the floor:
     (a) width-fit   : 1366 x 0.928 / 1770                      = 0.7162 px/unit
     (b) height-fit  : .ob-pic is clamped by max-height:68cqh, and with
                       preserveAspectRatio="xMidYMid meet" the SVG then scales to
                       the HEIGHT: 0.68 x 768 / 750             = 0.6963 px/unit
   Worst case = 0.6963. Minimum viewBox unit = 15.03 / 0.6963   = 21.58.
   So the smallest size used here is 26, and the ladder measures:
     33 -> 22.98px = 1.682% of slide   (dimension name)
     31 -> 21.59px = 1.580%            (the three counts)
     28 -> 19.50px = 1.427%            (group headers, totals band)
     26 -> 18.10px = 1.325%            (column headers, glosses, legend)
   MEASURED, not computed, in the real shell at 1366x768 (shot2.py): the flex
   column - not max-height - is what actually sizes .ob-pic, giving a scale of
   0.4363 against an 855px slide, so the 26-unit floor renders at 1.326% of slide
   width. The first cut of this slide carried a 24-unit floor and measured 1.175%;
   it passed, but 26 plus a one-line .sub is the margin this rebuild deserves.

   COLUMN ARITHMETIC (viewBox units, art band x 76..1030):
     name      100..~472  (33u, longest is "Affected Constituency")
     gloss     100..~500  (26u, longest is "what the money is being spent on")
     2ND LVL   centred 570 -> 516..624      3RD LVL centred 700 -> 646..754
     TAXA no.  anchor end 830 -> ~780..830  bar 850..1030, 180u at 107 taxa,
                                            i.e. 1.6822 units per taxon.
   Every pair has clear air between it; verified by getBBox in the render, not by
   eye. The columns moved right when the floor went 24 -> 26: "2ND LVL" and
   "3RD LVL" grew and collided at the old 585/690 centres.
   All clear 1.10% with margin, in BOTH cases. Nothing on this slide is px.
   max-height is 68cqh rather than the shell's 66cqh so the picture is not
   squashed, and "meet" rather than "none" so that if it ever IS clamped the
   figure letterboxes instead of distorting the glyphs.

   preserveAspectRatio="meet" also fixes where the art ends horizontally: the
   drawn band is viewBox x 30..1030, which lands at 3.0%..58.0% of .ob-pic in
   BOTH cases, so every .ob-note at --x:59% sits on empty ground and can never
   cover a revealed row.

   PREFIXING: every class is gt22-*. An inline SVG <style> is NOT scoped to its
   subtree, so bare names leak page-wide - which is precisely why the class
   definitions live HERE, in a file-scoped `.gt22 .gt22-*` block, and there is no
   <style> element inside any of the four SVGs.

   HIDDEN STATES: none are declared. The deck's own
   `.slide [data-frag]{opacity:0;transition:none}` hides each .ob-step together
   with its SVG and its box, so nothing here can animate back to hidden after
   body.measuring lights the slide for autofit. The only transition added below
   is on a :hover, which autofit never triggers.
   ============================================================================= */

/* the slide is its own inline-size container, so cqw resolves against the slide
   in ANY host shell. The GaTech deck already declares this identically. */
.gt22{container-type:inline-size}

.gt22 .ob-pic{aspect-ratio:1770/750;max-height:68cqh;background:transparent}

.gt22 .ob-pic svg.gt22-lay{position:absolute;inset:0;width:100%;height:100%;display:block}

/* `.obuild .ob-pic img{position:absolute;inset:0;width:100%;height:100%}` outranks
   any plain two-class selector and force-stretches component images. gt22 ships
   no <img>; this is the scoped reset any future one must use. */
.gt22 .ob-pic img.gt22-shot{position:absolute;inset:auto;right:auto;bottom:auto;
  left:var(--x);top:var(--y);width:var(--w);height:auto;max-width:none;display:block;
  border-radius:4px;box-shadow:0 8px 26px rgba(0,0,0,.55)}

/* --- the pointer contract (VISUAL_SPEC 11): every .ob-step is a full-size
   transparent layer that would otherwise swallow the pointer, so the buttons in
   the notes would be unclickable. Both halves are mandatory. ---------------- */
.gt22 .ob-step{pointer-events:none}
.gt22 .ob-step > *{pointer-events:auto}
.gt22 .ob-scrim{pointer-events:none}
.gt22 .ob-pic svg.gt22-lay{pointer-events:none}

/* --- SVG type and marks. Sizes in viewBox user units; see the arithmetic above. */
.gt22 .gt22-hdr{font:600 26px "Titillium Web",system-ui,-apple-system,sans-serif;fill:#b9cee5;letter-spacing:.1em}
.gt22 .gt22-gh {font:700 28px "Titillium Web",system-ui,-apple-system,sans-serif;fill:#dbad50;letter-spacing:.09em}
.gt22 .gt22-nm {font:700 33px "Titillium Web",system-ui,-apple-system,sans-serif;fill:#f3f6fb}
.gt22 .gt22-gl {font:400 26px "Titillium Web",system-ui,-apple-system,sans-serif;fill:#b9cee5}
.gt22 .gt22-num{font:600 31px "Titillium Web",system-ui,-apple-system,sans-serif;fill:#f3f6fb}
.gt22 .gt22-tx {font:700 31px "Titillium Web",system-ui,-apple-system,sans-serif;fill:#dbad50}
.gt22 .gt22-lg {font:400 26px "Titillium Web",system-ui,-apple-system,sans-serif;fill:#b9cee5}
.gt22 .gt22-tot{font:700 28px "Titillium Web",system-ui,-apple-system,sans-serif;fill:#dbad50;letter-spacing:.04em}

.gt22 .gt22-row  {fill:#12294a;stroke:rgba(255,255,255,.15);stroke-width:1.5}
.gt22 .gt22-rowc {fill:#16305a;stroke:#dbad50;stroke-width:2;stroke-opacity:.8}   /* blind convergence */
.gt22 .gt22-acc  {fill:#dbad50}
.gt22 .gt22-bar  {fill:#dbad50;opacity:.82}
.gt22 .gt22-rule {stroke:rgba(255,255,255,.2);stroke-width:1.5}
.gt22 .gt22-totbx{fill:rgba(219,173,80,.10);stroke:#dbad50;stroke-opacity:.55;stroke-width:1.5}

/* --- the modal opener inside a note box.
   THE BUTTON TRAP: a <button> does not inherit font-size, so without an explicit
   size it silently renders at the 13.33px UA default and fails the floor. 1.30vw
   = 17.8px at 1366 = 1.30% of slide width. ---------------------------------- */
.gt22 .gt22-mb{display:inline-block;margin-top:.55em;font-family:inherit;
  font-size:1.20vw;font-weight:700;line-height:1.25;color:#dbad50;
  background:rgba(219,173,80,.10);border:1px solid rgba(219,173,80,.6);
  border-radius:5px;padding:.3em .7em;cursor:pointer;transition:background .15s,color .15s}
.gt22 .gt22-mb:hover,.gt22 .gt22-mb:focus-visible{background:#dbad50;color:#0a192f;outline:none}

/* the byte-identical SHA on the closing card. 1.12vw = 15.3px at 1366 = 1.12%. */
.gt22 .gt22-sha{display:block;margin-top:.6em;padding-top:.45em;
  border-top:1px solid rgba(219,173,80,.3);
  font-family:"SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace;
  font-size:1.25vw;line-height:1.45;color:#b9cee5;word-break:break-all}

/* the closing card sits over a dimmed picture, so it is allowed to cover art */
.gt22 .ob-note.wide{background:rgba(9,24,47,.96)}

/* --- modals. Every id is gt22-prefixed because all fragments splice into ONE
   document. showModal() promotes these to the top layer, so they escape both
   .ob-pic{overflow:hidden} and .slide{overflow:hidden}. Sizes in vw, never px. */
.gt22-mdl{border:1px solid #dbad50;border-left:4px solid #dbad50;border-radius:8px;
  background:#0a192f;color:#e8edf3;max-width:62vw;width:62vw;max-height:78vh;
  overflow:auto;padding:1.5vw 1.8vw;box-shadow:0 18px 60px rgba(0,0,0,.7);
  font-family:"Titillium Web",-apple-system,"Segoe UI",Roboto,Helvetica,sans-serif}
.gt22-mdl::backdrop{background:rgba(4,12,26,.78)}
.gt22-mdl h3{color:#dbad50;font-size:2.05vw;font-weight:700;line-height:1.15;margin:0 0 .5em}
.gt22-mdl p{font-size:1.32vw;line-height:1.5;margin:0 0 .75em;color:#e8edf3}
.gt22-mdl p b{color:#dbad50;font-weight:700}
.gt22-mdl form{margin:.4em 0 0}


/* --- type-floor repair gt22: 1.10% of 1366 = 15.03px effective.
   SVG text is scaled by the viewBox, so a vw size is multiplied by that scale too;
   these are raw viewBox units computed so raw x scale clears the floor. --- */
.gt22 .d{font-size:16px}
.gt22 .gt22-gl{font-size:27px}
.gt22 .gt22-hdr{font-size:27px}
.gt22 .gt22-lg{font-size:27px}

/* type-floor enforcement (high specificity; beats the earlier rules) */
.slide.gt22 .d,.slide.gt22 svg .d{font-size:16px !important}

/* ---- gt23 (frag_gt23.css) ---- */
/* ===========================================================================
   frag_gt23.css  -  slide gt23 "Inside a dimension"
   A four-click drill-down: HLTP > 2nd Level > 3rd Level > actual taxon strings,
   all read from TAXONOMY_AGREED_2026-09-01.tsv.

   EVERY class is prefixed .gt23- because an inline SVG <style> is not scoped to
   its subtree and all fragments splice into ONE document.

   TYPE FLOOR: nothing below 1.10vw (= 15.03px at a 1366px viewport). All sizes
   are vw, never px, never vh. The <button>s carry an explicit font-size and
   font-family because a form control does NOT inherit them.

   GEOMETRY (percentages of .ob-pic, which is 1770/750):
     col A  HLTP        left  0.5%  width 14%    right edge 14.5%
     col B  2nd level   left 17%    width 19%    right edge 36%
     col C  3rd level   left 38%    width 19%    right edge 57%
     col D  taxa        left 59%    width 40%    right edge 99%
     wire trunks sit in the gaps at x = 15.7% / 37.0% / 58.0%
     tree band ends at 67%; the note band (68% down) is therefore always
     over EMPTY ground - no .ob-note ever covers a revealed component.
   =========================================================================== */

/* --- §11 of the visual spec: the full-size step layer must pass the pointer
       through, its CONTENTS must take it, or nothing on the slide is selectable.
       Only a SHOWN step is live, so an invisible button is never clickable. --- */
.gt23 .ob-step{pointer-events:none}
.gt23 .ob-step.shown > *{pointer-events:auto}
.gt23 .gt23-wires{pointer-events:none}

/* defensive: .obuild .ob-pic img{inset:0;width:100%;height:100%} outranks a
   two-class selector. This slide ships no <img>, but the guard costs nothing. */
.gt23 .ob-pic img.gt23-component{position:absolute;right:auto;bottom:auto;
  width:auto;height:auto}

/* ---------------- the explanation boxes ---------------- */
.gt23 .ob-note.gt23-note{left:1%;top:68%;width:57%}
.gt23 .ob-note .k{font-size:1.34vw;line-height:1.18;color:#dbad50}   /* 18.30px @1366 */
.gt23 .ob-note .d{font-size:1.18vw;line-height:1.38;color:#e8edf3}   /* 16.12px @1366 */

/* ---------------- shared node chrome ---------------- */
.gt23 .gt23-hltp,
.gt23 .gt23-l2,
.gt23 .gt23-l3{position:absolute;box-sizing:border-box;
  background:#132f59;border:1px solid rgba(255,255,255,.14);
  border-left:3px solid #82a0bc;border-radius:5px;
  display:flex;flex-direction:column;justify-content:center;
  padding:.28em .6em;overflow:hidden}
.gt23 .gt23-l2.pick,
.gt23 .gt23-l3.pick{border-color:#dbad50;border-left-color:#dbad50;
  background:rgba(219,173,80,.14)}

/* ---------------- col A: the dimension ---------------- */
.gt23 .gt23-hltp{left:.5%;top:3%;width:14%;height:32%;
  border-left-color:#dbad50;background:rgba(219,173,80,.13);border-color:#dbad50}
.gt23 .gt23-hltp .gt23-kick{font-size:1.10vw;line-height:1.25;color:#dbad50;   /* 15.03px */
  font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.gt23 .gt23-hltp .n{font-size:1.34vw;line-height:1.16;color:#f3f6fb;           /* 18.30px */
  font-weight:700;margin:.18em 0 .22em}
.gt23 .gt23-hltp .c{font-size:1.22vw;line-height:1.2;color:#dbad50;            /* 16.66px */
  font-weight:700;font-variant-numeric:tabular-nums}
.gt23 .gt23-hltp .cl{font-size:1.10vw;line-height:1.2;color:#9db8d6}           /* 15.03px */

/* the gauge: taxa carried by each of the seven dimensions, 107 .. 32 */
.gt23 .gt23-gaugebtn{position:absolute;left:.5%;top:38%;width:14%;
  box-sizing:border-box;display:flex;flex-direction:column;gap:.3em;
  background:transparent;border:1px dashed rgba(219,173,80,.42);border-radius:5px;
  padding:.4em .5em;cursor:pointer;text-align:left;
  font-family:"Titillium Web",-apple-system,"Segoe UI",Roboto,Helvetica,sans-serif;
  font-size:1.10vw;line-height:1.22;color:#9db8d6}                             /* 15.03px */
.gt23 .gt23-gaugebtn:hover,
.gt23 .gt23-gaugebtn:focus-visible{border-color:#dbad50;color:#e8edf3;outline:none}
.gt23 .gt23-gauge{display:block;width:100%;height:auto}
.gt23 .gt23-bar{fill:#82a0bc;opacity:.42}
.gt23 .gt23-bar-on{fill:#dbad50;opacity:1}

/* ---------------- col B: the four second-level elements ---------------- */
.gt23 .gt23-l2{left:17%;width:19%;height:17%}
.gt23 .gt23-b1{top:.5%}
.gt23 .gt23-b2{top:17%}
.gt23 .gt23-b3{top:33.5%}
.gt23 .gt23-b4{top:50%}
.gt23 .gt23-l2 .n{font-size:1.12vw;line-height:1.15;color:#f3f6fb;font-weight:700}  /* 15.30px */
.gt23 .gt23-l2 .c{font-size:1.10vw;line-height:1.2;color:#9db8d6;margin-top:.15em}  /* 15.03px */
.gt23 .gt23-l2.pick .n{color:#dbad50}

/* ---------------- col C: the third-level elements ---------------- */
.gt23 .gt23-l3{left:38%;width:19%;height:17%}
.gt23 .gt23-c1{top:2.5%}
.gt23 .gt23-c2{top:21%}
.gt23 .gt23-c3{top:39.5%}
.gt23 .gt23-l3 .n{font-size:1.12vw;line-height:1.15;color:#f3f6fb;font-weight:700}  /* 15.30px */
.gt23 .gt23-l3 .c{font-size:1.10vw;line-height:1.2;color:#9db8d6;margin-top:.15em}  /* 15.03px */
.gt23 .gt23-l3.pick .n{color:#dbad50}

.gt23 .gt23-more{position:absolute;left:38%;top:58%;width:19%;height:8%;
  box-sizing:border-box;background:transparent;border:1px dashed rgba(219,173,80,.5);
  border-radius:5px;color:#dbad50;cursor:pointer;
  font-family:"Titillium Web",-apple-system,"Segoe UI",Roboto,Helvetica,sans-serif;
  font-size:1.10vw;line-height:1.2;font-weight:700}                             /* 15.03px */
.gt23 .gt23-more:hover,
.gt23 .gt23-more:focus-visible{background:rgba(219,173,80,.16);outline:none}

/* ---------------- col D: the taxa themselves ---------------- */
.gt23 .gt23-tax{position:absolute;left:59%;top:1.5%;width:40%;height:97%;
  box-sizing:border-box;display:flex;flex-direction:column;gap:2px;
  justify-content:space-between;background:rgba(10,25,47,.72);border:1px solid rgba(219,173,80,.5);
  border-left:3px solid #dbad50;border-radius:5px;padding:.38em .55em}
.gt23 .gt23-tax .th{font-size:1.18vw;line-height:1.2;color:#dbad50;             /* 16.12px */
  font-weight:700;margin-bottom:.15em}
.gt23 .gt23-tax .tx{font-size:1.12vw;line-height:1.16;color:#e8edf3;            /* 15.30px */
  padding-left:.85em;position:relative}
.gt23 .gt23-tax .tx::before{content:"";position:absolute;left:0;top:.42em;
  width:.34em;height:.34em;background:#dbad50;border-radius:50%}

/* ---------------- the wires ---------------- */
.gt23 .gt23-wires{position:absolute;inset:0;width:100%;height:100%;display:block}
.gt23 .gt23-wire{fill:none;stroke:#82a0bc;stroke-width:2;stroke-linejoin:round;
  stroke-linecap:round;vector-effect:non-scaling-stroke;opacity:.85}
.gt23 .gt23-wire-hot{stroke:#dbad50;stroke-width:2.5;opacity:1}

/* ---------------- motion: the hidden state carries transition:none ----------
   autofit() lights every fragment under body.measuring; a hidden state that
   TRANSITIONS animates back to hidden and the room sees the slide paint fully
   built and then fade. That defect lived in 33 rules once already.           */
.gt23 .ob-reveal{opacity:0;transition:none}
.gt23 .ob-step.shown .ob-reveal{opacity:1;transition:opacity .3s ease}
body.measuring .gt23 .ob-reveal,
body.nobuild .gt23 .ob-reveal{opacity:1;transition:none}

/* ---------------- modals (every id prefixed gt23-) ---------------- */
.gt23 .mdl{border:1px solid #dbad50;border-left:4px solid #dbad50;border-radius:8px;
  background:#0a192f;color:#e8edf3;padding:1.1em 1.35em 1em;
  width:min(58vw,880px);max-height:82vh;overflow:auto;
  box-shadow:0 18px 60px rgba(0,0,0,.65);
  font-family:"Titillium Web",-apple-system,"Segoe UI",Roboto,Helvetica,sans-serif}
.gt23 .mdl::backdrop{background:rgba(4,12,26,.82)}
.gt23 .mdl h3{font-size:1.55vw;line-height:1.15;color:#dbad50;font-weight:700;  /* 21.17px */
  margin:0 0 .35em}
.gt23 .mdl .ms{font-size:1.18vw;line-height:1.42;color:#9db8d6;margin-bottom:.85em}  /* 16.12px */
.gt23 .gt23-mrow{display:grid;grid-template-columns:1fr 4.2em 4.2em 5em;gap:.6em;
  align-items:baseline;padding:.3em .35em;border-bottom:1px solid rgba(255,255,255,.10);
  font-size:1.15vw;line-height:1.28;color:#e8edf3;font-variant-numeric:tabular-nums}  /* 15.71px */
.gt23 .gt23-mrow.gt23-m2{grid-template-columns:1fr 5em}
.gt23 .gt23-mrow span:not(:first-child){text-align:right;color:#9db8d6}
.gt23 .gt23-mhead{color:#dbad50;font-weight:700;border-bottom:1px solid #dbad50}
.gt23 .gt23-mhead span:not(:first-child){color:#dbad50}
.gt23 .gt23-mpick{background:rgba(219,173,80,.14);border-radius:4px}
.gt23 .gt23-mpick span{color:#dbad50;font-weight:700}
.gt23 .gt23-mtot{font-weight:700;border-bottom:0;border-top:1px solid #dbad50;margin-top:.25em}
.gt23 .gt23-mgrp{font-size:1.18vw;line-height:1.3;color:#dbad50;font-weight:700;  /* 16.12px */
  margin:.8em 0 .2em;letter-spacing:.02em}
.gt23 .mdl form{margin-top:1em;display:flex;justify-content:flex-end}
.gt23 .mdl button{background:transparent;border:1px solid #dbad50;color:#dbad50;
  border-radius:6px;padding:.34em 1.1em;cursor:pointer;font-weight:700;
  font-family:"Titillium Web",-apple-system,"Segoe UI",Roboto,Helvetica,sans-serif;
  font-size:1.15vw;line-height:1.3}                                              /* 15.71px */
.gt23 .mdl button:hover,
.gt23 .mdl button:focus-visible{background:#dbad50;color:#0a192f;outline:none}

@media (prefers-reduced-motion:reduce){
  .gt23 .ob-step.shown .ob-reveal{transition:none}
}

/* ---- gt24 (frag_gt24.css) ---- */
/* ============================================================================
   gt24 - "Inside a second dimension" - Remedy Sought.

   ROUTE 3 (draw it). Four inline-SVG figures and nothing raster: a proportional
   band showing the whole dimension to scale, then three "racks" - one per
   second-level element - whose rows are the third-level elements with a
   measured count bar and one taxon quoted verbatim from the agreed TSV. Depth
   beyond that lives in four <dialog> modals holding all 92 taxa.

   WHY IT IS COMPOSED THIS WAY (deliberately unlike its sibling slide): the
   explanation box sits in a FIXED right-hand column, x 70-99%, while every
   figure is confined to x 0-68%. A box therefore cannot cover already-revealed
   art at any step - the collision class VISUAL_SPEC section 2 was written for -
   without needing a scrim on any step but the last.

   TYPE FLOOR. Every size below is in cqw, which on a .slide (container-type:
   inline-size) is 1% of SLIDE width. Floor 1.10cqw = 15.03px at a 1366px slide.
   SVG text is sized in viewBox USER UNITS, which is a different scale: each
   figure is 68% of the picture wide (viewBox 1203.6 units) and the picture is
   1770 units wide, so at a 1366px slide one user unit = 0.7161px. The floor in
   user units is therefore 15.03 / 0.7161 = 20.99, and the two SVG sizes used
   are 22 (15.76px) and 28 (20.05px). Computed, not eyeballed.

   BUTTONS. .gt24-ib and .gt24-more, .gt24-close all carry font-family:inherit
   and an EXPLICIT font-size. A <button> inherits neither, and silently renders
   at the 13.33px UA default - below the floor - if you let it.

   MOTION (VISUAL_SPEC section 7). Every hidden state carries transition:none;
   the fade lives only on the shown state. Otherwise autofit's body.measuring
   pass paints the slide fully built and animates it away, which the room sees
   as a flash before the build starts.

   CLASS PREFIXING. Every class here is gt24-prefixed, and every dialog id is
   gt24-prefixed, because all fragments splice into ONE document.
   ========================================================================== */

/* ---- fragment machinery, scoped so it cannot fight the deck's own copy ---- */
.slide.gt24 [data-frag]{opacity:0;transform:translateY(.28em);transition:none}
.slide.gt24 [data-frag].shown{opacity:1;transform:none;
  transition:opacity .26s ease,transform .26s ease}
body.measuring .slide.gt24 [data-frag]{opacity:1;transform:none;transition:none}
body.nobuild  .slide.gt24 [data-frag]{opacity:1;transform:none}

/* ---- slide shell --------------------------------------------------------- */
.slide.gt24{background:#0a192f;color:#e8edf3;
  font-family:"Titillium Web",-apple-system,"Segoe UI",Roboto,Helvetica,sans-serif}
.slide.gt24 h2{margin:0 0 .28em;color:#dbad50;font-weight:700;
  font-size:4.5cqw;line-height:1.04;letter-spacing:-.01em;text-wrap:balance}
.slide.gt24 .sub{margin:-.1em 0 .70em;color:#b9cfe6;
  font-size:1.95cqw;line-height:1.35;max-width:66ch}

/* ---- the picture --------------------------------------------------------- */
.gt24 .ob-pic{position:relative;width:100%;aspect-ratio:1770/750;margin:0 auto;
  max-height:66cqh;border-radius:4px;overflow:hidden;background:transparent}

/* Each step is a full-size transparent layer that passes the pointer THROUGH,
   so its contents stay reachable to the review overlay (VISUAL_SPEC 11). */
.gt24 .ob-step{position:absolute;inset:0;transform:none;pointer-events:none}
.gt24 .ob-step > *{pointer-events:auto}
.gt24 .ob-scrim{position:absolute;inset:0;background:rgba(6,16,34,.80);
  pointer-events:none}

/* ---- the four figures ---------------------------------------------------- *
   Each is left-aligned in the art zone (0-68% of the picture) and its viewBox
   aspect EQUALS its element aspect, so preserveAspectRatio="meet" letterboxes
   nothing: element w = .68*1770 = 1203.6 units, element h = pct*750 units.     */
.gt24 .ob-pic svg.gt24-fig{position:absolute;left:0;right:auto;bottom:auto;
  width:68%;display:block;overflow:visible}
.gt24 .gt24-fig-band{top:0;    height:16%}   /* viewBox 1203.6 x 120   */
.gt24 .gt24-fig-ra  {top:18%;  height:23%}   /* viewBox 1203.6 x 172.5 */
.gt24 .gt24-fig-cc  {top:43%;  height:23%}   /* viewBox 1203.6 x 172.5 */
.gt24 .gt24-fig-ia  {top:68%;  height:32%}   /* viewBox 1203.6 x 240   */

.gt24 .gt24-fig text{font-family:"Titillium Web",-apple-system,"Segoe UI",
  Roboto,Helvetica,sans-serif}

/* ---- the proportional band (step 1) -------------------------------------- */
.gt24 .gt24-hltp{fill:#dbad50;font-weight:700;letter-spacing:.06em}
.gt24 .gt24-meta{fill:#b9cfe6;font-weight:400}
.gt24 .gt24-seg{stroke:rgba(10,25,47,.55);stroke-width:1}
.gt24 .gt24-tick{stroke:#0a192f;stroke-width:2.5}
.gt24 .gt24-seglab{fill:#e8edf3;font-weight:700}
.gt24 .gt24-segsub{fill:#b9cfe6;font-weight:400}

/* ---- a rack: one second-level element, its third-level rows -------------- */
.gt24 .gt24-l2{fill:#dbad50;font-weight:700;letter-spacing:.055em}
.gt24 .gt24-rule{stroke:rgba(255,255,255,.10);stroke-width:1}
.gt24 .gt24-rule-hd{stroke:rgba(219,173,80,.45);stroke-width:1}
.gt24 .gt24-l3{fill:#e8edf3;font-weight:600}
.gt24 .gt24-trk{fill:rgba(219,173,80,.15)}
.gt24 .gt24-cnt{font-weight:700}
.gt24 .gt24-tax{fill:#b9cfe6;font-weight:400}
.gt24 .gt24-row:hover .gt24-tax{fill:#e8edf3}

/* ---- the round "i" badge that opens a second-level element's full list ---- *
   A <button> inherits NEITHER family nor size: both are stated outright.       */
.gt24 .gt24-ib{position:absolute;left:var(--x);top:var(--y);
  font-family:"Titillium Web",-apple-system,"Segoe UI",Roboto,Helvetica,sans-serif;
  font-size:1.30cqw;font-weight:700;line-height:1;font-style:italic;
  width:2.35cqw;height:2.35cqw;padding:0;border:0;border-radius:50%;
  color:#0a192f;background:#dbad50;cursor:pointer;
  display:grid;place-items:center;
  box-shadow:0 2px 8px rgba(0,0,0,.5);transition:transform .15s}
.gt24 .gt24-ib:hover,.gt24 .gt24-ib:focus-visible{transform:scale(1.12);outline:none;
  box-shadow:0 0 0 .25cqw rgba(219,173,80,.35)}

/* ---- the explanation box: exactly one on screen at a time ---------------- */
.gt24 .ob-note{position:absolute;left:var(--x);top:var(--y);width:var(--w);
  background:rgba(10,24,47,.94);border:1px solid rgba(219,173,80,.55);
  border-left:3px solid #dbad50;border-radius:5px;padding:.72em .9em;
  box-shadow:0 8px 26px rgba(0,0,0,.55);transition:opacity .2s ease}

/* ---- gt25 (frag_gt25.css) ---- */
/* ---- gt25 &#183; "One issue, seven readings" -------------------------------------
   The payoff fragment for the lower levels: ONE real congressional issue, read on
   all seven dimensions at once, with the verbatim taxon from
   TAXONOMY_AGREED_2026-09-01.tsv on each.

   ROUTE 3 (draw it). There is no source figure for this and never was, so the
   whole picture is one inline SVG: an issue card, a beam, a prism, and seven rays
   into seven labelled readings. No plate, no reveal image, nothing rastered.

   ONE SVG, NOT EIGHT. VISUAL_SPEC section 6: every .ob-step is a full-size layer,
   so a per-step <svg> would stack eight full-size overlays and swallow the pointer.
   Instead the art is a SINGLE static <svg> child of .ob-pic and each reading is a
   <g class="gt25-lay gt25-rN"> lit from the step's own .shown class through :has().
   Each .ob-step therefore carries only its .ob-note - which is exactly what the
   spec says a box-only step should carry.

   TYPE FLOOR, COMPUTED NOT EYEBALLED. Inline SVG text is measured against the
   viewBox. Worst case for this fragment:
     .ob-pic is width:100% of the slide content box (92.8% of slide width after the
     3.6% side padding) BUT is also clamped by max-height:66cqh, and #stage is the
     nearest container with block containment. In present mode stage height is
     slide_width * 9/16, so the clamped picture width is
       66% * (W * 9/16) * 1770/750 = 0.876 * W.
     The viewBox is 1770 wide, so a viewBox font-size F renders at
       F * 0.876 * W / 1770 = 0.000495 * F * W  px.
     The 1.10%-of-slide-width floor is therefore F >= 22.2.
   gt01 measured that .ob-pic does NOT always keep its declared aspect (it read 2.60
   against a declared 2.6 - it is a shrinkable flex item). At 2.60 the meet-fitted
   SVG loses a further 9.2% of scale, which pushes the floor to F >= 24.5. NOTHING
   in this fragment is below 26, so the smallest glyph holds at 1.29% of slide width
   in the nominal case and 1.17% in the shrunk case. Both clear the floor.

   HTML type on this slide uses cqw, which is 1% of the SLIDE's inline size - the
   stricter and more literal reading of "1.10% of slide width" than vw, since the
   slide is never wider than the viewport. Nothing is below 1.32cqw (18.0px at
   1366), and the two <button>s carry an explicit size plus font-family:inherit,
   because a button does NOT inherit font-size and silently falls to the 13.33px UA
   default - the trap that shipped today.

   COLOUR. Ground #0a192f; the seven rays run a warm-to-cool ramp anchored at the
   two house accents, gold #dbad50 through to light blue #82a0bc, so the prism reads
   as a spectrum without leaving the palette. All PROSE is off-white #e8edf3 or
   #b9cfe6 (luminance 237 and 205); gold and the ramp are used for accents, rules
   and headings only, matching every other slide in the deck.
   ------------------------------------------------------------------------------ */

/* ---------- the picture ---------- */
.gt25 .ob-pic{aspect-ratio:1770/750;max-height:66cqh;background:#0a192f;border-radius:5px}
.gt25 .ob-pic > svg.gt25-svg{position:absolute;inset:0;width:100%;height:100%;display:block}

/* ---------- hit-testing (VISUAL_SPEC section 11) ----------------------------
   A .ob-step is a full-size transparent layer. Without these two rules the LAST
   step's layer sits over every earlier note and the modal buttons cannot be
   clicked at all, even though they are visible. The layer passes the pointer
   through; its contents take it. */
.gt25 .ob-step{pointer-events:none}
.gt25 .ob-step > *{pointer-events:auto}
.gt25 .ob-scrim{pointer-events:none}

/* ---------- the seven readings light one per click --------------------------
   Hidden state carries transition:none. autofit() lights every fragment under
   body.measuring, and a hidden state that TRANSITIONS animates back to hidden -
   the slide paints fully built and fades away, which the room sees as a flash
   before the build starts. The fade lives on the SHOWN state only. */
.gt25 .gt25-lay{opacity:0;transition:none}
.gt25 .ob-pic:has(.gt25-s1.shown) .gt25-r1,
.gt25 .ob-pic:has(.gt25-s2.shown) .gt25-r2,
.gt25 .ob-pic:has(.gt25-s3.shown) .gt25-r3,
.gt25 .ob-pic:has(.gt25-s4.shown) .gt25-r4,
.gt25 .ob-pic:has(.gt25-s5.shown) .gt25-r5,
.gt25 .ob-pic:has(.gt25-s6.shown) .gt25-r6,
.gt25 .ob-pic:has(.gt25-s7.shown) .gt25-r7{opacity:1;transition:opacity .32s ease}
/* measuring must see the built state, and B (builds off) must show everything */
body.measuring .gt25 .gt25-lay,
body.nobuild  .gt25 .gt25-lay{opacity:1;transition:none}

/* ---------- the explanation boxes ----------
   Slightly tightened from the house default so a 200-character box clears the
   picture: at --w:27% the content column is ~294px at 1366, 1.40cqw is 19.1px,
   ~33 characters a line, seven lines, ~232px against a 507px picture. */

<template id="deck"><section class="slide hyc" data-audience="all" data-n="OPENING. Hypothesen, AIRA-training, woensdag 14 oktober 2026, 10:45–12:00, Den Haag. Stephan presenteert. WAT DEZE SESSIE IS: de tweede helft van de woensdagochtend, na de sessie over taxonomie. Ze volgt hetzelfde patroon: eerst formuleren de groepen zelf hypothesen, daarna met een taalmodel dat bewust vanuit andere perspectieven redeneert, en dan vergelijken ze en kiezen ze de hypothesen die ze kunnen toetsen. UITGANGSPUNT (programmagids): een groep analisten met een vergelijkbare achtergrond komt vaak tot vergelijkbare hypothesen; een model kan andere invalshoeken naar boven halen. UITGEWERKTE CASUS: Noordelijk Signaal, een FICTIEVE trainingscasus (echte staten, verzonnen gebeurtenissen) met 1.000 verzonnen documenten; dezelfde casus loopt door het taxonomiedeck. OPLEVERING aan het eind van de dag: twee of drie toetsbare hypothesen per groep, die samen met taxonomie v1 meegaan naar de annotatiesessie om 13:00 en naar de patroonanalyse op donderdag. TIMING: 75 minuten, waarvan de drie rondes samen ongeveer 40 minuten innemen. Coverbeeld: een getekend schema (één redeneerlijn die zich tussen verspreid bewijs vertakt in concurrerende takken); het is een metafoor, geen data." data-sec="why" data-sid="hy-cover" data-t="Hypothesen"><svg aria-label="Schema: één redeneerlijn splitst zich tussen verspreide stukjes bewijs in zes concurrerende takken, die elk bij een andere verklaring eindigen" class="hyc-art" preserveaspectratio="xMidYMid slice" role="img" viewbox="0 0 1600 900"><path class="hyc-grid" d="M0 0 V900"></path><path class="hyc-grid" d="M50 0 V900"></path><path class="hyc-grid" d="M100 0 V900"></path><path class="hyc-grid" d="M150 0 V900"></path><path class="hyc-grid" d="M200 0 V900"></path><path class="hyc-grid" d="M250 0 V900"></path><path class="hyc-grid" d="M300 0 V900"></path><path class="hyc-grid" d="M350 0 V900"></path><path class="hyc-grid" d="M400 0 V900"></path><path class="hyc-g <section class="slide obuild hyw" data-audience="all" data-n="WAAROM MEER DAN ÉÉN VERKLARING. Opbouw in vier klikken. KLIK 1, GELIJKSOORTIGE MENSEN: het uitgangspunt uit de programmagids: een groep analisten met een vergelijkbare achtergrond komt vaak tot vergelijkbare hypothesen. Dezelfde opleiding, dezelfde bronnen, hetzelfde institutionele geheugen: de zoekbundels overlappen. Dit is geen kritiek op iemand in de zaal; het is een eigenschap van elk homogeen team. KLIK 2, SATISFICING: de term van Herbert Simon, overgenomen door Richards Heuer in Psychology of Intelligence Analysis (1999, hoofdstuk 4): het eerste alternatief kiezen dat goed genoeg lijkt, in plaats van ze allemaal te onderzoeken. In april noemden we het de dominante faalwijze. Symptoom in groepswerk: na twintig minuten besluit de groep dat ze genoeg heeft. Hypothese nummer vijf voelt altijd geforceerd; dat is normaal. KLIK 3, DE MISSER: de dure fouten komen van de verklaring die nooit op de lijst stond, want bewijs wordt alleen afgewogen tegen de hypothesen die er zijn. Voorbeeld: Irak 2002; de Amerikaans-Britse inschattingen wogen niet serieus de mogelijkheid dat Irak zijn wapenprogramma’s had opgegeven maar de ambiguïteit in stand hield, deels om Iran af te schrikken (Robb–Silberman-commissie, 2005; Robert Jervis, Why Intelligence Fails, 2010). KLIK 4, HET REMEDIE VOOR VANDAAG: verbreed de ruimte bewust voordat je toetst. Eerst jullie eigen lijst, dan een model dat vanuit vaste, andere perspectieven redeneert (in de uitgewerkte casus: een planner van de Generale Staf, een binnenlands adviseur van het Kremlin, een Chinese analist, een scepticus). De labels rechts zijn illustraties van zulke perspectieven. Het veld met stippen is een schema, geen data." data-sec="why" data-sid="hy-why" data-t="Waarom één team één verhaal vindt">
<h2>Waarom één team één verhaal vindt</h2>
<p class="sub">De hypothesen die je nooit opschrijft, kun je ook nooit toetsen.</p>
<div class="ob-pic">

dy" d="M34 505 Q34 466 60 466 Q86 466 86 505 Z"></path><circle class="hyw-head" cx="120" cy="440" r="17"></circle><path class="hyw-body" d="M94 505 Q94 466 120 466 Q146 466 146 505 Z"></path><circle class="hyw-head" cx="180" cy="440" r="17"></circle><path class="hyw-body" d="M154 505 Q154 466 180 466 Q206 466 206 505 Z"></path><circle class="hyw-head" cx="240" cy="440" r="17"></circle><path class="hyw-body" d="M214 505 Q214 466 240 466 Q266 466 266 505 Z"></path><text class="hyw-lab" x="300" y="452">Jullie team:</text><text class="hyw-lab" x="300" y="477">dezelfde opleiding,</text><text class="hyw-lab" x="300" y="502">dezelfde bronnen</text></svg>
<div class="ob-note" style="--x:64%;--y:4%;--w:35.5%"><div class="k">Gelijksoortige mensen, gelijksoortige hypothesen</div><div class="d">Een groep analisten met dezelfde opleiding, dezelfde bronnen en hetzelfde institutionele geheugen doorzoekt meestal dezelfde hoek van het probleem. Hun hypothesen overlappen, dus de lijst lijkt langer dan de reeks ideeën die hij werkelijk dekt.</div></div></div>
<div class="ob-step" data-frag="1"><svg aria-label="Het eerste plausibele verhaal is gemarkeerd en het zoeken stopt" class="hyw-svg" preserveaspectratio="xMidYMid meet" viewbox="0 0 1300 540"><circle class="hyw-glow" cx="250" cy="150" r="34"></circle><circle class="hyw-gold" cx="250" cy="150" r="11"></circle><path class="hyw-lead" d="M262 160 L300 190"></path><rect class="hyw-tagbg" height="34" rx="5" width="330" x="300" y="180"></rect><text class="hyw-tag" x="312" y="204">Eerste plausibele verhaal: stop</text></svg>
<div class="ob-note" style="--x:64%;--y:4%;--w:35.5%"><div class="k">Satisficing: het eerste verhaal dat goed genoeg is, wint</div><div class="d">Richards Heuer (<i>Psychology of Intelligence Analysis</i>, 1999) noemt het satisficing: de eerste verklaring accepteren die goed genoeg lijkt, in plaats van de alternatieven te onderzoeken. Zodra een verhaal past, lees je nieuw bewijs als steun ervoor.</div></div></div>
<div class="ob-step" data-frag="1"><svg aria-label="Een verre verklaring die niemand opschreef, omcirkeld" class="hyw-svg" preserveaspectratio="xMidYMid meet" viewbox="0 0 1300 540"><circle class="hyw-miss" cx="660" cy="432" r="30"></circle><circle class="hyw-missdot" cx="660" cy="432" r="11"></circle><text class="hyw-misslab" text-anchor="middle" x="660" y="494">Die niemand opschreef</text></svg>
<div class="ob-note" style="--x:64%;--y:4%;--w:35.5%"><div class="k">De dure misser is die niemand opschreef</div><div class="d">Bewijs wordt alleen afgewogen tegen hypothesen die op de lijst staan. Volgens de <span class="hyw-nw">Robb–Silberman</span>-commissie (2005) is in Irak in 2002 nooit serieus getoetst of Bagdad zijn wapenprogramma’s had opgegeven maar de ambiguïteit liet bestaan.</div></div></div>
<div class="ob-step" data-frag="1"><svg aria-label="Bundels uit drie andere perspectieven verlichten andere gebieden, ook de gemiste verklaring" class="hyw-svg" preserveaspectratio="xMidYMid meet" viewbox="0 0 1300 540"><defs><clippath id="hyw-frameclip"><rect height="465" rx="10" width="800" x="20" y="55"></rect></clippath></defs><g clip-path="url(#hyw-frameclip)"><path class="hyw-beam2" d="M840 304 L560 90 L790 64 Z"></path><path class="hyw-beam3" d="M840 374 L540 225 L530 410 Z"></path><path class="hyw-beam4" d="M840 444 L615 395 L615 470 Z"></path></g><path class="hyw-con2" d="M820 304 H850"></path><path class="hyw-con3" d="M820 374 H850"></path><path class="hyw-con4" d="M820 444 H850"></path><circle class="hyw-lit2" cx="610" cy="95" r="9"></circle><circle class="hyw-lit2" cx="700" cy="160" r="9"></circle><circle class="hyw-lit2" cx="760" cy="110" r="9"></circle><circle class="hyw-lit2" cx="560" cy="300" r="9"></circle><circle class="hyw-lit2" cx="610" cy="380" r="9"></circle><circle class="hyw-missdot2" cx="660" cy="432" r="11"></circle><rect class="hyw-pv hyw-pv2" height="38" rx="5" width="380" x="850" y="285"></rect><text class="hyw-pvt" x="866" y="311">Een planner aan de andere kant</text><rect class="hyw-pv hyw-pv3" height="38" rx="5" width="380" x="850" y="355"></rect><text class="hyw-pvt" x="866" y="381">Een analist uit een derde land</text><rect class="hyw-pv hyw-pv4" height="38" rx="5" width="380" x="850" y="425"></rect><text class="hyw-pvt" x="866" y="451">Een scepticus van onze lezing</text></svg>
<div class="ob-note" style="--x:64%;--y:4%;--w:35.5%"><div class="k">Vandaag: eerst verbreden, dan toetsen</div><div class="d">Schrijf eerst jullie eigen hypothesen op. Laat daarna een model redeneren vanuit vaste, andere perspectieven, en kijk welke invalshoeken jullie misten. Kies pas dan wat je toetst.</div></div></div>

<section class="slide obuild hyg" data-audience="all" data-n="WAT MAAKT EEN HYPOTHESE BRUIKBAAR. Opbouw in acht klikken. KLIK 1–4, STOP (uit het hypothesekader van april en de hypotheseprompt van SDS): Stelling, Toetsbaar, Observatie-gebaseerd, Predictief. Loop elke letter langs. Het acroniem werkt in het Nederlands net zo als in het Engels (Statement, Testable, Observation-based, Predicts). Tegenvoorbeeld voor Toetsbaar, bewaard uit april: ‘Rusland zal mobiliseren of niet’ is geen hypothese. KLIK 5, VOOR DE SET: de hypothesen moeten onderscheidend zijn (de criteria onafhankelijkheid en onderscheidbaarheid in het kader: geen logisch gevolg van een andere, te onderscheiden door een of andere waarneming) en minstens één moet uitgaan van misleiding (principe van misleidingsbewustzijn; in april: ‘geen maskirovka-hypothese betekent dat je de Russische kant van het spel niet hebt gemodelleerd’). KLIK 6, ONZE TOEVOEGING VOOR DEZE WEEK: zichtbaar in het corpus. Vanmiddag annoteren de groepen minstens 1.000 fragmenten met hun eigen taxonomie; een hypothese die niet naar een categorie, een brontype of een tijdspatroon wijst, kun je met die uitvoer niet toetsen. KLIK 7–8, DE CASUS (Noordelijk Signaal, FICTIEF): het slechte voorbeeld is de reflexzin. Het goede voorbeeld is de verklaring ‘binnenlandse afleiding’, in STOP-vorm geformuleerd; ze spiegelt een van de hypothesen die de HCSS-prompt op de casus opleverde (H4 in demo_outputs/hypotheses_multiperspective.md, daar ‘Domestic diversion’), dus presenteer haar niet als het juiste antwoord, alleen als een goed gevormd antwoord. De categorienamen (Geadresseerde, Russisch binnenland) komen uit de taxonomie die de HCSS-prompt in de vorige sessie opleverde; het model gaf ze in het Engels (Addressee, Domestic Russian), de slide toont de Nederlandse weergave. NS-0242 is het Kremlinverslag van Poetins overleg met de gouverneurs op Dag 8." data-sec="good" data-sid="hy-good" data-t="Wat maakt een hypothese bruikbaar">
<h2>Wat maakt een hypothese bruikbaar</h2>
<p class="sub">Vier toetsen per hypothese, twee voor de hele set, één voor deze week.</p>
<div class="ob-pic">
<div class="ob-step" data-frag="1"><div class="hyg-tile" style="--i:0"><span class="hyg-L">S</span><p class="hyg-w">Stelling</p><p class="hyg-g">Eén zin die onwaar kan blijken</p></div><div class="ob-note" style="--x:70.5%;--y:3%;--w:28%"><div class="k">S · Stelling</div><div class="d">Een hypothese is een bewering over de wereld, geschreven als één eenvoudige zin. Als ze niet onwaar kan blijken, is het een beschrijving of een hoop, geen hypothese.</div></div></div><div class="ob-step" data-frag="1"><div class="hyg-tile" style="--i:1"><span class="hyg-L">T</span><p class="hyg-w">Toetsbaar</p><p class="hyg-g">Haalbaar bewijs kan haar weerleggen</p></div><div class="ob-note" style="--x:70.5%;--y:3%;--w:28%"><div class="k">T · Toetsbaar</div><div class="d">Er moet bewijs bestaan dat je realistisch kunt krijgen en dat de hypothese onderuit kan halen. “Rusland zal escaleren of niet” overleeft elke waarneming, dus vertelt het je niets.</div></div></div><div class="ob-step" data-frag="1"><div class="hyg-tile" style="--i:2"><span class="hyg-L">O</span><p class="hyg-w">Observatie‑<br/>gebaseerd</p><p class="hyg-g">Steunt op wat we zien, niet op geraden bedoelingen</p></div><div class="ob-note" style="--x:70.5%;--y:3%;--w:28%"><div class="k">O · Observatie-gebaseerd</div><div class="d">Veranker de bewering in dingen die sporen nalaten: uitspraken, bewegingen, timing, wie wat tegen wie zegt. Een bedoeling waar je alleen naar kunt raden, is een conclusie voor later, geen vertrekpunt.</div></div></div><div class="ob-step" data-frag="1"><div class="hyg-tile" style="--i:3"><span class="hyg-L">P</span><p class="hyg-w">Predictief</p><p class="hyg-g">Zegt wat we hierna zien als ze klopt</p></div><div class="ob-note" style="--x:70.5%;--y:3%;--w:28%"><div class="k">P · Predictief</div><div class="d">Een bruikbare hypothese vertelt je wat je hierna kunt verwachten als ze klopt. Die verwachting zoek je in de documenten, en daarmee houd je twee hypothesen uit elkaar.</div></div></div><div class="ob-step" data-frag="1"><div class="hyg-card hyg-set"><p class="hyg-ch">Voor de set als geheel</p><p class="hyg-li"><b>Onderscheidend:</b> elke hypothese voorspelt iets wat de andere niet voorspellen</p><p class="hyg-li"><b>Misleiding:</b> minstens één gaat ervan uit dat de tegenstander vormt wat jij ziet</p></div><div class="ob-note" style="--x:70.5%;--y:3%;--w:28%"><div class="k">Onderscheidend, en één gaat uit van misleiding</div><div class="d">Twee hypothesen die dezelfde waarnemingen voorspellen, kan geen enkel bewijs scheiden, dus voeg ze samen. En minstens één hoort uit te gaan van misleiding: een tegenstander die weet dat je kijkt, kan ensceneren wat je ziet.</div></div></div><div class="ob-step" data-frag="1"><div class="hyg-card hyg-corp"><p class="hyg-ch">Voor ons: zichtbaar in het corpus</p><p class="hyg-li"><b>Categorie:</b> welke taxonomiecategorie zou oplichten?</p><p class="hyg-li"><b>Bron:</b> welk brontype zou het dragen?</p><p class="hyg-li"><b>Tijd:</b> welke verandering in de tijd zou het tonen?</p></div><div class="ob-note" style="--x:70.5%;--y:3%;--w:28%"><div class="k">Zichtbaar in het corpus</div><div class="d">Vanmiddag toets je hypothesen aan geannoteerde documenten, niet aan je geheugen. Elke hypothese moet dus wijzen naar een taxonomiecategorie, een brontype of een verandering in de tijd die zou opduiken als ze klopt.</div></div></div><div class="ob-step" data-frag="1"><div class="hyg-ex hyg-bad"><p class="hyg-et">Niet bruikbaar</p><p class="hyg-q">“Rusland stuurt een boodschap aan de NAVO.”</p><p class="hyg-why">Waar van bijna alles, voorspelt niets, en geen document kan het weerleggen.</p></div><div class="hyg-fict">FICTIEF – trainingscasus · Noordelijk Signaal</div><div class="ob-note" style="--x:70.5%;--y:3%;--w:28%"><div class="k">Een slecht voorbeeld uit de casus</div><div class="d">Dit is de zin die de meesten van ons als eerste over Noordelijk Signaal zouden schrijven. Hij is waarschijnlijk waar, en dat is precies het probleem: hij past bij elk document in het pakket, dus toetsen leert je niets.</div></div></div><div class="ob-step" data-frag="1"><div class="hyg-ex hyg-good"><p class="hyg-et">Bruikbaar: “binnenlandse afleiding”</p><p class="hyg-q">Het nucleaire taalgebruik van Moskou richt zich vooral op Russen, om woede over regionale bezuinigingen af te leiden. Zo ja, dan is dreigtaal het dichtst in binnenlandse kanalen, staat ze naast begrotingsnieuws en keert ze terug als nieuwe grieven oplaaien.</p><p class="hyg-vis"><b>Categorie:</b> Geadresseerde = Russisch binnenland · <b>Bron:</b> staatstelevisie en staats-Telegram meer dan het Russische BuZa · <b>Tijd:</b> Poetins opmerking op Dag 8 viel tijdens een begrotingsoverleg met gouverneurs (NS‑0242)</p></div><div class="ob-note" style="--x:70.5%;--y:3%;--w:28%"><div class="k">Een goed voorbeeld uit de casus</div><div class="d">Zelfde casus, nu met een bewering die kan falen. Ze noemt een publiek, een motief en drie waarneembare gevolgen, en elk gevolg past bij een taxonomiecategorie, een brontype of een moment op de tijdlijn.</div></div></div>
</div>

<section class="slide obuild hyk" data-audience="all" data-n="DE CASUS, opgebouwd in vijf klikken (vier fasen, dan de vraag). Noordelijk Signaal is een FICTIEVE trainingscasus: echte staten en instellingen, verzonnen gebeurtenissen, relatieve dagen in plaats van datums, en een pakket van 1.000 verzonnen documenten (740 in het Russisch met een vertaling, 260 in het Engels; 14 brontypen, van milbloggers en Telegramkanalen van de staat tot Noorse media, de NAVO en OSINT-accounts; ongeveer een kwart bewust niet ter zake). Dezelfde casus loopt door het taxonomiedeck. Achtergrond in de fictie: de oorlog in Oekraïne gaat door met een grotendeels vastgelopen front, de Russische federale begroting staat onder druk en regio’s bezuinigen, en de Amerikaans-Russische contacten over strategische stabiliteit liggen stil, al is een hervatting geopperd. FASE 1 (Dag 1–3): de aanleiding; de briefing van Zacharova is NS-0013. FASE 2 (Dag 4–8): Medvedev NS-0722, ministerie van Defensie NS-0416, Peskov NS-0395 (zijn briefing van Dag 6, transcript gepubliceerd op Dag 7), Poetin NS-0242. De volgende slide zet deze vijf stemmen naast elkaar. FASE 3 (Dag 9–12): reacties en het spoor naar Genève. FASE 4 (Dag 13–14): de bommenwerpers en het uitstel. Na Dag 14 gaat de casus verder (de Russische televisie viert feest op Dag 15, Genève op Dag 20), maar verklap dat nu NIET: de vraag wordt gesteld per Dag 14, zodat de groepen voorspellingen kunnen opschrijven. KLIK 5, DE VRAAG: lees haar hardop voor en laat haar op het scherm staan terwijl de groepen een minuut nadenken. De scenarioschrijvers hebben het bewijs bewust zo geschreven dat meerdere verklaringen openblijven; er staat geen enkel juist antwoord in het pakket. Bron: _build/scenario_bible.md." data-sec="case" data-sid="hy-case" data-t="De casus: Noordelijk Signaal">
<h2>De casus: Noordelijk Signaal</h2>
<p class="sub">Een fictieve Arctische crisis: echte staten, verzonnen feiten en documenten.</p>
<div class="ob-pic">
<div class="hyk-axis"><span class="hyk-sep" style="--l:24%"></span><span class="hyk-sep" style="--l:56%"></span><span class="hyk-sep" style="--l:81%"></span><span class="hyk-tick" style="--l:4.000%">1</span><span class="hyk-tick" style="--l:12.000%">2</span><span class="hyk-tick" style="--l:20.000%">3</span><span class="hyk-tick" style="--l:27.200%">4</span><span class="hyk-tick" style="--l:33.600%">5</span><span class="hyk-tick" style="--l:40.000%">6</span><span class="hyk-tick" style="--l:46.400%">7</span><span class="hyk-tick" style="--l:52.800%">8</span><span class="hyk-tick" style="--l:59.125%">9</span><span class="hyk-tick" style="--l:65.375%">10</span><span class="hyk-tick" style="--l:71.625%">11</span><span class="hyk-tick" style="--l:77.875%">12</span><span class="hyk-tick" style="--l:85.750%">13</span><span class="hyk-tick" style="--l:95.250%">14</span></div>
<div class="ob-step" data-frag="1"><div class="hyk-col" style="--x:0%;--w:24%"><p class="hyk-ph"><b>Dag 1–3</b> · De aanleiding</p><div class="hyk-ev"><span class="hyk-d">Dag 1</span><p class="hyk-t">Noorwegen en het VK kondigen NAVO-oefening <i>Arctic Bastion</i> aan in Finnmark (Dag 8–18, ongeveer 6.000 militairen) en een bezoek van onderzeeboot HMS Anson aan Tromsø.</p></div><div class="hyk-ev"><span class="hyk-d">Dag 2</span><p class="hyk-t">Russische ambassade in Oslo: een “onvriendelijke stap vlak bij onze grenzen.”</p></div><div class="hyk-ev"><span class="hyk-d">Dag 3</span><p class="hyk-t">Zacharova (BuZa): “provocerend”; Rusland neemt “militair-technische maatregelen.” Geen nucleaire woorden.</p></div></div><div class="ob-note" style="--x:1%;--y:76.5%;--w:83%"><div class="k">De aanleiding: een NAVO-oefening naast de deur</div><div class="d">Een NAVO-oefening in het hoge noorden van Noorwegen, dicht bij het schiereiland Kola, plus een Britse jachtonderzeeboot die Tromsø bezoekt. De eerste antwoorden van Moskou zijn diplomatiek en bevatten geen nucleaire woorden.</div></div></div><div class="ob-step" data-frag="1"><div class="hyk-col" style="--x:24%;--w:32%"><p class="hyk-ph"><b>Dag 4–8</b> · De woorden escaleren</p><div class="hyk-ev"><span class="hyk-d">Dag 4</span><p class="hyk-t">Medvedev op Telegram: Noorwegen “houdt het eerste uur niet vol”; noemt kernwapens. Eén zin later verwijderd.</p></div><div class="hyk-ev"><span class="hyk-d">Dag 5</span><p class="hyk-t">Ministerie van Defensie: onaangekondigde gereedheidsinspectie van de Noordelijke Vloot, met oefeningen met “speciale munitie.”</p></div><div class="hyk-ev"><span class="hyk-d">Dag 6</span><p class="hyk-t">Peskov: “Onze nucleaire doctrine is openbaar. Lees haar.” Geen commentaar op Medvedev.</p></div><div class="hyk-ev"><span class="hyk-d">Dag 7</span><p class="hyk-t">OSINT-beelden: meer voertuigen bij een opslagplaats op Kola. Anderen: routine­onderhoud.</p></div><div class="hyk-ev"><span class="hyk-d">Dag 8</span><p class="hyk-t">Poetin, op een overleg over regionale bezuinigingen: Rusland heeft “middelen die niemand anders heeft.”</p></div></div><div class="ob-note" style="--x:1%;--y:76.5%;--w:83%"><div class="k">Vijf dagen, vier Russische stemmen</div><div class="d">Een expliciet dreigement van een oud-president, een oefening met “speciale munitie,” een verwijzing naar de doctrine en een toespeling van de president. Intussen zijn de satellietbeelden op twee manieren te lezen.</div></div></div><div class="ob-step" data-frag="1"><div class="hyk-col" style="--x:56%;--w:25%"><p class="hyk-ph"><b>Dag 9–12</b> · Reacties</p><div class="hyk-ev"><span class="hyk-d">Dag 9</span><p class="hyk-t">Milbloggers verdeeld: sommigen juichen, anderen klagen over “alleen woorden terwijl het front stilstaat.”</p></div><div class="hyk-ev"><span class="hyk-d">Dag 10</span><p class="hyk-t">China roept “alle partijen” op tot terughoudendheid in het Noordpoolgebied.</p></div><div class="hyk-ev"><span class="hyk-d">Dag 11</span><p class="hyk-t">Noorse premier: de oefening gaat door; Noorwegen “laat zich niet intimideren.”</p></div><div class="hyk-ev"><span class="hyk-d">Dag 12</span><p class="hyk-t">VS en Rusland bevestigen overleg over strategische stabiliteit in Genève op Dag 20. De vlootinspectie eindigt volgens plan.</p></div></div><div class="ob-note" style="--x:1%;--y:76.5%;--w:83%"><div class="k">Iedereen reageert, nog niemand bindt in</div><div class="d">De Russische haviken zijn verdeeld, Peking maant tot kalmte en Oslo houdt voet bij stuk. Dan opent zich een diplomatiek spoor: Washington en Moskou spreken af om in Genève te praten.</div></div></div><div class="ob-step" data-frag="1"><div class="hyk-col" style="--x:81%;--w:19%"><p class="hyk-ph"><b>Dag 13–14</b> · Een uitkomst?</p><div class="hyk-ev"><span class="hyk-d">Dag 13</span><p class="hyk-t">Twee Tu-95-bommenwerpers vliegen langs de Noorse kust en worden routinematig onderschept.</p></div><div class="hyk-ev"><span class="hyk-d">Dag 14</span><p class="hyk-t">VK: bezoek van HMS Anson aan Tromsø “om technische redenen uitgesteld.”</p></div></div><div class="ob-note" style="--x:1%;--y:76.5%;--w:83%"><div class="k">Een toegeving, of toch niet?</div><div class="d">Het bezoek van de onderzeeboot wordt uitgesteld, officieel om technische redenen. Of dat een concessie is, toeval of een stille keuze in Londen, is precies wat de documenten openlaten.</div></div></div><div class="ob-step" data-frag="1"><div class="ob-note wide hyk-q" style="--x:1%;--y:76.5%;--w:80%"><div class="k">Jullie vraag</div><div class="d">Wat probeert Moskou met deze signalen te bereiken, en wat zouden we hierna zien als jullie gelijk hebben?</div></div></div>

<section class="slide obuild hyv" data-audience="all" data-n="EEN SIGNAAL, VIJF STEMMEN. De ladder links is de dimensie ‘Nucleaire explicietheid’ (niveaus L0–L4) van de taxonomie die de HCSS-prompt in de vorige sessie op deze casus opleverde (Opus 5.5, 80 steekproefdocumenten; demo_outputs/taxonomy_hcss_prompt.md). Het model gaf de niveaunamen in het Engels (Explicit, Coded-operational, Allusive, Euphemistic, None); de slide toont de Nederlandse weergave uit de gedeelde woordenlijst. De taxoncodes onder elk niveau (explicit_nuclear_mention enzovoort) zijn die modeluitvoer, letterlijk en onvertaald. Opbouw: één stem per klik, op haar sport geplaatst, laagste eerst. KLIK 1, ZACHAROVA (Dag 3, NS-0013): L1 eufemistisch. KLIK 2, PESKOV (briefing van Dag 6; transcript NS-0395 is gedateerd op Dag 7): L2, verwijzing naar de doctrine; let erop dat de vraag die hij kreeg over de binnenlandse agenda ging. KLIK 3, POETIN (Dag 8, NS-0242): L2, toespeling op capaciteiten; het grootste deel van het overleg ging over begrotingen. KLIK 4, MINISTERIE VAN DEFENSIE (Dag 5, NS-0416): L3, gecodeerd-operationeel. KLIK 5, MEDVEDEV (Dag 4, NS-0722; zijn langere bericht van dezelfde dag is NS-0488; beide zijn zijn eigen Telegramberichten in het pakket): L4 expliciet; in het scenario haalt hij later één zin weg. De plaatsing van elke stem op een niveau is onze eigen lezing met de categorieën van het model, geen annotatie uit de antwoordsleutel. KLIK 6, DE PUZZEL: geordend naar niveau lijken de stemmen een trap; geordend naar dag springen ze heen en weer (3, 4, 5, 6, 8). NS-0481, een poolverslag van het Kremlin van Dag 8, zegt dat er geen eenduidige formulering is. Laat de puzzel open: het is precies het soort vraag dat de concurrerende hypothesen moeten beantwoorden (gecoördineerde campagne, ongecoördineerde instellingen, of bewuste ambiguïteit). Alle citaten komen uit FICTIEVE documenten; het Nederlands is een vertaling van de Engelse glossering in het pakket, het Russisch is het oorspronkelijke fragment." data-sec="case" data-sid="hy-voices" data-t="Eén signaal, vijf stemmen">
<h2>Eén signaal, vijf stemmen</h2>
<p class="sub">Vijf Russische staatsstemmen op de explicietheidsladder van de casustaxonomie.</p>
<div class="ob-pic">
<svg aria-label="Pijl: de explicietheid stijgt van L0 onderaan naar L4 bovenaan" class="hyv-rail" preserveaspectratio="none" viewbox="0 0 20 600"><path class="hyv-railp" d="M10 596 V18"></path><path class="hyv-railh" d="M2 26 L10 6 L18 26 Z"></path></svg><div class="hyv-ladder"><p class="hyv-hd">De dimensie “nucleaire explicietheid” van de casustaxonomie (L0–L4)</p><div class="hyv-row" style="--y:4.5%;--h:20.875%"><div class="hyv-lv"><p class="hyv-lvn"><b>L4</b> Expliciet</p><p class="hyv-lvt"><span class="hyv-code">explicit_nuclear_mention</span></p></div></div><div class="hyv-row" style="--y:25.375%;--h:20.875%"><div class="hyv-lv"><p class="hyv-lvn"><b>L3</b> Gecodeerd-operationeel</p><p class="hyv-lvt"><span class="hyv-code">special_munitions_wording</span></p></div></div><div class="hyv-row" style="--y:46.25%;--h:20.875%"><div class="hyv-lv"><p class="hyv-lvn"><b>L2</b> Zinspelend</p><p class="hyv-lvt"><span class="hyv-code">allusion_doctrine</span> · <span class="hyv-code">capability_allusion</span></p></div></div><div class="hyv-row" style="--y:67.125%;--h:20.875%"><div class="hyv-lv"><p class="hyv-lvn"><b>L1</b> Eufemistisch</p><p class="hyv-lvt"><span class="hyv-code">military_technical_measures</span></p></div></div><div class="hyv-row" style="--y:88%;--h:12%"><div class="hyv-lv"><p class="hyv-lvn"><b>L0</b> Geen</p><p class="hyv-lvt">geen nucleaire verwijzing</p></div></div></div>
<div class="ob-step" data-frag="1"><div class="hyv-card" style="left:20.4%;width:44.3%;top:68.06%"><p class="hyv-who"><span class="hyv-day">Dag 3</span>Maria Zacharova, woordvoerder BuZa</p><p class="hyv-q">“Rusland … zal de nodige militair-technische maatregelen nemen om de eigen veiligheid te waarborgen.”</p><p class="hyv-src"><span lang="ru">«военно-технические меры»</span> · NS‑0013 · briefing BuZa</p></div><div class="ob-note" style="--x:66.5%;--y:4%;--w:33%"><div class="k">L1: Buitenlandse Zaken blijft eufemistisch</div><div class="d">Zacharova noemt de oefening provocerend en belooft “militair-technische maatregelen.” Die vaste formule zinspeelt op een militair antwoord zonder iets nucleairs te noemen.</div></div></div><div class="ob-step" data-frag="1"><div class="hyv-card hyv-tight" style="left:20.4%;width:21.8%;top:46.6%"><p class="hyv-who"><span class="hyv-day">Dag 6</span>Dmitri Peskov, Kremlin</p><p class="hyv-q">“Onze nucleaire doctrine is openbaar. Lees haar.”</p><p class="hyv-src"><span lang="ru">«Прочтите её»</span> · NS‑0395 · briefing</p></div><div class="ob-note" style="--x:66.5%;--y:4%;--w:33%"><div class="k">L2: het Kremlin wijst naar de doctrine</div><div class="d">Gevraagd of de nucleaire retoriek van deze week de binnenlandse agenda dient, wijst Peskov naar de gepubliceerde doctrine. Hij verwijst naar het nucleaire beleid zonder een dreigement uit te spreken.</div></div></div><div class="ob-step" data-frag="1"><div class="hyv-card hyv-tight" style="left:42.9%;width:21.8%;top:46.6%"><p class="hyv-who"><span class="hyv-day">Dag 8</span>Vladimir Poetin</p><p class="hyv-q">“Rusland heeft middelen die niemand anders heeft.”</p><p class="hyv-src"><span lang="ru">«средства, каких нет ни у кого»</span> · NS‑0242 · Kremlinverslag</p></div><div class="ob-note" style="--x:66.5%;--y:4%;--w:33%"><div class="k">L2: de president zinspeelt, tussen begrotingspunten door</div><div class="d">Op een overleg met gouverneurs zinspeelt Poetin op unieke capaciteiten, zonder een nucleair woord. Het overleg gaat bijna helemaal over regionale bezuinigingen, en dat doet ertoe voor de vraag wie het publiek is.</div></div></div><div class="ob-step" data-frag="1"><div class="hyv-card" style="left:20.4%;width:44.3%;top:26.31%"><p class="hyv-who"><span class="hyv-day">Dag 5</span>Persdienst ministerie van Defensie</p><p class="hyv-q">“Een aparte fase voorziet in oefeningen in het omgaan met speciale munitie.” Een onaangekondigde gereedheidsinspectie van de Noordelijke Vloot.</p><p class="hyv-src"><span lang="ru">«специальные боеприпасы»</span> · NS‑0416 · persbericht Defensie</p></div><div class="ob-note" style="--x:66.5%;--y:4%;--w:33%"><div class="k">L3: het leger gebruikt gecodeerde technische taal</div><div class="d">“Speciale munitie” is het gangbare eufemisme voor kernkoppen. Zulke oefeningen aankondigen in een open persbericht, tijdens een inspectie, is een bewust signaal in technische taal.</div></div></div><div class="ob-step" data-frag="1"><div class="hyv-card" style="left:20.4%;width:44.3%;top:5.44%"><p class="hyv-who"><span class="hyv-day">Dag 4</span>Dmitri Medvedev, Telegram</p><p class="hyv-q">“Noorwegen zou het eerste uur van een echt conflict niet doorstaan. Ter herinnering: Rusland heeft kernwapens, en dat is geen beeldspraak.”</p><p class="hyv-src"><span lang="ru">«у России есть ядерное оружие»</span> · NS‑0722, NS‑0488 · Telegramberichten</p></div><div class="ob-note" style="--x:66.5%;--y:4%;--w:33%"><div class="k">L4: het expliciete dreigement komt van de minst officiële stem</div><div class="d">Medvedev noemt kernwapens met zoveel woorden, en haalt later een zin uit zijn bericht. Hij is vicevoorzitter van de Veiligheidsraad, maar op Telegram spreekt hij voor zichzelf; twee dagen later wil Peskov niet op hem reageren.</div></div></div><div class="ob-step" data-frag="1"><div class="ob-note" style="--x:66.5%;--y:4%;--w:33%"><div class="k">De puzzel: coördinatie of ruis?</div><div class="d">Naar explicietheid verdelen de vijf uitspraken zich over vier sporten, van L1 tot L4; in de tijd kwamen ze op Dag 3, 4, 5, 6 en 8, van vijf verschillende sprekers. Een poolverslag van het Kremlin op Dag 8 merkt op dat er “geen eenduidige formulering” is (NS‑0481). Eén georkestreerd signaal, of meerdere instellingen die langs elkaar heen praten?</div></div></div>

<section class="slide obuild hyr" data-audience="all" data-n="RONDE 1, 15 MINUTEN, GROEPSWERK, NOG GEEN TAALMODEL. Elke groep werkt aan haar eigen projectthema (Transparent Battlefield, Grey-Zone Warfare, Effective Deterrence), omdat de twee of drie hypothesen die aan het eind van deze sessie worden gekozen, meegaan naar de annotatie van het eigen corpus van de groep vanmiddag. Opbouw: één taak per klik, de timerring vult zich gaandeweg; de verdeling in minuten (2 / 8 / 2 / 3) is een voorgesteld tempo, geen regel. TAAK 1: één zin, bij voorkeur met een actor, een gedrag en een tijdsbestek. TAAK 2: minstens vier hypothesen in STOP-vorm (Stelling, Toetsbaar, Observatie-gebaseerd, Predictief). Waarschuwing voor satisficing uit april: de groep besluit na een paar minuten dat ze genoeg heeft; zet door voor nummer vijf. TAAK 3: minstens één misleidingshypothese (april: geen misleidingshypothese betekent dat je de andere kant van het spel niet hebt gemodelleerd). TAAK 4: per hypothese de verwachte volgende waarneming en waar die in het corpus zou opduiken (taxonomiecategorie van vanochtend, brontype, tijdspatroon). Die derde kolom maakt de hypothesen vanmiddag toetsbaar, en die wordt in ronde 2 vergeleken met de modeluitvoer. KLIK 5, DE VORM: de voorbeeldrij gebruikt de hypothese ‘binnenlandse afleiding’ die al op de slide ‘Wat maakt een hypothese bruikbaar’ stond (Noordelijk Signaal, fictief); laat vóór ronde 2 geen andere hypothesen uit de casus zien. Trainers lopen langs de groepen; vraag elke groep welke van haar hypothesen het moeilijkst van een andere te onderscheiden zou zijn." data-sec="do" data-sid="hy-round1" data-t="Ronde 1: jullie eigen hypothesen (15 min)">
<h2>Ronde 1: jullie eigen hypothesen</h2>
<p class="sub">15 minuten, in jullie projectgroep, zonder taalmodel.</p>

<div class="ob-step" data-frag="1"><svg aria-label="Timersegment: vraag, minuut 0 tot 2" class="hyr-svg" preserveaspectratio="xMidYMid meet" viewbox="0 0 1300 560"><path class="hyr-seg" d="M221.5 20.1 A195 195 0 0 1 355.5 79.7 L307.2 126.2 A128 128 0 0 0 219.3 87.1 Z"></path><text class="hyr-sl" text-anchor="middle" x="281" y="78">1</text></svg><div class="hyr-task" style="--t:1.5%;--h:19.6%"><span class="hyr-n">1</span><p class="hyr-tt">Formuleer één vraag <span class="hyr-min2">2 min</span></p><p class="hyr-ts">Eén zin over jullie projectthema: Transparent Battlefield, Grey-Zone Warfare of Effective Deterrence.</p></div><div class="ob-note" style="--x:66%;--y:4%;--w:32.5%"><div class="k">Begin met één vraag</div><div class="d">Schrijf de vraag van jullie groep in één zin op, over jullie eigen projectthema. Een vraag die een actor, een gedrag en een tijdsbestek noemt, maakt de rest van de ronde veel makkelijker.</div></div></div><div class="ob-step" data-frag="1"><svg aria-label="Timersegment: hypothesen, minuut 2 tot 10" class="hyr-svg" preserveaspectratio="xMidYMid meet" viewbox="0 0 1300 560"><path class="hyr-seg" d="M364.2 89.4 A195 195 0 1 1 49.5 318.1 L106.4 282.7 A128 128 0 1 0 312.9 132.6 Z"></path><text class="hyr-sl" text-anchor="middle" x="310" y="357">2</text></svg><div class="hyr-task" style="--t:22%;--h:20.5%"><span class="hyr-n">2</span><p class="hyr-tt">Minstens vier hypothesen, elk <span class="hyr-nb">in STOP‑vorm <span class="hyr-min2">8 min</span></span></p><p class="hyr-ts">Stelling, Toetsbaar, Observatie-gebaseerd, Predictief. Stop niet bij de eerste die past.</p></div><div class="ob-note" style="--x:66%;--y:8%;--w:32.5%"><div class="k">Vier of meer, in STOP-vorm</div><div class="d">Schrijf minstens vier concurrerende antwoorden op, elk als één zin die onwaar kan blijken. Vindt de groep dat ze genoeg heeft, zet dan door voor nog één: de vierde en vijfde voelen vaak geforceerd, en dat is normaal.</div></div></div><div class="ob-step" data-frag="1"><svg aria-label="Timersegment: misleiding, minuut 10 tot 12" class="hyr-svg" preserveaspectratio="xMidYMid meet" viewbox="0 0 1300 560"><path class="hyr-seg" d="M43.0 306.8 A195 195 0 0 1 27.6 161.0 L92.0 179.5 A128 128 0 0 0 102.1 275.3 Z"></path><text class="hyr-sl" text-anchor="middle" x="54" y="243">3</text></svg><div class="hyr-task" style="--t:43.4%;--h:19%"><span class="hyr-n">3</span><p class="hyr-tt">Minstens één gaat uit <span class="hyr-nb">van misleiding <span class="hyr-min2">2 min</span></span></p><p class="hyr-ts">Wat als de tegenstander ensceneert wat je ziet?</p></div><div class="ob-note" style="--x:66%;--y:12%;--w:32.5%"><div class="k">Eén misleidingshypothese</div><div class="d">Minstens één hypothese moet ervan uitgaan dat wat je waarneemt bewust wordt gevormd. Vraag je af hoe de andere kant een vals verhaal echt zou laten lijken voor een analist zoals jij.</div></div></div><div class="ob-step" data-frag="1"><svg aria-label="Timersegment: verwachting, minuut 12 tot 15" class="hyr-svg" preserveaspectratio="xMidYMid meet" viewbox="0 0 1300 560"><path class="hyr-seg" d="M31.7 148.6 A195 195 0 0 1 208.5 20.1 L210.7 87.1 A128 128 0 0 0 94.7 171.4 Z"></path><text class="hyr-sl" text-anchor="middle" x="120" y="95">4</text></svg><div class="hyr-task" style="--t:63.3%;--h:14.5%"><span class="hyr-n">4</span><p class="hyr-tt">Per hypothese: wat zie je hierna? <span class="hyr-min2">3 min</span></p><p class="hyr-ts">Noem een taxonomiecategorie, een brontype of een verandering in de tijd die het zou tonen.</p></div><div class="ob-note" style="--x:66%;--y:16%;--w:32.5%"><div class="k">Schrijf je verwachtingen op</div><div class="d">Noteer bij elke hypothese wat er hierna in de documenten zou moeten verschijnen als ze klopt, en waar: welke categorie, welk soort bron, welk moment. Deze kolom vergelijk je in ronde 2 met het model.</div></div></div><div class="ob-step" data-frag="1"><div class="hyr-tmpl"><div class="hyr-th">Hypothese (STOP)</div><div class="hyr-th">Wat we hierna zouden zien</div><div class="hyr-th">Waar in het corpus</div><div class="hyr-td">Binnenlandse afleiding: het nucleaire taalgebruik richt zich vooral op Russen, om woede over bezuinigingen af te leiden</div><div class="hyr-td">Dreigtaal naast begrotingsnieuws; keert terug als grieven oplaaien</div><div class="hyr-td">Geadresseerde = Russisch binnenland · staatstelevisie en Telegram · volgt pieken in grieven</div></div><div class="hyr-fict">FICTIEF – trainingscasus · Noordelijk Signaal</div><div class="ob-note" style="--x:66%;--y:4%;--w:32.5%"><div class="k">Jullie resultaat: één rij per hypothese</div><div class="d">Houd een lijst met drie kolommen bij: de hypothese, wat je hierna zou zien, en waar in het corpus. De voorbeeldrij is de hypothese “binnenlandse afleiding” uit de casus Noordelijk Signaal (fictief), alleen om de vorm te tonen.</div></div></div>

<section class="slide obuild hyr2" data-audience="all" data-n="RONDE 2, 10 MINUTEN. De groepen gebruiken hun eigen vraag uit Ronde 1 (over hun projectthema); de slide laat als uitgewerkt voorbeeld zien hoe de prompt op de casus Noordelijk Signaal (FICTIEF) is gedraaid: een model genereert hypothesen vanuit vier vaste perspectieven. Opbouw: eerst het promptskelet, dan per klik één perspectief, dan de opdracht. WAAROM VASTE PERSPECTIEVEN: vraag je een model één keer iets, dan geeft het zijn meest waarschijnlijke antwoord, grofweg de middenlezing van zijn trainingsdata; voor een westerse analist is dat meestal de lezing die je al hebt. Door perspectieven te benoemen duw je het naar de staarten (dit is de ‘persona panel’-methode uit het HCSS-hypothesenkader, april 2026; verwante methode: verbalized sampling tegen mode collapse). Elk perspectief genereert apart VOORDAT er wordt samengevoegd, anders domineert het eerste kader. DE VIER uit de demorun (bron: demo_outputs/hypotheses_multiperspective.md, sectie 1): (a) planner van de Russische Generale Staf: a1 bastiondreiging door een Britse SSN bij Tromsø plus Amerikaanse mariniers bij Petsjenga; a2 goedkope test van de reactietijden van bondgenoten onder de NAVO-drempels voor een houdingswijziging. (b) binnenlands-politiek adviseur van het Kremlin: b1 afleiding van de olie-inzinking, regionale bezuinigingen, achterstallige lonen en een vastgelopen front; b2 de haviksachtige milbloggers een ‘sterke stem’ geven (NS-0556). (c) Chinese analist van buitenlands beleid: c1 een Arctisch agendapunt fabriceren om gelijkwaardigheid met Washington terug te winnen; c2 de samenhang van de NAVO testen bij haar kleinste lid; c3 Genève herkaderen als risicobeheer tussen grootmachten met Oekraïne op de achtergrond. (d) scepticus van de voor de hand liggende westerse lezing: d1 geen dirigent, polyfonie van instanties; d2 de polyfonie is zelf het ontwerp (misleiding). De kaarten citeren het eerste idee van elk perspectief, ingekort. Het model werkte in het Engels; de slide toont een Nederlandse weergave. EERLIJKE KANTTEKENING: de exacte prompttekst van de demorun is niet met de uitvoer bewaard; het skelet op de slide volgt de structuur van het HCSS-hypothesenkader (pluraliteit, minstens 5 hypothesen, één misleidingshypothese, indicatoren, doc_ids) plus deze vier perspectieven. OPDRACHT: draai hem op het trainingsplatform met je eigen vraag uit Ronde 1; bewaar de ruwe lijst van elk perspectief; markeer alles wat niet op je lijst uit Ronde 1 staat. Zeg tegen de groepen dat ze een perspectief mogen vervangen door een dat beter bij hun thema past (bijv. een Oekraïense inlichtingenofficier, een Noorse burgemeester in Finnmark), zolang het vastligt voordat ze de prompt draaien." data-sec="do" data-sid="hy-round2" data-t="Ronde 2: laat een model denken als iemand anders">
<h2>Ronde 2: laat een model denken als iemand anders</h2>
<p class="sub">Noordelijk Signaal als uitgewerkt voorbeeld: vier bewust verschillende denkwijzen.</p>
<div class="ob-pic">
<div class="hyr2-tag">FICTIEF – trainingscasus</div>
<div class="ob-step" data-frag="1">
<div class="hyr2-prompt">
<p class="hyr2-ph">Promptskelet, zoals gedraaid op de casus (ingekort)</p>
<div class="hyr2-pl"><span>VRAAG</span><span>Wat wil Moskou bereiken met de nucleaire signalen van Dag 1–14, en wat zien we hierna als elke verklaring klopt?</span></div>
<div class="hyr2-pl"><span>DOCUMENTEN</span><span>de casusdocumenten (in de demo: een steekproef van 80)</span></div>
<div class="hyr2-pl"><span>PERSPECTIEVEN</span><span>redeneer om de beurt als a, b, c en d; elk 1–3 hypothesen, vóór het samenvoegen</span></div>
<div class="hyr2-pl"><span>SAMENVOEGEN</span><span>minstens 5 verschillende hypothesen; minstens één veronderstelt misleiding</span></div>
<div class="hyr2-pl"><span>PER HYPOTHESE</span><span>wat ze hierna voorspelt; indicatoren; doc_ids voor en tegen</span></div>
</div>
<div class="ob-note" style="--x:62.5%;--y:4%;--w:37%"><div class="k">Waarom vaste perspectieven?</div><div class="d">Vraag je een model één keer iets, dan krijg je zijn meest typische antwoord: grofweg de westerse middenlezing, waarschijnlijk ook de jouwe. Door perspectieven te benoemen duw je het weg van dat midden. Elk perspectief levert eerst zijn eigen hypothesen voordat er iets wordt samengevoegd, zodat geen enkel kader vanzelf wint.</div></div>
</div>
<div class="ob-step" data-frag="1">
<div class="hyr2-card" style="--x:0%;--y:47%"><p class="hyr2-who"><b>a</b> Planner van de Russische Generale Staf</p><p class="hyr2-first">Eerste idee: “Een Britse jachtonderzeeboot bij Tromsø plus Amerikaanse mariniers bij Petsjenga bedreigen het onderzeebootbastion op Kola.”</p></div>
<div class="ob-note" style="--x:62.5%;--y:4%;--w:37%"><div class="k">a · Denkt als een militair planner</div><div class="d">Hij leest de oefening als een militair probleem: mariniers naast het schiereiland waar Rusland zijn onderzeeboten met ballistische raketten houdt, en een jachtonderzeeboot voor de kust van Noord-Noorwegen. Zijn tweede idee was een goedkope test van de reactietijden van de bondgenoten, onder elke drempel die de houding van de NAVO zou veranderen.</div></div>
</div>
<div class="ob-step" data-frag="1">
<div class="hyr2-card" style="--x:30.5%;--y:47%"><p class="hyr2-who"><b>b</b> Binnenlands-politiek adviseur van het Kremlin</p><p class="hyr2-first">Eerste idee: “Leid de aandacht af van de olie-inzinking, regionale bezuinigingen, achterstallige lonen en een vastgelopen front.”</p></div>
<div class="ob-note" style="--x:62.5%;--y:4%;--w:37%"><div class="k">b · Kijkt naar binnen</div><div class="d">Voor deze adviseur is het publiek Russisch, niet Noors: een dreiging van buiten verenigt, ruzie over de begroting verdeelt. Hij voegde eraan toe dat harde woorden gefrustreerde, haviksachtige milbloggers een “sterke stem” geven, zodat hun woede zich niet tegen het ministerie van Defensie keert.</div></div>
</div>
<div class="ob-step" data-frag="1">
<div class="hyr2-card" style="--x:0%;--y:73.5%"><p class="hyr2-who"><b>c</b> Chinese analist van buitenlands beleid</p><p class="hyr2-first">Eerste idee: “Rusland komt met weinig in handen naar de hervatte gesprekken over strategische stabiliteit, dus fabriceert het een Arctisch agendapunt.”</p></div>
<div class="ob-note" style="--x:62.5%;--y:4%;--w:37%"><div class="k">c · Ziet een strijd om grootmachtstatus</div><div class="d">Een buitenstaande grootmacht leest de episode als Moskou dat aan tafel gelijkwaardigheid met Washington zoekt. Hij voegde twee invalshoeken toe: de samenhang van de NAVO testen bij haar meest kwetsbare lid, en van Genève nucleair risicobeheer maken met Oekraïne op de achtergrond.</div></div>
</div>
<div class="ob-step" data-frag="1">
<div class="hyr2-card" style="--x:30.5%;--y:73.5%"><p class="hyr2-who"><b>d</b> Scepticus van de gangbare westerse lezing</p><p class="hyr2-first">Eerste idee: “Er is geen dirigent. Medvedev gaat zijn eigen gang, Defensie volgt een routinekalender, en waarnemers rijgen de stukjes aaneen tot een plan.”</p></div>
<div class="ob-note" style="--x:62.5%;--y:4%;--w:37%"><div class="k">d · Gaat in tegen het voor de hand liggende</div><div class="d">De voor de hand liggende westerse lezing is een samenhangende dwangcampagne. De scepticus kwam met twee tegengestelde ideeën: helemaal geen dirigent, of een orkest dat zo is opgezet dat het er geen lijkt te hebben. Het model hield beide, omdat één waarneming ze scheidt: komen de stemmen aan het eind samen?</div></div>
</div>
<div class="ob-step" data-frag="1">
<div class="hyr2-task"><p class="hyr2-tk"><span class="hyr2-clock">10 min</span> Nu jullie</p>
<p class="hyr2-ti">Voer de prompt uit op het <a href="https://onderwijsophcss.app.hcss.nl" rel="noopener" target="_blank">trainingsplatform</a> met je vraag uit Ronde 1.</p>
<p class="hyr2-ti">Bewaar de ruwe lijst van elk perspectief, niet alleen de samengevoegde set.</p>
<p class="hyr2-ti">Markeer elke hypothese die niet op je lijst uit Ronde 1 staat.</p></div>
<div class="ob-note" style="--x:62.5%;--y:4%;--w:37%"><div class="k">Neem de ruwe lijsten mee naar de vergelijking</div><div class="d">De samengevoegde set verbergt waar elk idee vandaan kwam; de ruwe lijsten laten zien welk perspectief het opleverde. Je mag een perspectief vervangen door een dat beter bij je thema past, zolang je het vastlegt voordat je de prompt draait.</div></div>
</div>
</div>
