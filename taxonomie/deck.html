/* ---- gt22 (frag_gt22.css) ---- */
/* =============================================================================
   gt22 - "Seven dimensions" (the 7 HLTPs of the congressional budget-issue
   taxonomy). This slide REPLACES a rasterised taxonomy image whose labels were
   unreadable, so readable type is the entire point of the rebuild.

   ROUTE 3 (drawn). Route 1 is unavailable - the taxonomy is a 4-column TSV
   (TAXONOMY_AGREED_2026-09-01.tsv, 498 data rows) emitted by the murderboard,
   and no generator anywhere produces staged figure layers from it. Route 2 is
   unavailable - there is no pptx /media asset for this content; the only prior
   rendering was the flat raster this slide exists to replace, and dimming that
   raster and cutting clip-path windows in it is the png dump the splicer
   refuses. So the whole picture is inline SVG, drawn from the TSV.

   A LAYOUT DECISION, stated so the next author does not "fix" it: a radial /
   sunburst was tried on paper and rejected. Seven arc labels plus 22 second-level
   and 61 third-level counts cannot be set on arcs at >=1.10% of slide width in a
   1770x750 frame without either rotating the labels or dropping to ~14 viewBox
   units, both of which reproduce the defect this slide is here to remove. A
   horizontal table-of-bars holds every label horizontal at 24-33 viewBox units.
   Readability beats the shape.

   ---------------------------------------------------------------------------
   TYPE-FLOOR ARITHMETIC - why every SVG font-size below is >= 24 viewBox units
   ---------------------------------------------------------------------------
   Floor            = 1.10% of slide width = 15.03px on a 1366px-wide slide.
   viewBox          = 1770 x 750 (aspect 2.360), matching .ob-pic's aspect-ratio.
   .ob-pic width    = slide width - 2 x 3.6% padding = 0.928 x slide width.
   Two cases, and the SMALLER scale is the one that must clear the floor:
     (a) width-fit   : 1366 x 0.928 / 1770                      = 0.7162 px/unit
     (b) height-fit  : .ob-pic is clamped by max-height:68cqh, and with
                       preserveAspectRatio="xMidYMid meet" the SVG then scales to
                       the HEIGHT: 0.68 x 768 / 750             = 0.6963 px/unit
   Worst case = 0.6963. Minimum viewBox unit = 15.03 / 0.6963   = 21.58.
   So the smallest size used here is 26, and the ladder measures:
     33 -> 22.98px = 1.682% of slide   (dimension name)
     31 -> 21.59px = 1.580%            (the three counts)
     28 -> 19.50px = 1.427%            (group headers, totals band)
     26 -> 18.10px = 1.325%            (column headers, glosses, legend)
   MEASURED, not computed, in the real shell at 1366x768 (shot2.py): the flex
   column - not max-height - is what actually sizes .ob-pic, giving a scale of
   0.4363 against an 855px slide, so the 26-unit floor renders at 1.326% of slide
   width. The first cut of this slide carried a 24-unit floor and measured 1.175%;
   it passed, but 26 plus a one-line .sub is the margin this rebuild deserves.

   COLUMN ARITHMETIC (viewBox units, art band x 76..1030):
     name      100..~472  (33u, longest is "Affected Constituency")
     gloss     100..~500  (26u, longest is "what the money is being spent on")
     2ND LVL   centred 570 -> 516..624      3RD LVL centred 700 -> 646..754
     TAXA no.  anchor end 830 -> ~780..830  bar 850..1030, 180u at 107 taxa,
                                            i.e. 1.6822 units per taxon.
   Every pair has clear air between it; verified by getBBox in the render, not by
   eye. The columns moved right when the floor went 24 -> 26: "2ND LVL" and
   "3RD LVL" grew and collided at the old 585/690 centres.
   All clear 1.10% with margin, in BOTH cases. Nothing on this slide is px.
   max-height is 68cqh rather than the shell's 66cqh so the picture is not
   squashed, and "meet" rather than "none" so that if it ever IS clamped the
   figure letterboxes instead of distorting the glyphs.

   preserveAspectRatio="meet" also fixes where the art ends horizontally: the
   drawn band is viewBox x 30..1030, which lands at 3.0%..58.0% of .ob-pic in
   BOTH cases, so every .ob-note at --x:59% sits on empty ground and can never
   cover a revealed row.

   PREFIXING: every class is gt22-*. An inline SVG <style> is NOT scoped to its
   subtree, so bare names leak page-wide - which is precisely why the class
   definitions live HERE, in a file-scoped `.gt22 .gt22-*` block, and there is no
   <style> element inside any of the four SVGs.

   HIDDEN STATES: none are declared. The deck's own
   `.slide [data-frag]{opacity:0;transition:none}` hides each .ob-step together
   with its SVG and its box, so nothing here can animate back to hidden after
   body.measuring lights the slide for autofit. The only transition added below
   is on a :hover, which autofit never triggers.
   ============================================================================= */

/* the slide is its own inline-size container, so cqw resolves against the slide
   in ANY host shell. The GaTech deck already declares this identically. */
.gt22{container-type:inline-size}

.gt22 .ob-pic{aspect-ratio:1770/750;max-height:68cqh;background:transparent}

.gt22 .ob-pic svg.gt22-lay{position:absolute;inset:0;width:100%;height:100%;display:block}

/* `.obuild .ob-pic img{position:absolute;inset:0;width:100%;height:100%}` outranks
   any plain two-class selector and force-stretches component images. gt22 ships
   no <img>; this is the scoped reset any future one must use. */
.gt22 .ob-pic img.gt22-shot{position:absolute;inset:auto;right:auto;bottom:auto;
  left:var(--x);top:var(--y);width:var(--w);height:auto;max-width:none;display:block;
  border-radius:4px;box-shadow:0 8px 26px rgba(0,0,0,.55)}

/* --- the pointer contract (VISUAL_SPEC 11): every .ob-step is a full-size
   transparent layer that would otherwise swallow the pointer, so the buttons in
   the notes would be unclickable. Both halves are mandatory. ---------------- */
.gt22 .ob-step{pointer-events:none}
.gt22 .ob-step > *{pointer-events:auto}
.gt22 .ob-scrim{pointer-events:none}
.gt22 .ob-pic svg.gt22-lay{pointer-events:none}

/* --- SVG type and marks. Sizes in viewBox user units; see the arithmetic above. */
.gt22 .gt22-hdr{font:600 26px "Titillium Web",system-ui,-apple-system,sans-serif;fill:#b9cee5;letter-spacing:.1em}
.gt22 .gt22-gh {font:700 28px "Titillium Web",system-ui,-apple-system,sans-serif;fill:#dbad50;letter-spacing:.09em}
.gt22 .gt22-nm {font:700 33px "Titillium Web",system-ui,-apple-system,sans-serif;fill:#f3f6fb}
.gt22 .gt22-gl {font:400 26px "Titillium Web",system-ui,-apple-system,sans-serif;fill:#b9cee5}
.gt22 .gt22-num{font:600 31px "Titillium Web",system-ui,-apple-system,sans-serif;fill:#f3f6fb}
.gt22 .gt22-tx {font:700 31px "Titillium Web",system-ui,-apple-system,sans-serif;fill:#dbad50}
.gt22 .gt22-lg {font:400 26px "Titillium Web",system-ui,-apple-system,sans-serif;fill:#b9cee5}
.gt22 .gt22-tot{font:700 28px "Titillium Web",system-ui,-apple-system,sans-serif;fill:#dbad50;letter-spacing:.04em}

.gt22 .gt22-row  {fill:#12294a;stroke:rgba(255,255,255,.15);stroke-width:1.5}
.gt22 .gt22-rowc {fill:#16305a;stroke:#dbad50;stroke-width:2;stroke-opacity:.8}   /* blind convergence */
.gt22 .gt22-acc  {fill:#dbad50}
.gt22 .gt22-bar  {fill:#dbad50;opacity:.82}
.gt22 .gt22-rule {stroke:rgba(255,255,255,.2);stroke-width:1.5}
.gt22 .gt22-totbx{fill:rgba(219,173,80,.10);stroke:#dbad50;stroke-opacity:.55;stroke-width:1.5}

/* --- the modal opener inside a note box.
   THE BUTTON TRAP: a <button> does not inherit font-size, so without an explicit
   size it silently renders at the 13.33px UA default and fails the floor. 1.30vw
   = 17.8px at 1366 = 1.30% of slide width. ---------------------------------- */
.gt22 .gt22-mb{display:inline-block;margin-top:.55em;font-family:inherit;
  font-size:1.20vw;font-weight:700;line-height:1.25;color:#dbad50;
  background:rgba(219,173,80,.10);border:1px solid rgba(219,173,80,.6);
  border-radius:5px;padding:.3em .7em;cursor:pointer;transition:background .15s,color .15s}
.gt22 .gt22-mb:hover,.gt22 .gt22-mb:focus-visible{background:#dbad50;color:#0a192f;outline:none}

/* the byte-identical SHA on the closing card. 1.12vw = 15.3px at 1366 = 1.12%. */
.gt22 .gt22-sha{display:block;margin-top:.6em;padding-top:.45em;
  border-top:1px solid rgba(219,173,80,.3);
  font-family:"SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace;
  font-size:1.25vw;line-height:1.45;color:#b9cee5;word-break:break-all}

/* the closing card sits over a dimmed picture, so it is allowed to cover art */
.gt22 .ob-note.wide{background:rgba(9,24,47,.96)}

/* --- modals. Every id is gt22-prefixed because all fragments splice into ONE
   document. showModal() promotes these to the top layer, so they escape both
   .ob-pic{overflow:hidden} and .slide{overflow:hidden}. Sizes in vw, never px. */
.gt22-mdl{border:1px solid #dbad50;border-left:4px solid #dbad50;border-radius:8px;
  background:#0a192f;color:#e8edf3;max-width:62vw;width:62vw;max-height:78vh;
  overflow:auto;padding:1.5vw 1.8vw;box-shadow:0 18px 60px rgba(0,0,0,.7);
  font-family:"Titillium Web",-apple-system,"Segoe UI",Roboto,Helvetica,sans-serif}
.gt22-mdl::backdrop{background:rgba(4,12,26,.78)}
.gt22-mdl h3{color:#dbad50;font-size:2.05vw;font-weight:700;line-height:1.15;margin:0 0 .5em}
.gt22-mdl p{font-size:1.32vw;line-height:1.5;margin:0 0 .75em;color:#e8edf3}
.gt22-mdl p b{color:#dbad50;font-weight:700}
.gt22-mdl form{margin:.4em 0 0}


/* --- type-floor repair gt22: 1.10% of 1366 = 15.03px effective.
   SVG text is scaled by the viewBox, so a vw size is multiplied by that scale too;
   these are raw viewBox units computed so raw x scale clears the floor. --- */
.gt22 .d{font-size:16px}
.gt22 .gt22-gl{font-size:27px}
.gt22 .gt22-hdr{font-size:27px}
.gt22 .gt22-lg{font-size:27px}

/* type-floor enforcement (high specificity; beats the earlier rules) */
.slide.gt22 .d,.slide.gt22 svg .d{font-size:16px !important}

/* ---- gt23 (frag_gt23.css) ---- */
/* ===========================================================================
   frag_gt23.css  -  slide gt23 "Inside a dimension"
   A four-click drill-down: HLTP > 2nd Level > 3rd Level > actual taxon strings,
   all read from TAXONOMY_AGREED_2026-09-01.tsv.

   EVERY class is prefixed .gt23- because an inline SVG <style> is not scoped to
   its subtree and all fragments splice into ONE document.

   TYPE FLOOR: nothing below 1.10vw (= 15.03px at a 1366px viewport). All sizes
   are vw, never px, never vh. The <button>s carry an explicit font-size and
   font-family because a form control does NOT inherit them.

   GEOMETRY (percentages of .ob-pic, which is 1770/750):
     col A  HLTP        left  0.5%  width 14%    right edge 14.5%
     col B  2nd level   left 17%    width 19%    right edge 36%
     col C  3rd level   left 38%    width 19%    right edge 57%
     col D  taxa        left 59%    width 40%    right edge 99%
     wire trunks sit in the gaps at x = 15.7% / 37.0% / 58.0%
     tree band ends at 67%; the note band (68% down) is therefore always
     over EMPTY ground - no .ob-note ever covers a revealed component.
   =========================================================================== */

/* --- §11 of the visual spec: the full-size step layer must pass the pointer
       through, its CONTENTS must take it, or nothing on the slide is selectable.
       Only a SHOWN step is live, so an invisible button is never clickable. --- */
.gt23 .ob-step{pointer-events:none}
.gt23 .ob-step.shown > *{pointer-events:auto}
.gt23 .gt23-wires{pointer-events:none}

/* defensive: .obuild .ob-pic img{inset:0;width:100%;height:100%} outranks a
   two-class selector. This slide ships no <img>, but the guard costs nothing. */
.gt23 .ob-pic img.gt23-component{position:absolute;right:auto;bottom:auto;
  width:auto;height:auto}

/* ---------------- the explanation boxes ---------------- */
.gt23 .ob-note.gt23-note{left:1%;top:68%;width:57%}
.gt23 .ob-note .k{font-size:1.34vw;line-height:1.18;color:#dbad50}   /* 18.30px @1366 */
.gt23 .ob-note .d{font-size:1.18vw;line-height:1.38;color:#e8edf3}   /* 16.12px @1366 */

/* ---------------- shared node chrome ---------------- */
.gt23 .gt23-hltp,
.gt23 .gt23-l2,
.gt23 .gt23-l3{position:absolute;box-sizing:border-box;
  background:#132f59;border:1px solid rgba(255,255,255,.14);
  border-left:3px solid #82a0bc;border-radius:5px;
  display:flex;flex-direction:column;justify-content:center;
  padding:.28em .6em;overflow:hidden}
.gt23 .gt23-l2.pick,
.gt23 .gt23-l3.pick{border-color:#dbad50;border-left-color:#dbad50;
  background:rgba(219,173,80,.14)}

/* ---------------- col A: the dimension ---------------- */
.gt23 .gt23-hltp{left:.5%;top:3%;width:14%;height:32%;
  border-left-color:#dbad50;background:rgba(219,173,80,.13);border-color:#dbad50}
.gt23 .gt23-hltp .gt23-kick{font-size:1.10vw;line-height:1.25;color:#dbad50;   /* 15.03px */
  font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.gt23 .gt23-hltp .n{font-size:1.34vw;line-height:1.16;color:#f3f6fb;           /* 18.30px */
  font-weight:700;margin:.18em 0 .22em}
.gt23 .gt23-hltp .c{font-size:1.22vw;line-height:1.2;color:#dbad50;            /* 16.66px */
  font-weight:700;font-variant-numeric:tabular-nums}
.gt23 .gt23-hltp .cl{font-size:1.10vw;line-height:1.2;color:#9db8d6}           /* 15.03px */

/* the gauge: taxa carried by each of the seven dimensions, 107 .. 32 */
.gt23 .gt23-gaugebtn{position:absolute;left:.5%;top:38%;width:14%;
  box-sizing:border-box;display:flex;flex-direction:column;gap:.3em;
  background:transparent;border:1px dashed rgba(219,173,80,.42);border-radius:5px;
  padding:.4em .5em;cursor:pointer;text-align:left;
  font-family:"Titillium Web",-apple-system,"Segoe UI",Roboto,Helvetica,sans-serif;
  font-size:1.10vw;line-height:1.22;color:#9db8d6}                             /* 15.03px */
.gt23 .gt23-gaugebtn:hover,
.gt23 .gt23-gaugebtn:focus-visible{border-color:#dbad50;color:#e8edf3;outline:none}
.gt23 .gt23-gauge{display:block;width:100%;height:auto}
.gt23 .gt23-bar{fill:#82a0bc;opacity:.42}
.gt23 .gt23-bar-on{fill:#dbad50;opacity:1}

/* ---------------- col B: the four second-level elements ---------------- */
.gt23 .gt23-l2{left:17%;width:19%;height:17%}
.gt23 .gt23-b1{top:.5%}
.gt23 .gt23-b2{top:17%}
.gt23 .gt23-b3{top:33.5%}
.gt23 .gt23-b4{top:50%}
.gt23 .gt23-l2 .n{font-size:1.12vw;line-height:1.15;color:#f3f6fb;font-weight:700}  /* 15.30px */
.gt23 .gt23-l2 .c{font-size:1.10vw;line-height:1.2;color:#9db8d6;margin-top:.15em}  /* 15.03px */
.gt23 .gt23-l2.pick .n{color:#dbad50}

/* ---------------- col C: the third-level elements ---------------- */
.gt23 .gt23-l3{left:38%;width:19%;height:17%}
.gt23 .gt23-c1{top:2.5%}
.gt23 .gt23-c2{top:21%}
.gt23 .gt23-c3{top:39.5%}
.gt23 .gt23-l3 .n{font-size:1.12vw;line-height:1.15;color:#f3f6fb;font-weight:700}  /* 15.30px */
.gt23 .gt23-l3 .c{font-size:1.10vw;line-height:1.2;color:#9db8d6;margin-top:.15em}  /* 15.03px */
.gt23 .gt23-l3.pick .n{color:#dbad50}

.gt23 .gt23-more{position:absolute;left:38%;top:58%;width:19%;height:8%;
  box-sizing:border-box;background:transparent;border:1px dashed rgba(219,173,80,.5);
  border-radius:5px;color:#dbad50;cursor:pointer;
  font-family:"Titillium Web",-apple-system,"Segoe UI",Roboto,Helvetica,sans-serif;
  font-size:1.10vw;line-height:1.2;font-weight:700}                             /* 15.03px */
.gt23 .gt23-more:hover,
.gt23 .gt23-more:focus-visible{background:rgba(219,173,80,.16);outline:none}

/* ---------------- col D: the taxa themselves ---------------- */
.gt23 .gt23-tax{position:absolute;left:59%;top:1.5%;width:40%;height:97%;
  box-sizing:border-box;display:flex;flex-direction:column;gap:2px;
  justify-content:space-between;background:rgba(10,25,47,.72);border:1px solid rgba(219,173,80,.5);
  border-left:3px solid #dbad50;border-radius:5px;padding:.38em .55em}
.gt23 .gt23-tax .th{font-size:1.18vw;line-height:1.2;color:#dbad50;             /* 16.12px */
  font-weight:700;margin-bottom:.15em}
.gt23 .gt23-tax .tx{font-size:1.12vw;line-height:1.16;color:#e8edf3;            /* 15.30px */
  padding-left:.85em;position:relative}
.gt23 .gt23-tax .tx::before{content:"";position:absolute;left:0;top:.42em;
  width:.34em;height:.34em;background:#dbad50;border-radius:50%}

/* ---------------- the wires ---------------- */
.gt23 .gt23-wires{position:absolute;inset:0;width:100%;height:100%;display:block}
.gt23 .gt23-wire{fill:none;stroke:#82a0bc;stroke-width:2;stroke-linejoin:round;
  stroke-linecap:round;vector-effect:non-scaling-stroke;opacity:.85}
.gt23 .gt23-wire-hot{stroke:#dbad50;stroke-width:2.5;opacity:1}

/* ---------------- motion: the hidden state carries transition:none ----------
   autofit() lights every fragment under body.measuring; a hidden state that
   TRANSITIONS animates back to hidden and the room sees the slide paint fully
   built and then fade. That defect lived in 33 rules once already.           */
.gt23 .ob-reveal{opacity:0;transition:none}
.gt23 .ob-step.shown .ob-reveal{opacity:1;transition:opacity .3s ease}
body.measuring .gt23 .ob-reveal,
body.nobuild .gt23 .ob-reveal{opacity:1;transition:none}

/* ---------------- modals (every id prefixed gt23-) ---------------- */
.gt23 .mdl{border:1px solid #dbad50;border-left:4px solid #dbad50;border-radius:8px;
  background:#0a192f;color:#e8edf3;padding:1.1em 1.35em 1em;
  width:min(58vw,880px);max-height:82vh;overflow:auto;
  box-shadow:0 18px 60px rgba(0,0,0,.65);
  font-family:"Titillium Web",-apple-system,"Segoe UI",Roboto,Helvetica,sans-serif}
.gt23 .mdl::backdrop{background:rgba(4,12,26,.82)}
.gt23 .mdl h3{font-size:1.55vw;line-height:1.15;color:#dbad50;font-weight:700;  /* 21.17px */
  margin:0 0 .35em}
.gt23 .mdl .ms{font-size:1.18vw;line-height:1.42;color:#9db8d6;margin-bottom:.85em}  /* 16.12px */
.gt23 .gt23-mrow{display:grid;grid-template-columns:1fr 4.2em 4.2em 5em;gap:.6em;
  align-items:baseline;padding:.3em .35em;border-bottom:1px solid rgba(255,255,255,.10);
  font-size:1.15vw;line-height:1.28;color:#e8edf3;font-variant-numeric:tabular-nums}  /* 15.71px */
.gt23 .gt23-mrow.gt23-m2{grid-template-columns:1fr 5em}
.gt23 .gt23-mrow span:not(:first-child){text-align:right;color:#9db8d6}
.gt23 .gt23-mhead{color:#dbad50;font-weight:700;border-bottom:1px solid #dbad50}
.gt23 .gt23-mhead span:not(:first-child){color:#dbad50}
.gt23 .gt23-mpick{background:rgba(219,173,80,.14);border-radius:4px}
.gt23 .gt23-mpick span{color:#dbad50;font-weight:700}
.gt23 .gt23-mtot{font-weight:700;border-bottom:0;border-top:1px solid #dbad50;margin-top:.25em}
.gt23 .gt23-mgrp{font-size:1.18vw;line-height:1.3;color:#dbad50;font-weight:700;  /* 16.12px */
  margin:.8em 0 .2em;letter-spacing:.02em}
.gt23 .mdl form{margin-top:1em;display:flex;justify-content:flex-end}
.gt23 .mdl button{background:transparent;border:1px solid #dbad50;color:#dbad50;
  border-radius:6px;padding:.34em 1.1em;cursor:pointer;font-weight:700;
  font-family:"Titillium Web",-apple-system,"Segoe UI",Roboto,Helvetica,sans-serif;
  font-size:1.15vw;line-height:1.3}                                              /* 15.71px */
.gt23 .mdl button:hover,
.gt23 .mdl button:focus-visible{background:#dbad50;color:#0a192f;outline:none}

@media (prefers-reduced-motion:reduce){
  .gt23 .ob-step.shown .ob-reveal{transition:none}
}

/* ---- gt24 (frag_gt24.css) ---- */
/* ============================================================================
   gt24 - "Inside a second dimension" - Remedy Sought.

   ROUTE 3 (draw it). Four inline-SVG figures and nothing raster: a proportional
   band showing the whole dimension to scale, then three "racks" - one per
   second-level element - whose rows are the third-level elements with a
   measured count bar and one taxon quoted verbatim from the agreed TSV. Depth
   beyond that lives in four <dialog> modals holding all 92 taxa.

   WHY IT IS COMPOSED THIS WAY (deliberately unlike its sibling slide): the
   explanation box sits in a FIXED right-hand column, x 70-99%, while every
   figure is confined to x 0-68%. A box therefore cannot cover already-revealed
   art at any step - the collision class VISUAL_SPEC section 2 was written for -
   without needing a scrim on any step but the last.

   TYPE FLOOR. Every size below is in cqw, which on a .slide (container-type:
   inline-size) is 1% of SLIDE width. Floor 1.10cqw = 15.03px at a 1366px slide.
   SVG text is sized in viewBox USER UNITS, which is a different scale: each
   figure is 68% of the picture wide (viewBox 1203.6 units) and the picture is
   1770 units wide, so at a 1366px slide one user unit = 0.7161px. The floor in
   user units is therefore 15.03 / 0.7161 = 20.99, and the two SVG sizes used
   are 22 (15.76px) and 28 (20.05px). Computed, not eyeballed.

   BUTTONS. .gt24-ib and .gt24-more, .gt24-close all carry font-family:inherit
   and an EXPLICIT font-size. A <button> inherits neither, and silently renders
   at the 13.33px UA default - below the floor - if you let it.

   MOTION (VISUAL_SPEC section 7). Every hidden state carries transition:none;
   the fade lives only on the shown state. Otherwise autofit's body.measuring
   pass paints the slide fully built and animates it away, which the room sees
   as a flash before the build starts.

   CLASS PREFIXING. Every class here is gt24-prefixed, and every dialog id is
   gt24-prefixed, because all fragments splice into ONE document.
   ========================================================================== */

/* ---- fragment machinery, scoped so it cannot fight the deck's own copy ---- */
.slide.gt24 [data-frag]{opacity:0;transform:translateY(.28em);transition:none}
.slide.gt24 [data-frag].shown{opacity:1;transform:none;
  transition:opacity .26s ease,transform .26s ease}
body.measuring .slide.gt24 [data-frag]{opacity:1;transform:none;transition:none}
body.nobuild  .slide.gt24 [data-frag]{opacity:1;transform:none}

/* ---- slide shell --------------------------------------------------------- */
.slide.gt24{background:#0a192f;color:#e8edf3;
  font-family:"Titillium Web",-apple-system,"Segoe UI",Roboto,Helvetica,sans-serif}
.slide.gt24 h2{margin:0 0 .28em;color:#dbad50;font-weight:700;
  font-size:4.5cqw;line-height:1.04;letter-spacing:-.01em;text-wrap:balance}
.slide.gt24 .sub{margin:-.1em 0 .70em;color:#b9cfe6;
  font-size:1.95cqw;line-height:1.35;max-width:66ch}

/* ---- the picture --------------------------------------------------------- */
.gt24 .ob-pic{position:relative;width:100%;aspect-ratio:1770/750;margin:0 auto;
  max-height:66cqh;border-radius:4px;overflow:hidden;background:transparent}

/* Each step is a full-size transparent layer that passes the pointer THROUGH,
   so its contents stay reachable to the review overlay (VISUAL_SPEC 11). */
.gt24 .ob-step{position:absolute;inset:0;transform:none;pointer-events:none}
.gt24 .ob-step > *{pointer-events:auto}
.gt24 .ob-scrim{position:absolute;inset:0;background:rgba(6,16,34,.80);
  pointer-events:none}

/* ---- the four figures ---------------------------------------------------- *
   Each is left-aligned in the art zone (0-68% of the picture) and its viewBox
   aspect EQUALS its element aspect, so preserveAspectRatio="meet" letterboxes
   nothing: element w = .68*1770 = 1203.6 units, element h = pct*750 units.     */
.gt24 .ob-pic svg.gt24-fig{position:absolute;left:0;right:auto;bottom:auto;
  width:68%;display:block;overflow:visible}
.gt24 .gt24-fig-band{top:0;    height:16%}   /* viewBox 1203.6 x 120   */
.gt24 .gt24-fig-ra  {top:18%;  height:23%}   /* viewBox 1203.6 x 172.5 */
.gt24 .gt24-fig-cc  {top:43%;  height:23%}   /* viewBox 1203.6 x 172.5 */
.gt24 .gt24-fig-ia  {top:68%;  height:32%}   /* viewBox 1203.6 x 240   */

.gt24 .gt24-fig text{font-family:"Titillium Web",-apple-system,"Segoe UI",
  Roboto,Helvetica,sans-serif}

/* ---- the proportional band (step 1) -------------------------------------- */
.gt24 .gt24-hltp{fill:#dbad50;font-weight:700;letter-spacing:.06em}
.gt24 .gt24-meta{fill:#b9cfe6;font-weight:400}
.gt24 .gt24-seg{stroke:rgba(10,25,47,.55);stroke-width:1}
.gt24 .gt24-tick{stroke:#0a192f;stroke-width:2.5}
.gt24 .gt24-seglab{fill:#e8edf3;font-weight:700}
.gt24 .gt24-segsub{fill:#b9cfe6;font-weight:400}

/* ---- a rack: one second-level element, its third-level rows -------------- */
.gt24 .gt24-l2{fill:#dbad50;font-weight:700;letter-spacing:.055em}
.gt24 .gt24-rule{stroke:rgba(255,255,255,.10);stroke-width:1}
.gt24 .gt24-rule-hd{stroke:rgba(219,173,80,.45);stroke-width:1}
.gt24 .gt24-l3{fill:#e8edf3;font-weight:600}
.gt24 .gt24-trk{fill:rgba(219,173,80,.15)}
.gt24 .gt24-cnt{font-weight:700}
.gt24 .gt24-tax{fill:#b9cfe6;font-weight:400}
.gt24 .gt24-row:hover .gt24-tax{fill:#e8edf3}

/* ---- the round "i" badge that opens a second-level element's full list ---- *
   A <button> inherits NEITHER family nor size: both are stated outright.       */
.gt24 .gt24-ib{position:absolute;left:var(--x);top:var(--y);
  font-family:"Titillium Web",-apple-system,"Segoe UI",Roboto,Helvetica,sans-serif;
  font-size:1.30cqw;font-weight:700;line-height:1;font-style:italic;
  width:2.35cqw;height:2.35cqw;padding:0;border:0;border-radius:50%;
  color:#0a192f;background:#dbad50;cursor:pointer;
  display:grid;place-items:center;
  box-shadow:0 2px 8px rgba(0,0,0,.5);transition:transform .15s}
.gt24 .gt24-ib:hover,.gt24 .gt24-ib:focus-visible{transform:scale(1.12);outline:none;
  box-shadow:0 0 0 .25cqw rgba(219,173,80,.35)}

/* ---- the explanation box: exactly one on screen at a time ---------------- */
.gt24 .ob-note{position:absolute;left:var(--x);top:var(--y);width:var(--w);
  background:rgba(10,24,47,.94);border:1px solid rgba(219,173,80,.55);
  border-left:3px solid #dbad50;border-radius:5px;padding:.72em .9em;
  box-shadow:0 8px 26px rgba(0,0,0,.55);transition:opacity .2s ease}

/* ---- gt25 (frag_gt25.css) ---- */
/* ---- gt25 &#183; "One issue, seven readings" -------------------------------------
   The payoff fragment for the lower levels: ONE real congressional issue, read on
   all seven dimensions at once, with the verbatim taxon from
   TAXONOMY_AGREED_2026-09-01.tsv on each.

   ROUTE 3 (draw it). There is no source figure for this and never was, so the
   whole picture is one inline SVG: an issue card, a beam, a prism, and seven rays
   into seven labelled readings. No plate, no reveal image, nothing rastered.

   ONE SVG, NOT EIGHT. VISUAL_SPEC section 6: every .ob-step is a full-size layer,
   so a per-step <svg> would stack eight full-size overlays and swallow the pointer.
   Instead the art is a SINGLE static <svg> child of .ob-pic and each reading is a
   <g class="gt25-lay gt25-rN"> lit from the step's own .shown class through :has().
   Each .ob-step therefore carries only its .ob-note - which is exactly what the
   spec says a box-only step should carry.

   TYPE FLOOR, COMPUTED NOT EYEBALLED. Inline SVG text is measured against the
   viewBox. Worst case for this fragment:
     .ob-pic is width:100% of the slide content box (92.8% of slide width after the
     3.6% side padding) BUT is also clamped by max-height:66cqh, and #stage is the
     nearest container with block containment. In present mode stage height is
     slide_width * 9/16, so the clamped picture width is
       66% * (W * 9/16) * 1770/750 = 0.876 * W.
     The viewBox is 1770 wide, so a viewBox font-size F renders at
       F * 0.876 * W / 1770 = 0.000495 * F * W  px.
     The 1.10%-of-slide-width floor is therefore F >= 22.2.
   gt01 measured that .ob-pic does NOT always keep its declared aspect (it read 2.60
   against a declared 2.6 - it is a shrinkable flex item). At 2.60 the meet-fitted
   SVG loses a further 9.2% of scale, which pushes the floor to F >= 24.5. NOTHING
   in this fragment is below 26, so the smallest glyph holds at 1.29% of slide width
   in the nominal case and 1.17% in the shrunk case. Both clear the floor.

   HTML type on this slide uses cqw, which is 1% of the SLIDE's inline size - the
   stricter and more literal reading of "1.10% of slide width" than vw, since the
   slide is never wider than the viewport. Nothing is below 1.32cqw (18.0px at
   1366), and the two <button>s carry an explicit size plus font-family:inherit,
   because a button does NOT inherit font-size and silently falls to the 13.33px UA
   default - the trap that shipped today.

   COLOUR. Ground #0a192f; the seven rays run a warm-to-cool ramp anchored at the
   two house accents, gold #dbad50 through to light blue #82a0bc, so the prism reads
   as a spectrum without leaving the palette. All PROSE is off-white #e8edf3 or
   #b9cfe6 (luminance 237 and 205); gold and the ramp are used for accents, rules
   and headings only, matching every other slide in the deck.
   ------------------------------------------------------------------------------ */

/* ---------- the picture ---------- */
.gt25 .ob-pic{aspect-ratio:1770/750;max-height:66cqh;background:#0a192f;border-radius:5px}
.gt25 .ob-pic > svg.gt25-svg{position:absolute;inset:0;width:100%;height:100%;display:block}

/* ---------- hit-testing (VISUAL_SPEC section 11) ----------------------------
   A .ob-step is a full-size transparent layer. Without these two rules the LAST
   step's layer sits over every earlier note and the modal buttons cannot be
   clicked at all, even though they are visible. The layer passes the pointer
   through; its contents take it. */
.gt25 .ob-step{pointer-events:none}
.gt25 .ob-step > *{pointer-events:auto}
.gt25 .ob-scrim{pointer-events:none}

/* ---------- the seven readings light one per click --------------------------
   Hidden state carries transition:none. autofit() lights every fragment under
   body.measuring, and a hidden state that TRANSITIONS animates back to hidden -
   the slide paints fully built and fades away, which the room sees as a flash
   before the build starts. The fade lives on the SHOWN state only. */
.gt25 .gt25-lay{opacity:0;transition:none}
.gt25 .ob-pic:has(.gt25-s1.shown) .gt25-r1,
.gt25 .ob-pic:has(.gt25-s2.shown) .gt25-r2,
.gt25 .ob-pic:has(.gt25-s3.shown) .gt25-r3,
.gt25 .ob-pic:has(.gt25-s4.shown) .gt25-r4,
.gt25 .ob-pic:has(.gt25-s5.shown) .gt25-r5,
.gt25 .ob-pic:has(.gt25-s6.shown) .gt25-r6,
.gt25 .ob-pic:has(.gt25-s7.shown) .gt25-r7{opacity:1;transition:opacity .32s ease}
/* measuring must see the built state, and B (builds off) must show everything */
body.measuring .gt25 .gt25-lay,
body.nobuild  .gt25 .gt25-lay{opacity:1;transition:none}

/* ---------- the explanation boxes ----------
   Slightly tightened from the house default so a 200-character box clears the
   picture: at --w:27% the content column is ~294px at 1366, 1.40cqw is 19.1px,
   ~33 characters a line, seven lines, ~232px against a 507px picture. */

<template id="deck"><section class="slide txc" data-audience="all" data-n="[1 min] OPENING (09:00–09:01). Inhoud: Nidas; moderator: Jesse (zo staat het in de programmagids, paragraaf 3.3.3). VOOR NIDAS (inhoud): deze sessie gaat over het categoriesysteem waarmee jullie vanmiddag annoteren. De zin uit de programmagids: een taxonomie is het categorieënstelsel waarmee teksten worden geannoteerd; vooraf categorieën definiëren voorkomt labelruis en willekeur; en de taxonomie zelf is een menselijke keuze: als er geen categorie ‘dissidentie’ is, detecteert het systeem geen dissidentie. Zeg expliciet dat de sessie is OMGEBOUWD op de eigen thema’s van de groepen: Transparent Battlefield, Grey-Zone Warfare en Effective Deterrence, met hun eigen datasets (tb, grey_zone, deterrence, elk in een set van 100, 1.000 en een grote set). De grote sets zijn niet allemaal 10.000: grey_zone_10000 heeft 8.052 rijen en deterrence_10000 heeft 7.287 rijen (geteld uit de CSV’s); tb_10000 heeft er 10.000. De leidende vragen op de kaarten staan letterlijk zo in de programmagids (paragraaf 4.4); de HCSS-rapporten: From the Fog of War to the Fever of Exposure (maart 2026), The Grey Horizon (januari 2026), The Glass Wall (januari 2026). De prompt waarmee in Ronde 2 een taalmodel een taxonomie genereert is MDTDF.md, Multi-Dimensional Taxonomy Development Framework, Stephan De Spiegeleire, 4 juni 2025 (Enhanced Edition); dezelfde file als in het ADA-deck van Bakoe. NIET de oudere AIRA-prompt van april 2026. VOOR JESSE (moderator): de tijdlijn onderaan is het draaiboek. Waarom 8 min (09:00–09:08), Opbouw 14 (09:08–09:22), Recept 8 (09:22–09:30), Rondes 47 (09:30–10:17: uitleg 2, Ronde 1 15, Ronde 2 15, HCSS-referentie 3, Ronde 3 12), Stresstest 8 (10:17–10:25), Verder 5 (10:25–10:30). Geen pauze; de wissels zitten in de rondetijden. Om 10:45 volgt Hypothesen, om 13:00 de annotatie op schaal (minstens 1.000 fragmenten per groep met de eigen taxonomie). Omslagbeeld: een getekend schema, één document in een ring van categorieën met subcategorieën; één vak is leeg en gestippeld, de categorie die niemand definieerde. Het is een metafoor, geen data." data-sec="why" data-sid="tx-cover" data-t="Taxonomie: bepalen wat je kunt zien"><svg aria-label="Schema: één document in het midden van een ring van categoriesegmenten, elk segment een lens met subcategorieën; één segment is een leeg gestippeld vak, een categorie die niemand definieerde" class="txc-art" preserveaspectratio="xMidYMid slice" role="img" viewbox="0 0 1600 900"><path class="txc-grid" d="M0 0 V900"></path><path class="txc-grid" d="M50 0 V900"></path><path class="txc-grid" d="M100 0 V900"></path><path class="txc-grid" d="M150 0 V900"></path><path class="txc-grid" d="M200 0 V900"></path><path class="txc-grid" d="M250 0 V900"></path><path class="txc-grid" d="M300 0 V900"></path><path class="txc-grid" d="M350 0 V900"></path><path class="txc-grid" d="M400 0 V900"></path><path class="txc-grid" d="M450 0 V900"></path><path class="txc-grid" d="M500 0 V900"></path><path class="txc-grid" d="M550 0 V900"></path><path class="txc-grid" d="M600 0 V900"></path><path class="txc-grid" d="M650 0 V900"></path><path class="txc-grid" d="M700 0 V900"></path><path class="txc-grid" d="M750 0 V900"></path><path class="txc-grid" d="M800 0 V900"></path><path class="txc-grid" d="M850 0 V900"></path><path class="txc-grid" d="M900 0 V900"></path><path class="txc-grid" d="M950 0 V900"></path><path class="txc-grid" d="M1000 0 V900"></path><path class="txc-grid" d="M1050 0 V900"></path><path class="txc-grid" d="M1100 0 V900"></path><path class="txc-grid" d="M1150 0 V900"></path><path class="txc-grid" d="M1200 0 V900"></path><path class="txc-grid" d="M1250 0 V900"></path><path class="txc-grid" d="M1300 0 V900"></path><path class="txc-grid" d="M1350 0 V900"></path><path class="txc-grid" d="M1400 0 V900"></path><path class="txc-grid" d="M1450 0 V900"></path><path class="txc-grid" d="M1500 0 V900"></path><path class="txc-grid" d="M1550 0 V900"></ <section class="slide obuild txw" data-audience="all" data-n="[7 min] WAAROM CATEGORIEËN EERST KOMEN (09:01–09:08). Zeven klikken: links drie dingen die misgaan zonder gedeelde taxonomie, rechts drie dingen die een taxonomie oplevert (filteren, tellen, vergelijken), dan de slotkaart. Elk voorbeeld komt uit de eigen thema’s van de groepen; noem bij elke klik welk thema het is, zodat elke groep haar eigen onderwerp terugziet. KLIK 1, DE GRAFIEK (gemeten, niet geschat): in elke _1000-dataset noemt de kolom is_relevant 700 van de 1.000 fragmenten relevant. Daarin hebben we gezocht naar het themawoord in elke vorm. Transparent Battlefield (tb_1000), zoekwoord прозрачн*/транспарент*: 11 van de 700 relevante fragmenten (1,6%), plus 8 treffers in fragmenten die NIET relevant zijn. Grey-Zone Warfare (grey_zone_1000), «серая зона»/гибридн*: 34 van 700 (4,9%), plus 9 niet-relevant. Effective Deterrence (deterrence_1000), сдерживан*: 92 van 700 (13,1%), plus 3 niet-relevant. Herteld op 13 oktober uit de drie CSV’s (chunk_content, kleine letters, regex). Boodschap: het woord vindt een kleine minderheid van wat de dataset zelf relevant noemt, en het raakt ook ruis. Let op: is_relevant is het oordeel van de dataset zelf, geen gouden standaard. KLIK 2 (Effective Deterrence): Peskov zegt ‘de nucleaire doctrine is van kracht’ (deterrence_1000, fragment 27691, kanaal Elena Panina, 16 juli 2025); Poetin zegt ‘het antwoord op de Tomahawks wordt een sterkere luchtverdediging’ (fragment 31732, 10 oktober 2025). Vraag de zaal: zelfde soort signaal of niet? Zonder categorieën (bestraffing tegenover ontzegging, nucleair tegenover conventioneel) blijft het een indruk. KLIK 3 (Grey-Zone Warfare): de FSB-melding over een inwoner van Tomsk die militaire objecten fotografeerde voor Oekraïense diensten (grey_zone_1000, fragment 40258, kanaal Solovjov, 2 juli 2025). Het voorbeeld van twee rapporten die het verschillend labelen is HYPOTHETISCH, ter illustratie. KLIK 4 (Transparent Battlefield): fragment 1251980 uit tb_1000, Telegram-kanaal ‘Репортёр Руденко V’ (in de dataset gelabeld als telegram_Cossack), 30 januari 2026. Het fragment beschrijft vuurcorrectie in realtime door drone-operators, dus zichtbaarheid op het slagveld, maar het woord прозрачность komt er niet in voor (gecontroleerd). De codering naar de HCSS-taxonomie Transparent Battlefield (Transparency Driver &gt; Sensor Systems &gt; Aerial ISR &gt; Tactical UAVs / FPV drones; de labels zijn in het origineel Engels) is een ILLUSTRATIEVE codering door Claude (Opus 5.5), gemaakt voor dit deck: geen gouden standaard en geen pipeline-uitvoer. KLIK 5 en 6 zijn VRAGEN die een taxonomie beantwoordbaar maakt, geen bevindingen: wij hebben die tellingen en vergelijkingen niet gedaan. grey_zone_10000 heeft 8.052 rijen (niet 10.000), 2022–2026; deterrence_1000 bevat onder meer integrum (452) en telegram_Experts (156). KLIK 7, SLOTKAART: de zin uit de programmagids: ‘als er geen categorie dissidentie is, detecteert het systeem geen dissidentie’. Categorieën vooraf vastleggen voorkomt labelruis en willekeur, en het betekent dat de structuur een keuze van de groep is. Besteed die niet uit aan het model. Brug naar de volgende slide: wat leggen we dan als eerste vast? Het object." data-sec="why" data-sid="tx-why" data-t="Waarom categorieën eerst komen"><h2>Waarom categorieën eerst komen</h2><p class="sub">Een taxonomie bepaalt wat je analyse kan vinden, tellen en vergelijken.</p><div class="ob-pic"><div class="txw-head txw-h-without" style="--x:0%">Zonder gedeelde taxonomie</div><div class="txw-head txw-h-with" style="--x:52%">Met een taxonomie</div><div aria-hidden="true" class="txw-slot txw-l1" style="--x:0%;--y:7.5%;--h:40.5%"><p class="txw-sn">1</p></div><div aria-hidden="true" class="txw-slot txw-l2" style="--x:0%;--y:49%;--h:13.8%"><p class="txw-sn">2</p></div><div aria-hidden="true" class="txw-slot txw-l3" style="--x:0%;--y:63.8%;--h:13.8%"><p class="txw-sn">3</p></div><div aria-hidden="true" class="txw-slot txw-l4" style="--x:52%;--y:7.5%;--h:40.5%"><p class="txw-sn">1</p></div><div aria-hidden="true" class="txw-slot txw-l5" style="--x:52%;--y:49%;--h:13.8%"><p class="txw-sn">2</p></div><div aria-hidden="true" class="txw-slot txw-l6" style="--x:52%;--y:63.8%;--h:13.8%"><p class="txw-sn">3</p></div><div class="ob-step txw-s1" data-frag="1"><div class="txw-card txw-without txw-big" style="--x:0%;--y:7.5%;--h:40.5%"><p class="txw-lab"><span class="txw-num">1</span>Zoeken op het themawoord mist het meeste</p><svg aria-label="Staafdiagram: van de 700 relevante fragmenten per dataset bevat het themawoord er 11 (Transparent Battlefield), 34 (Grey-Zone Warfare) en 92 (Effective Deterrence)" class="txw-chart" preserveaspectratio="xMidYMid meet" role="img" viewbox="0 0 680 242"><g class="txw-row"><text class="txw-t" x="0" y="22">Transparent Battlefield</text><text class="txw-v" text-anchor="end" x="680" y="22">11 van 700 · 1,6%</text><rect class="txw-track" height="30" rx="3" width="470" x="0" y="32"></rect><rect class="txw-fill" height="30" rx="2" width="7.4" x="0" y="32"></rect><text class="txw-kw" x="18.4" y="54">tb_1000 · прозрачн* · транспарент*</text><rect class="txw-nr" height="14" rx="2" width="14" x="482" y="40"></rect><text class="txw-kw" x="502" y="54">+8 niet-relevant</text></g><g class="txw-row"><text class="txw-t" x="0" y="90">Grey-Zone Warfare</text><text class="txw-v" text-anchor="end" x="680" y="90">34 van 700 · 4,9%</text><rect class="txw-track" height="30" rx="3" width="470" x="0" y="100"></rect><rect class="txw-fill" height="30" rx="2" width="22.8" x="0" y="100"></rect><text class="txw-kw" x="33.8" y="122">grey_zone_1000 · «серая зона» · гибридн*</text><rect class="txw-nr" height="14" rx="2" width="14" x="482" y="108"></rect><text class="txw-kw" x="502" y="122">+9 niet-relevant</text></g><g class="txw-row"><text class="txw-t" x="0" y="158">Effective Deterrence</text><text class="txw-v" text-anchor="end" x="680" y="158">92 van 700 · 13,1%</text><rect class="txw-track" height="30" rx="3" width="470" x="0" y="168"></rect><rect class="txw-fill" height="30" rx="2" width="61.8" x="0" y="168"></rect><text class="txw-kw" x="72.8" y="190">deterrence_1000 · сдерживан*</text><rect class="txw-nr" height="14" rx="2" width="14" x="482" y="176"></rect><text class="txw-kw" x="502" y="190">+3 niet-relevant</text></g><path class="txw-ax" d="M0 208 H470 M0 208 v7 M470 208 v7"></path><text class="txw-at" x="0" y="234">0</text><text class="txw-at" text-anchor="end" x="470" y="234">700 relevante fragmenten</text></svg></div><div class="ob-note" style="--x:0%;--y:78.8%;--w:100%"><div class="k">Het woord is niet het begrip</div><div class="d">In elke dataset van 1.000 noemt de dataset zelf 700 fragmenten relevant. Het themawoord staat in slechts 11, 34 en 92 daarvan, en raakt ook fragmenten die níet relevant zijn. Zoeken op het woord geeft een kleine en scheve steekproef.</div></div></div><div class="ob-step txw-s2" data-frag="1"><div class="txw-card txw-without" style="--x:0%;--y:49%;--h:13.8%"><p class="txw-lab"><span class="txw-num">2</span>Elke vergelijking is ad hoc</p><p class="txw-ex"><span class="txw-tag">Effective Deterrence</span> Peskov: “de nucleaire doctrine is van kracht”. Poetin: “tegen de Tomahawks: sterkere luchtverdediging”. Zelfde soort signaal?</p></div><div class="ob-note" style="--x:0%;--y:78.8%;--w:100%"><div class="k">Geen gemeenschappelijke maatstaf</div><div class="d">Twee analisten lezen dezelfde twee uitspraken en zijn het oneens of ze over hetzelfde gaan. Pas met vooraf gedefinieerde dimensies, zoals bestraffing tegenover ontzegging, wordt het verschil iets wat je kunt aanwijzen.</div></div></div><div class="ob-step txw-s3" data-frag="1"><div class="txw-card txw-without" style="--x:0%;--y:63.8%;--h:13.8%"><p class="txw-lab"><span class="txw-num">3</span>Elk rapport bedenkt zijn categorieën opnieuw</p><p class="txw-ex"><span class="txw-tag">Grey-Zone Warfare</span> De FSB-zaak tegen een inwoner van Tomsk die militaire objecten fotografeerde: in het ene rapport ‘spionage’, in het volgende ‘sabotage’?</p></div><div class="ob-note" style="--x:0%;--y:78.8%;--w:100%"><div class="k">Niets stapelt zich op</div><div class="d">Als elk rapport zijn eigen kopjes bedenkt, sluiten de tellingen van deze maand niet aan op die van vorige maand, of op die van de groep naast je. Het werk groeit dan nooit uit tot één dataset.</div></div></div><div class="ob-step txw-s4" data-frag="1"><div class="txw-card txw-with txw-big" style="--x:52%;--y:7.5%;--h:40.5%"><p class="txw-lab txw-labrow"><span><span class="txw-num">1</span>Filteren op betekenis</span><span class="txw-noword"><s>прозрачн*</s>: niet in de tekst</span></p><div class="txw-frag"><p class="txw-meta"><b>Transparent Battlefield</b> · tb_1000 · fragment 1251980 · Telegram ‘Репортёр Руденко V’ · 30 januari 2026</p><p class="txw-ru">«…Корректировка огня и контроль поражения цели осуществлялись в режиме реального времени операторами БПЛА.»</p><p class="txw-nl">“Vuurcorrectie en controle van het resultaat gebeurden in realtime door de drone-operators.”</p><p class="txw-path"><span class="txw-lbl">Transparantiefactor › Sensorsystemen › Luchtverkenning › FPV‑drones</span></p></div></div><div class="ob-note" style="--x:0%;--y:78.8%;--w:100%"><div class="k">Filteren: de categorie vindt wat het woord mist</div><div class="d">Dit fragment gaat over zien en gezien worden: drone-operators sturen het vuur in realtime, maar het woord ‘transparantie’ valt nergens. Een label op betekenis vindt het wel terug (illustratieve codering, geen gouden standaard).</div></div></div><div class="ob-step txw-s5" data-frag="1"><div class="txw-card txw-with" style="--x:52%;--y:49%;--h:13.8%"><p class="txw-lab"><span class="txw-num">2</span>Tellen</p><p class="txw-ex"><span class="txw-tag">Grey-Zone Warfare</span> Melden Russische bronnen tussen 2022 en 2026 vaker FSB-zaken tegen ‘Oekraïense diensten’? (grey_zone_10000, 8.052 fragmenten)</p></div><div class="ob-note" style="--x:0%;--y:78.8%;--w:100%"><div class="k">Tellen: van lezen naar meten</div><div class="d">Labels kun je tellen per maand, per bron of per actor. Een claim als “dit neemt toe” wordt dan controleerbaar in plaats van een indruk. Let op: dit is een vraag die de taxonomie beantwoordbaar maakt, nog geen bevinding.</div></div></div><div class="ob-step txw-s6" data-frag="1"><div class="txw-card txw-with" style="--x:52%;--y:63.8%;--h:13.8%"><p class="txw-lab"><span class="txw-num">3</span>Vergelijken</p><p class="txw-ex"><span class="txw-tag">Effective Deterrence</span> Spreken Telegram-experts vaker over bestraffing, en officiële bronnen vaker over ontzegging? (deterrence_1000)</p></div><div class="ob-note" style="--x:0%;--y:78.8%;--w:100%"><div class="k">Vergelijken: dezelfde categorieën, andere bronnen</div><div class="d">Omdat elke bron met dezelfde categorieën is gelabeld, worden verschillen tussen bronnen bevindingen in plaats van indrukken. Ook dit is een vraag die je straks kunt stellen, niet iets wat wij al gemeten hebben.</div></div></div><div class="ob-step txw-s7" data-frag="1"><div class="ob-scrim"></div><div class="ob-note wide txw-close" style="--x:0%;--y:0%;--w:100%"><div class="k">Geen categorie, geen bevinding</div><div class="txw-cb"><div class="d">Uit de programmagids: “als er geen categorie ‘dissidentie’ is, detecteert het systeem geen dissidentie.” Elke telling, trend en vergelijking blijft beperkt tot de categorieën die jullie vooraf definiëren. De taxonomie is dus jullie analytische keuze, geen technisch detail voor een model.</div><div class="txw-chips"><span class="txw-chip">Luchtverkenning <i>Transparent Battlefield</i></span><span class="txw-chip">Clandestiene operaties <i>Grey-Zone Warfare</i></span><span class="txw-chip">Afschrikking door bestraffing <i>Effective Deterrence</i></span><span class="txw-chip txw-miss">dissidentie: nooit gedefinieerd, nooit gevonden</span></div></div></div></div></div><img class="aira-logo" src="img/aira/hcss-logo/hcss-logo.jpg" alt="HCSS"></section>
<section class="slide obuild tca" data-audience="all" data-n="[4 min] FRAME: EERST DEFINIËREN, DAN ZOEKEN (09:08–09:12). Deze slide vervangt de oude fictieve casus: we werken vanaf nu alleen nog met de eigen thema’s van de groepen. De logica komt uit het ADA-deck (Bakoe, 21 september 2026), slide ‘FRAME · define before searching’. BOVENAAN de fasebalk uit ADA (FRAME, DISCOVER, ANALYZE, DELIVER), gelegd op de AIRA-week: ma–di vraag en relevantieprompt, woensdagochtend taxonomie (FRAME, nu), woensdagmiddag annotatie en donderdag validatie (ANALYZE), vrijdag briefing (DELIVER). Eerlijk zeggen: bij ADA kwam FRAME vóór het zoeken; jullie hebben al 100 fragmenten op relevantie gelezen. Dat is prima, maar de discipline van vandaag is dezelfde: object en dimensies vastleggen vóór je de data gebruikt om categorieën te verzinnen. KLIK 1, HET PRINCIPE: bij ADA was het object ‘the bilateral relationship since 1991, not papers’; het primaire object daar: een waarneembare bilaterale interactie-episode of duurzame relationele regeling. ADA-tekst: ‘Every lower-level label must describe that instance, not a document genre or a fashionable topic.’ De deductieve regel uit de ADA-maandagworkshop: het corpus kan v0 toetsen of falsifiëren, maar niet genereren. KLIK 2–4, DE DRIE THEMA’S: de leidende vraag staat letterlijk zo in de programmagids (paragraaf 4.4). Het primaire object is telkens een VOORSTEL van ons; de groep beslist. Transparent Battlefield: het jubileum van SOBR ‘Mangoest’ is fragment 1256505 uit tb_100 (Integrum, Moreposts, 30 januari 2026, is_relevant = False): ruis die geen categorie mag krijgen. Grey-Zone Warfare: F-GZ2 is grey_zone_1000, fragment 20401, officieel Telegram-kanaal van het Russische ministerie van Defensie, 15 december 2025: de woordvoerder van de Zwarte Zeevloot ontkent dat een onderzeeër in Novorossiejsk is vernietigd en noemt het een mislukte Oekraïense sabotagepoging met een onbemand onderwatervaartuig. Dat is open oorlog en geen Russische handeling, maar wel een informatiestrijd erover: precies het grensprobleem dat de domeinzin moet beslechten. Effective Deterrence: F-DET1 is deterrence_1000, fragment 27691, kanaal Elena Panina, 16 juli 2025: Peskov ‘de nucleaire doctrine is van kracht’, met punt 11 van de doctrine. De leidende vraag gaat over afschrikking TEGENOVER Rusland; veel fragmenten gaan over Rusland dat het Westen afschrikt. De groep moet de richting kiezen (of bewust beide, en dat dan als dimensie opnemen). Ter info: de HCSS-taxonomie Effective Deterrence is gebouwd rond hoe Moskou westerse afschrikking waarneemt; die laten we pas na Ronde 2 zien. KLIK 5, DOMEINZIN: elke groep schrijft één zin uit haar onderzoeksvraag v2. Die zin komt in Ronde 2 op de plek ‘Domain for this run: {{DOMAIN}}’ in de publieke kopie van de prompt (QR); de prompt is MDTDF.md (Stephan De Spiegeleire, 4 juni 2025, Enhanced Edition), dezelfde file als in het ADA-deck. Stap 1 van MDTDF, letterlijk: ‘1. Define Your Domain: Clearly specify what you are creating a taxonomy for’. Laat de groepen de zin nu al opschrijven; ze hebben hem nodig in Ronde 1." data-sec="frame" data-sid="tx-case" data-t="FRAME · eerst definiëren, dan zoeken"><h2>FRAME · eerst definiëren, dan zoeken</h2><p class="sub">Leg het object en het kader vast vóór je de data opent, voor elk van de drie thema’s.</p><div class="ob-pic"><svg aria-label="Fasebalk uit ADA op de AIRA-week: DISCOVER maandag en dinsdag, FRAME woensdagochtend (nu), ANALYZE woensdagmiddag en donderdag, DELIVER vrijdag" class="tca-rail" preserveaspectratio="xMidYMid meet" role="img" viewbox="0 0 1600 78"><g class="tca-st tca-done"><rect height="70" rx="35" width="368" x="1" y="4"></rect><circle cx="38" cy="39" r="20"></circle><path class="tca-ck" d="M28 39 l7 7 l13 -14"></path><text class="tca-sn" x="70" y="34">DISCOVER</text><text class="tca-sd" x="70" y="61">vraag + relevantie (ma–di)</text></g><path class="tca-arr" d="M378 39 h24 m-9 -9 l9 9 l-9 9"></path><g class="tca-st tca-now"><rect height="74" rx="37" width="368" x="411" y="2"></rect><circle cx="448" cy="39" r="20"></circle><text class="tca-nn" text-anchor="middle" x="448" y="47">2</text><text class="tca-sn" x="480" y="34">FRAME · nu</text><text class="tca-sd" x="480" y="61">taxonomie (wo-ochtend)</text></g><path class="tca-arr" d="M788 39 h24 m-9 -9 l9 9 l-9 9"></path><g class="tca-st"><rect height="70" rx="35" width="368" x="821" y="4"></rect><circle cx="858" cy="39" r="20"></circle><text class="tca-nn" text-anchor="middle" x="858" y="47">3</text><text class="tca-sn" x="890" y="34">ANALYZE</text><text class="tca-sd" x="890" y="61">annotatie (wo) · validatie (do)</text></g><path class="tca-arr" d="M1198 39 h24 m-9 -9 l9 9 l-9 9"></path><g class="tca-st"><rect height="70" rx="35" width="368" x="1231" y="4"></rect><circle cx="1268" cy="39" r="20"></circle><text class="tca-nn" text-anchor="middle" x="1268" y="47">4</text><text class="tca-sn" x="1300" y="34">DELIVER</text><text class="tca-sd" x="1300" y="61">briefing (vr)</text></g></svg><div aria-hidden="true" class="tca-slot tca-s1s" style="--x:0%;--w:24%"></div><div aria-hidden="true" class="tca-slot tca-s2s" style="--x:25.5%;--w:23.83%"></div><div aria-hidden="true" class="tca-slot tca-s3s" style="--x:50.83%;--w:23.83%"></div><div aria-hidden="true" class="tca-slot tca-s4s" style="--x:76.17%;--w:23.83%"></div><div class="ob-step tca-st1" data-frag="1"><div class="tca-card tca-pri" style="--x:0%;--w:24%"><p class="tca-eb">Het principe · uit ADA (Bakoe, sept. 2026)</p><p class="tca-h">Leg eerst het object vast</p><p class="tca-tx">Het primaire object is de eenheid die elk label beschrijft. Bij ADA: de relatie tussen Armenië en Azerbeidzjan sinds 1991, niet de publicaties.</p><svg aria-label="Elk niveau van de taxonomie, van HLTP tot taxon, beschrijft hetzelfde primaire object" class="tca-tree" preserveaspectratio="xMidYMid meet" role="img" viewbox="0 0 300 150"><rect class="tca-lv" height="30" rx="5" width="132" x="0" y="2"></rect><text class="tca-lt" text-anchor="middle" x="66" y="24">HLTP</text><rect class="tca-lv" height="30" rx="5" width="132" x="0" y="40"></rect><text class="tca-lt" text-anchor="middle" x="66" y="62">2e niveau</text><rect class="tca-lv" height="30" rx="5" width="132" x="0" y="78"></rect><text class="tca-lt" text-anchor="middle" x="66" y="100">3e niveau</text><rect class="tca-lv" height="30" rx="5" width="132" x="0" y="116"></rect><text class="tca-lt" text-anchor="middle" x="66" y="138">taxon</text><path class="tca-ln" d="M134 17 C175 17 172 74 200 74 M134 55 C170 55 175 74 200 74 M134 93 C170 93 175 74 200 74 M134 131 C175 131 172 74 200 74"></path><rect class="tca-ob" height="72" rx="8" width="100" x="200" y="38"></rect><text class="tca-ot" text-anchor="middle" x="250" y="69">primair</text><text class="tca-ot" text-anchor="middle" x="250" y="93">object</text></svg><p class="tca-rule"><b>Deductief:</b> het corpus kan v0 toetsen of falsifiëren, maar niet genereren.</p></div><div class="ob-note" style="--x:0%;--y:79%;--w:100%"><div class="k">Wat is één eenheid die je labelt?</div><div class="d">Elk label op elk niveau moet dát object beschrijven, niet een documentgenre of een modieus onderwerp. Je bouwt v0 vanuit je vraag en eerste principes; de data gebruik je daarna om v0 te toetsen, niet om haar te verzinnen.</div></div></div><div class="ob-step tca-st2" data-frag="1"><div class="tca-card tca-th" style="--x:25.5%;--w:23.83%"><p class="tca-tn"><svg aria-hidden="true" class="tca-ic" viewbox="0 0 40 40"><path class="tca-icl" d="M3 20 C10 9 30 9 37 20 C30 31 10 31 3 20 Z"></path><circle class="tca-icf" cx="20" cy="20" r="6"></circle><path class="tca-icl" d="M20 2 v7 M20 31 v7 M2 20 h0 M38 20 h0"></path></svg>Transparent Battlefield</p><p class="tca-q">“Hoe beïnvloedt vergroot situationeel bewustzijn de moderne oorlogsvoering?”</p><div class="tca-obj"><span class="tca-vs">voorstel – jullie groep bepaalt</span><p class="tca-eb">Primair object</p><p class="tca-tx">een Russische uitspraak over zichtbaarheid op het slagveld en wat die betekent voor de strijd</p></div><p class="tca-eb tca-out">Buiten scope</p><p class="tca-tx">techniek zonder iets over zien of gezien worden; ruis zoals het jubileum van SOBR ‘Mangoest’ (tb_100, niet relevant)</p></div><div class="ob-note" style="--x:0%;--y:79%;--w:100%"><div class="k">Transparent Battlefield: de uitspraak, niet de drone</div><div class="d">Een fragment over drones of satellieten valt alleen binnen het object als het iets zegt over zien en gezien worden. Zo voorkomt de domeinzin dat jullie taxonomie een catalogus van wapensystemen wordt.</div></div></div><div class="ob-step tca-st3" data-frag="1"><div class="tca-card tca-th" style="--x:50.83%;--w:23.83%"><p class="tca-tn"><svg aria-hidden="true" class="tca-ic" viewbox="0 0 40 40"><rect class="tca-icg" height="16" rx="3" width="36" x="2" y="12"></rect><path class="tca-icd" d="M26 6 v28"></path><circle class="tca-icf" cx="12" cy="20" r="3.5"></circle></svg>Grey-Zone Warfare</p><p class="tca-q">“Hoe opereert Rusland in het grijze gebied tussen vrede en oorlog?”</p><div class="tca-obj"><span class="tca-vs">voorstel – jullie groep bepaalt</span><p class="tca-eb">Primair object</p><p class="tca-tx">een beschreven of geclaimde Russische (of aan Rusland toegeschreven) handeling onder de drempel van open oorlog, zoals Russische bronnen die framen</p></div><p class="tca-eb tca-out">Buiten scope en grensgeval</p><p class="tca-tx">gevechten aan het front. Grens: <b>F‑GZ2</b>, een Oekraïense sabotage bij Novorossiejsk in open oorlog. Erin of eruit?</p></div><div class="ob-note" style="--x:0%;--y:79%;--w:100%"><div class="k">Grey-Zone Warfare: waar ligt de drempel?</div><div class="d">De dataset bevat ook Russische meldingen over Oekraïense acties en over de informatiestrijd daarover. Beslis nu of die binnen het object vallen; anders gaan annotatoren straks bij elk grensgeval uit elkaar lopen.</div></div></div><div class="ob-step tca-st4" data-frag="1"><div class="tca-card tca-th" style="--x:76.17%;--w:23.83%"><p class="tca-tn"><svg aria-hidden="true" class="tca-ic" viewbox="0 0 40 40"><path class="tca-icl" d="M20 3 L35 9 V20 C35 29 28 35 20 38 C12 35 5 29 5 20 V9 Z"></path><path class="tca-icd" d="M13 20 h14 M20 13 v14"></path></svg>Effective Deterrence</p><p class="tca-q">“Welke elementen maken afschrikking geloofwaardig en effectief tegenover Rusland?”</p><div class="tca-obj"><span class="tca-vs">voorstel – jullie groep bepaalt</span><p class="tca-eb">Primair object</p><p class="tca-tx">een Russische inschatting van, of signaal over, afschrikking tussen Rusland en het Westen</p></div><p class="tca-eb tca-out">Kies de richting</p><p class="tca-tx">De vraag: afschrikking <i>tegenover</i> Rusland. <b>F‑DET1</b> (Peskov: “de nucleaire doctrine is van kracht”) is het omgekeerde. Buiten: zonder Rusland.</p></div><div class="ob-note" style="--x:0%;--y:79%;--w:100%"><div class="k">Effective Deterrence: wie schrikt wie af?</div><div class="d">Westerse afschrikking zoals Moskou die inschat, of Russische afschrikking van het Westen: dat zijn twee verschillende objecten. Kies er één, of neem de richting bewust op als eigen dimensie van jullie taxonomie.</div></div></div><div class="ob-step tca-st5" data-frag="1"><div class="ob-scrim"></div><div class="ob-note wide tca-dom" style="--x:0%;--y:0%;--w:76%"><div class="k">Jullie domeinzin</div><div class="tca-dg"><div class="tca-dl"><div class="d">Schrijf vanuit jullie onderzoeksvraag v2 één zin die het object vastlegt: wat één eenheid is, vanuit wiens perspectief, en waar de grens ligt. In Ronde 2 vult die zin het enige open veld van de HCSS-prompt MDTDF.md:</div><p class="tca-code">Domain for this run: {{DOMAIN}}</p><p class="tca-quote"><span>MDTDF.md, ‘Instructions for Use’, stap 1</span>“1. Define Your Domain: Clearly specify what you are creating a taxonomy for”</p><p class="tca-slots"><span>één object</span><span>één perspectief</span><span>één grens</span></p></div></div></div><p class="tca-qrw"><img alt="QR-code naar de HCSS-prompt MDTDF.md" class="tca-qr" src="img/aira/qr/mdtdf-prompt.png"/><span>de prompt (MDTDF.md)</span></p></div></div><img class="aira-logo" src="img/aira/hcss-logo/hcss-logo.jpg" alt="HCSS"></section>
<section class="slide obuild txt" data-audience="all" data-n="[4 min] DE ANATOMIE VAN EEN BOOM. Opbouw in zes klikken. (1) Wortel. (2) IS-EEN-keten Hond IS-EEN Zoogdier IS-EEN Dier, met overerving: wat voor de ouder geldt (warmbloedig), geldt voor elk kind. Wat niet in een IS-EEN-keten past, is een ander soort ding. (3) Nevencategorieën sluiten elkaar uit (vuistregel uit april: kun je niet beslissen waar iets hoort, dan klopt de taxonomie niet, niet het ding). (4) Overstap naar hun eigen thema: de vier MDTDF-niveaus op een ECHTE tak van de HCSS-taxonomie Transparent Battlefield (CLAS 2025; bestand RuBase/RNLA/CLAS 2025/Taxonomies/transparent-battlefield-taxonomy.csv; gemeten: 6 HLTP, 17 2e-niveau-elementen, 40 3e-niveau-elementen, 107 taxa). De generatieprompt van deze taxonomie is aantoonbaar MDTDF (RuBase/Transparent battlefield/taxonomy.prompt.md draagt de MDTDF-tekst, 4 juni 2025). De originele labels zijn Engels; de slide toont een Nederlandse weergave met het Engels klein eronder. Het fragment is ECHT: dataset tb_1000, chunk_id 1251980, Telegram (Kozakkenkanaal) „Репортёр Руденко V”, 30 januari 2026, is_relevant = True. Het Russisch is ingekort met ‘…’, niet gewijzigd; de Nederlandse vertaling is van Claude. Dat dit fragment het taxon Tactische UAV’s / FPV-drones krijgt, is een ILLUSTRATIEVE codering door Claude (Opus 5.5) voor dit deck, geen gouden standaard en geen pipeline-uitvoer. (5) Weer nevencategorieën: de vier 3e-niveau-elementen onder Sensor Systems (Aerial ISR, Space-based ISR, Ground-based sensors, Signals intelligence) sluiten elkaar uit voor één sensor. Let op: F-TB1 noemt ook grondverkenning (подразделения наземной разведки); dat zijn verkenningseenheden, geen grondsensoren, dus het fragment krijgt hier geen tweede label. Vraag de zaal waar een fragment met twee sensoren zou landen: twee labels, niet één vaag label. (6) Slotkaart (de dierenboom verdwijnt, de TB-tak blijft staan): de MDTDF-definities van de vier niveaus, letterlijk in het Engels uit StratBase/MDTDF.md (Jun 4, 2025, Enhanced Edition, sha256 f0e7fadd…788bc04c; kopie voor deelnemers in prompts/MDTDF_2025-06-04_enhanced.md). Wijs op ‘classified along all dimensions’: dat is de volgende slide. Deze voorbeelden tonen een paar HCSS-dimensies; moedig groepen in Ronde 1 aan ook andere dimensies te zoeken. De volledige HCSS-taxonomieën komen pas op tx-llmtax, na Ronde 1 en 2." data-sec="frame" data-sid="tx-tree" data-t="De anatomie van een boom"><h2>De anatomie van een boom</h2><p class="sub">Eén relatie, nevencategorieën die nooit overlappen, vier niveaus van dimensie tot label.</p><div class="ob-pic"><div class="ob-step txt-early" data-frag="1"><svg aria-label="Wortelknoop: Dier" class="txt-svg" preserveaspectratio="xMidYMid meet" viewbox="0 0 1600 700"><text class="txt-cap" x="0" y="24">GENERIEK VOORBEELD: DIEREN</text><rect class="txt-node txt-root" height="56" rx="7" width="200" x="240.0" y="50"></rect><text class="txt-t txt-tb" text-anchor="middle" x="340" y="86.0">Dier</text><text class="txt-side" x="460" y="86">wortel</text></svg><div class="ob-note" style="--x:50%;--y:8%;--w:46%"><div class="k">De wortel: één breedste categorie</div><div class="d">Elke boom begint bij één categorie die alles daaronder omvat. Hier is de wortel Dier; in jouw taxonomie is het je thema.</div></div></div><div class="ob-step txt-early" data-frag="1"><svg aria-label="IS-EEN-keten: Hond is een Zoogdier is een Dier; een zoogdier is warmbloedig en de hond erft dat" class="txt-svg" preserveaspectratio="xMidYMid meet" viewbox="0 0 1600 700"><rect class="txt-node" height="56" rx="7" width="200" x="240.0" y="190"></rect><text class="txt-t" text-anchor="middle" x="340" y="226.0">Zoogdier</text><path class="txt-edge" d="M340 190 L340 106"></path><path class="txt-head" d="M332 120 L340 106 L348 120 Z"></path><text class="txt-isa" x="352.0" y="154.0">IS-EEN</text><rect class="txt-node" height="56" rx="7" width="160" x="170.0" y="330"></rect><text class="txt-t" text-anchor="middle" x="250" y="366.0">Hond</text><path class="txt-edge" d="M250 330 L320 246"></path><path class="txt-head" d="M312 260 L320 246 L328 260 Z"></path><text class="txt-isa" x="297.0" y="294.0">IS-EEN</text><path class="txt-edge txt-dash" d="M552 284 L425 244"></path><rect class="txt-prop" height="40" rx="20" width="176" x="550" y="270"></rect><text class="txt-pt" text-anchor="middle" x="638" y="298">warmbloedig</text><rect class="txt-prop txt-inh" height="40" rx="20" width="122" x="40" y="338"></rect><text class="txt-pt txt-pti" text-anchor="middle" x="101" y="366">geërfd</text></svg><div class="ob-note" style="--x:50%;--y:8%;--w:46%"><div class="k">IS‑EEN: de enige relatie in een boom</div><div class="d">Een Hond IS‑EEN Zoogdier, en een Zoogdier IS‑EEN Dier. Elke eigenschap van de ouder geldt ook voor het kind: zoogdieren zijn warmbloedig, dus honden ook. Past een nieuw begrip niet in een IS‑EEN‑keten, dan hoort het niet in deze boom.</div></div></div><div class="ob-step txt-early" data-frag="1"><svg aria-label="Nevencategorieën die elkaar uitsluiten: Vogel en Reptiel naast Zoogdier, Kat naast Hond" class="txt-svg" preserveaspectratio="xMidYMid meet" viewbox="0 0 1600 700"><rect class="txt-node" height="56" rx="7" width="170" x="10.0" y="190"></rect><text class="txt-t" text-anchor="middle" x="95" y="226.0">Vogel</text><path class="txt-edge" d="M95 190 L300 106"></path><path class="txt-head" d="M292 120 L300 106 L308 120 Z"></path><rect class="txt-node" height="56" rx="7" width="170" x="540.0" y="190"></rect><text class="txt-t" text-anchor="middle" x="625" y="226.0">Reptiel</text><path class="txt-edge" d="M625 190 L380 106"></path><path class="txt-head" d="M372 120 L380 106 L388 120 Z"></path><rect class="txt-node" height="56" rx="7" width="160" x="360.0" y="330"></rect><text class="txt-t" text-anchor="middle" x="440" y="366.0">Kat</text><path class="txt-edge" d="M440 330 L360 246"></path><path class="txt-head" d="M352 260 L360 246 L368 260 Z"></path><rect class="txt-excl" fill="none" height="80" rx="12" width="718" x="2" y="178"></rect><rect class="txt-excl" fill="none" height="80" rx="12" width="370" x="160" y="318"></rect></svg><div class="ob-note" style="--x:50%;--y:8%;--w:46%"><div class="k">Nevencategorieën sluiten elkaar uit</div><div class="d">Op elk niveau hoort een item bij precies één categorie: een dier is een vogel, een zoogdier of een reptiel, niet twee tegelijk. Kun je niet beslissen waar iets hoort, dan zit de fout in de taxonomie, niet in het ding.</div></div></div><div class="ob-step" data-frag="1"><svg aria-label="Thema Transparent Battlefield: een echte tak van de HCSS-taxonomie, Transparantiefactor, Sensorsystemen, Luchtverkenning, Tactische UAV’s of FPV-drones, met het fragment uit tb_1000 dat dat label krijgt" class="txt-svg" preserveaspectratio="xMidYMid meet" viewbox="0 0 1600 700"><text class="txt-cap" x="1205" y="30">THEMA: TRANSPARENT BATTLEFIELD</text><text class="txt-lq" x="1205" y="64">„Hoe beïnvloedt vergroot situationeel</text><text class="txt-lq" x="1205" y="90">bewustzijn de moderne oorlogsvoering?”</text><text class="txt-cnt" x="1205" y="132">HCSS-taxonomie (CLAS 2025):</text><text class="txt-cnt" x="1205" y="158">6 HLTP · 17 · 40 · 107 taxa</text><text class="txt-side2" x="1205" y="186">originele labels Engels, klein eronder</text><text class="txt-lev" x="790" y="40">HLTP (dimensie)</text><rect class="txt-node txt-hltp" height="62" rx="7" width="380" x="790" y="48"></rect><text class="txt-t txt-og txt-tb" text-anchor="middle" x="980" y="76">Transparantiefactor</text><text class="txt-en txt-oge" text-anchor="middle" x="980" y="100">Transparency Driver</text><path class="txt-edge" d="M980 110 V148"></path><text class="txt-lev" x="790" y="140">2e niveau</text><rect class="txt-node txt-cn" height="62" rx="7" width="380" x="790" y="148"></rect><text class="txt-t" text-anchor="middle" x="980" y="176">Sensorsystemen</text><text class="txt-en" text-anchor="middle" x="980" y="200">Sensor Systems</text><path class="txt-edge" d="M980 210 V248"></path><text class="txt-lev" x="790" y="240">3e niveau</text><rect class="txt-node txt-cn" height="62" rx="7" width="380" x="790" y="248"></rect><text class="txt-t" text-anchor="middle" x="980" y="276">Luchtverkenning</text><text class="txt-en" text-anchor="middle" x="980" y="300">Aerial ISR</text><path class="txt-edge" d="M1170 279 H1195"></path><path class="txt-head2" d="M1191 271 L1205 279 L1191 287 Z"></path><text class="txt-lev" x="1205" y="240">Taxon (het label)</text><rect class="txt-node txt-tax" height="62" rx="7" width="390" x="1205" y="248"></rect><text class="txt-t txt-tb" text-anchor="middle" x="1400" y="276">Tactische UAV’s / FPV-drones</text><text class="txt-en" text-anchor="middle" x="1400" y="300">Tactical UAVs / FPV drones</text><path class="txt-edge txt-dash" d="M1400 344 V310"></path><path class="txt-head2" d="M1392 324 L1400 310 L1408 324 Z"></path><rect class="txt-doc" height="346" rx="7" width="390" x="1205" y="344"></rect><path class="txt-fold" d="M1567 344 V368 H1595"></path><text class="txt-dh" x="1222" y="374">tb_1000 · fragment 1251980</text><text class="txt-dh" x="1222" y="400">Telegram „Репортёр Руденко V”</text><text class="txt-dh" x="1222" y="426">30 januari 2026</text><text class="txt-ru" x="1222" y="464">«…подтверждены операторами</text><text class="txt-ru" x="1222" y="490">войск беспилотных систем. …</text><text class="txt-ru" x="1222" y="516">в режиме реального времени</text><text class="txt-ru" x="1222" y="542">операторами БПЛА»</text><text class="txt-dq" x="1222" y="584">„…bevestigd door operators van</text><text class="txt-dq" x="1222" y="610">de onbemande systemen … in</text><text class="txt-dq" x="1222" y="636">realtime door de drone-operators.”</text><text class="txt-dn" x="1222" y="672">Nederlandse vertaling: Claude</text></svg><div class="ob-note" style="--x:0%;--y:60%;--w:46%"><div class="k">Vier niveaus, op een echte HCSS-tak</div><div class="d">MDTDF bouwt elke taxonomie in vier niveaus. Bovenaan staat een HLTP: één dimensie, of lens, op het thema. Rechts één tak uit de HCSS-taxonomie voor Transparent Battlefield, tot het taxon dat een echt fragment uit tb_1000 zou krijgen.</div></div></div><div class="ob-step" data-frag="1"><svg aria-label="De vier nevencategorieën op het 3e niveau onder Sensorsystemen: Luchtverkenning, Ruimteverkenning, Grondsensoren, Signaalinlichting" class="txt-svg" preserveaspectratio="xMidYMid meet" viewbox="0 0 1600 700"><path class="txt-edge" d="M790 179 H770 V491 M770 351 H790 M770 421 H790 M770 491 H790"></path><circle class="txt-jn" cx="770" cy="351" r="5"></circle><circle class="txt-jn" cx="770" cy="421" r="5"></circle><circle class="txt-jn" cx="770" cy="491" r="5"></circle><rect class="txt-node" height="62" rx="7" width="380" x="790" y="320"></rect><text class="txt-t" text-anchor="middle" x="980" y="348">Ruimteverkenning</text><text class="txt-en" text-anchor="middle" x="980" y="372">Space-based ISR</text><rect class="txt-node" height="62" rx="7" width="380" x="790" y="390"></rect><text class="txt-t" text-anchor="middle" x="980" y="418">Grondsensoren</text><text class="txt-en" text-anchor="middle" x="980" y="442">Ground-based sensors</text><rect class="txt-node" height="62" rx="7" width="380" x="790" y="460"></rect><text class="txt-t" text-anchor="middle" x="980" y="488">Signaalinlichting</text><text class="txt-en" text-anchor="middle" x="980" y="512">Signals intelligence</text><rect class="txt-excl" fill="none" height="318" rx="12" width="430" x="756" y="216"></rect><text class="txt-lev" x="790" y="566">nevencategorieën: één sensor,</text><text class="txt-lev" x="790" y="592">precies één vak</text></svg><div class="ob-note" style="--x:0%;--y:60%;--w:46%"><div class="k">Weer nevencategorieën, nu in jullie thema</div><div class="d">Onder Sensorsystemen staan op het 3e niveau vier vakken die elkaar uitsluiten: een sensor zit in de lucht, in de ruimte, op de grond of luistert signalen af, nooit twee tegelijk. Noemt een fragment twee sensoren, dan krijgt het twee labels, geen vaag middenlabel.</div></div></div><div class="ob-step txt-s6" data-frag="1"><div class="ob-note txt-def" style="--x:0%;--y:0%;--w:46.5%"><div class="k">Zo definieert MDTDF de vier niveaus</div><div class="d">Letterlijk uit <i>MDTDF.md</i>, het recept dat jullie straks draaien.<ul class="txt-dl"><li><b>HLTP (dimensie)</b><span class="txt-q">“Fundamental, independent dimensions or "lenses" for analyzing the domain”</span></li><li><b>2e niveau</b><span class="txt-q">“Major divisions within each HLTP”</span></li><li><b>3e niveau</b><span class="txt-q">“Specific operational areas within each second-level element”</span></li><li><b>Taxon</b><span class="txt-q">“Concrete instances or activities that can be classified along all dimensions”</span></li></ul>Een taxon moet dus langs <b>alle</b> dimensies te plaatsen zijn: de volgende slide.</div></div></div></div><img class="aira-logo" src="img/aira/hcss-logo/hcss-logo.jpg" alt="HCSS"></section>
<section class="slide obuild txl" data-audience="all" data-n="[3 min] EÉN FRAGMENT, ZES LENZEN. Het MDTDF-idee: een fragment wordt langs ALLE onafhankelijke dimensies (HLTP’s) geclassificeerd, niet in één vak gestopt. Fragment F-TB1: dataset tb_1000, chunk_id 1251980, Telegram (Kozakkenkanaal) „Репортёр Руденко V”, 30 januari 2026, is_relevant = True. Russisch ingekort met ‘…’, niet gewijzigd; Nederlandse vertaling door Claude. Het fragment gaat over transparantie en gebruikt het woord nergens (zie tx-why: in tb_1000 noemen maar 11 van de 700 relevante fragmenten прозрачн*/транспарент*). De zes HLTP’s zijn die van de HCSS-taxonomie Transparent Battlefield (CLAS 2025; 6 HLTP, 17, 40, 107 taxa; generatieprompt aantoonbaar MDTDF). Originele labels zijn Engels, de slide toont een Nederlandse weergave met het Engels klein. De codering is ILLUSTRATIEF, gemaakt door Claude (Opus 5.5) voor dit deck: geen gouden standaard, geen pipeline-uitvoer; dat staat ook op de slide. Paden: Transparency Driver &gt; Sensor Systems &gt; Aerial ISR &gt; Tactical UAVs / FPV drones; Battlefield Effect &gt; Tactical effects &gt; Survivability degradation &gt; Concealment/camouflage failure EN Engagement dynamics &gt; Compressed kill chains; Warfare Domain &gt; Physical domains &gt; Land &gt; Mechanized / armored operations; Adaptation Type &gt; Organizational adaptation &gt; C2 reform &gt; Inter-service integration (betwistbaar: tanks gevoed door drone-operators, je kunt ook ‘geen aanpassing zichtbaar’ verdedigen); Temporal-Geographic Scope &gt; Ukraine conflict &gt; Theater-specific &gt; Specific front or axis (troepengroep ‘Centrum’); Discourse Type &gt; Analytical &gt; Descriptive &gt; Situation assessment. Opbouw: fragment, dan één lens per klik; de bijbehorende woorden lichten goud op in het fragment. Slotkaart (op de plek van het fragment; de zes kaarten blijven staan): zes onafhankelijke antwoorden; het MDTDF-voorbeeld (Example of Dimensional Analysis: community policing patrol, zeven HLTP’s: Temporal Dimension, Geographical Scope, Power Application, Stakeholder Interaction, Process Flow, Knowledge Dimension, Operational Level); en de eerlijke kanttekening dat Effect twee taxa krijgt. Vraag de zaal: mag dat? Antwoord: ja, als je het vóór het annoteren in het codeboek vastlegt (het script van vanmiddag moet dan een lijst per dimensie accepteren). Deze voorbeelden tonen een paar HCSS-dimensies; moedig groepen in Ronde 1 aan ook andere dimensies te zoeken (de volledige HCSS-lijsten komen pas op tx-llmtax)." data-sec="frame" data-sid="tx-lenses" data-t="Eén fragment, zes lenzen"><h2>Eén fragment, zes lenzen</h2><p class="sub">Transparent Battlefield: één bericht uit tb_1000, gecodeerd op alle zes dimensies van de HCSS-taxonomie.</p><div class="ob-pic"><div class="ob-step txl-s0" data-frag="1"><svg aria-label="Thema Transparent Battlefield: fragment 1251980 uit tb_1000 in het midden" class="txl-svg" preserveaspectratio="xMidYMid meet" viewbox="0 0 1600 700"><rect class="txl-hub" height="404" rx="8" width="520" x="540" y="6"></rect><rect class="txl-hubbar" height="6" rx="3" width="520" x="540" y="6"></rect><text class="txl-cap" x="558" y="40">THEMA: TRANSPARENT BATTLEFIELD</text><text class="txl-meta" x="558" y="68">tb_1000 · fragment 1251980 · 30 januari 2026</text><text class="txl-ru" x="558" y="102"><tspan class="txl-e3">«Экипажи танков Т-72Б3М</tspan> … <tspan class="txl-e5">группировки</tspan></text><text class="txl-ru" x="558" y="124"><tspan class="txl-e5">войск «Центр»</tspan> <tspan class="txl-e6">уничтожили</tspan> <tspan class="txl-e2">замаскированный</tspan></text><text class="txl-ru" x="558" y="146"><tspan class="txl-e2">опорный пункт</tspan> формирований ВСУ … получены</text><text class="txl-ru" x="558" y="168"><tspan class="txl-e4">от подразделений наземной разведки</tspan> и</text><text class="txl-ru" x="558" y="190"><tspan class="txl-e1 txl-e4">подтверждены операторами войск</tspan></text><text class="txl-ru" x="558" y="212"><tspan class="txl-e1 txl-e4">беспилотных систем</tspan>. … <tspan class="txl-e2">в режиме реального</tspan></text><text class="txl-ru" x="558" y="234"><tspan class="txl-e2">времени</tspan> <tspan class="txl-e1">операторами БПЛА</tspan>.»</text><text class="txl-nl" x="558" y="266">„<tspan class="txl-e3">Tankbemanningen (T-72B3M)</tspan> … van <tspan class="txl-e5">troepengroep</tspan></text><text class="txl-nl" x="558" y="288"><tspan class="txl-e5">‘Centrum’</tspan> <tspan class="txl-e6">vernietigden</tspan> een <tspan class="txl-e2">gecamoufleerd steunpunt</tspan></text><text class="txl-nl" x="558" y="310">van de Oekraïense strijdkrachten … De coördinaten</text><text class="txl-nl" x="558" y="332">kwamen van <tspan class="txl-e4">grondverkenningseenheden</tspan> en werden</text><text class="txl-nl" x="558" y="354">bevestigd door <tspan class="txl-e1 txl-e4">operators van de onbemande</tspan></text><text class="txl-nl" x="558" y="376"><tspan class="txl-e1 txl-e4">systemen</tspan>. … <tspan class="txl-e2">in realtime</tspan> door de <tspan class="txl-e1">drone-operators</tspan>.”</text><text class="txl-tr" text-anchor="end" x="1044" y="402">vertaling: Claude</text><text class="txl-tr" text-anchor="end" x="1044" y="40">Telegram</text></svg><div class="ob-note" style="--x:34.2%;--y:65%;--w:31.6%"><div class="k">Eén echt fragment, zes lenzen</div><div class="d">Een Telegram-bericht over een tankaanval, uit de dataset van de groep Transparent Battlefield. Klik voor klik leggen we het langs alle zes HLTP’s van de HCSS-taxonomie.</div></div></div><div class="ob-step txl-s1" data-frag="1"><svg aria-label="Lens 1: Transparantiefactor" class="txl-svg" preserveaspectratio="xMidYMid meet" viewbox="0 0 1600 700"><text class="txl-ill" text-anchor="middle" x="800" y="438">illustratieve codering (Claude), geen gouden standaard</text><path class="txl-spoke" d="M540 95 C505 95 505 95 470 95"></path><circle class="txl-dot" cx="540" cy="95" r="6"></circle><rect class="txl-card" height="190" rx="7"
