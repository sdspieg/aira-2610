 width="470" x="0" y="0"></rect><rect class="txl-cbar" height="190" width="4" x="466" y="0"></rect><circle class="txl-badge" cx="34" cy="38" r="21"></circle><text class="txl-bn" text-anchor="middle" x="34" y="46">1</text><text class="txl-hl" x="66" y="36">Transparantiefactor</text><text class="txl-hen" x="66" y="61">Transparency Driver</text><text class="txl-tag" x="18" y="94">2e</text><text class="txl-d" x="82" y="94">Sensorsystemen<tspan class="txl-en" dx="12">Sensor Systems</tspan></text><text class="txl-tag" x="18" y="118">3e</text><text class="txl-d" x="82" y="118">Luchtverkenning<tspan class="txl-en" dx="12">Aerial ISR</tspan></text><text class="txl-tag txl-tagx" x="18" y="142">taxon</text><text class="txl-dx" x="82" y="142">Tactische UAV’s / FPV-drones</text><text class="txl-en" x="82" y="165">Tactical UAVs / FPV drones</text></svg><div class="ob-note" style="--x:34.2%;--y:65%;--w:31.6%"><div class="k">Transparantiefactor</div><div class="d">Wat maakt het slagveld hier doorzichtig? Drone-operators bevestigen het doel en sturen het vuur in realtime: een tactische UAV.</div></div></div><div class="ob-step txl-s2" data-frag="1"><svg aria-label="Lens 2: Effect op het slagveld" class="txl-svg" preserveaspectratio="xMidYMid meet" viewbox="0 0 1600 700"><path class="txl-spoke" d="M1060 143 C1095 143 1095 143 1130 143"></path><circle class="txl-dot" cx="1060" cy="143" r="6"></circle><rect class="txl-card" height="286" rx="7" width="470" x="1130" y="0"></rect><rect class="txl-cbar" height="286" width="4" x="1130" y="0"></rect><circle class="txl-badge" cx="1164" cy="38" r="21"></circle><text class="txl-bn" text-anchor="middle" x="1164" y="46">2</text><text class="txl-hl" x="1196" y="36">Effect op het slagveld</text><text class="txl-hen" x="1196" y="61">Battlefield Effect</text><text class="txl-tag" x="1148" y="94">2e</text><text class="txl-d" x="1212" y="94">Tactische effecten<tspan class="txl-en" dx="12">Tactical effects</tspan></text><text class="txl-tag" x="1148" y="118">3e</text><text class="txl-d" x="1212" y="118">Aantasting overlevingsvermogen</text><text class="txl-en" x="1212" y="141">Survivability degradation</text><text class="txl-tag txl-tagx" x="1148" y="166">taxon</text><text class="txl-dx" x="1212" y="166">Falende camouflage</text><text class="txl-en" x="1212" y="189">Concealment/camouflage failure</text><text class="txl-tag" x="1148" y="214">3e</text><text class="txl-d" x="1212" y="214">Gevechtsdynamiek<tspan class="txl-en" dx="12">Engagement dynamics</tspan></text><text class="txl-tag txl-tagx" x="1148" y="238">taxon</text><text class="txl-dx" x="1212" y="238">Kortere kill chains</text><text class="txl-en" x="1212" y="261">Compressed kill chains</text></svg><div class="ob-note" style="--x:34.2%;--y:65%;--w:31.6%"><div class="k">Effect: twee taxa tegelijk</div><div class="d">Een gecamoufleerd steunpunt wordt toch gevonden: falende camouflage. Realtime vuurcorrectie wijst ook op een kortere kill chain. Beide passen hier.</div></div></div><div class="ob-step txl-s3" data-frag="1"><svg aria-label="Lens 3: Domein" class="txl-svg" preserveaspectratio="xMidYMid meet" viewbox="0 0 1600 700"><path class="txl-spoke" d="M1060 356 C1095 356 1095 393 1130 393"></path><circle class="txl-dot" cx="1060" cy="356" r="6"></circle><rect class="txl-card" height="190" rx="7" width="470" x="1130" y="298"></rect><rect class="txl-cbar" height="190" width="4" x="1130" y="298"></rect><circle class="txl-badge" cx="1164" cy="336" r="21"></circle><text class="txl-bn" text-anchor="middle" x="1164" y="344">3</text><text class="txl-hl" x="1196" y="334">Domein</text><text class="txl-hen" x="1196" y="359">Warfare Domain</text><text class="txl-tag" x="1148" y="392">2e</text><text class="txl-d" x="1212" y="392">Fysieke domeinen<tspan class="txl-en" dx="12">Physical domains</tspan></text><text class="txl-tag" x="1148" y="416">3e</text><text class="txl-d" x="1212" y="416">Land<tspan class="txl-en" dx="12">Land</tspan></text><text class="txl-tag txl-tagx" x="1148" y="440">taxon</text><text class="txl-dx" x="1212" y="440">Gemechaniseerd / pantser</text><text class="txl-en" x="1212" y="463">Mechanized / armored operations</text></svg><div class="ob-note" style="--x:34.2%;--y:65%;--w:31.6%"><div class="k">Domein</div><div class="d">Tanks vuren op een steunpunt: dit is landoorlog, gemechaniseerd. Het domein zegt niets over de sensor of het effect.</div></div></div><div class="ob-step txl-s4" data-frag="1"><svg aria-label="Lens 4: Type aanpassing" class="txl-svg" preserveaspectratio="xMidYMid meet" viewbox="0 0 1600 700"><path class="txl-spoke" d="M540 309 C505 309 505 309 470 309"></path><circle class="txl-dot" cx="540" cy="309" r="6"></circle><rect class="txl-card" height="214" rx="7" width="470" x="0" y="202"></rect><rect class="txl-cbar" height="214" width="4" x="466" y="202"></rect><circle class="txl-badge" cx="34" cy="240" r="21"></circle><text class="txl-bn" text-anchor="middle" x="34" y="248">4</text><text class="txl-hl" x="66" y="238">Type aanpassing</text><text class="txl-hen" x="66" y="263">Adaptation Type</text><text class="txl-tag" x="18" y="296">2e</text><text class="txl-d" x="82" y="296">Organisatorische aanpassing</text><text class="txl-en" x="82" y="319">Organizational adaptation</text><text class="txl-tag" x="18" y="344">3e</text><text class="txl-d" x="82" y="344">C2-hervorming<tspan class="txl-en" dx="12">C2 reform</tspan></text><text class="txl-tag txl-tagx" x="18" y="368">taxon</text><text class="txl-dx" x="82" y="368">Integratie tussen krijgsmachtdelen</text><text class="txl-en" x="82" y="391">Inter-service integration</text></svg><div class="ob-note" style="--x:34.2%;--y:65%;--w:31.6%"><div class="k">Type aanpassing (betwistbaar)</div><div class="d">Grondverkenning en drone-operators voeden samen een tankbemanning. Je kunt dat lezen als integratie tussen krijgsmachtdelen, of als: geen aanpassing zichtbaar.</div></div></div><div class="ob-step txl-s5" data-frag="1"><svg aria-label="Lens 5: Reikwijdte in tijd en ruimte" class="txl-svg" preserveaspectratio="xMidYMid meet" viewbox="0 0 1600 700"><path class="txl-spoke" d="M540 356 C505 356 505 535 470 535"></path><circle class="txl-dot" cx="540" cy="356" r="6"></circle><rect class="txl-card" height="214" rx="7" width="470" x="0" y="428"></rect><rect class="txl-cbar" height="214" width="4" x="466" y="428"></rect><circle class="txl-badge" cx="34" cy="466" r="21"></circle><text class="txl-bn" text-anchor="middle" x="34" y="474">5</text><text class="txl-hl" x="66" y="464">Reikwijdte in tijd en ruimte</text><text class="txl-hen" x="66" y="489">Temporal-Geographic Scope</text><text class="txl-tag" x="18" y="522">2e</text><text class="txl-d" x="82" y="522">Oorlog in Oekraïne<tspan class="txl-en" dx="12">Ukraine conflict</tspan></text><text class="txl-tag" x="18" y="546">3e</text><text class="txl-d" x="82" y="546">Specifiek strijdtoneel</text><text class="txl-en" x="82" y="569">Theater-specific</text><text class="txl-tag txl-tagx" x="18" y="594">taxon</text><text class="txl-dx" x="82" y="594">Specifiek front of as</text><text class="txl-en" x="82" y="617">Specific front or axis</text></svg><div class="ob-note" style="--x:34.2%;--y:65%;--w:31.6%"><div class="k">Reikwijdte in tijd en ruimte</div><div class="d">Troepengroep ‘Centrum’ plaatst het fragment op een specifiek front in de huidige oorlog, niet bij een algemene beschouwing.</div></div></div><div class="ob-step txl-s6" data-frag="1"><svg aria-label="Lens 6: Type betoog" class="txl-svg" preserveaspectratio="xMidYMid meet" viewbox="0 0 1600 700"><path class="txl-spoke" d="M1060 356 C1095 356 1095 595 1130 595"></path><circle class="txl-dot" cx="1060" cy="356" r="6"></circle><rect class="txl-card" height="190" rx="7" width="470" x="1130" y="500"></rect><rect class="txl-cbar" height="190" width="4" x="1130" y="500"></rect><circle class="txl-badge" cx="1164" cy="538" r="21"></circle><text class="txl-bn" text-anchor="middle" x="1164" y="546">6</text><text class="txl-hl" x="1196" y="536">Type betoog</text><text class="txl-hen" x="1196" y="561">Discourse Type</text><text class="txl-tag" x="1148" y="594">2e</text><text class="txl-d" x="1212" y="594">Analytisch<tspan class="txl-en" dx="12">Analytical</tspan></text><text class="txl-tag" x="1148" y="618">3e</text><text class="txl-d" x="1212" y="618">Beschrijvend<tspan class="txl-en" dx="12">Descriptive</tspan></text><text class="txl-tag txl-tagx" x="1148" y="642">taxon</text><text class="txl-dx" x="1212" y="642">Situatiebeoordeling</text><text class="txl-en" x="1212" y="665">Situation assessment</text></svg><div class="ob-note" style="--x:34.2%;--y:65%;--w:31.6%"><div class="k">Type betoog</div><div class="d">Een kaal gevechtsbericht: wat er gebeurde, zonder oordeel of advies. Dat is een situatiebeoordeling, geen analyse of aanbeveling.</div></div></div><div class="ob-step txl-s7" data-frag="1"><div class="ob-note txl-close" style="--x:34.2%;--y:0%;--w:31.6%"><div class="k">Eén fragment, zes onafhankelijke antwoorden</div><div class="d">Op onderwerp is dit bericht gewoon ‘drones’. Door zes lenzen krijg je zes antwoorden, links en rechts, en geen ervan volgt uit een ander.<p class="txl-mq">MDTDF doet hetzelfde: <span class="txl-q">“consider a community policing patrol analyzed through multiple HLTPs”</span>: zeven lenzen.</p><p class="txl-mq"><b>Beslis vóór het annoteren:</b> mag een dimensie meer dan één label krijgen? Bij Effect passen er hier twee. Leg het vast, anders tellen annotatoren verschillend.</p></div></div></div></div><img class="aira-logo" src="img/aira/hcss-logo/hcss-logo.jpg" alt="HCSS"></section>
<section class="slide obuild txo" data-audience="all" data-n="[3 min] DE ORTHOGONALITEITSTEST. Zin uit april (Nidas): ‘Kan iets hoog scoren op A en laag op B? Zo niet, dan zijn het dezelfde dimensie in een ander jasje: samenvoegen of herdefiniëren.’ Thema Effective Deterrence. X = Deterrence Mechanism (by Denial vs by Punishment), Y = Capability Domain (Conventional Military vs Nuclear Forces), twee HLTP’s uit de HCSS-taxonomie Effective Deterrence (CLAS 2025; 14 HLTP, 40 2e-niveau, 102 3e-niveau; welke prompt die taxonomie genereerde is NIET geverifieerd, wel de MDTDF-structuur). Fragmenten (allemaal Telegram, is_relevant = True, Russisch ingekort met ‘…’, niet gewijzigd; Nederlandse vertaling door Claude; plaatsing in de hoeken is een illustratieve codering door Claude, geen gouden standaard): F-DET1 rechtsboven = deterrence_1000, chunk_id 27691, kanaal „Елена Панина” (experts), 16 juli 2025: Peskov over de nucleaire doctrine; hetzelfde bericht citeert punt 11 (agressie door een niet-nucleaire staat met steun van een nucleaire staat geldt als gezamenlijke aanval). Twijfel bij het 3e niveau: strategisch of niet-strategisch nucleair? De tekst zegt het niet. F-DET2 linksonder = deterrence_1000, chunk_id 31732, „Первый казачий”, 10 oktober 2025 (lijst met uitspraken van Poetin). F-DET3 rechtsonder = deterrence_1000, chunk_id 45000, „Шейх Тамир”, 5 september 2025 (Poetin over westerse troepen in Oekraïne). Lege hoek ontzegging x nucleair: niet gevonden in een gerichte zoektocht in deterrence_1000 (relevante fragmenten korter dan 1.200 tekens, zoektermen противоракетн / ПРО). Leer: een lege hoek is geen bewijs van afhankelijkheid maar een opdracht; zoek gericht (10.000-set: 7.287 rijen, andere bronnen) voordat je samenvoegt. Let ook op de richting: de HCSS-taxonomie is gebouwd rond NAVO die Rusland afschrikt (gezien vanuit Moskou); hier schrikt Rusland het Westen af. De domeindefinitie moet die richting vastleggen. Stap 6, thema Grey-Zone Warfare: Conflict Phase Positioning (Steady-State Competition, Crisis Intensification, Conflict Support) tegenover Threshold Calibration (Well Below Threshold, Approaching Threshold, At Threshold), uit de HCSS-taxonomie Grey-Zone Conflict (13 HLTP, 48, 116). KANDIDAAT-overlap, NIET gemeten; zeg dat expliciet. Andere kandidaten (ook niet gemeten): Deterrence Temporal Context vs Escalation Dynamics; Credibility Components vs Russian Perception. Slotkaart (het raster verdwijnt): MDTDF.md, Testing for Independence (drie criteria letterlijk) en de vijf Validation Criteria: Independence, Universality, Fundamentality, Distinctiveness, Utility. Deze voorbeelden tonen een paar HCSS-dimensies; moedig groepen in Ronde 1 aan ook andere dimensies te zoeken." data-sec="frame" data-sid="tx-ortho" data-t="De orthogonaliteitstest"><h2>De orthogonaliteitstest</h2><p class="sub">Houd twee dimensies alleen als elke combinatie ervan in echte fragmenten voorkomt.</p><div class="ob-pic"><div class="ob-step txo-early" data-frag="1"><svg aria-label="Lege twee-bij-twee, thema Effective Deterrence: afschrikkingsmechanisme tegenover vermogensdomein" class="txo-svg" preserveaspectratio="xMidYMid meet" viewbox="0 0 1600 700"><text class="txo-cap" x="150" y="26">THEMA: EFFECTIVE DETERRENCE · drie Telegram-fragmenten uit deterrence_1000</text><rect class="txo-plot" height="560" rx="6" width="840" x="150" y="44"></rect><path class="txo-mid" d="M570 44 V604 M150 324 H990"></path><path class="txo-ax" d="M150 622 H990"></path><path class="txo-hd" d="M988 614 L1004 622 L988 630 Z"></path><path class="txo-hd" d="M152 614 L136 622 L152 630 Z"></path><text class="txo-axl" x="150" y="652">ontzegging</text><text class="txo-axl" text-anchor="end" x="990" y="652">bestraffing</text><text class="txo-axt" text-anchor="middle" x="570" y="688">X · Afschrikkingsmechanisme<tspan class="txo-axe" dx="10">(Deterrence Mechanism)</tspan></text><path class="txo-ax" d="M128 604 V44"></path><path class="txo-hd" d="M120 46 L128 30 L136 46 Z"></path><path class="txo-hd" d="M120 602 L128 618 L136 602 Z"></path><text class="txo-axt" text-anchor="middle" transform="translate(62 324) rotate(-90)">Y · Vermogensdomein<tspan class="txo-axe" dx="10">(Capability Domain)</tspan></text><text class="txo-axl" text-anchor="start" transform="translate(100 604) rotate(-90)">conventioneel</text><text class="txo-axl" text-anchor="end" transform="translate(100 44) rotate(-90)">nucleair</text></svg><div class="ob-note" style="--x:63.5%;--y:4%;--w:36%"><div class="k">Kan iets hoog scoren op A en laag op B?</div><div class="d">Neem twee kandidaat-dimensies uit Effective Deterrence en probeer alle vier de hoeken te vullen met echte fragmenten. Blijft een hoek leeg, dan zijn het misschien dezelfde dimensie in een ander jasje.</div></div></div><div class="ob-step txo-early" data-frag="1"><svg aria-label="Rechtsboven, bestraffing en nucleair: Peskov over de nucleaire doctrine" class="txo-svg" preserveaspectratio="xMidYMid meet" viewbox="0 0 1600 700"><rect class="txo-q" height="264" rx="6" width="404" x="578" y="52"></rect><text class="txo-qh" x="594" y="82">fragment 27691 · 16 juli 2025</text><text class="txo-qs" x="594" y="106">„Елена Панина” (Peskov)</text><text class="txo-ru" x="594" y="140">«Ядерная доктрина же действует.</text><text class="txo-ru" x="594" y="162">Соответственно, все её положения</text><text class="txo-ru" x="594" y="184">[тоже] действуют»</text><text class="txo-qt" x="594" y="216">„De nucleaire doctrine is van kracht.</text><text class="txo-qt" x="594" y="239">Dus gelden ook al haar bepalingen.”</text></svg><div class="ob-note" style="--x:63.5%;--y:4%;--w:36%"><div class="k">Bestraffing × nucleair</div><div class="d">Peskov wijst op de nucleaire doctrine, die agressie met steun van een kernmacht als gezamenlijke aanval behandelt. Dreigen met nucleaire vergelding: bestraffing, in het nucleaire domein.</div></div></div><div class="ob-step txo-early" data-frag="1"><svg aria-label="Linksonder, ontzegging en conventioneel: Poetin over Tomahawks en luchtverdediging" class="txo-svg" preserveaspectratio="xMidYMid meet" viewbox="0 0 1600 700"><rect class="txo-q" height="264" rx="6" width="404" x="158" y="332"></rect><text class="txo-qh" x="174" y="362">fragment 31732 · 10 oktober 2025</text><text class="txo-qs" x="174" y="386">„Первый казачий” (Poetin)</text><text class="txo-ru" x="174" y="420">«Ответом России на "Томагавки"</text><text class="txo-ru" x="174" y="442">будет усиление системы ПВО.»</text><text class="txo-qt" x="174" y="474">„Het Russische antwoord op de</text><text class="txo-qt" x="174" y="497">‘Tomahawks’ wordt een versterking</text><text class="txo-qt" x="174" y="520">van de luchtverdediging.”</text></svg><div class="ob-note" style="--x:63.5%;--y:4%;--w:36%"><div class="k">Ontzegging × conventioneel</div><div class="d">Geen dreiging met vergelding, maar de aanval laten mislukken: een sterkere luchtverdediging tegen Tomahawks. Dat is ontzegging, met conventionele middelen.</div></div></div><div class="ob-step txo-early" data-frag="1"><svg aria-label="Rechtsonder, bestraffing en conventioneel: Poetin over westerse troepen in Oekraine" class="txo-svg" preserveaspectratio="xMidYMid meet" viewbox="0 0 1600 700"><rect class="txo-q" height="264" rx="6" width="404" x="578" y="332"></rect><text class="txo-qh" x="594" y="362">fragment 45000 · 5 september 2025</text><text class="txo-qs" x="594" y="386">„Шейх Тамир” (Poetin)</text><text class="txo-ru" x="594" y="420">«Если там будут появляться какие-то</text><text class="txo-ru" x="594" y="442">войска … исходим из того, что это</text><text class="txo-ru" x="594" y="464">будут законные цели для их</text><text class="txo-ru" x="594" y="486">поражения.»</text><text class="txo-qt" x="594" y="518">„Als daar troepen verschijnen … gaan</text><text class="txo-qt" x="594" y="541">we ervan uit dat het legitieme doelen</text><text class="txo-qt" x="594" y="564">zijn om uit te schakelen.”</text></svg><div class="ob-note" style="--x:63.5%;--y:4%;--w:36%"><div class="k">Bestraffing × conventioneel</div><div class="d">Westerse troepen in Oekraïne worden ‘legitieme doelen’: een dreiging met vergelding, zonder kernwapens. Bestraffing kan dus ook conventioneel zijn, en drie hoeken zijn gevuld.</div></div></div><div class="ob-step txo-early" data-frag="1"><svg aria-label="Linksboven, ontzegging en nucleair: leeg" class="txo-svg" preserveaspectratio="xMidYMid meet" viewbox="0 0 1600 700"><rect class="txo-qe" height="264" rx="6" width="404" x="158" y="52"></rect><circle class="txo-qc" cx="510" cy="108" r="32"></circle><text class="txo-qm" text-anchor="middle" x="510" y="122">?</text><text class="txo-eh" x="174" y="92">LEEG</text><text class="txo-qs" x="174" y="120">ontzegging × nucleair</text><text class="txo-et" x="174" y="160">Niet gevonden in een gerichte</text><text class="txo-et" x="174" y="184">zoektocht in deterrence_1000</text><text class="txo-et" x="174" y="208">(zoektermen противоракетн, ПРО).</text><text class="txo-eb" x="174" y="248">Een lege hoek is een opdracht,</text><text class="txo-eb" x="174" y="272">geen bewijs.</text></svg><div class="ob-note" style="--x:63.5%;--y:4%;--w:36%"><div class="k">De vierde hoek is leeg</div><div class="d">Ontzegging in het nucleaire domein, zoals raketverdediging, vonden we niet in deterrence_1000. Zoek eerst gericht verder in de 10.000-set en in andere bronnen. Blijft de hoek dan leeg, dan zijn de twee dimensies misschien één.</div></div></div><div class="ob-step txo-early" data-frag="1"><svg aria-label="Thema Grey-Zone Warfare: kandidaat-overlap tussen Positie in conflictfase en Drempelkalibratie" class="txo-svg" preserveaspectratio="xMidYMid meet" viewbox="0 0 1600 700"><rect class="txo-gz" height="262" rx="7" width="584" x="1016" y="436"></rect><text class="txo-cap" x="1032" y="466">THEMA: GREY-ZONE WARFARE · HCSS-taxonomie</text><text class="txo-kand" x="1032" y="494">kandidaat-overlap, niet gemeten</text><text class="txo-gh" x="1032" y="526">Positie in conflictfase</text><text class="txo-ge" x="1032" y="549">Conflict Phase Positioning</text><rect class="txo-chip2" height="38" rx="19" width="268" x="1032" y="560"></rect><text class="txo-ct2" text-anchor="middle" x="1166" y="586">Concurrentie in vredestijd</text><rect class="txo-chip2" height="38" rx="19" width="268" x="1032" y="605"></rect><text class="txo-ct2" text-anchor="middle" x="1166" y="631">Crisisverheviging</text><rect class="txo-chip2" height="38" rx="19" width="268" x="1032" y="650"></rect><text class="txo-ct2" text-anchor="middle" x="1166" y="676">Steun aan een conflict</text><text class="txo-gh" x="1316" y="526">Drempelkalibratie</text><text class="txo-ge" x="1316" y="549">Threshold Calibration</text><rect class="txo-chip2" height="38" rx="19" width="268" x="1316" y="560"></rect><text class="txo-ct2" text-anchor="middle" x="1450" y="586">Ruim onder de drempel</text><rect class="txo-chip2" height="38" rx="19" width="268" x="1316" y="605"></rect><text class="txo-ct2" text-anchor="middle" x="1450" y="631">Naderen van de drempel</text><rect class="txo-chip2" height="38" rx="19" width="268" x="1316" y="650"></rect><text class="txo-ct2" text-anchor="middle" x="1450" y="676">Op de drempel</text><path class="txo-link" d="M1300 579 H1316"></path><path class="txo-link" d="M1300 624 H1316"></path><path class="txo-link" d="M1300 669 H1316"></path></svg><div class="ob-note" style="--x:63.5%;--y:4%;--w:36%"><div class="k">Faalt de test, voeg dan samen</div><div class="d">Twee HLTP’s uit de HCSS-taxonomie voor Grey-Zone Warfare. Valt elke fase steeds samen met één drempelniveau? Dan meten ze hetzelfde en voeg je ze samen. Dit is een kandidaat: niemand heeft het nog op fragmenten gemeten.</div></div></div><div class="ob-step txo-s7" data-frag="1"><svg aria-label="De vijf MDTDF-validatiecriteria, letterlijk, met Nederlandse uitleg" class="txo-svg" preserveaspectratio="xMidYMid meet" viewbox="0 0 1600 700"><rect class="txo-cr" height="322" rx="7" width="306" x="8" y="372"></rect><rect class="txo-crb" height="5" rx="2" width="306" x="8" y="372"></rect><text class="txo-cre" text-anchor="middle" x="161" y="414">Independence</text><text class="txo-crn" text-anchor="middle" x="161" y="446">onafhankelijkheid</text><text class="txo-crg" text-anchor="middle" x="161" y="478">varieert los van de rest?</text><path class="txo-crl" d="M38 506 H284"></path><text class="txo-crq" text-anchor="middle" x="161" y="548">“Does this dimension vary</text><text class="txo-crq" text-anchor="middle" x="161" y="576">independently of others?”</text><rect class="txo-cr" height="322" rx="7" width="306" x="326" y="372"></rect><rect class="txo-crb" height="5" rx="2" width="306" x="326" y="372"></rect><text class="txo-cre" text-anchor="middle" x="479" y="414">Universality</text><text class="txo-crn" text-anchor="middle" x="479" y="446">universaliteit</text><text class="txo-crg" text-anchor="middle" x="479" y="478">past op elk fragment?</text><path class="txo-crl" d="M356 506 H602"></path><text class="txo-crq" text-anchor="middle" x="479" y="548">“Can all domain instances</text><text class="txo-crq" text-anchor="middle" x="479" y="576">be classified along this</text><text class="txo-crq" text-anchor="middle" x="479" y="604">dimension?”</text><rect class="txo-cr" height="322" rx="7" width="306" x="644" y="372"></rect><rect class="txo-crb" height="5" rx="2" width="306" x="644" y="372"></rect><text class="txo-cre" text-anchor="middle" x="797" y="414">Fundamentality</text><text class="txo-crn" text-anchor="middle" x="797" y="446">fundamentaliteit</text><text class="txo-crg" text-anchor="middle" x="797" y="478">wezenlijk, niet oppervlakkig?</text><path class="txo-crl" d="M674 506 H920"></path><text class="txo-crq" text-anchor="middle" x="797" y="548">“Does this dimension</text><text class="txo-crq" text-anchor="middle" x="797" y="576">capture an essential rather</text><text class="txo-crq" text-anchor="middle" x="797" y="604">than superficial aspect?”</text><rect class="txo-cr" height="322" rx="7" width="306" x="962" y="372"></rect><rect class="txo-crb" height="5" rx="2" width="306" x="962" y="372"></rect><text class="txo-cre" text-anchor="middle" x="1115" y="414">Distinctiveness</text><text class="txo-crn" text-anchor="middle" x="1115" y="446">onderscheidend vermogen</text><text class="txo-crg" text-anchor="middle" x="1115" y="478">een eigen blik?</text><path class="txo-crl" d="M992 506 H1238"></path><text class="txo-crq" text-anchor="middle" x="1115" y="548">“Does this dimension</text><text class="txo-crq" text-anchor="middle" x="1115" y="576">provide a unique analytical</text><text class="txo-crq" text-anchor="middle" x="1115" y="604">perspective?”</text><rect class="txo-cr" height="322" rx="7" width="306" x="1280" y="372"></rect><rect class="txo-crb" height="5" rx="2" width="306" x="1280" y="372"></rect><text class="txo-cre" text-anchor="middle" x="1433" y="414">Utility</text><text class="txo-crn" text-anchor="middle" x="1433" y="446">bruikbaarheid</text><text class="txo-crg" text-anchor="middle" x="1433" y="478">helpt het je vraag?</text><path class="txo-crl" d="M1310 506 H1556"></path><text class="txo-crq" text-anchor="middle" x="1433" y="548">“Does this dimension reveal</text><text class="txo-crq" text-anchor="middle" x="1433" y="576">important insights or support</text><text class="txo-crq" text-anchor="middle" x="1433" y="604">practical applications?”</text></svg><div class="ob-note wide txo-close" style="--x:5%;--y:0%;--w:90%"><div class="k">Zo toetst MDTDF onafhankelijkheid</div><div class="d">Letterlijk uit het HCSS-recept: <span class="txo-mq">“An HLTP is independent if:”</span><ul class="txo-ul"><li><span class="txo-mq">“Classification along one dimension does not determine classification along others”</span></li><li><span class="txo-mq">“You can find examples where an instance’s position on one dimension changes while its position on other dimensions remains constant”</span></li><li><span class="txo-mq">“The dimension captures a unique aspect not covered by other dimensions”</span></li></ul>Onafhankelijkheid is één van vijf <i>Validation Criteria</i> (onder, letterlijk). Alleen deze kun je niet bluffen: je toetst hem op echte fragmenten.</div></div></div></div><img class="aira-logo" src="img/aira/hcss-logo/hcss-logo.jpg" alt="HCSS"></section>
<section class="slide obuild txm" data-audience="all" data-n="[5 min] HET RECEPT: MDTDF (09:22–09:27). Deze dia toont de generatieprompt die we vandaag gebruiken, met letterlijke Engelse citaten (Engels blijft Engels: dit is de werkprompt die de groepen in Ronde 2 aan het model geven). BESTAND: StratBase/MDTDF.md, ‘Multi-Dimensional Taxonomy Development Framework (MDTDF)’, Stephan De Spiegeleire, HCSS Principal Scientist, Jun 4, 2025 (Enhanced Edition); sha256 f0e7fadd66ade795a9d004da46a06e5b70ef250f0cd9c32295d7413c788bc04c (gemeten op 13 oktober 2026). Byte-identieke kopie voor de deelnemers: prompts/MDTDF_2025-06-04_enhanced.md (zelfde hash). Dit is hetzelfde bestand, met dezelfde hash, dat de FRAME-dia van het ADA-deck (Bakoe, 21 september 2026) noemt. De QR-code leidt naar de publieke kopie die de ADA-oefening gebruikte (sdspieg.github.io/rubase-workshop-gatech-2608/prompt.html?id=taxonomy-generation): dezelfde tekst woord voor woord, alleen is het auteursblok vervangen door ‘Domain for this run: {{DOMAIN}}’ en is er één tikfout anders (‘systemic’ werd ‘systematic’). Controleer vóór de sessie dat het bestand ook echt op het onderwijsplatform (onderwijsophcss.app.hcss.nl) staat. NIET WAT WE GEBRUIKEN: (a) de ‘first edition’-variant uit april 2026 (AIRA/workshops/2604/sessions/Day 3 - Wednesday/taxonomy_generation_prompt.md, met pluraliteit N ≥ 5, acht lenzen en 2–3 kandidaten per lens); dat staat niet in MDTDF.md. (b) StratBase/Strategic disposition/MDT_WriteUp_Guide.md: dat is voor het uitschrijven van een bestaande taxonomie, niet voor het genereren ervan. OPBOUW: (1) herkomst; (2) de vier niveaus, letterlijk uit de sectie ‘Framework Structure’ (bij niveau 1 is het voorbeeldlijstje ‘(e.g., Temporal Dimension, Geographical Scope, Power Application)’ weggelaten, vandaar het weglatingsteken); (3) de vier fasen met elk hun vijf stappen, letterlijk uit ‘Development Methodology’; (4) de vijf ‘Validation Criteria’ en ‘Begin with 5-7 clearly independent dimensions’ (uit ‘Starting Points’); (5) het TSV-contract uit ‘TSV Output Format’, met drie ECHTE rijen uit de HCSS-taxonomie Transparent Battlefield (RuBase/RNLA/CLAS 2025/Taxonomies/transparent-battlefield-taxonomy.csv: 6 HLTP, 17 elementen op het 2e niveau, 40 op het 3e, 107 taxa, geteld uit het bestand), plus ‘Aim for 8-15 concrete taxa for each 3rd Level element’ en de slotzin van de prompt. Die TB-taxonomie is aantoonbaar met MDTDF gemaakt: het promptbestand RuBase/Transparent battlefield/taxonomy.prompt.md bevat de MDTDF-tekst. Voor de HCSS-taxonomieën Grey Zone en Deterrence is geen promptbestand gevonden; claim daar dus niet meer dan dat ze dezelfde vier niveaus volgen. EERLIJK PUNT: 107 taxa over 40 elementen op het 3e niveau is gemiddeld 2,7 per element, dus de HCSS-taxonomie zelf haalt de 8–15 niet; een model levert vaak meer dan je uiteindelijk houdt, en snoeien is normaal. KERNBOODSCHAP: het exacte pad HLTP → 2e niveau → 3e niveau → taxon is vanmiddag het annotatielabel. Wat in de definities vaag blijft, wordt bij 1.000 fragmenten inconsistent geannoteerd." data-sec="recipe" data-sid="tx-mdtdf" data-t="Het recept: MDTDF"><h2>Het recept: de MDTDF-prompt</h2><p class="sub">De generatieprompt die HCSS gebruikt, letterlijk geciteerd: wat hij het model laat doen, en in welk formaat.</p><div class="ob-pic"><div class="ob-step" data-frag="1"><div class="txm-prov"><div class="txm-pt"><p class="txm-ttl">Multi-Dimensional Taxonomy Development Framework (MDTDF)</p><p class="txm-by">Stephan De Spiegeleire, HCSS · Jun 4, 2025 (Enhanced Edition)</p><p class="txm-file">StratBase/MDTDF.md · sha256 f0e7fadd…788bc04c</p><p class="txm-ada">Bronbestand, ook gebruikt in het ADA-deck (Bakoe, 21 september 2026); ook als bestand op het onderwijsplatform</p></div><figure class="txm-qrbox"><img alt="QR-code naar de publieke kopie van de MDTDF-prompt" class="txm-qr" src="img/aira/qr/mdtdf-prompt.png"/><figcaption>scan: de prompt</figcaption></figure></div><div class="ob-note" style="--x:76%;--y:0%;--w:24%"><div class="k">Dit is het recept, letterlijk</div><div class="d">Wat het model in Ronde 2 doet, staat in dit ene bestand van Stephan De Spiegeleire, versie 4 juni 2025. De Engelse tekst citeren we letterlijk, want precies die tekst geef je aan het model. De vingerafdruk (sha256) bewijst dat het hetzelfde bestand is als in Bakoe; scan de QR-code of haal het van het platform.</div></div></div><div class="ob-step" data-frag="1"><div class="txm-lev"><p class="txm-h">Wat het model bouwt: vier niveaus</p><div class="txm-lrow" style="--i:0"><span class="txm-ln">HLTP (dimensie)</span><span class="txm-q">High-Level Taxonomic Principles (HLTPs): Fundamental, independent dimensions or “lenses” for analyzing the domain…</span></div><div class="txm-lrow" style="--i:1"><span class="txm-ln">2e niveau</span><span class="txm-q">Second-Level Elements: Major divisions within each HLTP</span></div><div class="txm-lrow" style="--i:2"><span class="txm-ln">3e niveau</span><span class="txm-q">Third-Level Elements: Specific operational areas within each second-level element</span></div><div class="txm-lrow" style="--i:3"><span class="txm-ln">Taxon</span><span class="txm-q">Taxa: Concrete instances or activities that can be classified along all dimensions</span></div></div><div class="ob-note" style="--x:76%;--y:20%;--w:24%"><div class="k">Vier niveaus, één pad per label</div><div class="d">Het model moet elke dimensie uitwerken tot vier niveaus: HLTP, 2e niveau, 3e niveau en taxon. Voor vanmiddag is dat geen detail, want het label dat een fragment krijgt, is het volledige pad van HLTP tot taxon. Wat hier vaag blijft, wordt bij 1.000 fragmenten inconsistent geannoteerd.</div></div></div><div class="ob-step" data-frag="1"><svg aria-label="De vier fasen van de MDTDF-methode met elk vijf stappen" class="txm-psvg" preserveaspectratio="xMidYMid meet" viewbox="0 0 1330 216"><polygon class="txm-chev txm-c1" points="0,0 312,0 330,108 312,216 0,216"></polygon><polygon class="txm-chev" points="334,0 644,0 662,108 644,216 334,216 352,108"></polygon><polygon class="txm-chev" points="666,0 976,0 994,108 976,216 666,216 684,108"></polygon><polygon class="txm-chev txm-c4" points="998,0 1330,0 1330,216 998,216 1016,108"></polygon><text class="txm-pn" x="14" y="25">FASE 1 · dimensies vinden</text><text class="txm-ph" x="14" y="52">Initial Dimension</text><text class="txm-ph" x="14" y="76">Identification</text><text class="txm-ps" x="14" y="106">Domain Definition</text><text class="txm-ps" x="14" y="130">Brainstorming</text><text class="txm-ps" x="14" y="154">Literature Review</text><text class="txm-ps" x="14" y="178">Expert Consultation</text><text class="txm-ps" x="14" y="202">First Principles Analysis</text><text class="txm-pn" x="364" y="25">FASE 2 · verfijnen</text><text class="txm-ph" x="364" y="52">Dimension</text><text class="txm-ph" x="364" y="76">Refinement</text><text class="txm-ps" x="364" y="106">Independence Testing</text><text class="txm-ps" x="364" y="130">Classification Exercise</text><text class="txm-ps" x="364" y="154">Gap Analysis</text><text class="txm-ps" x="364" y="178">Redundancy Elimination</text><text class="txm-ps" x="364" y="202">Dimension Definition</text><text class="txm-pn" x="696" y="25">FASE 3 · onderverdelen</text><text class="txm-ph" x="696" y="52">Second-Level</text><text class="txm-ph" x="696" y="76">Development</text><text class="txm-ps" x="696" y="106">Division Identification</text><text class="txm-ps" x="696" y="130">Mutual Exclusivity Check</text><text class="txm-ps" x="696" y="154">Completeness Verification</text><text class="txm-ps" x="696" y="178">Definition Clarification</text><text class="txm-ps" x="696" y="202">Boundary Testing</text><text class="txm-pn" x="1028" y="25">FASE 4 · testen</text><text class="txm-ph" x="1028" y="52">Testing and</text><text class="txm-ph" x="1028" y="76">Validation</text><text class="txm-ps" x="1028" y="106">Real-World Testing</text><text class="txm-ps" x="1028" y="130">Edge Case Analysis</text><text class="txm-ps" x="1028" y="154">Expert Validation</text><text class="txm-ps" x="1028" y="178">Practical Application Test</text><text class="txm-ps" x="1028" y="202">Refinement Iteration</text></svg><div class="ob-note" style="--x:76%;--y:27%;--w:24%"><div class="k">Vier fasen, in deze volgorde</div><div class="d">Eerst het domein afbakenen en dimensies bedenken, dan die dimensies op onafhankelijkheid toetsen en snoeien, pas daarna onderverdelen, en ten slotte alles testen op echte voorbeelden. De allereerste stap is Domain Definition: zonder afgebakend domein valt er niets te toetsen. Vraag het model in Ronde 2 om per fase te laten zien wat het deed.</div></div></div><div class="ob-step" data-frag="1"><div class="txm-val"><p class="txm-h">Hoe elke dimensie wordt getoetst</p><div class="txm-chips"><span class="txm-chip"><svg aria-hidden="true" class="txm-ck" viewbox="0 0 20 20"><path d="M3 10.5 L8 15 L17 4"></path></svg>Independence</span><span class="txm-chip"><svg aria-hidden="true" class="txm-ck" viewbox="0 0 20 20"><path d="M3 10.5 L8 15 L17 4"></path></svg>Universality</span><span class="txm-chip"><svg aria-hidden="true" class="txm-ck" viewbox="0 0 20 20"><path d="M3 10.5 L8 15 L17 4"></path></svg>Fundamentality</span><span class="txm-chip"><svg aria-hidden="true" class="txm-ck" viewbox="0 0 20 20"><path d="M3 10.5 L8 15 L17 4"></path></svg>Distinctiveness</span><span class="txm-chip"><svg aria-hidden="true" class="txm-ck" viewbox="0 0 20 20"><path d="M3 10.5 L8 15 L17 4"></path></svg>Utility</span></div><p class="txm-q txm-q5">Begin with 5-7 clearly independent dimensions</p></div><div class="ob-note" style="--x:76%;--y:4%;--w:24%"><div class="k">Vijf toetsen voor elke dimensie</div><div class="d">Elke kandidaat-dimensie moet vijf vragen doorstaan, en de prompt zegt te beginnen met vijf tot zeven duidelijk onafhankelijke dimensies. Universality betekent dat elk fragment op die dimensie een plek heeft; Independence is de orthogonaliteitstoets van de vorige dia’s. Gebruik deze vijf als checklist voor jullie eigen dimensies.</div></div></div><div class="ob-step" data-frag="1"><div class="txm-tsv"><p class="txm-h">Wat het model oplevert: een TSV-tabel <span class="txm-th">· THEMA: TRANSPARENT BATTLEFIELD, drie echte rijen uit de HCSS-taxonomie</span></p><div class="txm-tw"><table><thead><tr><th>HLTP</th><th>2nd Level TE</th><th>3rd Level TE</th><th>Taxon</th></tr></thead><tbody><tr><td>Transparency Driver</td><td>Sensor Systems</td><td>Aerial ISR</td><td>Tactical UAVs / FPV drones</td></tr><tr><td>Transparency Driver</td><td>Sensor Systems</td><td>Space-based ISR</td><td>Commercial satellite imagery</td></tr><tr><td>Battlefield Effect</td><td>Tactical effects</td><td>Survivability degradation</td><td>Concealment/camouflage failure</td></tr></tbody></table><p class="txm-q txm-qa">Aim for 8-15 concrete taxa for each 3rd Level element</p></div><p class="txm-q txm-qz">Please produce a complete taxonomy following this exact structure, with no deviations in format.</p></div><div class="ob-note" style="--x:76%;--y:17%;--w:24%"><div class="k">Het contract: vier kolommen, elke rij één pad</div><div class="d">De prompt eist precies vier kolommen, gescheiden door tabs; elke rij is één volledig pad. Zo’n bestand laad je direct in een annotatiescript: vanmiddag kiest het model per fragment een rij. De HCSS-taxonomie voor Transparent Battlefield heeft 107 taxa onder 40 elementen op het 3e niveau: gemiddeld 2,7, minder dan de <span class="txm-nw">8–15</span> die de prompt vraagt.</div></div></div></div><img class="aira-logo" src="img/aira/hcss-logo/hcss-logo.jpg" alt="HCSS"></section>
<section class="slide obuild txp" data-audience="all" data-n="[3 min] HOE TAXONOMIEËN FALEN (09:27–09:30). De vijf valkuilen die de MDTDF-prompt zelf noemt onder ‘Common Pitfalls to Avoid’ (StratBase/MDTDF.md, sectie Implementation Guidance, Jun 4, 2025, sha256 f0e7fadd…788bc04c). De Engelse zinnen staan letterlijk op de kaarten; de Nederlandse titel is onze weergave. Bouw per klik één kaart op; elke kaart noemt het thema waaruit het voorbeeld komt. Bron van alle HCSS-taxonomieën: RuBase/RNLA/CLAS 2025/Taxonomies/ (Engelse originele labels; de kaarten tonen ze in het Engels omdat het de HCSS-namen zijn). (1) GREY-ZONE WARFARE: Conflict Phase Positioning (Steady-State Competition, Crisis Intensification, Conflict Support) naast Threshold Calibration (Well Below, Approaching, At Threshold), allebei HLTP’s in grey_zone_conflict_taxonomy_writeup.md. Dit is een KANDIDAAT-overlap, NIET gemeten: niemand heeft getoetst of ze in de fragmenten samen bewegen. Laat de groep het toetsen met het raster van de orthogonaliteitsdia. Andere kandidaat: Deterrence Credibility Components naast Russian Perception (beide bevatten een beoordeling van politieke wil). (2) ALLE DRIE: MDTDF zegt ‘Begin with 5-7 clearly independent dimensions’. Aantallen HLTP’s geteld in de bestanden: Transparent Battlefield 6 (transparent-battlefield-taxonomy.csv), Grey Zone 13 (grey_zone_conflict_taxonomy_writeup.md, secties 2.1–2.13), Deterrence 14 (effective_deterrence_taxonomy_writeup.md, secties 2.1–2.14). 14 dimensies maal 1.000 fragmenten = 14.000 beslissingen per annotatieronde (rekensom, geen meting). Eerlijk: de HCSS-taxonomieën zijn als analysekader voor rapporten gebouwd, niet als annotatie-instrument voor één middag; dat verklaart een deel van de omvang. (3) EFFECTIVE DETERRENCE: HLTP Theoretical Framework, 2e niveau Deterrence Theory, 3e niveau Classical Concepts, Contemporary Developments en Russian Strategic Thought (sectie 2.13 van de Deterrence-write-up). Stel het als VRAAG, niet als oordeel: is die dimensie bruikbaar op een Telegrampost, of alleen op vakliteratuur? Het voorbeeld van Peskov over de nucleaire doctrine is fragment 27691 uit deterrence_1000 (Telegram ‘Елена Панина’, 16 juli 2025). (4) ALLE THEMA’S: v0 (Ronde 1), v1 (vandaag, bevroren voor de annotatie van 13:00–15:00), v1.1 (na de stresstest), en mogelijk v2 na de menselijke validatie van 50 fragmenten op donderdag. Houd een wijzigingslog bij. (5) EFFECTIVE DETERRENCE: de Deterrence-taxonomie heeft zelf een 3e niveau Russian Strategic Thought, en de write-up (sectie 2.13.1.3) beschrijft ‘strategic deterrence concepts extending beyond nuclear to all instruments of national power’. Houd de claim bescheiden: стратегическое сдерживание wordt in Russische bronnen vaak breder gebruikt dan het westerse ‘deterrence’; dit is geen volledige begripsanalyse. Moedig groepen in Ronde 1 aan ook andere dimensies te zoeken dan de HCSS-voorbeelden op deze dia." data-sec="recipe" data-sid="tx-pitfalls" data-t="Hoe taxonomieën falen">
<h2>Hoe taxonomieën falen</h2><p class="sub">De vijf valkuilen die de MDTDF-prompt zelf noemt, elk getoond op een van jullie drie thema’s.</p><div class="ob-pic">
<div class="ob-step" data-frag="1"><div class="txp-card" style="--x:0%"><div class="txp-top"><span class="txp-num">1</span><span class="txp-t">Twee dimensies, één ding</span></div><p class="txp-q">Creating dimensions that are actually different aspects of the same thing</p><p class="txp-tag">THEMA: GREY-ZONE WARFARE</p><svg aria-label="Twee sterk overlappende cirkels: Conflictfase en Drempel" class="txp-mini" preserveaspectratio="xMidYMid meet" viewbox="0 0 300 200"><circle class="txp-c1" cx="112" cy="80" r="68"></circle><circle class="txp-c2" cx="188" cy="80" r="68"></circle><text class="txp-big" text-anchor="middle" x="150" y="93">?</text><text class="txp-ms" text-anchor="middle" x="78" y="190">Conflictfase</text><text class="txp-ms" text-anchor="middle" x="226" y="190">Drempel</text></svg><p class="txp-case">Conflict Phase Positioning naast Threshold Calibration: kandidaat, niet gemeten.</p></div><div class="ob-note" style="--x:0%;--y:74%;--w:100%"><div class="k">Twee namen voor één as?</div><div class="d">In de HCSS-taxonomie voor Grey-Zone Warfare loopt Conflictfase van concurrentie in vredestijd via crisis naar conflict, en Drempel van ruim onder tot op de drempel van een gewapende aanval. Als die twee in jullie fragmenten altijd samen opschuiven, meten ze één ding en moet er één weg. Toets het met het raster van de orthogonaliteitsdia: zoek een fragment uit een crisis dat toch ruim onder de drempel blijft.</div></div></div>
<div class="ob-step" data-frag="1"><div class="txp-card" style="--x:20.35%"><div class="txp-top"><span class="txp-num">2</span><span class="txp-t">Te ingewikkeld om te gebruiken</span></div><p class="txp-q">Developing overly complex frameworks that are difficult to use</p><p class="txp-tag">THEMA: ALLE DRIE</p><svg aria-label="Aantal HLTP’s per HCSS-taxonomie: Transparent Battlefield 6, Grey Zone 13, Deterrence 14, tegen de band van 5 tot 7 uit MDTDF" class="txp-mini" preserveaspectratio="xMidYMid meet" viewbox="0 0 300 200"><rect class="txp-band" height="158" width="24" x="152" y="6"></rect><rect class="txp-bar txp-ok" height="34" rx="4" width="72" x="92" y="18"></rect><rect class="txp-bar" height="34" rx="4" width="156" x="92" y="70"></rect><rect class="txp-bar" height="34" rx="4" width="168" x="92" y="122"></rect><text class="txp-ms" x="0" y="44">TB</text><text class="txp-ms" x="0" y="96">GZ</text><text class="txp-ms" x="0" y="148">Afschr.</text><text class="txp-mv" x="184" y="44">6</text><text class="txp-mv" x="254" y="96">13</text><text class="txp-mv" x="266" y="148">14</text><text class="txp-mg" text-anchor="middle" x="164" y="194">MDTDF: 5–7</text></svg><p class="txp-case">Aantal HLTP’s, geteld in de HCSS-bestanden: TB 6, Grey Zone 13, Deterrence 14.</p></div><div class="ob-note" style="--x:0%;--y:74%;--w:100%"><div class="k">Elke dimensie is een beslissing per fragment</div><div class="d">MDTDF zegt te beginnen met vijf tot zeven dimensies; de HCSS-taxonomieën voor Grey Zone (13) en Deterrence (14) zitten daar ruim boven, die voor Transparent Battlefield (6) niet. Met 14 dimensies en 1.000 fragmenten moet een annotator, of het model, 14.000 keer kiezen. Een dimensie die niemand consequent kan toepassen, levert op die schaal ruis op, geen inzicht.</div></div></div>
<div class="ob-step" data-frag="1"><div class="txp-card" style="--x:40.7%"><div class="txp-top"><span class="txp-num">3</span><span class="txp-t">Elegant, maar onbruikbaar?</span></div><p class="txp-q">Prioritizing theoretical elegance over practical utility</p><p class="txp-tag">THEMA: EFFECTIVE DETERRENCE</p><svg aria-label="Een Telegrampost, een vraagteken, en drie theoretische categorieën: Klassiek, Hedendaags, Russisch" class="txp-mini" preserveaspectratio="xMidYMid meet" viewbox="0 0 300 200"><rect class="txp-post" height="62" rx="10" width="96" x="4" y="50"></rect><path class="txp-post" d="M20 112 L16 130 L40 112 Z"></path><path class="txp-ln" d="M18 68 H86 M18 82 H78 M18 96 H62"></path><text class="txp-ms" text-anchor="middle" x="52" y="164">Telegram</text><path class="txp-arr" d="M106 84 H140"></path><path class="txp-ah" d="M134 76 L147 84 L134 92 Z"></path><text class="txp-big2" text-anchor="middle" x="124" y="68">?</text><rect class="txp-th" height="54" rx="6" width="146" x="152" y="2"></rect><rect class="txp-th" height="54" rx="6" width="146" x="152" y="73"></rect><rect class="txp-th" height="54" rx="6" width="146" x="152" y="144"></rect><text class="txp-ms txp-w" text-anchor="middle" x="225" y="38">Klassiek</text><text class="txp-ms txp-w" text-anchor="middle" x="225" y="109">Hedendaags</text><text class="txp-ms txp-w" text-anchor="middle" x="225" y="180">Russisch</text></svg><p class="txp-case">Theoretical Framework → Deterrence Theory → Classical / Contemporary / Russian Strategic Thought.</p></div><div class="ob-note" style="--x:0%;--y:74%;--w:100%"><div class="k">Kan een annotator dit op een Telegrampost zetten?</div><div class="d">Deze dimensie van de HCSS-taxonomie voor Effective Deterrence ordent vooral de wetenschappelijke literatuur over afschrikking. Een post waarin Peskov zegt dat de nucleaire doctrine van kracht is, verwijst niet naar Schelling of naar ‘Contemporary Developments’. Vraag bij elke dimensie: kun je haar consequent op jullie fragmenten toepassen, of alleen op vakliteratuur?</div></div></div>
<div class="ob-step" data-frag="1"><div class="txp-card" style="--x:61.05%"><div class="txp-top"><span class="txp-num">4</span><span class="txp-t">Bevroren voor altijd</span></div><p class="txp-q">Treating the taxonomy as fixed rather than evolving</p><p class="txp-tag">THEMA: JULLIE EIGEN TAXONOMIE</p><svg aria-label="Versielijn: v0 in Ronde 1, v1 vandaag (bevroren voor de annotatie), v1.1 na de stresstest, misschien v2 op donderdag" class="txp-mini" preserveaspectratio="xMidYMid meet" viewbox="0 0 300 200"><rect class="txp-lock" height="20" rx="3" width="28" x="96" y="24"></rect><path class="txp-shk" d="M101 24 V17 a9 9 0 0 1 18 0 V24"></path><path class="txp-tl" d="M10 104 H290"></path><path class="txp-tld" d="M212 104 H290"></path><circle class="txp-v" cx="40" cy="104" r="11"></circle><circle class="txp-v txp-v1" cx="110" cy="104" r="16"></circle><circle class="txp-v" cx="180" cy="104" r="11"></circle><circle class="txp-v txp-v2" cx="248" cy="104" r="11"></circle><text class="txp-mt" text-anchor="middle" x="40" y="76">v0</text><text class="txp-mt txp-g" text-anchor="middle" x="110" y="76">v1</text><text class="txp-mt" text-anchor="middle" x="180" y="76">v1.1</text><text class="txp-mt" text-anchor="middle" x="248" y="76">v2?</text><text class="txp-ms" x="2" y="148">ronde 1</text><text class="txp-ms" text-anchor="middle" x="110" y="182">vandaag</text><text class="txp-ms" text-anchor="middle" x="180" y="148">stresstest</text><text class="txp-ms" text-anchor="end" x="298" y="182">donderdag</text></svg><p class="txp-case">v1 gaat vanmiddag de annotatie in; de validatie van 50 fragmenten op donderdag kan een v2 afdwingen.</p></div><div class="ob-note" style="--x:0%;--y:74%;--w:100%"><div class="k">Bevriezen voor één ronde, niet voor altijd</div><div class="d">Taxonomie v1 is het instrument voor de annotatie van vanmiddag: tijdens een annotatieronde verander je hem niet, anders zijn de labels niet meer vergelijkbaar. Daarna mag hij groeien: een v1.1 na de stresstest, en een v2 als de menselijke validatie van 50 fragmenten op donderdag systematische twijfel laat zien. Houd bij wat je verandert en waarom.</div></div></div>
<div class="ob-step" data-frag="1"><div class="txp-card" style="--x:81.4%"><div class="txp-top"><span class="txp-num">5</span><span class="txp-t">Alleen het vertrouwde</span></div><p class="txp-q">Focusing exclusively on familiar or comfortable dimensions</p><p class="txp-tag">THEMA: EFFECTIVE DETERRENCE</p><svg aria-label="Het westerse begrip deterrence als kleinere ellips binnen het bredere Russische стратегическое сдерживание" class="txp-mini" preserveaspectratio="xMidYMid meet" viewbox="0 0 300 200"><ellipse class="txp-ru" cx="150" cy="100" rx="146" ry="96"></ellipse><ellipse class="txp-we" cx="150" cy="56" rx="84" ry="32"></ellipse><text class="txp-ms txp-w" text-anchor="middle" x="150" y="64">deterrence</text><text class="txp-mr" text-anchor="middle" x="150" y="134">стратегическое</text><text class="txp-mr" text-anchor="middle" x="150" y="162">сдерживание</text></svg><p class="txp-case">De HCSS-taxonomie heeft zelf een 3e niveau Russian Strategic Thought.</p></div><div class="ob-note" style="--x:0%;--y:74%;--w:100%"><div class="k">Jullie fragmenten zijn Russisch</div><div class="d">De westerse literatuur over afschrikking is voor de meeste analisten vertrouwd terrein. Het Russische стратегическое сдерживание (strategisch afschrikken) wordt in de HCSS-taxonomie zelf beschreven als een begrip dat verder reikt dan kernwapens, tot alle instrumenten van nationale macht. Een taxonomie met alleen westerse categorieën mist precies waar Moskou anders over denkt.</div></div></div>
</div><img class="aira-logo" src="img/aira/hcss-logo/hcss-logo.jpg" alt="HCSS"></section>
<section class="slide obuild txd" data-audience="all" data-n="[2 min] 09:30–09:32. Overgang van uitleg naar doen: deze slide legt de volgorde van de drie rondes uit. Klik vlot door (8 klikken, ca. 15 seconden per klik); de inhoud is een samenvatting, de tijd hoort bij de rondes. (1–3) Drie manieren om te bouwen: bottom-up (lees fragmenten en groepeer), top-down (begin bij een raamwerk), hybride (raamwerk eerst, data vullen in). De voorbeelden zijn bewust op de drie thema’s van de groepen gezet (grey_zone_1000, de afschrikkingsliteratuur over ontzegging en bestraffing, tb_1000). (4) De ADA-regel uit het Bakoe-deck van 21 september 2026 (FRAME: eerst definiëren, dan zoeken): leg het object en het kader vast VOORDAT je het corpus opent; het corpus kan v0 toetsen, maar niet genereren. Daarom begint Ronde 1 bij de onderzoeksvraag v2 en niet bij de fragmenten. (5) Waarom niet alleen het model: dan kiest het model de kopjes, de beslissing met de meeste gevolgen. Waarom niet alleen de analisten: vergelijkbare mensen (vergelijkbare opleiding, dezelfde westerse canon, bv. Schelling over afschrikking) vinden vergelijkbare structuren en delen blinde vlekken. (6) Paso Doble is een HCSS-interne term, niet uit de tradecraftliteratuur: mens en model in rondes. Vandaag dansen we één volledige ronde, verdeeld over drie oefeningen; in een echt project zijn het er 3–5. (7) Twee manieren waarop het misgaat (uit de aprilworkshop): het ‘stockholmsyndroom’ (na twee rondes schaaft een model alleen nog bij; dwing een andere lens of een ander model af) en geen realiteitstoets (LLM-uitvoer nooit aan echte fragmenten getoetst). (8) De tijdbalk: Ronde 1 09:32–09:47, Ronde 2 09:47–10:02, HCSS-referentie 10:02–10:05 (slide tx-llmtax), Ronde 3 10:05–10:17, stresstest 10:17–10:25. Zeg hardop dat de HCSS-referentietaxonomieën pas NA Ronde 1 en 2 komen, zodat niemand erdoor verankerd raakt. Tijdbewaking: Nidas/Jesse, spreek vooraf af wie de klok houdt en wie rondloopt." data-sec="do" data-sid="tx-pasodoble" data-t="Eerst mensen, dan het model, dan samen"><h2>Eerst mensen, dan het model, dan samen</h2><p class="sub">Drie manieren om te bouwen, waarom geen van beide partijen alleen bouwt, en hoe de drie rondes van vanochtend in elkaar grijpen.</p><div class="ob-pic">
<div class="ob-step" data-frag="1"><div class="txd-b" style="--x:0%"><p class="txd-bn">Bottom-up</p><p class="txd-how">Lees fragmenten, groepeer wat je ziet.</p><p class="txd-eg">bv. 50 fragmenten uit <code class="txd-ds">grey_zone_1000</code> <span>thema Grey-Zone</span></p><p class="txd-pc"><span class="txd-plus">+</span> past bij de data <span class="txd-min">–</span> vertekend</p></div><div class="ob-note" style="--x:66.5%;--y:0%;--w:33.5%"><div class="k">Bottom-up: begin bij de documenten</div><div class="d">Je leest een steekproef en groepeert wat je ziet. De categorieën passen bij je data, maar alleen bij de data die toevallig in je steekproef zat.</div></div></div>
<div class="ob-step" data-frag="1"><div class="txd-b" style="--x:21.9%"><p class="txd-bn">Top-down</p><p class="txd-how">Begin bij een raamwerk: doctrine, theorie.</p><p class="txd-eg">bv. ontzegging ↔ bestraffing uit de afschrikkingstheorie <span>thema Deterrence</span></p><p class="txd-pc"><span class="txd-plus">+</span> samenhangend <span class="txd-min">–</span> mist de praktijk</p></div><div class="ob-note" style="--x:66.5%;--y:0%;--w:33.5%"><div class="k">Top-down: begin bij een raamwerk</div><div class="d">Je leidt categorieën af uit doctrine of theorie. Dat is samenhangend en verdedigbaar, maar het kan missen wat er echt in de fragmenten staat.</div></div></div>
<div class="ob-step" data-frag="1"><div class="txd-b txd-hy" style="--x:43.8%"><p class="txd-bn">Hybride</p><p class="txd-how">Het raamwerk geeft de structuur, de data vullen het detail in.</p><p class="txd-eg">bv. dimensies uit de literatuur, verfijnd op <code class="txd-ds">tb_1000</code> <span>thema Transparent Battlefield</span></p><p class="txd-pc"><span class="txd-plus">+</span> evenwichtig <span class="txd-min">–</span> meer werk</p></div><div class="ob-note" style="--x:66.5%;--y:0%;--w:33.5%"><div class="k">Hybride: wat HCSS doet</div><div class="d">Het raamwerk geeft de structuur en het corpus vult het detail in. Zo bouwt HCSS de taxonomieën in zijn RuBase-projecten: opgezet vanuit de literatuur, verfijnd aan het corpus. Zo werken jullie vandaag.</div></div></div>
<div class="ob-step" data-frag="1"><svg aria-label="ADA-regel: het kader komt eerst; het corpus kan v0 toetsen maar niet genereren" class="txd-ada" viewbox="0 0 1050 84"><rect class="txd-adabg" height="82" rx="8" width="1048" x="1" y="1"></rect><rect class="txd-adak" height="52" rx="6" width="150" x="14" y="16"></rect><text class="txd-adat" text-anchor="middle" x="89" y="50">kader → v0</text><path class="txd-adaa" d="M172 50 L296 50"></path><path class="txd-adah" d="M302 50 L288 41 L288 59 Z"></path><text class="txd-adas" text-anchor="middle" x="234" y="38">toets ✓</text><rect class="txd-adac" height="52" rx="6" width="120" x="306" y="16"></rect><text class="txd-adat" text-anchor="middle" x="366" y="50">corpus</text><text class="txd-adar" x="448" y="36">ADA-regel (FRAME): eerst definiëren, dan zoeken.</text><text class="txd-adar2" x="448" y="68">Het corpus kan v0 toetsen, maar niet genereren.</text></svg><div class="ob-note" style="--x:66.5%;--y:0%;--w:33.5%"><div class="k">Eerst het kader, dan het corpus</div><div class="d">Leg vast wat je onderzoekt en langs welke dimensies, voordat je de fragmenten opent. Het corpus laat zien of je kader werkt, maar een kader dat je uit het corpus afleest, beschrijft alleen wat je toevallig las.</div></div></div>
<div class="ob-step" data-frag="1"><div class="txd-a" style="--y:46.5%"><p class="txd-an">Alleen het model</p><p class="txd-ap">Het model kiest de kopjes: snel en fris, maar de belangrijkste analytische beslissing is uitbesteed.</p></div><div class="txd-a" style="--y:65.3%"><p class="txd-an">Alleen de analisten</p><p class="txd-ap">Drie experts, drie structuren, op dezelfde aannames: dezelfde opleiding, dezelfde westerse canon (Schelling), dezelfde blinde vlekken.</p></div><div class="ob-note" style="--x:66.5%;--y:0%;--w:33.5%"><div class="k">Waarom niet één partij alleen?</div><div class="d">Laat je het model bouwen, dan is de structuur zijn keuze en niet de jouwe. Bouw je alleen met vergelijkbare collega’s, dan vind je vergelijkbare structuren met gedeelde blinde vlekken.</div></div></div>
<div class="ob-step" data-frag="1"><svg aria-label="De Paso Doble als ronde: mens bouwt v0, model genereert en geeft kritiek, samen snoeien en toetsen" class="txd-loop" viewbox="0 0 540 260"><ellipse class="txd-ring" cx="270" cy="130" rx="190" ry="92"></ellipse><path class="txd-arr" d="M450 120 L470 120 L460 140 Z"></path><path class="txd-arr" d="M284 212 L284 232 L264 222 Z"></path><path class="txd-arr" d="M70 140 L90 140 L80 120 Z"></path><rect class="txd-hn" height="64" rx="8" width="250" x="145" y="2"></rect><text class="txd-nt" text-anchor="middle" x="270" y="30">Ronde 1 · mens</text><text class="txd-ns" text-anchor="middle" x="270" y="56">bouwt v0 zelf</text><rect class="txd-ln" height="64" rx="8" width="250" x="288" y="194"></rect><text class="txd-nt" text-anchor="middle" x="413" y="222">Ronde 2 · model</text><text class="txd-ns" text-anchor="middle" x="413" y="248">genereert + kritiek</text><rect class="txd-sn" height="64" rx="8" width="250" x="2" y="194"></rect><text class="txd-nt" text-anchor="middle" x="127" y="222">Ronde 3 · samen</text><text class="txd-ns" text-anchor="middle" x="127" y="248">snoeien, toetsen</text><text class="txd-c1" text-anchor="middle" x="270" y="124">vandaag 1×</text><text class="txd-c2" text-anchor="middle" x="270" y="156">in projecten 3–5×</text></svg><div class="ob-note" style="--x:66.5%;--y:0%;--w:33.5%"><div class="k">Paso Doble: een dans in rondes</div><div class="d">Jullie zetten eerst zelf een opzet neer, het model genereert en bekritiseert, en samen snoeien jullie en toetsen aan echte fragmenten. Vandaag doen we één ronde, verdeeld over drie oefeningen; in een echt project volgen er meer.</div></div></div>
<div class="ob-step" data-frag="1"><div class="txd-warn"><p class="txd-w"><b>⚠ Stockholmsyndroom</b>: na twee rondes schaaft het model alleen nog bij. Dwing een andere lens of een ander model af.</p><p class="txd-w"><b>⚠ Geen realiteitstoets</b>: lees elke ronde 5–10 echte fragmenten uit je eigen dataset.</p></div><div class="ob-note" style="--x:66.5%;--y:0%;--w:33.5%"><div class="k">Twee manieren waarop de dans misgaat</div><div class="d">Na een paar rondes gaat een model verfijnen in plaats van herdenken; dat voelt als vooruitgang. En een taxonomie die nooit aan echte fragmenten is getoetst, blijft een gok, hoe elegant ook.</div></div></div>

 zelf, dan draait het model de HCSS-prompt op jullie thema. Pas daarna zien jullie de HCSS-taxonomie, zodat die je eigen ontwerp niet stuurt. Tot slot voegen jullie samen en stresstesten.</div></div></div>

<section class="slide obuild tx1" data-audience="all" data-n="[15 min] 09:32–09:47. RONDE 1 VAN 3, GEEN LLM. Elke groep werkt op het eigen thema (Transparent Battlefield, Grey-Zone Warfare, Effective Deterrence), niet op een casus. Stappen en klok (staan op de slide): 09:32–09:34 domeinzin (MDTDF, Instructions for Use stap 1: ‘Define Your Domain’); 09:34–09:39 kandidaat-dimensies, mik op 5, minstens 4, met de onafhankelijkheidstoets uit MDTDF (‘You can find examples where an instance’s position on one dimension changes while its position on other dimensions remains constant’); 09:39–09:45 2e niveau, 2–4 per HLTP, wederzijds uitsluitend, definitie van één regel, 3e niveau alleen waar nodig (MDTDF zelf vraagt meerdere elementen op het 3e niveau en 8–15 taxa; dat doet het model in Ronde 2, voor mensen in 15 minuten is dit genoeg); 09:45–09:47 opschrijven in de vier kolommen en opslaan. WAAR OP LETTEN: (1) groepen die een onderwerpenlijst maken (drones, energie, Tomahawks) in plaats van dimensies: de clusters uit de thema-visualisatie zijn ONDERWERPEN, één as; vraag ‘welke vraag stel je aan elk fragment?’. (2) Groepen die DIME/PMESII opnieuw uitvinden: dwing een andere lens af (tijd, actor, wat het fragment doet: beschrijven of voorschrijven). (3) Twee dimensies die altijd samen bewegen: laat ze het voorbeeld zoeken waarin de ene verandert en de andere niet. ALS EEN GROEP VASTZIT: geef één startvraag uit de eigen onderzoeksvraag (bv. TB: ‘welke bron van transparantie?’; GZ: ‘welk instrument?’; Deterrence: ‘welk mechanisme, ontzegging of bestraffing?’), maar NIET de HCSS-HLTP-lijst: die komt pas om 10:02 (tx-llmtax), anders heeft Ronde 3 geen zin. Moedig groepen aan ook andere dimensies te zoeken dan de voorbeelden op eerdere slides. TIJD: één trainer houdt de klok en roept 09:34, 09:39 (‘nu 2e niveau’) en 09:45 (‘opschrijven’). Een onaffe v0 is prima; opslaan om 09:47 is belangrijker dan afmaken. MATERIAAL: het opmaakvoorbeeld is de letterlijke voorbeeldrij uit MDTDF.md (sectie TSV Output Format), over politiewerk, gekozen omdat het geen van de drie thema’s is. Controleer vóór de sessie dat elke groep een groepsmap op onderwijsophcss.app.hcss.nl heeft." data-sec="do" data-sid="tx-ex1" data-t="Ronde 1: zelf bouwen"><h2>Ronde 1: zelf bouwen (15 min)</h2><p class="sub">Per groep, op je eigen thema: Transparent Battlefield, Grey-Zone Warfare of Effective Deterrence. Nog geen taalmodel.</p><div class="ob-pic">
<div class="ob-step" data-frag="1"><svg aria-label="Tijdbalk 09:30–10:25; nu: Ronde 1 · zelf bouwen" class="tx1-strip" viewbox="0 0 1770 92"><rect class="tx1-soff" height="62" rx="6" width="112" x="2" y="2"></rect><rect class="tx1-son" height="62" rx="6" width="416" x="118" y="2"></rect><rect class="tx1-soff" height="62" rx="6" width="416" x="538" y="2"></rect><rect class="tx1-soff" height="62" rx="6" width="172" x="958" y="2"></rect><rect class="tx1-soff" height="62" rx="6" width="368" x="1134" y="2"></rect><rect class="tx1-soff" height="62" rx="6" width="262" x="1506" y="2"></rect><text class="tx1-stld" text-anchor="middle" x="58" y="28">uitleg</text><text class="tx1-sts" text-anchor="middle" x="58" y="54">2 min</text><text class="tx1-stl" text-anchor="middle" x="326" y="28">Ronde 1 · zelf bouwen</text><text class="tx1-sts" text-anchor="middle" x="326" y="54">09:32–09:47</text><text class="tx1-stld" text-anchor="middle" x="746" y="28">Ronde 2 · MDTDF-prompt</text><text class="tx1-sts" text-anchor="middle" x="746" y="54">15 min · model</text><text class="tx1-stld" text-anchor="middle" x="1044" y="28">HCSS-ref.</text><text class="tx1-sts" text-anchor="middle" x="1044" y="54">3 min</text><text class="tx1-stld" text-anchor="middle" x="1318" y="28">Ronde 3 · samenvoegen</text><text class="tx1-sts" text-anchor="middle" x="1318" y="54">12 min · samen</text><text class="tx1-stld" text-anchor="middle" x="1637" y="28">stresstest</text><text class="tx1-sts" text-anchor="middle" x="1637" y="54">8 min</text><text class="tx1-stk" x="3" y="88">09:30</text><text class="tx1-stk" x="119" y="88">09:32</text><text class="tx1-stk" x="539" y="88">09:47</text><text class="tx1-stk" x="959" y="88">10:02</text><text class="tx1-stk" x="1135" y="88">10:05</text><text class="tx1-stk" x="1507" y="88">10:17</text><text class="tx1-stk" text-anchor="end" x="1767" y="88">10:25</text></svg><div class="tx1-card tx1-mat" style="left:0%;top:69.5%;width:29.6%;height:30.5%"><p class="tx1-ch">Materiaal</p><ul class="tx1-ul"><li>je onderzoeksvraag v2 + deelvragen (ma/di)</li><li>wat je van je dataset weet: de clusters uit de thema-visualisatie, de fragmenten van dinsdag</li><li>papier, whiteboard of een sheet op de groepslaptop; <b>geen</b> taalmodel</li></ul></div><div class="ob-note" style="--x:68.3%;--y:15.5%;--w:31.5%"><div class="k">Ronde 1: bouw eerst zelf, zonder model</div><div class="d">Elke groep bouwt een eerste taxonomie voor het eigen thema, met alleen eigen kennis. Zo staan jullie aannames op papier voordat een model iets voorstelt, en zie je in Ronde 3 wat het model toevoegt.</div></div></div>
<div class="ob-step" data-frag="1"><svg aria-label="1 · domein, 09:32–09:34" class="tx1-bar" style="left:0.000%;width:8.979%" viewbox="0 0 158.9 82.1"><rect class="tx1-bseg" height="50" rx="5" width="154.9" x="2" y="2"></rect><text class="tx1-bl" text-anchor="middle" x="79.5" y="35">1 · domein</text><path class="tx1-btk" d="M2 52 L2 62"></path><text class="tx1-bt" x="3" y="80">09:32</text></svg><div class="tx1-card" style="left:0.0%;top:28.5%;width:16.2%;height:38.5%"><p class="tx1-ch">1 · Domeinzin <span class="tx1-min">2 min</span></p><p class="tx1-ct">Eén zin: wat ordent deze taxonomie? Vertrek vanuit je onderzoeksvraag v2.</p><p class="tx1-q">“Define Your Domain: Clearly specify what you are creating a taxonomy for”</p></div><div class="ob-note" style="--x:68.3%;--y:15.5%;--w:31.5%"><div class="k">Begin met één zin over je domein</div><div class="d">MDTDF begint met het afbakenen van het domein. Schrijf in één zin wat jullie taxonomie ordent, vanuit de onderzoeksvraag die je maandag en dinsdag hebt aangescherpt. Die zin gebruik je in Ronde 2 opnieuw.</div></div></div>
<div class="ob-step" data-frag="1"><svg aria-label="2 · dimensies (HLTP’s), 09:34–09:39" class="tx1-bar" style="left:8.979%;width:22.448%" viewbox="0 0 397.3 82.1"><rect class="tx1-bseg" height="50" rx="5" width="393.3" x="2" y="2"></rect><text class="tx1-bl" text-anchor="middle" x="198.7" y="35">2 · dimensies (HLTP’s)</text><path class="tx1-btk" d="M2 52 L2 62"></path><text class="tx1-bt" x="3" y="80">09:34</text></svg><div class="tx1-card" style="left:17.099999999999998%;top:28.5%;width:16.2%;height:38.5%"><p class="tx1-ch">2 · Dimensies <span class="tx1-min">5 min</span></p><p class="tx1-ct">Mik op <b>5</b> (minstens 4) onafhankelijke HLTP’s.</p><p class="tx1-ct">Toets elk paar: kan A veranderen terwijl B gelijk blijft?</p></div><svg aria-label="Onafhankelijkheidstoets: A verandert, B blijft gelijk" class="tx1-ind" viewbox="0 0 270 92"><text class="tx1-il" x="4" y="26">A</text><path class="tx1-ir" d="M34 18 L262 18"></path><circle class="tx1-id0" cx="80" cy="18" r="10"></circle><circle class="tx1-id1" cx="210" cy="18" r="10"></circle><path class="tx1-ia" d="M96 18 L190 18"></path><path class="tx1-iah" d="M196 18 L184 11 L184 25 Z"></path><text class="tx1-il" x="4" y="70">B</text><path class="tx1-ir" d="M34 62 L262 62"></path><circle class="tx1-id1" cx="145" cy="62" r="10"></circle><text class="tx1-is" x="170" y="90">B blijft</text></svg><div class="ob-note" style="--x:68.3%;--y:15.5%;--w:31.5%"><div class="k">Dimensies die echt onafhankelijk zijn</div><div class="d">Een HLTP is een vraag die je aan elk fragment kunt stellen. Twee dimensies zijn onafhankelijk als je fragmenten kunt vinden waarin de ene verandert terwijl de andere gelijk blijft. Lukt dat niet, dan is het één dimensie.</div></div></div>
<div class="ob-step" data-frag="1"><svg aria-label="3 · 2e niveau + definities, 09:39–09:45" class="tx1-bar" style="left:31.427%;width:26.938%" viewbox="0 0 476.8 82.1"><rect class="tx1-bseg" height="50" rx="5" width="472.8" x="2" y="2"></rect><text class="tx1-bl" text-anchor="middle" x="238.4" y="35">3 · 2e niveau + definities</text><path class="tx1-btk" d="M2 52 L2 62"></path><text class="tx1-bt" x="3" y="80">09:39</text></svg><div class="tx1-card" style="left:34.199999999999996%;top:28.5%;width:16.2%;height:38.5%"><p class="tx1-ch">3 · 2e niveau <span class="tx1-min">6 min</span></p><p class="tx1-ct"><b>2–4</b> elementen per HLTP, die elkaar uitsluiten, elk met een definitie van één regel.</p><p class="tx1-ct">3e niveau alleen waar het nodig is.</p></div><div class="ob-note" style="--x:68.3%;--y:15.5%;--w:31.5%"><div class="k">Verdelen, en elke categorie definiëren</div><div class="d">Binnen één HLTP mogen de elementen elkaar niet overlappen. Een definitie van één regel is wat twee annotatoren, mens of model, hetzelfde fragment in hetzelfde vakje laat zetten.</div></div></div>
<div class="ob-step" data-frag="1"><svg aria-label="4 · opschrijven, 09:45–09:47" class="tx1-bar" style="left:58.365%;width:8.979%" viewbox="0 0 158.9 82.1"><rect class="tx1-bseg" height="50" rx="5" width="154.9" x="2" y="2"></rect><text class="tx1-bl" text-anchor="middle" x="79.5" y="35">4 · opschrijven</text><path class="tx1-btk" d="M2 52 L2 62"></path><text class="tx1-bt" x="3" y="80">09:45</text><path class="tx1-btk" d="M156.9 52 L156.9 62"></path><text class="tx1-bt" text-anchor="end" x="155.9" y="80">09:47</text></svg><div class="tx1-card" style="left:51.3%;top:28.5%;width:16.2%;height:38.5%"><p class="tx1-ch">4 · Opschrijven <span class="tx1-min">2 min</span></p><p class="tx1-ct">In de vier kolommen van MDTDF, één rij per pad: dezelfde opmaak als de modeluitvoer in Ronde 2.</p></div><div class="tx1-fmt"><p class="tx1-fcap">Opmaak, letterlijk uit MDTDF (politiewerk, <b>niet</b> jullie thema)</p><table><tr><th>HLTP</th><th>2nd Level TE</th><th>3rd Level TE</th><th>Taxon</th></tr><tr><td>Functional Domain</td><td>Law Enforcement</td><td>Criminal Apprehension</td><td>Suspect pursuit and capture</td></tr><tr class="tx1-yours"><td>jullie HLTP</td><td>2e niveau</td><td>3e niveau</td><td>taxon</td></tr></table></div><div class="ob-note" style="--x:68.3%;--y:15.5%;--w:31.5%"><div class="k">Schrijf het op zoals MDTDF het vraagt</div><div class="d">Gebruik exact de vier kolommen uit MDTDF. Het voorbeeld gaat over politiewerk en toont alleen de opmaak; vul jullie eigen paden in. Dan kun je in Ronde 3 regel voor regel vergelijken met het model.</div></div></div>

<section class="slide obuild tx2" data-audience="all" data-n="[15 min] 09:47–10:02. RONDE 2 VAN 3. Elke groep draait de HCSS-generatieprompt MDTDF (Multi-Dimensional Taxonomy Development Framework, Stephan De Spiegeleire, 4 juni 2025, Enhanced Edition; StratBase/MDTDF.md, sha256 f0e7fadd…788bc04c) op het EIGEN thema. Dat is de prompt waarmee de HCSS-taxonomie voor Transparent Battlefield is gemaakt (aantoonbaar: het promptbestand van dat project bevat de MDTDF-tekst); voor Grey-Zone en Deterrence is niet vastgelegd welke prompt werd gebruikt, zeg dus niet meer dan dat. Gebruik NIET de promptversie uit de aprilworkshop: dat is een andere tekst dan MDTDF. TWEE BRONNEN: de bovenste QR leidt naar de publieke kopie (sdspieg.github.io, prompt.html?id=taxonomy-generation): de MDTDF-tekst woordelijk, met het auteursblok vervangen door de regel ‘Domain for this run: {{DOMAIN}}’ (één typefout verschilt: systemic/systematic). Het blok ‘MDTDF · ongewijzigd plakken’ op de slide toont een selectie van de sectiekoppen van MDTDF, niet de volledige tekst. De onderste QR leidt naar het platform onderwijsophcss.app.hcss.nl, waar het bestand MDTDF_2025-06-04_enhanced.md staat, bytegelijk aan het origineel; daar zet je de domeinzin als eerste regel boven de prompt. CONTROLEER VÓÓR DE SESSIE dat het bestand op het platform staat. STAPPEN: 09:47–09:50 openen en domeinzin invullen, de rest ONGEWIJZIGD plakken (groepen willen de prompt ‘verbeteren’: niet doen, anders vergelijk je in Ronde 3 niet met de HCSS-methode); 09:50–09:56 draaien met het sterkste model op de groepslaptop (Claude Code, Codex, of een lokaal model in LM Studio) en model + versie noteren; 09:56–10:02 kritisch lezen en dimensies markeren die de onafhankelijkheidstoets niet doorstaan. ALS HET MODEL FAALT: MDTDF vraagt 8–15 taxa per element op het 3e niveau, dus de uitvoer is lang; duurt het te lang, laat het model eerst alleen HLTP, 2e en 3e niveau geven. Een klein lokaal model is zwakker en breekt soms het TSV-formaat: vraag dan ‘output only the TSV’. Werkt er niets, laat de groep meekijken bij een groep met hetzelfde thema. Gevoelig materiaal alleen in een lokaal model. OPTIONELE TOETS: 20–30 fragmenten uit de eigen _100-set erachter plakken met de zin ‘ground the dimensions in this corpus, and tell me which dimensions the corpus does NOT support.’ (letterlijk van de HCSS-workshoppagina). Dat is GEEN onderdeel van MDTDF zelf, en het TOETST v0, het genereert haar niet (ADA-regel, tx-pasodoble). INLEVEREN om 10:02: taxonomie_v0_model.tsv + modelnaam en versie + datum + de exacte prompttekst (inclusief de domeinzin) in de groepsmap. Daarna 3 minuten HCSS-referentie (tx-llmtax)." data-sec="do" data-sid="tx-ex2" data-t="Ronde 2: de MDTDF-prompt draaien"><h2>Ronde 2: de MDTDF-prompt draaien (15 min)</h2><p class="sub">Dezelfde opdracht voor een taalmodel, met de generatieprompt die HCSS zelf gebruikt, op jullie eigen thema.</p><div class="ob-pic">

<section class="slide obuild tlm" data-audience="all" data-n="[3 min] 10:02–10:05, NA Ronde 2 en VÓÓR Ronde 3. Pas nu tonen we de echte HCSS-taxonomieën voor de drie thema’s, zodat ze de eigen versies (Ronde 1) en de MDTDF-uitvoer (Ronde 2) niet konden sturen. Zeg dat hardop. LABELS: de dimensienamen staan in het Nederlands op de slide; de Engelse originelen uit de HCSS-bestanden staan als tooltip op elk label (13 okt: de tweede Engelse regel paste niet in de rij). BRONNEN (gemeten 13 okt 2026): Drive RuBase/RNLA/CLAS 2025/Taxonomies/. Transparent Battlefield: transparent-battlefield-taxonomy.csv, geteld 6 HLTP’s, 17 elementen op het 2e niveau, 40 op het 3e, 107 taxa (rijen); de boom op schaal onderaan de TB-kolom is uit diezelfde CSV getekend (breedte = aantal taxa). Grey-Zone Conflict: grey_zone_conflict_taxonomy_writeup.md, geteld via de kopjes: 13 HLTP’s (##), 48 (###), 116 (####). Effective Deterrence: effective_deterrence_taxonomy_writeup.md: 14, 40, 102. De blokjes per dimensie zijn het aantal elementen op het 2e niveau, uit dezelfde bestanden geteld. Voor Grey-Zone en Afschrikking is geen taxonniveau geteld: de write-ups gaan tot het 3e niveau (de gsheets zijn niet geteld); vandaar het streepje. LET OP DASHBOARD (gemeten door de coördinator, 13 okt): het TB-dashboard rubase.org/transparent-battlefield gebruikt een latere, grotere TB-taxonomie (13 HLTP’s, 39 op het 2e, 73 op het 3e niveau met annotaties); de CLAS-versie op deze slide is die met 6. Ter vergelijking: rubase.org/grey-horizon toont 13 / 44 / 95 (dezelfde 13 HLTP’s als de write-up), rubase.org/glass-wall 14 / 39 / 97 (dezelfde 14 HLTP’s); de write-ups tellen meer elementen dan er in de dashboards annotaties dragen. Labels: de originelen zijn Engels (klein op de slide); de Nederlandse weergave is van ons. Rapporten: TB = From the Fog of War to the Fever of Exposure (maart 2026); Grey-Zone = The Grey Horizon (januari 2026); Afschrikking = The Glass Wall (januari 2026). HERKOMST, eerlijk: het TB-promptbestand RuBase/Transparent battlefield/taxonomy.prompt.md bevat de MDTDF-tekst (kop: MULTI-DIMENSIONAL TAXONOMY DEVELOPMENT FRAMEWORK, Jun 4, 2025 (Enhanced Edition)); geverifieerd. Voor Grey-Zone en Afschrikking is geen promptbestand gevonden; ze volgen de vier-niveaustructuur van MDTDF, maar welke prompt ze genereerde is NIET geverifieerd. Beweer niet meer. Alle drie zijn gemaakt in het CLAS 2025-programma. GEBRUIK IN RONDE 3: een derde referentie naast eigen versie en modeluitvoer, geen antwoordsleutel. De spanning (gemeten): MDTDF zegt ‘Begin with 5-7 clearly independent dimensions’; TB heeft 6, Grey-Zone 13, Afschrikking 14. Meer dimensies = meer kans op valkuil 1 (‘Creating dimensions that are actually different aspects of the same thing’). Kandidaat-overlappingen om te testen (NIET gemeten, zeg ‘kandidaat’): Grey-Zone Conflict Phase Positioning tegenover Threshold Calibration; Afschrikking Temporal Context (competitie, crisis, conflict) tegenover Escalation Dynamics; Afschrikking Credibility Components tegenover Russian Perception (beide beoordelen politieke wil); en Evidence Base (in beide) beschrijft onze kennis, niet het verschijnsel: een ander soort dimensie. Vraag de groepen: welke HCSS-dimensie mist in jullie versie, en welke van jullie dimensies mist bij HCSS? Neem een HCSS-dimensie pas over als die op eigen fragmenten werkt." data-sec="do" data-sid="tx-llmtax" data-t="De derde kolom: HCSS-taxonomieën">
